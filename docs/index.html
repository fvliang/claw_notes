负载平衡的综合资源管理。大量实验表明，xLLM相比现有开源推理框架实现了2-5倍的吞吐量提升，同时保持竞争力的延迟。", "file": "arxiv/2025/06_xllm.md", "id": 41, "topic": "LLM Serving"}, {"title": "SpecForge: A Flexible and Efficient Open-Source Training Framework for Speculative Decoding", "authors": "Shenggui Li, Chao Wang, Yikai Zhu, Yubo Wang, Fan Yin, Shuai Shi, Yefei Chen, Xiaomin Dong, Qiaoling Chen, Jin Pan, Ji Li, Laixin Xie, Yineng Zhang, Lei Yu, Yonggang Wen, Ivor Tsang, Tianwei Zhang", "arxiv_id": "", "github_repo": "SpecForge", "conference": "arXiv", "full_conference": "arXiv", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2025/specforge.md", "id": 42, "topic": "Speculative Decoding"}, {"title": "PCR: A Prefetch-Enhanced Cache Reuse System for Low-Latency RAG Serving", "authors": "Wenfeng Wang, Xiaofeng Hou, Peng Tang, Hengyi Zhou, Jing Wang, Xinkai Wang, Chao Li, Minyi Guo", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2025/pcr_rag_cache.md", "id": 43, "topic": "LLM Serving"}, {"title": "DSD: A Distributed Speculative Decoding Solution for Edge-Cloud Agile Large Model Serving", "authors": "Fengze Yu, Leshu Li, Brad McDanel, Sai Qian Zhang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2025/03_dsd.md", "id": 44, "topic": "Speculative Decoding"}, {"title": "Speculating Experts: Accelerates Inference for Mixture-of-Experts", "authors": "Vivan Madan, Prajwal Singhania, Abhinav Bhatele, Tom Goldstein, Ashwinee Panda", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2026/31_speculating_experts_moe.md", "id": 45, "topic": "Speculative Decoding"}, {"title": "A Pipelined Collaborative Speculative Decoding Framework for Efficient Edge-Cloud LLM Inference", "authors": "Yida Zhang, Zhiyong Gao, Shuaibing Yue, Jie Li, Rui Wang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "本文介绍了StarSD，这是一种一对多的推测解码方法，使单个draft模型能够与多个目标模型高效协作。\n\n---", "file": "arxiv/2026/llm_serving_papers_2026.md", "id": 46, "topic": "Speculative Decoding"}, {"title": "FLYING SERVING: On-the-Fly Parallelism Switching for Large Language Model Serving", "authors": "Shouwei Gao, Junqi Yin, Feiyi Wang, Wenqian Dong", "arxiv_id": "", "github_repo": "", "conference": "ACM", "full_conference": "ACM International Conference on Supercomputing (ICS 2026)", "year": 2026, "abstract_en": "", "abstract_cn": "*更新时间: 2026-03-25*", "intro_en": "", "intro_cn": "生产级LLM服务必须在非平稳流量和混合请求需求下同时提供高吞吐量、低延迟和足够的上下文容量。数据并行（DP）通过运行独立副本来最大化吞吐量，而张量并行（TP）减少每请求延迟并聚合内存用于长上下文推理。然而，现有服务堆栈通常在部署时静态配置并行性；适应突发、优先级或长上下文请求通常具有破坏性且缓慢。我们提出了Flying Serving，这是一个基于vLLM的系统，可以在不重启引擎 workers 的情况下实现在线DP-TP切换。Flying Serving通过虚拟化原本会强制数据移动的状态来使重新配置变得实用：(i) 零拷贝模型权重管理器，可按需暴露TP分片视图，(ii) KV Cache适配器，可在DP/TP布局之间保留请求KV状态，(iii) 积极初始化的通信器池，以分摊集体设置，以及 (iv) 无死锁调度器，在执行偏斜下协调安全转换。在三个流行的LLM和实际服务场景中，Flying Serving在高负载下将性能提升至4.79倍，在低负载下提升至3.47倍，同时支持延迟驱动和内存驱动的请求。", "file": "arxiv/2026/flying_serving_parallelism.md", "id": 47, "topic": "LLM Serving"}, {"title": "WISP: Waste- and Interference-Suppressed Distributed Speculative LLM Serving at the Edge", "authors": "", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "", "abstract_cn": "*本文档由自动化任务生成于 2026-03-24*", "intro_en": "", "intro_cn": "", "file": "arxiv/2026/wisp_distributed_speculative_serving.md", "id": 48, "topic": "Speculative Decoding"}, {"title": "AE-LLM: Adaptive Efficiency Optimization for Large Language Models", "authors": "Kaito Tanaka, Masato Ito, Yuji Nishimura, Keisuke Matsuda, Aya Nakayama", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "", "abstract_cn": "*更新时间: 2026-03-24*", "intro_en": "", "intro_cn": "", "file": "arxiv/2026/ae_llm_adaptive_efficiency.md", "id": 49, "topic": "LLM Serving"}, {"title": "Beyond Test-Time Compute Strategies: Advocating Energy-per-Token in LLM Inference", "authors": "Patrick Wilhelm, Thorsten Wittkopp, Odej Kao", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "", "abstract_cn": "*更新时间: 2026-03-24*", "intro_en": "", "intro_cn": "", "file": "arxiv/2026/energy_per_token_llm_inference.md", "id": 50, "topic": "LLM Serving"}, {"title": "MineDraft: A Framework for Batch Parallel Speculative Decoding", "authors": "Zhenwei Tang, Arun Verma, Zijian Zhou, Zhaoxuan Wu, Alok Prakash, Daniela Rus, Bryan Kian Hsiang Low", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2026/minedraft.md", "id": 51, "topic": "Speculative Decoding"}, {"title": "P-EAGLE: Parallel-Drafting EAGLE with Scalable Training", "authors": "Mude Hui, Xin Huang, Jaime Campos Salas, Yue Sun, Nathan Pemberton, Xiang Song, Ashish Khetan, George Karypis", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "", "abstract_cn": "*更新时间: 2026-03-25*", "intro_en": "", "intro_cn": "推理LLM产生更长的输出，需要在长序列上训练的投机解码drafters。并行drafting——每次前向传播预测多个tokens——比顺序生成提供延迟优势，但训练复杂度随序列长度和并行位置的乘积呈二次方增长，使得长上下文训练不切实际。我们提出了P(arallel)-EAGLE，它通过可学习的共享隐藏状态将EAGLE从自回归转变为并行多token预测。为了将训练扩展到长上下文，我们开发了一个具有注意力掩码预计算和序列分区技术的框架，使梯度能够在单个序列内积累，用于并行预测训练。我们在vLLM中实现了P-EAGLE，并在GPT-OSS 120B、20B和Qwen3-Coder 30B上展示了比自回归EAGLE-3高1.10-1.36倍的加速。", "file": "arxiv/2026/peagle_parallel_drafting.md", "id": 53, "topic": "LLM Serving"}, {"title": "MoE-Spec: Expert Budgeting for Efficient Speculative Decoding", "authors": "Bradley McDanel, Steven Li, Sruthikesh Surineni, Harshit Khaitan", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "", "abstract_cn": "*更新时间: 2026-03-25*", "intro_en": "", "intro_cn": "投机解码通过并行验证多个draft tokens来加速大型语言模型（LLM）推理。然而，对于混合专家（MoE）模型，这种并行性引入了严重的瓶颈：大型draft树激活许多独特的专家，大大增加了内存压力，并减少了相对于自回归解码的投机解码加速。之前的方法在MoE验证变得昂贵时减少投机深度。我们提出了MoE-Spec，这是一种无需训练的验证时专家预算方法，通过在每一层强制执行固定的专家容量限制来解耦投机深度和内存成本，只加载对验证贡献最大的专家，并丢弃驱动带宽开销的很少使用的专家尾部的专家。在多个模型规模和数据集上的实验表明，与基线（EAGLE-3）相比，该方法在相同质量下提供10-30%更高的吞吐量，并且通过更严格的预算可以灵活地权衡准确性以进一步降低延迟。", "file": "arxiv/2026/moe_spec_expert_budgeting.md", "id": 54, "topic": "Speculative Decoding"}, {"title": "Efficient LLM Serving for Agentic Workflows: A Data Systems Perspective", "authors": "(待补充)", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "", "abstract_cn": "*更新时间: 2026-03-24*", "intro_en": "", "intro_cn": "", "file": "arxiv/2026/llm_serving_agentic_workflows.md", "id": 55, "topic": "Speculative Decoding"}, {"title": "DualPath: Breaking the Storage Bandwidth Bottleneck in Agentic LLM Inference", "authors": "Yongtong Wu, Shaoyuan Chen, Yinmin Zhong, Rilin Huang, Yixuan Tan, Wentao Zhang, Liyue Zhang, Shangyan Zhou, Yuxuan Liu, Shunfeng Zhou, Mingxing Zhang, Xin Jin, Panpan Huang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "", "abstract_cn": "*更新时间: 2026-03-25*", "intro_en": "", "intro_cn": "多轮、agentic LLM推理的性能越来越受KV-Cache存储I/O而非计算支配。在流行的解聚架构中，从外部存储加载大量KV-Cache造成了一个根本的不平衡：预填充引擎上的存储NIC变得带宽饱和，而解码引擎上的存储NIC却保持空闲。这种不对称性严重限制了整体系统吞吐量。我们提出了DualPath，这是一种通过引入双路径KV-Cache加载来打破这一瓶颈的推理系统。除了传统的存储到预填充路径，DualPath还启用了一种新颖的存储到解码路径，在该路径中，KV-Cache被加载到解码引擎，然后通过计算网络上的RDMA高效传输到预填充引擎。DualPath将这种优化的数据路径（本质上避免网络拥塞并避免与延迟关键模型执行通信的干扰）与全局调度器相结合，全局调度器动态平衡预填充和解码引擎之间的负载。我们在对三个具有生产agentic工作负载的模型进行评估表明，DualPath在内部推理系统上将离线推理吞吐量提高了1.87倍。它还可以在不违反S Serving"}, {"title": "DFlash: Block Diffusion for Flash Speculative Decoding", "authors": "Jian Chen, Yesheng Liang, Zhijian Liu", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "", "abstract_cn": "*更新时间: 2026-03-25*", "intro_en": "", "intro_cn": "自回归大型语言模型（LLM）虽然性能强大，但需要固有的顺序解码，导致高推理延迟和GPU利用率低。投机解码通过使用快速draft模型来缓解这一瓶颈，该模型的输出由目标LLM并行验证；然而，现有方法仍然依赖于自回归drafting，这仍然是顺序的，限制了实际的加速。扩散LLM通过实现并行生成提供了另一种有前途的方案，但当前的扩散模型通常比自回归模型性能差。在本文中，我们引入了DFlash，这是一种使用轻量级块扩散模型进行并行drafting的投机解码框架。通过在单个前向传播中生成draft tokens，并将draft模型 conditioning 在从目标模型提取的上下文特征上，DFlash能够生成高质量输出和更高的接受率。实验表明，DFlash在各种模型和任务上实现了超过6倍的无损加速，比最新的投机解码方法EAGLE-3高出2.5倍。", "file": "arxiv/2026/dflash_block_diffusion.md", "id": 73, "topic": "Speculative Decoding"}, {"title": "CacheSolidarity: Preventing Prefix Caching Side Channels in Multi-tenant LLM Serving Systems", "authors": "Panagiotis Georgios Pennas, Konstantinos Papaioannou, Marco Guarnieri, Thaleia Dimitra Doudali", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2026/30_cachesolidarity.md", "id": 76, "topic": "LLM Serving"}, {"title": "StarSD: One-for-Many Speculative Decoding", "authors": "", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "", "abstract_cn": "*本文档由自动化任务生成于 2026-03-24*", "intro_en": "", "intro_cn": "", "file": "arxiv/2026/starsd_one_for_many_speculative.md", "id": 77, "topic": "Speculative Decoding"}, {"title": "FlashInfer: Kernel Library for LLM Serving", "authors": "", "arxiv_id": "2501.01005", "github_repo": "flashinfer-ai/flashinfer", "conference": "arXiv", "full_conference": "arXiv", "year": 2024, "abstract_en": "", "abstract_cn": "*本文档由自动化任务生成于 2026-03-24*", "intro_en": "", "intro_cn": "如果你在研究中使用FlashInfer，请引用我们的论文：\n\n```\n@article{ye2025flashinfer,\n title = {FlashInfer: Ef t: Ultra Long Sequence Generation", "authors": "bigai-nlco", "arxiv_id": "", "github_repo": "", "conference": "ICML", "full_conference": "ICML 2025", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "icml/2025/tokenswift.md", "id": 124, "topic": "LLM Serving"}];
    const topics = ["Speculative Decoding", "KV Cache", "Attention", "Hardware", "LLM Serving", "MoE", "Edge-Cloud", "Scheduling"];
    
    // 按会议-年份分组
    const confYearPapers = {};
    papers.forEach(p => {
        const conf = p.conference || 'arXiv';
        const year = p.year || 2024;
        const key = conf + '|' + year;
        if (!confYearPapers[key]) confYearPapers[key] = [];
        confYearPapers[key].push(p);
    });
    
    const confYears = Object.keys(confYearPapers).sort();
    const conferences = [...new Set(papers.map(p => p.conference).filter(c => c))];
    
    let currentFilter = "";
    let currentSearch = "";
    
    function initNav() {
        const navBar = document.getElementById('navBar');
        
        // 添加主题筛选
        topics.forEach(t => {
            const chip = document.createElement('div');
            chip.className = 'nav-chip';
            chip.dataset.filter = t;
            chip.textContent = t;
            chip.onclick = () => setFilter(t);
            navBar.appendChild(chip);
        });
    }
    
    function setFilter(topic) {
        currentFilter = topic;
        document.querySelectorAll('.nav-chip').forEach(c => {
            c.classList.toggle('active', c.dataset.filter === topic);
        });
        render();
    }
    
    function render() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        currentSearch = search;
        
        let filtered = papers.filter(p => {
            const matchFilter = !currentFilter || p.topic === currentFilter;
            const matchSearch = !search || 
                (p.title && p.title.toLowerCase().includes(search)) || 
                (p.authors && p.authors.toLowerCase().includes(search));
            return matchFilter && matchSearch;
        });
        
        const list = document.getElementById('paperList');
        
        if (filtered.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">没有找到匹配的论文</div>';
            return;
        }
        
        // 按会议-年份分组显示
        let html = '';
        const grouped = {};
        filtered.forEach(p => {
            const conf = p.conference || 'arXiv';
            const year = p.year || 2024;
            const key = conf + ' / ' + year;
            if (!grouped[key]) grouped[key] = [];
            grouped[key].push(p);
        });
        
        Object.keys(grouped).sort().forEach(key => {
            html += `<div class="section-title">📁 ${key}</div>`;
            grouped[key].forEach(p => {
                html += renderPaperCard(p);
            });
        });
        
        list.innerHTML = html;
        
        document.getElementById('paperCount').textContent = papers.length;
        document.getElementById('confCount').textContent = conferences.length;
        document.getElementById('topicCount').textContent = topics.length;
        document.getElementById('totalCount').textContent = papers.length;
    }
    
    function renderPaperCard(p) {
        return `
        <div class="paper-card" data-id="${p.id}">
            <div class="title">${p.title || 'Untitled'}</div>
            <div class="authors">${p.authors || 'Unknown'}</div>
            <div class="meta">
                <span class="tag conf">${p.conference || 'arXiv'}</span>
                <span class="tag year">${p.year || '2024'}</span>
                <span class="tag topic">${p.topic || 'LLM Serving'}</span>
            </div>
            <div class="links">
                ${p.arxiv_id ? `<a href="https://arxiv.org/abs/${p.arxiv_id}" target="_blank">📄 arXiv</a>` : ''}
                ${p.github_repo ? `<a href="https://github.com/${p.github_repo}" target="_blank">🐙 GitHub</a>` : ''}
                <a href="javascript:void(0)" onclick="showDetail(${p.id})">📖 详情 →</a>
            </div>
            ${(p.abstract_en || p.abstract_cn) ? `
            <button class="abstract-toggle" onclick="toggleAbstract(${p.id}, this)">
                📖 展开摘要
            </button>
            <div class="abstract-content" id="abstract-${p.id}">
                ${p.abstract_en ? `<h4>Abstract</h4><p>${p.abstract_en.substring(0,600)}${p.abstract_en.length>600?'...':''}</p>` : ''}
                ${p.abstract_cn ? `<h4>摘要</h4><p class="cn">${p.abstract_cn.substring(0,400)}${p.abstract_cn.length>400?'...':''}</p>` : ''}
            </div>
            ` : ''}
        </div>`;
    }
    
    function toggleAbstract(id, btn) {
        const content = document.getElementById('abstract-' + id);
        if (content.classList.contains('show')) {
            content.classList.remove('show');
            btn.textContent = '📖 展开摘要';
        } else {
            content.classList.add('show');
            btn.textContent = '📕 收起摘要';
        }
    }
    
    function showDetail(id) {
        const p = papers.find(p => p.id === id);
        if (!p) return;
        
        document.getElementById('listPage').style.display = 'none';
        document.getElementById('detailPage').classList.add('show');
        
        document.getElementById('detailTitle').textContent = p.title;
        document.getElementById('detailAuthors').textContent = p.authors || 'Unknown';
        
        document.getElementById('detailMeta').innerHTML = `
            <span class="tag conf">${p.conference || 'arXiv'}</span>
            <span class="tag year">${p.year || '2024'}</span>
            <span class="tag topic">${p.topic || 'LLM Serving'}</span>
        `;
        
        let links = '';
        if (p.arxiv_id) links += `<a href="https://arxiv.org/abs/${p.arxiv_id}" target="_blank">📄 arXiv</a> `;
        if (p.github_repo) links += `<a href="https://github.com/${p.github_repo}" target="_blank">🐙 GitHub</a> `;
        document.getElementById('detailLinks').innerHTML = links;
        
        let body = '';
        if (p.abstract_en) {
            body += `<h3>Abstract</h3><p>${p.abstract_en}</p>`;
        }
        if (p.abstract_cn) {
            body += `<h3>摘要</h3><p class="cn">${p.abstract_cn}</p>`;
        }
        if (p.intro_en) {
            body += `<h3>1. Introduction</h3><p>${p.intro_en}</p>`;
        }
        if (p.intro_cn) {
            body += `<h3>引言</h3><p class="cn">${p.intro_cn}</p>`;
        }
        
        document.getElementById('detailBody').innerHTML = body || '<p style="color:#999;text-align:center;padding:40px;">暂无详细内容</p>';
        
        window.scrollTo(0, 0);
    }
    
    function showList() {
        document.getElementById('detailPage').classList.remove('show');
        document.getElementById('listPage').style.display = 'block';
    }
    
    document.getElementById('searchInput').addEventListener('input', render);
    
    initNav();
    render();
    </script>
</body>
</html>
