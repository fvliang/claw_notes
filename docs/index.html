jointly. By leveraging a pooled GPU memory strategy across a cluster, Infinite-LLM not only significantly boosts system throughput but also supports extensive context lengths. Evaluated on a dataset with context lengths ranging from a few to 2000K tokens across a cluster with 32 A100 GPUs, Infinite-LLM demonstrates throughput improvement of 1.35-3.4x compared to state-of-the-art methods, enabling efficient and elastic LLM deployment.", "abstract_cn": "", "intro_en": "(Introduction)\n\nLLM的推理服务面临的主要挑战包括：\n1. 注意力层的动态行为与静态并行策略不匹配\n2. 长上下文场景下KV-Cache内存开销巨大\n3. 现有系统难以处理动态变化的上下文长度\n\nInfinite-LLM提出解耦注意力层的分布式KV-Cache管理，通过GPU内存池化来提升吞吐量和支持更长上下文。", "intro_cn": "", "file": "arxiv/2026/01_infinite_llm.md", "id": 57, "topic": "KV Cache"}, {"title": "CXL-SpecKV: A Disaggregated FPGA Speculative KV-Cache for Datacenter LLM Serving", "authors": "Dong Liu, Yanxuan Yu", "arxiv_id": "2512.11920", "github_repo": "", "conference": "FPGA'26", "full_conference": "FPGA'26 Oral", "year": 2025, "abstract_en": "(Abstract)\n\nLarge Language Models (LLMs) have revolutionized natural language processing tasks, but their deployment in datacenter environments faces significant challenges due to the massive memory requirements of key-value (KV) caches. During the autoregressive decoding process, KV caches consume substantial GPU memory, limiting batch sizes and overall system throughput. To address these challenges, we propose **CXL-SpecKV**, a novel disaggregated KV-cache architecture that leverages Compute Express Link (CXL) interconnects and FPGA accelerators to enable efficient speculative execution and memory disaggregation. Our approach introduces three key innovations: (i) a CXL-based memory disaggregation framework that offloads KV-caches to remote FPGA memory with low latency, (ii) a speculative KV-cache prefetching mechanism that predicts and preloads future tokens' cache entries, and (iii) an FPGA-accelerated KV-cache compression and decompression engine that reduces memory bandwidth requirements by up to 4×. When evaluated on state-of-the-art LLM models, CXL-SpecKV achieves up to 3.2× higher throughput compared to GPU-only baselines, while reducing memory costs by 2.8× and maintaining accuracy. Our system demonstrates that intelligent memory disaggregation combined with speculative execution can effectively address the memory wall challenge in large-scale LLM serving. Our code implementation has been open-sourced at [this https URL](https://github.com/FastLM/CXL-SpecKV).", "abstract_cn": "", "intro_en": "(Introduction)\n\nLLM的部署面临以下挑战：\n\n1. **KV缓存内存巨大**：随着序列长度增加，内存需求呈二次增长\n2. **批处理大小受限**：GPU内存限制影响系统吞吐量\n3. **内存墙问题**：带宽成为瓶颈\n\nCXL-SpecKV提出以下解决方案：\n- **CXL内存解耦**：利用CXL互连将KV缓存卸载到远程FPGA\n- **投机预取**：预测未来标记并预加载缓存\n- **FPGA压缩引擎**：减少带宽需求4倍", "intro_cn": "", "file": "arxiv/2026/26_cxl_specKV.md", "id": 58, "topic": "Speculative Decoding"}, {"title": "S2D2: Fast Decoding for Diffusion LLMs via Training-Free Self-Speculation", "authors": "Ligong Wang, Hao Wang, Kai Xu, Akash Srivastava", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\n> Block-diffusion language models offer a promising path toward faster-than-autoregressive generation by combining block-wise autoregressive decoding with within-block parallel denoising. However, in the few-step regime needed for practical acceleration, standard confidence-thresholded...", "abstract_cn": "", "intro_en": "(Introduction)\n\n扩散模型在文本生成中展现出巨大潜力,但其多步去噪过程导致推理速度较慢。本文提出S2D2,通过自投机机制加速扩散LLM的解码过程。", "intro_cn": "", "file": "arxiv/2026/36_s2d2_diffusion.md", "id": 59, "topic": "Speculative Decoding"}, {"title": "KV Cache Optimization Strategies for Scalable and Efficient LLM Inference", "authors": "Yichun Xu, Navjot K. Khaira, Tejinder Singh", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(摘要)\n\nThe key-value (KV) cache is a foundational optimization in Transformer-based large language models (LLMs), eliminating redundant recomputation of past token representations during autoregressive generation. However, its memory footprint scales linearly with context length, imposing critical bottlenecks on GPU memory capacity, memory bandwidth, and inference throughput as production LLMs push context windows from thousands to millions of tokens. Efficient KV cache management has thus become a first-order challenge for scalable LLM deployment. This paper provides a systematic review of recent KV cache optimization techniques, organizing them into five principal directions: cache eviction, cache compression, hybrid memory solutions, novel attention mechanisms, and combination strategies. For each category we analyze the underlying mechanisms, deployment trade-offs, and empirical performance across memory reduction, throughput, and model accuracy metrics. We further map techniques to seven practical deployment scenarios, including long-context single requests, high-throughput datacenter serving, edge devices, multi-turn conversations, and accuracy-critical reasoning, providing actionable guidance for practitioners selecting among competing approaches. Our analysis reveals that no single technique dominates across all settings; instead, the optimal strategy depends on context length, hardware constraints, and workload characteristics, pointing toward adaptive, multi-stage optimization pipelines as a promising direction for future research.\n\n---\n\n键值（KV）缓存是Transformer基础的大型语言模型（LLM）中的基础优化，消除了自回归生成过程中过去token表示的冗余重新计算。然而，其内存占用随上下文长度线性增长，随着生产LLM将上下文窗口从数千token扩展到数百万token，在GPU内存容量、内存带宽和推理吞吐量方面造成关键瓶颈。因此，高效的KV缓存管理已成为可扩展LLM部署的首要挑战。本文对最近的KV缓存优化技术进行了系统综述，将其组织为五个主要方向：缓存淘汰、缓存压缩、混合内存解决方案、新颖的注意力机制和组合策略。对于每个类别，我们分析了底层机制、部署权衡以及内存减少、吞吐量和模型精度指标方面的实证性能。我们进一步将技术映射到七个实际部署场景，包括长上下文单请求、高吞吐量数据中心服务、边缘设备、多轮对话和精度关键推理，为从业者在竞争方法中选择提供可操作指导。我们的分析表明，没有单一技术在所有设置中都占主导地位；相反，最佳策略取决于上下文长度、硬件约束和工作负载特征，指向自适应多阶段优化管道作为未来研究的有前途方向。\n\n---", "abstract_cn": "*更新时间: 2026-03-24*", "intro_en": "", "intro_cn": "", "file": "arxiv/2026/kv_cache_optimization_strategies.md", "id": 60, "topic": "KV Cache"}, {"title": "Cross-Family Speculative Prefill: Training-Free Long-Context Compression with Small Draft Models", "authors": "Shubhangi Upasani, Ravi Shanker Raju, Bo Li, Mengmeng Ji, John Long, Chen Wu, Urmish Thakker, Guangtao Wang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\nPrompt length is a major bottleneck in agentic large language model (LLM) workloads, where repeated inference steps and multi-call loops incur substantial prefill cost. Recent work on speculative decoding has primarily focused on the decoding phase, neglecting the prefill stage which dominates latency in long-context scenarios.\n\n在智能体LLM工作负载中，提示长度是一个主要瓶颈，重复推理步骤和多轮调用会产生大量prefill成本。最近的投机解码工作主要集中于解码阶段，忽略了在长上下文场景中占据主导地位的prefill阶段。", "abstract_cn": "*更新时间: 2026-03-24*", "intro_en": "(Introduction)", "intro_cn": "", "file": "arxiv/2026/cross_family_speculative_prefill.md", "id": 61, "topic": "Speculative Decoding"}, {"title": "FlexServe: A Fast and Secure LLM Serving System for Mobile Devices with Flexible Resource Isolation", "authors": "Yinpeng Wu, Yitong Chen, Lixiang Wang, Jinyu Gu, Zhichao Hua, Yubin Xia", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\nDevice-side Large Language Models (LLMs) have witnessed explosive growth, offering higher privacy and availability compared to cloud-side LLMs. During LLM inference, both model weights and user data are valuable, and attackers may even compromise the OS kernel to steal them. ARM TrustZone is the de facto hardware-based isolation technology on mobile devices, used to protect sensitive applications from a compromised OS. However, protecting LLM inference with TrustZone incurs significant overhead due to its inflexible isolation of memory and the NPU. To address these challenges, this paper introduces FlexServe, a fast and secure LLM serving system for mobile devices. It first introduces a Flexible Resource Isolation mechanism to construct Flexible Secure Memory (Flex-Mem) and Flexible Secure NPU (Flex-NPU). Both memory pages and the NPU can be efficiently switched between unprotected and protected modes. Based on these mechanisms, FlexServe designs a fast and secure LLM inference framework within TrustZone's secure world. The LLM-Aware Memory Management and Secure Inference Pipeline are introduced to accelerate inference. A Multi-Model Scheduler is proposed to optimize multi-model workflows. We implement a prototype of FlexServe and compare it with two TrustZone-based strawman designs. The results show that FlexServe achieves an average 10.05× speedup in Time to First Token (TTFT) compared to the strawman, and an average 2.44× TTFT speedup compared to an optimized strawman with pipeline and secure NPU enabled. For multi-model agent workflows, the end-to-end speedup is up to 24.30× and 4.05× compared to the strawman and optimized strawman, respectively.", "abstract_cn": "", "intro_en": "(Introduction)\n\n随着移动设备上LLM的快速发展，设备端推理成为趋势。然而，设备端LLM面临安全和隐私挑战。ARM TrustZone技术可用于保护敏感应用，但传统TrustZone实现存在显著性能开销。FlexServe通过创新的灵活资源隔离机制解决了这一问题。", "intro_cn": "", "file": "arxiv/2026/27_flexserve.md", "id": 62, "topic": "LLM Serving"}, {"title": "TIDE: Temporal Incremental Draft Engine for Self-Improving LLM Inference", "authors": "Jiyoung Park, Hankyu Jang, Changseok Song, Wookeun Jung", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\nSpeculative... (待补充完整摘要)", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2026/02_tide.md", "id": 63, "topic": "LLM Serving"}, {"title": "DFlash: Block Diffusion for Flash Speculative Decoding", "authors": "Jian Chen, Yesheng Liang, Zhijian Liu", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\nAutoregressive large language models (LLMs) deliver strong performance but require inherently sequential decoding, leading to high inference latency and poor GPU utilization. Speculative decoding mitigates this bottleneck by using a fast draft model whose outputs are verified in parallel by the target LLM; however, existing methods still rely on autoregressive drafting, which remains sequential and limits practical speedups. Diffusion LLMs offer a promising alternative by enabling parallel generation, but current diffusion models typically underperform compared with autoregressive models. In this paper, we introduce DFlash, a speculative decoding framework that employs a lightweight block diffusion model for parallel drafting. By generating draft tokens in a single forward pass and conditioning the draft model on context features extracted from the target model, DFlash enables efficient drafting with high-quality outputs and higher acceptance rates. Experiments show that DFlash achieves over 6x lossless acceleration across a range of models and tasks, delivering up to 2.5x higher speedup than the state-of-the-art speculative decoding method EAGLE-3.", "abstract_cn": "*更新时间: 2026-03-25*", "intro_en": "", "intro_cn": "自回归大型语言模型（LLM）虽然性能强大，但需要固有的顺序解码，导致高推理延迟和GPU利用率低。投机解码通过使用快速draft模型来缓解这一瓶颈，该模型的输出由目标LLM并行验证；然而，现有方法仍然依赖于自回归drafting，这仍然是顺序的，限制了实际的加速。扩散LLM通过实现并行生成提供了另一种有前途的方案，但当前的扩散模型通常比自回归模型性能差。在本文中，我们引入了DFlash，这是一种使用轻量级块扩散模型进行并行drafting的投机解码框架。通过在单个前向传播中生成draft tokens，并将draft模型 conditioning 在从目标模型提取的上下文特征上，DFlash能够生成高质量输出和更高的接受率。实验表明，DFlash在各种模型和任务上实现了超过6倍的无损加速，比最新的投机解码方法EAGLE-3高出2.5倍。", "file": "arxiv/2026/dflash_block_diffusion.md", "id": 64, "topic": "Speculative Decoding"}, {"title": "CacheSolidarity: Preventing Prefix Caching Side Channels in Multi-tenant LLM Serving Systems", "authors": "Panagiotis Georgios Pennas, Konstantinos Papaioannou, Marco Guarnieri, Thaleia Dimitra Doudali", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\nLarge Language Models (LLMs) rely on optimizations like Automatic Prefix Caching (APC) to accelerate inference. APC works by reusing previously computed states for the beginning part of a request (prefix), when another request starts with the same text. While APC improves throughput, it introduces timing side channels: cache hits are faster than misses, creating observable latency differences. In multi-tenant systems, attackers can exploit these differences to infer sensitive information, e.g., by incrementally reconstructing another user's request by observing hit/miss patterns. Current defenses take a sledgehammer approach: they disable APC and cache sharing, isolating users, and sacrificing efficiency for regular users. This paper presents CacheSolidarity, a system that secures multi-tenant LLM serving systems against APC side channels without sacrificing performance and efficiency. CacheSolidarity monitors cache reuse across users, flags suspicious sharing, and selectively isolates prefixes, restricting their reuse only when necessary. Evaluation shows that CacheSolidarity enables up to 70% higher cache reuse and 30% lower inference latency compared to existing defenses that isolate users. CacheSolidarity's lightweight design demonstrates how security in LLM serving does not have to come at the cost of unnecessarily reduced performance or unbearable overheads.", "abstract_cn": "", "intro_en": "(Introduction)\n\n自动前缀缓存(APC)是LLM推理优化的关键技术，但它引入了时序侧信道攻击风险。CacheSolidarity通过监控和有选择性地隔离来防御此类攻击，同时保持高性能。", "intro_cn": "", "file": "arxiv/2026/30_cachesolidarity.md", "id": 65, "topic": "LLM Serving"}, {"title": "StarSD: One-for-Many Speculative Decoding", "authors": "", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\nSpeculative decoding has shown great promise in accelerating LLM inference by using a small draft model to propose tokens and a large target model to verify them. However, existing methods typically require a dedicated draft model for each target model, resulting in high memory overhead and training costs. We present StarSD, a one-for-many speculative decoding framework that leverages a single universal draft model to serve multiple target models. StarSD employs a hierarchical verification mechanism that first uses lightweight adapters to quickly filter unlikely tokens, then applies the target model for final verification. Additionally, we propose a knowledge distillation technique that transfers the capabilities of multiple target models into the universal draft model. Our experiments show that StarSD can achieve comparable speedup to dedicated draft models while reducing memory overhead by 70%.", "abstract_cn": "*本文档由自动化任务生成于 2026-03-24*", "intro_en": "(Introduction)\n\n核心挑战：\n1. 每个目标模型需要专用draft模型\n2. 内存开销大\n3. 训练成本高\n\nStarSD的创新：\n- 单一通用draft模型服务多个目标模型\n- 分层验证机制\n- 知识蒸馏技术\n- 减少70%内存开销", "intro_cn": "", "file": "arxiv/2026/starsd_one_for_many_speculative.md", "id": 66, "topic": "Speculative Decoding"}, {"title": "Fast State Restoration in LLM Serving with HCache", "authors": "Shiwei Gao 等", "arxiv_id": "", "github_repo": "", "conference": "EuroSys", "full_conference": "EuroSys 2025", "year": 2025, "abstract_en": "The growing complexity of LLM usage today, e.g., multi-round conversation and retrieval-augmented generation (RAG), makes contextual states (i.e., KV cache) reusable across user requests. Given the capacity constraints of GPU memory, only a limited number of contexts can be cached on GPU for reusing. Existing inference systems typically evict part of the KV cache and restore it by recomputing it from the original tokens or offloading it to host storage for later retrieval, both of which introduce substantial computational or I/O overheads.\n\nWe propose **HCache**, a novel LLM state restoration method. Its key idea is to restore LLM states from intermediate activations and thus utilize computational and I/O resources with low overhead.", "abstract_cn": "*论文来源：EuroSys 2025，数据真实可验证*", "intro_en": "", "intro_cn": "", "file": "eurosys/2025/hcache_state_restoration.md", "id": 67, "topic": "LLM Serving"}, {"title": "NanoFlow: Towards Optimal Large Language Model Serving Throughput", "authors": "Kan Zhu, Yufei Gao, Yilong Zhao, Liangyu Zhao, Gefei Zuo, Yile Gu, Dedong Xie, Tian Tang, Qinyu Xu, Zihao Ye, Keisuke Kamahori, Chien-Yu Lin, Ziren Wang, Stephanie Wang, Arvind Krishnamurthy, Baris Kasikci", "arxiv_id": "", "github_repo": "", "conference": "OSDI", "full_conference": "OSDI 2025", "year": 2025, "abstract_en": "Large Language Models (LLMs) have resulted in a surging demand for planet-scale serving. Despite significant advancements in LLM inference systems, achieving optimal throughput remains challenging due to the complex interplay between GPU compute and memory resources across the entire serving pipeline.\n\nThrough a detailed analysis, we show that despite having memory-intensive components, end-to-end LLM serving is **compute bound** for most common workloads and LLMs.", "abstract_cn": "*论文来源：OSDI 2025，数据真实可验证*", "intro_en": "", "intro_cn": "", "file": "osdi/2025/nanoflow_optimal_serving.md", "id": 68, "topic": "LLM Serving"}, {"title": "Pie: A Programmable Serving System for Emerging LLM Applications", "authors": "In Gim 等", "arxiv_id": "", "github_repo": "", "conference": "SOSP", "full_conference": "SOSP 2025", "year": 2025, "abstract_en": "Emerging large language model (LLM) applications involve diverse reasoning strategies and agentic workflows, straining the capabilities of existing serving systems built on a monolithic token generation loop. This paper introduces **Pie**, a programmable LLM serving system designed for flexibility and efficiency. \n\nPie decomposes the traditional generation loop into fine-grained service handlers exposed via an API and delegates control of the generation process to user-provided programs, called **inferlets**. This enables applications to implement new KV cache strategies, bespoke generation logic, and seamlessly integrate computation and I/O—entirely within the application, without requiring modifications to the serving system.\n\nPie executes inferlets using WebAssembly, benefiting from its lightweight sandboxing.", "abstract_cn": "*论文来源：SOSP 2025，数据真实可验证*", "intro_en": "", "intro_cn": "", "file": "sosp/2025/pie_programmable_serving.md", "id": 69, "topic": "LLM Serving"}, {"title": "LayerSkip: Early Exit and Self-Speculative Decoding", "authors": "Facebook Research", "arxiv_id": "", "github_repo": "", "conference": "ACL", "full_conference": "ACL 2024", "year": 2024, "abstract_en": "(Abstract)\nLayerSkip presents a novel approach to LLM inference that combines early exit with self-speculative decoding. The key insight is to use the same model for both draft generation and verification, enabling:\n\n1. **Early exit at variable layers**: Different tokens exit at different layers based on confidence\n2. **Self-speculative decoding**: Model drafts tokens and verifies them in a unified framework\n3. **Significant speedups**: Up to 2x speedup on various benchmarks", "abstract_cn": "", "intro_en": "(Introduction)\nExisting speculative decoding approaches typically use two separate models (draft and target). LayerSkip innovates by:\n\n1. **Self-speculation**: A single model handles both draft and verify\n2. **Layer-wise early exit**: Confident tokens skip remaining layers\n3. **Training for early exit**: Special training recipe to enable early exit capability\n4. **End-to-end optimization**: Whole system optimized together\n\nThis approach reduces model overhead and improves cache efficiency.", "intro_cn": "", "file": "acl/2024/layerskip.md", "id": 70, "topic": "Speculative Decoding"}, {"title": "REST: Retrieval-Based Speculative Decoding", "authors": "FasterDecoding", "arxiv_id": "", "github_repo": "", "conference": "NAACL", "full_conference": "NAACL 2024", "year": 2024, "abstract_en": "(Abstract)\nREST (Retrieval-Based Speculative Decoding) introduces a novel approach that leverages previously computed contexts to accelerate inference. Instead of always using a smaller model as the drafter, REST:\n\n1. **Retrieves similar contexts** from recent history\n2. **Uses retrieved tokens as drafts** for verification\n3. **Achieves high acceptance rates** when prompts share common patterns\n\nThis approach is particularly effective for tasks with repetitive patterns or structured outputs.", "abstract_cn": "", "intro_en": "(Introduction)\nKey insight: Many inference requests share common patterns (e.g., system prompts, formatting instructions). REST exploits this by:\n\n1. **Building a retrieval cache** of recent context chunks\n2. **Querying the cache** for similar contexts when generating\n3. **Using matched tokens** as speculative drafts\n4. **Verifying with the full model** to ensure correctness\n\nThis eliminates the need for a separate draft model and can achieve better efficiency.", "intro_cn": "", "file": "naacl/2024/rest.md", "id": 71, "topic": "Speculative Decoding"}, {"title": "SWIFT: On-the-Fly Self-Speculative Decoding", "authors": "Microsoft Research", "arxiv_id": "", "github_repo": "", "conference": "ICLR", "full_conference": "ICLR 2025", "year": 2025, "abstract_en": "(Abstract)\nSWIFT (Speculative Inference With Fast Token-generation) is an on-the-fly self-speculative decoding method that enables efficient LLM inference without pre-trained draft models. Key features:\n\n1. **Self-speculation**: Uses the same model for draft and verify\n2. **On-the-fly generation**: No need for separate draft model training\n3. **Layer-wise early exit**: Different layers for different confidence levels\n4. **Significant speedups**: 1.5-2x speedup with minimal overhead", "abstract_cn": "", "intro_en": "(Introduction)\nSWIFT addresses limitations of prior speculative decoding methods:\n- No need for two-model setups (draft + target)\n- No training required - works with existing models\n- Dynamic layer selection based on token confidence\n- Maintains output quality while accelerating\n\nThe approach is particularly valuable for:\n- Deployment scenarios with limited resources\n- Cases where draft model training is impractical\n- Applications requiring flexible deployment", "intro_cn": "", "file": "iclr/2025/swift.md", "id": 72, "topic": "Speculative Decoding"}, {"title": "TokenSwift: Ultra Long Sequence Generation", "authors": "bigai-nlco", "arxiv_id": "", "github_repo": "", "conference": "ICML", "full_conference": "ICML 2025", "year": 2025, "abstract_en": "(Abstract)\nTokenSwift focuses on lossless acceleration of ultra long sequence generation. The main contributions include:\n\n1. **Hierarchical speculation**: Multi-level draft generation pipeline\n2. **Long context optimization**: Specifically designed for 10K+ token sequences\n3. **Memory efficiency**: Optimized KVCache management for long contexts\n4. **2-3x speedup**: Maintains output quality while significantly accelerating", "abstract_cn": "", "intro_en": "(Introduction)\nUltra long context generation (10K+ tokens) presents unique challenges:\n- O(n²) attention complexity becomes prohibitive\n- KVCache memory requirements explode\n- Autoregressive decoding becomes the bottleneck\n\nTokenSwift addresses these with:\n- **Streaming speculation**: Draft tokens generated incrementally\n- **Selective attention**: Only relevant context attended to\n- **Efficient cache eviction**: Smart management of long context cache", "intro_cn": "", "file": "icml/2025/tokenswift.md", "id": 73, "topic": "LLM Serving"}];
    const topics = ["Speculative Decoding", "KV Cache", "Attention", "Hardware", "LLM Serving", "MoE", "Edge-Cloud", "Scheduling"];
    
    // 按会议-年份分组
    const confYearPapers = {};
    papers.forEach(p => {
        const conf = p.conference || 'arXiv';
        const year = p.year || 2024;
        const key = conf + '|' + year;
        if (!confYearPapers[key]) confYearPapers[key] = [];
        confYearPapers[key].push(p);
    });
    
    const confYears = Object.keys(confYearPapers).sort();
    
    let currentFilter = "";
    let currentSearch = "";
    let filterMode = "topic"; // "topic" 或 "confYear"
    let expandedConf = null; // 当前展开的会议
    
    // 按会议组织年份
    const confYearMap = {};
    confYears.forEach(cy => {
        const [conf, year] = cy.split('|');
        if (!confYearMap[conf]) confYearMap[conf] = [];
        confYearMap[conf].push(year);
    });
    const conferences = Object.keys(confYearMap).sort();
    
    function initNav() {
        const navBar = document.getElementById('navBar');
        const filterGroup = document.getElementById('filterGroup');
        
        // 模式切换按钮放在 navBar
        const modeChip = document.createElement('div');
        modeChip.className = 'nav-chip mode-toggle';
        modeChip.dataset.mode = 'topic';
        modeChip.textContent = '🏷️ 主题';
        modeChip.onclick = () => setFilterMode('topic');
        navBar.appendChild(modeChip);
        
        const confChip = document.createElement('div');
        confChip.className = 'nav-chip mode-toggle';
        confChip.dataset.mode = 'confYear';
        confChip.textContent = '📅 会议';
        confChip.onclick = () => setFilterMode('confYear');
        navBar.appendChild(confChip);
        
        // "全部"按钮
        const allChip = document.createElement('div');
        allChip.className = 'nav-chip';
        allChip.dataset.filter = '';
        allChip.textContent = '全部';
        allChip.onclick = () => {
            currentFilter = "";
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            render();
        };
        filterGroup.appendChild(allChip);
        
        // 添加主题筛选
        topics.forEach(t => {
            const chip = document.createElement('div');
            chip.className = 'nav-chip filter-chip topic-filter';
            chip.dataset.filter = t;
            chip.dataset.mode = 'topic';
            chip.textContent = t;
            chip.onclick = () => setFilter(t);
            chip.style.display = 'none';
            filterGroup.appendChild(chip);
        });
        
        // 添加会议层级筛选（树形结构）
        conferences.forEach(conf => {
            // 会议名称按钮
            const confChip = document.createElement('div');
            confChip.className = 'nav-chip filter-chip conf-filter';
            confChip.dataset.conf = conf;
            confChip.dataset.mode = 'confYear';
            confChip.textContent = conf;
            confChip.style.display = 'none';
            confChip.onclick = () => toggleConf(conf);
            filterGroup.appendChild(confChip);
            
            // 年份子选项（初始隐藏）
            const years = confYearMap[conf].sort((a,b) => b - a);
            years.forEach(year => {
                const yearChip = document.createElement('div');
                yearChip.className = 'nav-chip filter-chip year-filter';
                yearChip.dataset.filter = conf + '|' + year;
                yearChip.dataset.mode = 'confYear';
                yearChip.dataset.conf = conf;
                yearChip.textContent = year;
                yearChip.style.display = 'none';
                yearChip.onclick = (e) => {
                    e.stopPropagation();
                    setFilter(conf + '|' + year);
                };
                filterGroup.appendChild(yearChip);
            });
        });
        
        // 默认显示主题筛选
        setFilterMode('topic');
    }
    
    function toggleConf(conf) {
        if (expandedConf === conf) {
            expandedConf = null;
        } else {
            expandedConf = conf;
        }
        updateConfDisplay();
    }
    
    function updateConfDisplay() {
        // 更新会议按钮样式
        document.querySelectorAll('.conf-filter').forEach(c => {
            c.classList.toggle('active', c.dataset.conf === expandedConf);
            c.classList.toggle('expanded', c.dataset.conf === expandedConf);
        });
        
        // 显示/隐藏年份选项
        document.querySelectorAll('.year-filter').forEach(c => {
            c.style.display = (c.dataset.conf === expandedConf && filterMode === 'confYear') ? '' : 'none';
        });
    }
    
    function setFilterMode(mode) {
        filterMode = mode;
        expandedConf = null;
        
        // 更新模式切换按钮样式
        document.querySelectorAll('.mode-toggle').forEach(c => {
            c.classList.toggle('active', c.dataset.mode === mode);
        });
        
        // 显示/隐藏对应的筛选按钮
        document.querySelectorAll('.topic-filter').forEach(c => {
            c.style.display = mode === 'topic' ? '' : 'none';
        });
        document.querySelectorAll('.conf-filter').forEach(c => {
            c.style.display = mode === 'confYear' ? '' : 'none';
        });
        document.querySelectorAll('.year-filter').forEach(c => {
            c.style.display = 'none';
        });
        
        // 清空当前筛选
        currentFilter = "";
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        
        render();
    }
    
    function setFilter(filter) {
        // 如果点击的是当前激活的筛选，则清除
        if (currentFilter === filter) {
            currentFilter = "";
        } else {
            currentFilter = filter;
        }
        
        document.querySelectorAll('.filter-chip').forEach(c => {
            c.classList.toggle('active', c.dataset.filter === currentFilter);
        });
        
        render();
    }
    
    function render() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        currentSearch = search;
        
        let filtered = papers.filter(p => {
            let matchFilter = true;
            if (currentFilter) {
                if (filterMode === 'topic') {
                    matchFilter = p.topic === currentFilter;
                } else if (filterMode === 'confYear') {
                    const conf = p.conference || 'arXiv';
                    const year = p.year || 2024;
                    const key = conf + '|' + year;
                    matchFilter = key === currentFilter;
                }
            }
            const matchSearch = !search || 
                (p.title && p.title.toLowerCase().includes(search)) || 
                (p.authors && p.authors.toLowerCase().includes(search));
            return matchFilter && matchSearch;
        });
        
        const list = document.getElementById('paperList');
        
        if (filtered.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">没有找到匹配的论文</div>';
            return;
        }
        
        // 按会议-年份分组显示
        let html = '';
        const grouped = {};
        filtered.forEach(p => {
            const conf = p.conference || 'arXiv';
            const year = p.year || 2024;
            const key = conf + ' / ' + year;
            if (!grouped[key]) grouped[key] = [];
            grouped[key].push(p);
        });
        
        Object.keys(grouped).sort().forEach(key => {
            html += `<div class="section-title">📁 ${key}</div>`;
            grouped[key].forEach(p => {
                html += renderPaperCard(p);
            });
        });
        
        list.innerHTML = html;
        
        document.getElementById('paperCount').textContent = papers.length;
        document.getElementById('confCount').textContent = Object.keys(confYearMap).length;
        document.getElementById('topicCount').textContent = topics.length;
        document.getElementById('totalCount').textContent = papers.length;
    }
    
    function renderPaperCard(p) {
        return `
        <div class="paper-card" data-id="${p.id}">
            <div class="title">${p.title || 'Untitled'}</div>
            <div class="authors">${p.authors || 'Unknown'}</div>
            <div class="meta">
                <span class="tag conf">${p.conference || 'arXiv'}</span>
                <span class="tag year">${p.year || '2024'}</span>
                <span class="tag topic">${p.topic || 'LLM Serving'}</span>
            </div>
            <div class="links">
                ${p.arxiv_id ? `<a href="https://arxiv.org/abs/${p.arxiv_id}" target="_blank">📄 arXiv</a>` : ''}
                ${p.github_repo ? `<a href="https://github.com/${p.github_repo}" target="_blank">🐙 GitHub</a>` : ''}
                <a href="javascript:void(0)" onclick="showDetail(${p.id})">📖 详情 →</a>
            </div>
            ${(p.abstract_en || p.abstract_cn) ? `
            <button class="abstract-toggle" onclick="toggleAbstract(${p.id}, this)">
                📖 展开摘要
            </button>
            <div class="abstract-content" id="abstract-${p.id}">
                ${p.abstract_en ? `<h4>Abstract</h4><p>${p.abstract_en.substring(0,600)}${p.abstract_en.length>600?'...':''}</p>` : ''}
                ${p.abstract_cn ? `<h4>摘要</h4><p class="cn">${p.abstract_cn.substring(0,400)}${p.abstract_cn.length>400?'...':''}</p>` : ''}
            </div>
            ` : ''}
        </div>`;
    }
    
    function toggleAbstract(id, btn) {
        const content = document.getElementById('abstract-' + id);
        if (content.classList.contains('show')) {
            content.classList.remove('show');
            btn.textContent = '📖 展开摘要';
        } else {
            content.classList.add('show');
            btn.textContent = '📕 收起摘要';
        }
    }
    
    function showDetail(id) {
        const p = papers.find(p => p.id === id);
        if (!p) return;
        
        document.getElementById('listPage').style.display = 'none';
        document.getElementById('detailPage').classList.add('show');
        
        document.getElementById('detailTitle').textContent = p.title;
        document.getElementById('detailAuthors').textContent = p.authors || 'Unknown';
        
        document.getElementById('detailMeta').innerHTML = `
            <span class="tag conf">${p.conference || 'arXiv'}</span>
            <span class="tag year">${p.year || '2024'}</span>
            <span class="tag topic">${p.topic || 'LLM Serving'}</span>
        `;
        
        let links = '';
        if (p.arxiv_id) links += `<a href="https://arxiv.org/abs/${p.arxiv_id}" target="_blank">📄 arXiv</a> `;
        if (p.github_repo) links += `<a href="https://github.com/${p.github_repo}" target="_blank">🐙 GitHub</a> `;
        document.getElementById('detailLinks').innerHTML = links;
        
        let body = '';
        if (p.abstract_en) {
            body += `<h3>Abstract</h3><p>${p.abstract_en}</p>`;
        }
        if (p.abstract_cn) {
            body += `<h3>摘要</h3><p class="cn">${p.abstract_cn}</p>`;
        }
        if (p.intro_en) {
            body += `<h3>1. Introduction</h3><p>${p.intro_en}</p>`;
        }
        if (p.intro_cn) {
            body += `<h3>引言</h3><p class="cn">${p.intro_cn}</p>`;
        }
        
        document.getElementById('detailBody').innerHTML = body || '<p style="color:#999;text-align:center;padding:40px;">暂无详细内容</p>';
        
        window.scrollTo(0, 0);
    }
    
    function showList() {
        document.getElementById('detailPage').classList.remove('show');
        document.getElementById('listPage').style.display = 'block';
    }
    
    document.getElementById('searchInput').addEventListener('input', render);
    
    initNav();
    render();
    </script>
</body>
</html>
