e, "is_github_project": false, "topic": "LLM Serving", "id": 89, "added_date": "2026-04-01"}, {"title": "ICaRus: Identical Cache Reuse for Efficient Multi Model Inference", "authors": "Sunghyeon Woo, Jaeeun Kil, Hoseung Kim, Minsub Kim, Joonghoon Kim, Ahreum Seo, Sungjae Lee, Minjung Jo, Jiwon Ryu, Baeseong Park, Se Jung Kwon, Dongsoo Lee", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Multi model inference has recently emerged as a prominent paradigm, particularly in the development of agentic AI systems. However, existing systems lack efficient cache sharing mechanisms across different models, leading to significant memory redundancy. We propose ICaRus, a framework that identifies and reuses identical intermediate activations across different model executions. Our approach achieves significant memory reduction while maintaining inference accuracy.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/ICaRus.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 90, "added_date": "2026-04-01"}, {"title": "SpecEyes: Accelerating Agentic Multimodal LLMs via Speculative Perception and Planning", "authors": "Haoyu Huang, Jinfa Huang, Zhongwei Wan, Xiawu Zheng, Rongrong Ji, Jiebo Luo", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Agentic multimodal large language models (MLLMs) (e.g., OpenAI o3 and Gemini Agentic Vision) achieve remarkable reasoning capabilities through iterative visual tool invocation. However, the cascaded pipeline of tool use introduces significant latency, making real-time deployment challenging. To address this, we propose SpecEyes, a novel speculative perception and planning framework for agentic MLLMs. Specifically, we first reveal a stateful bottleneck in current agentic MLLMs: the sequential tool-use dependency limits both latency and concurrency. Based on this insight, we propose speculative reasoning that can skip full tool invocation loops for easy queries. To decide whether to bypass the tool-using model, we introduce answer separability gating, a new confidence metric based on top-K logit gaps. Extensive experiments on multiple benchmarks (including V* Bench, HR-Bench, POPE, DeepEyes, and Thyme) demonstrate that SpecEyes can achieve up to 2.9× speedup while maintaining comparable accuracy.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/28_specEyes.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 92, "added_date": "2026-04-02"}, {"title": "The Workload-Router-Pool Architecture for LLM Inference Optimization: A Vision Paper from the vLLM S", "authors": "Huamin Chen, Xunzhuo Liu, Bowei He, Fuyuan Lyu, Yankai Chen, Xue Liu, Yuhan Liu, Junchen Jiang", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "> ...caching, user-feedback-driven routing adaptation, hallucination detection, and hierarchical content-safety classification for privacy and jailbreak protection; (2) fleet optimization -- fleet provisioning and energy-efficiency analysis; (3) agentic and multimodal routing -- multimodal agent routing, tool selection, CUA security, and multi-turn context memory...", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/34_workload_router_pool.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 93, "added_date": "2026-04-02"}, {"title": "Infinite-LLM: Efficient LLM Service for Long Context with DistAttention and Distributed KVCache", "authors": "Bin Lin, Chen Zhang, Tao Peng, et al.", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2024, "abstract_en": "Large Language Models (LLMs) demonstrate substantial potential across a diverse array of domains via request serving. However, as trends continue to push for expanding context sizes, the autoregressive nature of LLMs results in highly dynamic behavior of the attention layers, showcasing significant differences in computational characteristics and memory requirements from the non-attention layers. This presents substantial challenges for resource management and performance optimization in service systems. Existing static model parallelism and resource allocation strategies fall short when dealing with this dynamicity. To address the issue, we propose Infinite-LLM, a novel LLM serving system designed to effectively handle dynamic context lengths. Infinite-LLM disaggregates attention layers from an LLM's inference process, facilitating flexible and independent resource scheduling that optimizes computational performance and enhances memory utilization jointly. By leveraging a pooled GPU memory strategy across a cluster, Infinite-LLM not only significantly boosts system throughput but also supports extensive context lengths. Evaluated on a dataset with context lengths ranging from a few to 2000K tokens across a cluster with 32 A100 GPUs, Infinite-LLM demonstrates throughput improvement of 1.35-3.4x compared to state-of-the-art methods, enabling efficient and elastic LLM deployment.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/01_infinite_llm.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 94, "added_date": "2026-04-02"}, {"title": "CXL-SpecKV: A Disaggregated FPGA Speculative KV-Cache for Datacenter LLM Serving", "authors": "Dong Liu, Yanxuan Yu", "arxiv_id": "2512.11920", "github_repo": "", "conference": "FPGA'26 Oral", "year": 2025, "abstract_en": "Large Language Models (LLMs) have revolutionized natural language processing tasks, but their deployment in datacenter environments faces significant challenges due to the massive memory requirements of key-value (KV) caches. During the autoregressive decoding process, KV caches consume substantial GPU memory, limiting batch sizes and overall system throughput. To address these challenges, we propose **CXL-SpecKV**, a novel disaggregated KV-cache architecture that leverages Compute Express Link (CXL) interconnects and FPGA accelerators to enable efficient speculative execution and memory disaggregation. Our approach introduces three key innovations: (i) a CXL-based memory disaggregation framework that offloads KV-caches to remote FPGA memory with low latency, (ii) a speculative KV-cache prefetching mechanism that predicts and preloads future tokens' cache entries, and (iii) an FPGA-accelerated KV-cache compression and decompression engine that reduces memory bandwidth requirements by up to 4×. When evaluated on state-of-the-art LLM models, CXL-SpecKV achieves up to 3.2× higher throughput compared to GPU-only baselines, while reducing memory costs by 2.8× and maintaining accuracy. Our system demonstrates that intelligent memory disaggregation combined with speculative execution can effectively address the memory wall challenge in large-scale LLM serving. Our code implementation has been open-sourced at [this https URL](https://github.com/FastLM/CXL-SpecKV).", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/26_cxl_specKV.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 96, "added_date": "2026-04-03"}, {"title": "Cactus: Accelerating Auto-Regressive Decoding with Constrained Acceptance Speculative Sampling", "authors": "Yongchang Hao, Lili Mou", "arxiv_id": "", "github_repo": "", "conference": "ICLR 2026", "year": 2026, "abstract_en": "Speculative sampling (SpS) has been successful in accelerating the decoding throughput of auto-regressive large language models by leveraging smaller draft models. SpS strictly enforces the generated distribution to match that of the verifier LLM. This is unnecessarily restrictive as slight variations of the verifier distribution, such as sampling with top-k or temperature, would also be acceptable. Typical acceptance sampling (TAS) alleviates this issue by accepting more tokens using entropy-based heuristics. However, this approach distorts the verifier distribution, potentially degrading output quality when the verifier encodes critical information. In this work, we formalize the speculative sampling algorithm through the lens of constrained optimization. Based on this formulation, we propose Cactus (constrained acceptance speculative sampling), a method that guarantees controlled divergence from the verifier distribution and increasing acceptance rates.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/04_cactus.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 97, "added_date": "2026-04-03"}, {"title": "S2D2: Fast Decoding for Diffusion LLMs via Training-Free Self-Speculation", "authors": "Ligong Wang, Hao Wang, Kai Xu, Akash Srivastava", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "> Block-diffusion language models offer a promising path toward faster-than-autoregressive generation by combining block-wise autoregressive decoding with within-block parallel denoising. However, in the few-step regime needed for practical acceleration, standard confidence-thresholded...", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/36_s2d2_diffusion.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 98, "added_date": "2026-04-03"}, {"title": "SJD-PV: Speculative Jacobi Decoding with Phrase Verification for Autoregressive Image Generation", "authors": "Zhehao Yu, Baoquan Zhang, Bingqi Shan, Xinhao Liu, Dongliang Zhou, Guotao Liang, Guangming Ye, Yunming Ye", "arxiv_id": "2603.0", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Autoregressive (AR) image models have recently demonstrated remarkable generative capability, but their sequential nature results in significant inference latency. Existing training-free acceleration methods typically verify tokens independently, overlooking the strong co-occurrence patterns between adjacent visual tokens.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/sjd_pv.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 99, "added_date": "2026-04-03"}, {"title": "KV Cache Optimization Strategies for Scalable and Efficient LLM Inference", "authors": "Yichun Xu, Navjot K. Khaira, Tejinder Singh", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "The key-value (KV) cache is a foundational optimization in Transformer-based large language models (LLMs), eliminating redundant recomputation of past token representations during autoregressive generation. However, its memory footprint scales linearly with context length, imposing critical bottlenecks on GPU memory capacity, memory bandwidth, and serving throughput.\n\n本文研究了KV cache的优化策略，针对LLM推理中的内存瓶颈提出系统性解决方案。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/kv_cache_optimization_strategies.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 100, "added_date": "2026-04-03"}, {"title": "Cross-Family Speculative Prefill: Training-Free Long-Context Compression with Small Draft Models", "authors": "Shubhangi Upasani, Ravi Shanker Raju, Bo Li, Mengmeng Ji, John Long, Chen Wu, Urmish Thakker, Guangtao Wang", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Prompt length is a major bottleneck in agentic large language model (LLM) workloads, where repeated inference steps and multi-call loops incur substantial prefill cost. Recent work on speculative decoding has primarily focused on the decoding phase, neglecting the prefill stage which dominates latency in long-context scenarios.\n\n在智能体LLM工作负载中，提示长度是一个主要瓶颈，重复推理步骤和多轮调用会产生大量prefill成本。最近的投机解码工作主要集中于解码阶段，忽略了在长上下文场景中占据主导地位的prefill阶段。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/cross_family_speculative_prefill.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 101, "added_date": "2026-04-04"}, {"title": "Speculative Speculative Decoding", "authors": "Tanishq Kumar, Tri Dao, Avner May", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "### English\nAutoregressive decoding is bottlenecked by its sequential nature. Speculative decoding addresses this by using a draft model to propose tokens in parallel. We go one step further with Speculative Speculative Decoding (SSD), which uses the target model itself to generate speculative candidates. By leveraging the target model's own representations, SSD eliminates the need for a separate draft model while achieving comparable speedups. We show that self-speculation can achieve 1.5-2x speedup with minimal quality degradation.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/10_speculative_squared.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 102, "added_date": "2026-04-04"}, {"title": "FlexServe: A Fast and Secure LLM Serving System for Mobile Devices with Flexible Resource Isolation", "authors": "Yinpeng Wu, Yitong Chen, Lixiang Wang, Jinyu Gu, Zhichao Hua, Yubin Xia", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Device-side Large Language Models (LLMs) have witnessed explosive growth, offering higher privacy and availability compared to cloud-side LLMs. During LLM inference, both model weights and user data are valuable, and attackers may even compromise the OS kernel to steal them. ARM TrustZone is the de facto hardware-based isolation technology on mobile devices, used to protect sensitive applications from a compromised OS. However, protecting LLM inference with TrustZone incurs significant overhead due to its inflexible isolation of memory and the NPU. To address these challenges, this paper introduces FlexServe, a fast and secure LLM serving system for mobile devices. It first introduces a Flexible Resource Isolation mechanism to construct Flexible Secure Memory (Flex-Mem) and Flexible Secure NPU (Flex-NPU). Both memory pages and the NPU can be efficiently switched between unprotected and protected modes. Based on these mechanisms, FlexServe designs a fast and secure LLM inference framework within TrustZone's secure world. The LLM-Aware Memory Management and Secure Inference Pipeline are introduced to accelerate inference. A Multi-Model Scheduler is proposed to optimize multi-model workflows. We implement a prototype of FlexServe and compare it with two TrustZone-based strawman designs. The results show that FlexServe achieves an average 10.05× speedup in Time to First Token (TTFT) compared to the strawman, and an average 2.44× TTFT speedup compared to an optimized strawman with pipeline and secure NPU enabled. For multi-model agent workflows, the end-to-end speedup is up to 24.30× and 4.05× compared to the strawman and optimized strawman, respectively.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/27_flexserve.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 103, "added_date": "2026-04-04"}, {"title": "TIDE: Temporal Incremental Draft Engine for Self-Improving LLM Inference", "authors": "Jiyoung Park, Hankyu Jang, Changseok Song, Wookeun Jung", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Speculative decoding has emerged as a promising solution to accelerate large language model inference by leveraging a small draft model to propose candidate tokens in parallel and a large target model to verify them. However, existing speculative decoding approaches rely on static draft models that are not optimized for the specific inference workload, leading to suboptimal speedup. We present TIDE, a temporal incremental draft engine that enables continuous self-improvement of the draft model throughout the inference process. TIDE extracts high-quality generation patterns from the target model's outputs and incrementally updates the draft model, allowing it to adapt to the evolving distribution of inference requests. Our experiments show that TIDE achieves up to 2.1x speedup over state-of-the-art speculative decoding methods.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/02_tide.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 105, "added_date": "2026-04-04"}, {"title": "Rocks, Pebbles and Sand: Modality-aware Scheduling for Multimodal Large Language Model Inference", "authors": "Konstantinos Papaioannou, Thaleia Dimitra Doudali, et al.", "arxiv_id": "2603.26498", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Multimodal Large Language Models (MLLMs) power platforms like ChatGPT, Gemini, and Copilot, enabling richer interactions with text, images, and videos. These heterogeneous workloads introduce additional inference stages, such as vision preprocessing and encoding, that inflate latency and memory demand. Existing LLM serving systems, optimized for text-only workloads, fail under multimodality: large requests (e.g., videos) monopolize resources, causing severe head-of-line blocking and performance degradation. Our key insight is that multimodal requests differ by orders of magnitude in resource demands, which we capture through a simple abstraction: videos behave like rocks, images like pebbles, and text like sand. We design RPS-Serve, a modality-aware scheduler that lets sand flow quickly through pebbles and rocks, ensuring interactive responsiveness while avoiding starvation. RPS-Serve classifies requests, prioritizes them dynamically, and applies aging to avoid starvation. Evaluation across state-of-the-art MLLMs shows that RPS-Serve reduces, on average, time-to-first-token (TTFT) by 54% overall, and by 78.5% for latency-critical requests, compared to current systems.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/38_rocks_pebbles_sand.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 106, "added_date": "2026-04-05"}, {"title": "TokenDance: Scaling Multi-Agent LLM Serving via Collective KV Cache Sharing", "authors": "Zhuohang Bian, Feiyang Wu, Chengrui Zhang, Hangcheng Dong, Yun Liang, Youwei Zhuo", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "year": 2026, "abstract_en": "Multi-agent LLM applications organize execution in synchronized rounds where a central scheduler gathers outputs from all agents and redistributes the combined context. This All-Gather communication pattern creates massive KV Cache redundancy, because every agent's prompt contains the same shared output blocks, yet existing reuse methods fail to exploit it efficiently. We present TokenDance, a system that scales the number of concurrent agents by exploiting the All-Gather pattern for collective KV Cache sharing. TokenDance's KV Collector performs KV Cache reuse over the full round in one collective step, so the cost of reusing a shared block is paid once regardless of agent count. Its Diff-Aware Storage encodes sibling caches as block-sparse diffs against a single master copy, achieving 11-17x compression on representative workloads. Evaluation on GenerativeAgents and AgentSociety shows that TokenDance supports up to 2.7x more concurrent agents than vLLM with prefix caching under SLO requirement, reduces per-agent KV Cache storage by up to 17.5x, and achieves up to 1.9x prefill speedup over per-request position-independent caching.", "abstract_cn": "", "intro_en": "Multi-agent LLM systems have emerged as a powerful paradigm for complex task solving, where multiple LLM agents collaborate to handle sophisticated workflows. These systems typically organize execution in synchronized rounds, where agents process their assigned tasks and share results through a central scheduler. However, this architectural pattern introduces significant KV Cache redundancy, as all agents' prompts contain common system prompts, shared context, and previously generated content.", "intro_cn": "", "file": "./arxiv/2026/12_tokendance.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 107, "added_date": "2026-04-05"}, {"title": "DFlash: Block Diffusion for Flash Speculative Decoding", "authors": "Jian Chen, Yesheng Liang, Zhijian Liu", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "## 摘要 (中文)\n自回归大型语言模型（LLM）虽然性能强大，但需要固有的顺序解码，导致高推理延迟和GPU利用率低。投机解码通过使用快速draft模型来缓解这一瓶颈，该模型的输出由目标LLM并行验证；然而，现有方法仍然依赖于自回归drafting，这仍然是顺序的，限制了实际的加速。扩散LLM通过实现并行生成提供了另一种有前途的方案，但当前的扩散模型通常比自回归模型性能差。在本文中，我们引入了DFlash，这是一种使用轻量级块扩散模型进行并行drafting的投机解码框架。通过在单个前向传播中生成draft tokens，并将draft模型 conditioning 在从目标模型提取的上下文特征上，DFlash能够生成高质量输出和更高的接受率。实验表明，DFlash在各种模型和任务上实现了超过6倍的无损加速，比最新的投机解码方法EAGLE-3高出2.5倍。", "abstract_cn": "## 摘要 (中文)\n自回归大型语言模型（LLM）虽然性能强大，但需要固有的顺序解码，导致高推理延迟和GPU利用率低。投机解码通过使用快速draft模型来缓解这一瓶颈，该模型的输出由目标LLM并行验证；然而，现有方法仍然依赖于自回归drafting，这仍然是顺序的，限制了实际的加速。扩散LLM通过实现并行生成提供了另一种有前途的方案，但当前的扩散模型通常比自回归模型性能差。在本文中，我们引入了DFlash，这是一种使用轻量级块扩散模型进行并行drafting的投机解码框架。通过在单个前向传播中生成draft tokens，并将draft模型 conditioning 在从目标模型提取的上下文特征上，DFlash能够生成高质量输出和更高的接受率。实验表明，DFlash在各种模型和任务上实现了超过6倍的无损加速，比最新的投机解码方法EAGLE-3高出2.5倍。\n\n## 核心贡献\n1. **并行生成**: 首次将块扩散模型应用于投机解码，实现单次前向传播生成多个draft tokens\n2. **上下文条件化**: 通过从目标模型提取上下文特征来提高draft质量\n3. **高性能**: 在各种模型和任务上实现超过6倍的无损加速\n\n## 技术细节\n- **方法**: 使用轻量级块扩散模型进行并行drafting\n- **特点**: 在单个前向pass中生成draft tokens\n- **优势**: 比EAGLE-3高2.5倍的加速", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/dflash_block_diffusion.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 108, "added_date": "2026-04-05"}, {"title": "CacheSolidarity: Preventing Prefix Caching Side Channels in Multi-tenant LLM Serving Systems", "authors": "Panagiotis Georgios Pennas, Konstantinos Papaioannou, Marco Guarnieri, Thaleia Dimitra Doudali", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Large Language Models (LLMs) rely on optimizations like Automatic Prefix Caching (APC) to accelerate inference. APC works by reusing previously computed states for the beginning part of a request (prefix), when another request starts with the same text. While APC improves throughput, it introduces timing side channels: cache hits are faster than misses, creating observable latency differences. In multi-tenant systems, attackers can exploit these differences to infer sensitive information, e.g., by incrementally reconstructing another user's request by observing hit/miss patterns. Current defenses take a sledgehammer approach: they disable APC and cache sharing, isolating users, and sacrificing efficiency for regular users. This paper presents CacheSolidarity, a system that secures multi-tenant LLM serving systems against APC side channels without sacrificing performance and efficiency. CacheSolidarity monitors cache reuse across users, flags suspicious sharing, and selectively isolates prefixes, restricting their reuse only when necessary. Evaluation shows that CacheSolidarity enables up to 70% higher cache reuse and 30% lower inference latency compared to existing defenses that isolate users. CacheSolidarity's lightweight design demonstrates how security in LLM serving does not have to come at the cost of unnecessarily reduced performance or unbearable overheads.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/30_cachesolidarity.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 111, "added_date": "2026-04-06"}, {"title": "StarSD: One-for-Many Speculative Decoding", "authors": "Unknown", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "## 关键词\n- Speculative Decoding\n- One-for-Many\n- Multi-Target", "abstract_cn": "## 关键词\n- Speculative Decoding\n- One-for-Many\n- Multi-Target", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/starsd_one_for_many_speculative.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 112, "added_date": "2026-04-06"}, {"title": "When Drafts Evolve: Speculative Decoding Meets Online Learning", "authors": "Yu-Yang Qian, Hao-Cong Wu, Yichao Fu, Hao Zhang, Peng Zhao", "arxiv_id": "2603.1", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Speculative decoding has emerged as a widely adopted paradigm for accelerating large language model inference, where a lightweight draft model rapidly generates candidate tokens that are then verified in parallel by a larger target model. However, due to limited model capacity, drafts often struggle to approximate the target distribution, resulting in shorter acceptance lengths and diminished speedup gains.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/drafts_evolve.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 113, "added_date": "2026-04-06"}, {"title": "ParetoBandit: Budget-Paced Adaptive Routing for Non-Stationary LLM Serving", "authors": "Annette Taberner-Miller", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "### English\nProduction LLM serving often relies on multi-model portfolios spanning a ~530x cost range, where routing decisions trade off quality against cost. This trade-off is non-stationary: providers revise pricing, model quality can regress silently, and new models must be integrated without downtime. We present ParetoBandit, a budget-paced adaptive routing system that treats routing as a multi-armed bandit problem with budget constraints. ParetoBandit uses Thompson Sampling with Pareto optimization to balance exploration-exploitation while respecting budget limits. Our deployment in a production serving system shows that ParetoBandit achieves 45% cost reduction while maintaining 99% of the quality metrics.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/03_paretobandit.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 115, "added_date": "2026-04-06"}, {"title": "DIVERSED: Relaxed Speculative Decoding via Dynamic Ensemble Verification", "authors": "Ziyi Wang, Siva Rajesh Kasa, Ankith M S, Santhosh Kumar Kasa, Jiaru Zou, Sumit Negi, Ruqi Zhang, Nan Jiang, Qifan Song", "arxiv_id": "", "github_repo": "", "conference": "AISTATS 2026", "year": 2026, "abstract_en": "Speculative decoding is an effective technique for accelerating large language model inference by drafting multiple tokens in parallel. In practice, its speedup is often bottlenecked by a rigid verification step that strictly enforces the accepted token distribution to exactly match the target model. This constraint leads to the rejection of many plausible tokens, lowering the acceptance rate and limiting overall time speedup. To overcome this limitation, we propose Dynamic Verification Relaxed Speculative Decoding (DIVERSED), a relaxed verification framework that improves time efficiency while preserving generation quality. DIVERSED learns an ensemble-based verifier that blends the draft and target model distributions with a task-dependent and context-dependent weight.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/04_diversed.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 118, "added_date": "2026-04-07"}, {"title": "DWDP: Distributed Weight Data Parallelism for High-Performance LLM Inference on NVL72", "authors": "Wanqian Li, Jintao Peng, Zongfei Jing, Tianyu Zhang, Ze Long, Xianjie Qiao, Xiaoming Chen, Dongxu Yang, Kefeng Duan, June Yang", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "### English\nLarge language model (LLM) inference increasingly depends on multi-GPU execution, yet existing inference parallelization strategies require layer-wise inter-rank synchronization, making end-to-end performance sensitive to workload imbalance. We present DWDP (Distributed Weight Data Parallelism), an inference parallelization strategy that preserves data-parallelism across the entire LLM and eliminates inter-layer synchronization. DWDP distributes model weights across GPU memory hierarchy and performs weight updates asynchronously using high-bandwidth NVLink interconnects. Our evaluation on a 72-GPU NVL72 cluster demonstrates that DWDP achieves up to 2.1x speedup over state-of-the-art tensor parallelism while maintaining identical output quality.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/01_dwdp.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 119, "added_date": "2026-04-07"}, {"title": "ConFu: Contemplate the Future for Better Speculative Sampling", "authors": "Zongyue Qin, Raghavv Goel, Mukul Gagrani, Risheek Garrepalli, Mingu Lee, Yizhou Sun", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "### English\nSpeculative sampling aims to accelerate autoregressive generation by proposing multiple tokens in parallel and verifying them together. However, existing methods treat token proposal and verification as separate stages without considering future acceptance likelihood. We propose ConFu (Contemplate the Future), which introduces a lookahead mechanism that evaluates the future acceptance probability of candidate tokens during the proposal phase. By prioritizing candidates with higher future acceptance likelihood, ConFu achieves higher acceptance rates and better overall throughput. Experiments show ConFu improves acceptance rate by 15-25% compared to baseline methods.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/08_confu.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 120, "added_date": "2026-04-07"}, {"title": "PROTEUS: SLA-Aware Routing via Lagrangian RL for Multi-LLM Serving Systems", "authors": "Amit Singh Bhatti, Vishal Vaddina, Dagnachew Birru", "arxiv_id": "", "github_repo": "", "conference": "arXiv (EuroMLSys 2026)", "year": 2026, "abstract_en": "Production LLM deployments increasingly leverage multiple specialized models to handle diverse query types, necessitating intelligent routing mechanisms that direct requests to appropriate backend models while meeting Service Level Objectives (SLOs). We present PROTEUS, a novel reinforcement learning framework for SLA-aware request routing in multi-LLM serving systems. Unlike prior work that treats routing as a static optimization problem, PROTEUS formulates it as a sequential decision-making task and employs Lagrangian-based RL to jointly optimize for both SLO compliance and system throughput. Our approach dynamically adapts to varying query workloads and model performance characteristics, learned through continuous interaction with the serving system. We evaluate PROTEUS on a production-like multi-LLM serving cluster handling diverse query patterns. Results show that PROTEUS reduces SLO violations by 34% while maintaining 28% higher throughput compared to state-of-the-art routing policies.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/proteus.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 121, "added_date": "2026-04-08"}, {"title": "Edge-Cloud Collaborative Speech Emotion Captioning via Token-Level Speculative Decoding", "authors": "Xiangyuan Xue, Jiajun Lu, Yan Gao, Gongping Huang, Ting Dang, Hong Jia", "arxiv_id": "2603.1", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Speech Emotion Captioning (SEC) leverages large audio-language models to generate rich, context-aware affective descriptions from speech. However, real-world deployment remains challenging due to the substantial computational demands on resource-constrained edge devices and the privacy risks of transmitting biometric audio.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/edge_cloud_sec.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 122, "added_date": "2026-04-08"}, {"title": "MARS: Enabling Autoregressive Models Multi-Token Generation", "authors": "Ziqi Jin, Lei Wang, Ziwei Luo, Aixin Sun", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Autoregressive (AR) language models generate text one token at a time, even when consecutive tokens are highly predictable given earlier context. We introduce MARS (Mask AutoRegreSsion), a lightweight fine-tuning method that teaches an instruction-tuned AR model to predict multiple tokens per forward pass. MARS adds no architectural modifications, no extra parameters, and produces a single model that can still be called exactly like the original AR model with no performance degradation. Unlike speculative decoding, which maintains a separate draft model alongside the target, or multi-head approaches such as Medusa, which attach additional prediction heads, MARS requires only continued training on existing instruction data.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/04_mars.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 123, "added_date": "2026-04-08"}, {"title": "Quasar: Quantized Self-Speculative Acceleration for Rapid Inference via Memory-Efficient Verificatio", "authors": "Guang Huang, Zeyi Wen", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "### English\nWe present Quasar, a quantized self-speculative acceleration framework that combines model quantization with self-speculation for efficient LLM inference. Unlike traditional speculative decoding that requires a separate draft model, Quasar uses the quantized target model to generate its own speculative candidates. The key innovation is a memory-efficient verification scheme that enables fast validation of self-generated candidates with minimal overhead. Quasar achieves 2.5x speedup while reducing memory usage by 40%.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/12_quasar.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 124, "added_date": "2026-04-08"}, {"title": "CHESS: Context-aware Hierarchical Efficient Semantic Selection for Long-Context LLM Inference", "authors": "Chao Fei, Guozhong Li, Chenxi Liu, Panos Kalnis", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Long-context LLMs demand accurate and efficient context selection mechanisms. We propose CHESS, a hierarchical semantic selection framework that efficiently identifies the most relevant context segments for each query. Our approach reduces computational complexity while maintaining model quality.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/CHESS.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 126, "added_date": "2026-04-09"}, {"title": "MemBoost: A Memory-Boosted Framework for Cost-Aware LLM Inference", "authors": "Joris Köster, Zixuan Liu, Siavash Khajavi, Zizhan Zheng", "arxiv_id": "2603.26557", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Large Language Models (LLMs) deliver strong performance but incur high inference cost in real-world services, especially under workloads with repeated or near-duplicate queries across users and sessions. In this work, we propose MemBoost, a memory-boosted LLM serving framework that enables a lightweight model to reuse previously generated answers and retrieve relevant supporting information for cheap inference, while selectively escalating difficult or uncertain queries to a stronger model. Unlike standard retrieval-augmented generation, which primarily grounds a single response, MemBoost is designed for interactive settings by supporting answer reuse, continual memory growth, and cost-aware routing. Experiments across multiple models under simulated workloads show that MemBoost substantially reduces expensive large-model invocations and overall inference cost, while maintaining high answer quality comparable to the strong model baseline.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/37_memboost.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 128, "added_date": "2026-04-09"}, {"title": "KV Cache Offloading for Context-Intensive Tasks", "authors": "Andrey Bocharnikov, Ivan Ermakov, Denis Kuznedelev, Vyacheslav Zhdanovskiy, Yegor Yershov", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "With the growing demand for long-context LLMs across a wide range of applications, the key-value (KV) cache has become a critical bottleneck for both latency and memory usage. Recently, KV-cache offloading has emerged as a promising approach to reduce memory footprint and inference latency while preserving accuracy. Prior evaluations have largely focused on tasks that do not require extracting large amounts of information from the context. In this work, we study KV-cache offloading on context-intensive tasks: problems where the solution requires looking up a lot of information from the input prompt. We create and release the Text2JSON benchmark, a highly context-intensive task that requires extracting structured knowledge from raw text. We evaluate modern KV offloading on Text2JSON and other context-intensive tasks and find significant performance degradation on both Llama 3 and Qwen 3 models.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/04_kv_offloading.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 129, "added_date": "2026-04-09"}, {"title": "TriForce: Lossless Acceleration of Long Sequence Generation with Hierarchical Speculative Decoding", "authors": "(待补充)", "arxiv_id": "", "github_repo": "Infini-AI-Lab/TriForce", "conference": "COLM 2024", "year": 2024, "abstract_en": "TriForce presents a hierarchical speculative decoding approach that uses multiple levels of draft models to achieve lossless acceleration of long sequence generation, addressing the verification bottleneck in tree-based methods.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./colm/triforce.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 130, "added_date": "2026-04-09"}, {"title": "LayerSkip: Enabling Early Exit Inference and Self-Speculative Decoding", "authors": "(待补充)", "arxiv_id": "", "github_repo": "facebookresearch/LayerSkip", "conference": "ACL 2024", "year": 2024, "abstract_en": "LayerSkip combines early exit inference with self-speculative decoding, allowing LLMs to dynamically skip layers during inference based on sample difficulty, while using the same model for both draft generation and verification.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./aclp/layerskip.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 131, "added_date": "2026-04-10"}, {"title": "KVQuant: Towards 10 Million Context Length LLM Inference with KV Cache Quantization", "authors": "(待补充)", "arxiv_id": "", "github_repo": "SqueezeAILab/KVQuant", "conference": "NeurIPS 2024", "year": 2024, "abstract_en": "This paper presents KVQuant, a KV cache quantization method that enables LLM inference with context lengths up to 10 million tokens. The method uses per-channel scaling and asymmetric quantization to preserve accuracy.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./neurips/kvquant.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 132, "added_date": "2026-04-10"}, {"title": "NanoFlow: Towards Optimal Large Language Model Serving Throughput", "authors": "Kan Zhu, Yufei Gao, Yilong Zhao, Liangyu Zhao, Gefei Zuo, Yile Gu, Dedong Xie, Tian Tang, Qinyu Xu, Zihao Ye, Keisuke Kamahori, Chien-Yu Lin, Ziren Wang, Stephanie Wang, Arvind Krishnamurthy, Baris Ka", "arxiv_id": "", "github_repo": "", "conference": "OSDI 2025", "year": 2025, "abstract_en": "Large Language Models (LLMs) have resulted in a surging demand for planet-scale serving. Despite significant advancements in LLM inference systems, achieving optimal throughput remains challenging due to the complex interplay between GPU compute and memory resources across the entire serving pipeline.\n\nThrough a detailed analysis, we show that despite having memory-intensive components, end-to-end LLM serving is **compute bound** for most common workloads and LLMs.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./osdi/2025/nanoflow_optimal_serving.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 133, "added_date": "2026-04-10"}, {"title": "DeFT: Decoding with Flash Tree-attention for Efficient Tree-structured LLM Inference", "authors": "(待补充)", "arxiv_id": "", "github_repo": "LINs-lab/DeFT", "conference": "ICLR 2025", "year": 2025, "abstract_en": "DeFT introduces Flash Tree-attention for efficient tree-structured speculative decoding, optimizing the attention computation over tree-shaped token sequences to accelerate LLM inference.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./iclr/deft.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Attention", "id": 134, "added_date": "2026-04-10"}, {"title": "DuoAttention: Efficient Long-Context LLM Inference with Retrieval and Streaming Heads", "authors": "(待补充)", "arxiv_id": "", "github_repo": "mit-han-lab/duo-attention", "conference": "ICLR 2025", "year": 2025, "abstract_en": "DuoAttention introduces a dual-head attention mechanism that separates retrieval and streaming workloads, enabling efficient long-context LLM inference with reduced memory and compute requirements.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./iclr/duo_attention.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Attention", "id": 135, "added_date": "2026-04-10"}, {"title": "SWIFT: On-the-Fly Self-Speculative Decoding for LLM Inference Acceleration", "authors": "(待补充)", "arxiv_id": "", "github_repo": "hemingkx/SWIFT", "conference": "ICLR 2025", "year": 2025, "abstract_en": "SWIFT presents an on-the-fly self-speculative decoding approach that allows a single LLM to generate speculative drafts without requiring a separate draft model, reducing latency while maintaining output quality.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./iclr/swift.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 136, "added_date": "2026-04-11"}, {"title": "Pie: A Programmable Serving System for Emerging LLM Applications", "authors": "In Gim 等", "arxiv_id": "", "github_repo": "", "conference": "SOSP 2025", "year": 2025, "abstract_en": "Emerging large language model (LLM) applications involve diverse reasoning strategies and agentic workflows, straining the capabilities of existing serving systems built on a monolithic token generation loop. This paper introduces **Pie**, a programmable LLM serving system designed for flexibility and efficiency. \n\nPie decomposes the traditional generation loop into fine-grained service handlers exposed via an API and delegates control of the generation process to user-provided programs, called **inferlets**. This enables applications to implement new KV cache strategies, bespoke generation logic, and seamlessly integrate computation and I/O—entirely within the application, without requiring modifications to the serving system.\n\nPie executes inferlets using WebAssembly, benefiting from its lightweight sandboxing.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./sosp/2025/pie_programmable_serving.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 138, "added_date": "2026-04-11"}, {"title": "Fast State Restoration in LLM Serving with HCache", "authors": "Shiwei Gao 等", "arxiv_id": "", "github_repo": "", "conference": "EuroSys 2025", "year": 2025, "abstract_en": "The growing complexity of LLM usage today, e.g., multi-round conversation and retrieval-augmented generation (RAG), makes contextual states (i.e., KV cache) reusable across user requests. Given the capacity constraints of GPU memory, only a limited number of contexts can be cached on GPU for reusing. Existing inference systems typically evict part of the KV cache and restore it by recomputing it from the original tokens or offloading it to host storage for later retrieval, both of which introduce substantial computational or I/O overheads.\n\nWe propose **HCache**, a novel LLM state restoration method. Its key idea is to restore LLM states from intermediate activations and thus utilize computational and I/O resources with low overhead.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./eurosys/2025/hcache_state_restoration.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 139, "added_date": "2026-04-11"}, {"title": "M2XFP: A Metadata-Augmented Microscaling Data Format for Efficient Low-bit Quantization", "authors": "Weiming Hu, Zihan Zhang, Haoyan Zhang, Chen Zhang, Cong Guo, Yu Feng, Tianchi Hu, Guanglin Li, Guipeng Hu, Junsong Wang, Jingwen Leng", "arxiv_id": "2601.19213", "github_repo": "", "conference": "ASPLOS 2026", "year": 2026, "abstract_en": "Existing low-bit Microscaling (MX) formats, such as MXFP4, often suffer from substantial accuracy degradation due to the use of a shared scaling factor with the Power-of-Two format. In this work, we explore strategies that introduce minimal metadata to recover accuracy lost during quantization while maintaining high bit efficiency across a wide range of large language models.\n\nWe propose a complete algorithm-hardware co-design based on flexible metadata, featuring an online quantization with simple encoding. To support the proposed method efficiently, we implement a lightweight hardware unit and integrate it into the accelerator.\n\nEvaluation results demonstrate that our method substantially narrows the accuracy gap, achieving on average a 70.63% reduction in accuracy loss compared to MXFP4 and a 37.30% reduction relative to the latest NVFP4 on LLM benchmarks. Furthermore, our design delivers up to 1.91× speedup and 1.75× energy savings over state-of-the-art accelerators. Our code is available at this https URL.", "abstract_cn": "## Abstract (摘要)\n\nExisting low-bit Microscaling (MX) formats, such as MXFP4, often suffer from substantial accuracy degradation due to the use of a shared scaling factor with the Power-of-Two format. In this work, we explore strategies that introduce minimal metadata to recover accuracy lost during quantization while maintaining high bit efficiency across a wide range of large language models.\n\nWe propose a complete algorithm-hardware co-design based on flexible metadata, featuring an online quantization with simple encoding. To support the proposed method efficiently, we implement a lightweight hardware unit and integrate it into the accelerator.\n\nEvaluation results demonstrate that our method substantially narrows the accuracy gap, achieving on average a 70.63% reduction in accuracy loss compared to MXFP4 and a 37.30% reduction relative to the latest NVFP4 on LLM benchmarks. Furthermore, our design delivers up to 1.91× speedup and 1.75× energy savings over state-of-the-art accelerato", "intro_en": "", "intro_cn": "", "file": "./asplops26/08_M2XFP.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Compression", "id": 140, "added_date": "2026-04-11"}, {"title": "SNIP: An Adaptive Mixed Precision Framework for Subbyte Large Language Model Training", "authors": "Yunjie Pan, Yao Fu, Ziheng Qiao, Chengmai Mao, Yining Qi, Tianchen Du, Hongxiang Li, Lanbo Li, Chen Liang, Yong Li, Dilin Wang, Wei Liu", "arxiv_id": "2602.01410", "github_repo": "", "conference": "ASPLOS 2026", "year": 2026, "abstract_en": "Training large language models (LLMs) efficiently while preserving model quality poses significant challenges, particularly with subbyte precision supported by state-of-the-art GPUs. Current mixed-precision training approaches either apply uniform precision to all GEMM operations or rely on heuristic-based methods that fail to generalize during training, leading to suboptimal convergence and instability. To address these challenges, this paper introduces SNIP, a fine-grained adaptive mixed-precision training framework for LLM pretraining that supports subbyte precision.\n\nSNIP periodically collects statistics on activations, gradients, and optimizer states to assess the precision loss impact on model quality. We define two key metrics:\n\n- **Loss divergence in the forward pass**: Caused by quantization-induced increases in training loss\n- **Weight divergence in the backward pass**: Measures error propagation through gradients affecting model updates\n\nThese metrics guide an Integer Linear Programming (ILP) problem that systematically optimizes layerwise precision to minimize overall quality loss while meeting efficiency targets.\n\nExperiments on 1B, 3B, 7B and 70B Llama-like models demonstrate that SNIP consistently outperforms existing baselines, reducing FLOPs by up to 80% while preserving model quality across different model sizes and training phases with minimal computational overhead.", "abstract_cn": "## Abstract (摘要)\n\nTraining large language models (LLMs) efficiently while preserving model quality poses significant challenges, particularly with subbyte precision supported by state-of-the-art GPUs. Current mixed-precision training approaches either apply uniform precision to all GEMM operations or rely on heuristic-based methods that fail to generalize during training, leading to suboptimal convergence and instability. To address these challenges, this paper introduces SNIP, a fine-grained adaptive mixed-precision training framework for LLM pretraining that supports subbyte precision.\n\nSNIP periodically collects statistics on activations, gradients, and optimizer states to assess the precision loss impact on model quality. We define two key metrics:\n\n- **Loss divergence in the forward pass**: Caused by quantization-induced increases in training loss\n- **Weight divergence in the backward pass**: Measures error propagation through gradients affecting model updates\n\nThese metrics guide", "intro_en": "", "intro_cn": "", "file": "./asplops26/07_SNIP.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 141, "added_date": "2026-04-12"}, {"title": "RedFuser: An Automatic Operator Fusion Framework for Cascaded Reductions on AI Accelerators", "authors": "Xinsheng Tang, Yuhui Zhao, Jintao Li, Jiaming Xu, Shuo Li, Jiansong Chen, Chen Zhang, Yong Li, Xiaoyong Liu, Ji Liu, Jin Wang, Wei Lin", "arxiv_id": "2603.10026", "github_repo": "", "conference": "ASPLOS 2026", "year": 2026, "abstract_en": "Operator fusion, as a key performance optimization technique in the deployment of AI models, significantly improves execution efficiency and has been widely adopted in modern AI compilers. However, for cascaded reduction operations involving multiple loops with inter-loop data dependencies, such as the safe softmax followed by GEMM within attention mechanisms, existing compilers lack effective automated fusion and kernel generation capabilities. Although some works have addressed specific instances through hand-crafted fusion strategies, their solutions are limited in generality and difficult to extend to other similar structures. Given the prevalence of such computational patterns in deep learning models, there remains significant untapped potential in achieving general and automated fusion optimization.\n\nIn this paper, we present a formal theoretical methodology for analyzing cascaded reductions which can fuse them into a single loop and introduce an incremental computation form. Based on this methodology, we design Reduction Fuser (RedFuser), a framework that automatically identifies supported cascaded reduction patterns and generates optimized fused kernels. Experiments show that RedFuser successfully fuses diverse workloads, achieving up to 2× to 5× speedup over state-of-the-art AI compilers and matching the performance of highly optimized hand-written kernels. The code is available at this https URL.", "abstract_cn": "## Abstract (摘要)\n\nOperator fusion, as a key performance optimization technique in the deployment of AI models, significantly improves execution efficiency and has been widely adopted in modern AI compilers. However, for cascaded reduction operations involving multiple loops with inter-loop data dependencies, such as the safe softmax followed by GEMM within attention mechanisms, existing compilers lack effective automated fusion and kernel generation capabilities. Although some works have addressed specific instances through hand-crafted fusion strategies, their solutions are limited in generality and difficult to extend to other similar structures. Given the prevalence of such computational patterns in deep learning models, there remains significant untapped potential in achieving general and automated fusion optimization.\n\nIn this paper, we present a formal theoretical methodology for analyzing cascaded reductions which can fuse them into a single loop and introduce an incremental com", "intro_en": "", "intro_cn": "", "file": "./asplops26/06_RedFuser.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 142, "added_date": "2026-04-12"}, {"title": "LAER-MoE: Load-Adaptive Expert Re-layout for Efficient Mixture-of-Experts Training", "authors": "Xinyi Liu, Zijian Zhang, YongLi Zhu, Jiale Zhang, Peng Sun, XuanWang, Qi Qi, Jingren Zhou, Tong Yang, Bin Cui", "arxiv_id": "2602.11686", "github_repo": "", "conference": "ASPLOS 2026", "year": 2026, "abstract_en": "Expert parallelism is vital for effectively training Mixture-of-Experts (MoE) models, enabling different devices to host distinct experts, with each device processing different input data. However, during expert parallel training, dynamic routing results in significant load imbalance among experts: a handful of overloaded experts hinder overall iteration, emerging as a training bottleneck.\n\nIn this paper, we introduce LAER-MoE, an efficient MoE training framework. The core of LAER-MoE is a novel parallel paradigm, Fully Sharded Expert Parallel (FSEP), which fully partitions each expert parameter by the number of devices and restores partial experts at expert granularity through All-to-All communication during training. This allows for flexible re-layout of expert parameters during training to enhance load balancing. In particular, we perform fine-grained scheduling of communication operations to minimize communication overhead. Additionally, we develop a load balancing planner to formulate re-layout strategies of experts and routing schemes for tokens during training. We perform experiments on an A100 cluster, and the results indicate that our system achieves up to 1.69x acceleration compared to the current state-of-the-art training systems. Source code available at this https URL.", "abstract_cn": "## Abstract (摘要)\n\nExpert parallelism is vital for effectively training Mixture-of-Experts (MoE) models, enabling different devices to host distinct experts, with each device processing different input data. However, during expert parallel training, dynamic routing results in significant load imbalance among experts: a handful of overloaded experts hinder overall iteration, emerging as a training bottleneck.\n\nIn this paper, we introduce LAER-MoE, an efficient MoE training framework. The core of LAER-MoE is a novel parallel paradigm, Fully Sharded Expert Parallel (FSEP), which fully partitions each expert parameter by the number of devices and restores partial experts at expert granularity through All-to-All communication during training. This allows for flexible re-layout of expert parameters during training to enhance load balancing. In particular, we perform fine-grained scheduling of communication operations to minimize communication overhead. Additionally, we develop a load balancin", "intro_en": "", "intro_cn": "", "file": "./asplops26/04_LAER-MoE.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "MoE", "id": 143, "added_date": "2026-04-12"}, {"title": "SpeContext: Enabling Efficient Long-context Reasoning with Speculative Context Sparsity in LLMs", "authors": "Jiaming Xu, Hong Cao, Yuhan Lin, Jinyang Li, Zheng Liu, Jie Liu, Xingyu Li, Jin Wang, Jingyuan Jia, Ge Li", "arxiv_id": "2512.00722", "github_repo": "", "conference": "ASPLOS 2026", "year": 2026, "abstract_en": "In this paper, we point out that the objective of the retrieval algorithms is to align with the LLM, which is similar to the objective of knowledge distillation in LLMs. We analyze the similarity in information focus between the distilled language model (DLM) and the original LLM from the perspective of information theory, and thus propose a novel paradigm that leverages a DLM as the retrieval algorithm. Based on the insight, we present SpeContext, an algorithm and system co-design for long-context reasoning.\n\n1. **At the algorithm level**: SpeContext proposes lightweight retrieval head based on the head-level attention weights of DLM, achieving >90% parameters reduction by pruning the redundancy.\n\n2. **At the system level**: SpeContext designs an asynchronous prefetch dataflow via the elastic loading strategy, effectively overlapping KV cache retrieval with the LLM computation.\n\n3. **At the compilation level**: SpeContext constructs the theoretical memory model and implements an adaptive memory management system to achieve acceleration by maximizing GPU memory utilization.\n\nWe deploy and evaluate SpeContext in two resource-constrained environments, cloud and edge. Extensive experiments show that, compared with the Huggingface framework, SpeContext achieves up to 24.89x throughput improvement in cloud and 10.06x speedup in edge with negligible accuracy loss, pushing the Pareto frontier of accuracy and throughput.", "abstract_cn": "## Abstract (摘要)\n\nIn this paper, we point out that the objective of the retrieval algorithms is to align with the LLM, which is similar to the objective of knowledge distillation in LLMs. We analyze the similarity in information focus between the distilled language model (DLM) and the original LLM from the perspective of information theory, and thus propose a novel paradigm that leverages a DLM as the retrieval algorithm. Based on the insight, we present SpeContext, an algorithm and system co-design for long-context reasoning.\n\n1. **At the algorithm level**: SpeContext proposes lightweight retrieval head based on the head-level attention weights of DLM, achieving >90% parameters reduction by pruning the redundancy.\n\n2. **At the system level**: SpeContext designs an asynchronous prefetch dataflow via the elastic loading strategy, effectively overlapping KV cache retrieval with the LLM computation.\n\n3. **At the compilation level**: SpeContext constructs the theoretical memory model and i", "intro_en": "", "intro_cn": "", "file": "./asplops26/05_SpeContext.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 144, "added_date": "2026-04-12"}, {"title": "Ouroboros: Wafer-Scale SRAM CIM with Token-Grained Pipelining for Large Language Model Inference", "authors": "Yiqi Liu, Cheng Liu, Zhen Gu, Tianchen Ding, Zongyue Zhao, Ziyu Yang, Yufei Ding, Yibo Lin, Mingjie Lin, Xiaowei Li, Zidong Du, Chen Liu, Yunji Chen", "arxiv_id": "2603.02737", "github_repo": "", "conference": "ASPLOS 2026", "year": 2026, "abstract_en": "Conventional LLM inference architectures suffer from high energy and latency due to frequent data movement across memory hierarchies. We propose Ouroboros, a wafer-scale SRAM-based Computing-in-Memory (CIM) architecture that executes all operations in situ, eliminating off-chip migration. To maximize its limited first-level capacity, we introduce three innovations:\n\n1. **Token-Grained Pipelining**: Replaces sequence-level pipelining to mitigate length variations, boosting utilization and reducing activation storage.\n\n2. **Distributed Dynamic KV Cache Management**: Decouples memory from compute to leverage fragmented SRAM for efficient KV storage.\n\n3. **Communication-Aware Mapping**: Optimizes core allocation for locality and fault tolerance across the wafer.\n\nExperimental results show Ouroboros achieves average gains of 4.1× in throughput and 4.2× in energy efficiency, peaking at 9.1× and 17× for the 13B model.", "abstract_cn": "## Abstract (摘要)\n\nConventional LLM inference architectures suffer from high energy and latency due to frequent data movement across memory hierarchies. We propose Ouroboros, a wafer-scale SRAM-based Computing-in-Memory (CIM) architecture that executes all operations in situ, eliminating off-chip migration. To maximize its limited first-level capacity, we introduce three innovations:\n\n1. **Token-Grained Pipelining**: Replaces sequence-level pipelining to mitigate length variations, boosting utilization and reducing activation storage.\n\n2. **Distributed Dynamic KV Cache Management**: Decouples memory from compute to leverage fragmented SRAM for efficient KV storage.\n\n3. **Communication-Aware Mapping**: Optimizes core allocation for locality and fault tolerance across the wafer.\n\nExperimental results show Ouroboros achieves average gains of 4.1× in throughput and 4.2× in energy efficiency, peaking at 9.1× and 17× for the 13B model.\n\n---\n\n传统的LLM推理架构由于跨内存层次结构的频繁数据移动而遭受高能耗和高延迟。我们提出了Ouroboros", "intro_en": "*(注：本文获取introduction失败，仅获取到摘要内容。如需完整introduction，建议下载PDF：https://arxiv.org/pdf/2603.02737)*\n\nThe development of Large Language Models (LLMs) has revolutionized artificial intelligence, but their deployment faces significant challenges due to the massive computational and memory requirements. Conventional LLM inference architectures suffer from high energy consumption and latency because of frequent data movement across memory hierarchies.\n\nTo address these challenges, we propose Ouroboros, a wafer-scale SRAM-based Computing-in-Memory (CIM) architecture designed specifically for efficient LLM inference. The key innovation of Ouroboros is that it executes all operations in situ, completely eliminating the need for off-chip data migration.\n\n---\n\n大型语言模型（LLM）的发展已经革新了人工智能，但其部署由于大量的计算和内存需求而面临重大挑战。传统的LLM推理架构由于跨内存层次的频繁数据移动而遭受高能耗和高延迟。\n\n为了应对这些挑战，我们提出了Ouroboros，这是一种专门为高效LLM推理设计的晶圆级SRAM存算一体（CIM）架构。Ouroboros的关键创新在于它在本地执行所有操作，完全消除了芯片外数据迁移的需要。\n\n---", "intro_cn": "", "file": "./asplops26/03_Ouroboros.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Hardware", "id": 148, "added_date": "2026-04-13"}, {"title": "Serving Compound Inference Systems on Datacenter GPUs", "authors": "Sriram Devata, Rahul Sukthankar, Saurabh Adya", "arxiv_id": "2603.08797", "github_repo": "", "conference": "ASPLOS '26 (Extended version f", "year": 2024, "abstract_en": "Applications in emerging domains such as XR are being built as compound inference systems, where multiple ML models are composed in the form of a task graph to service each request. Serving these compound systems efficiently raises two questions: how to apportion end-to-end latency and accuracy budgets between different tasks in a compound inference system, and how to allocate resources effectively for different models with varying resource requirements. We present JigsawServe, the first serving framework that jointly optimizes for latency, accuracy, and cost in terms of GPU resources by adaptively choosing model variants and performing fine-grained resource allocation by spatially partitioning the GPUs for each task of a compound inference system. Analytical evaluation of a system with a large number of GPUs shows that JigsawServe can increase the maximum serviceable demand (in requests per second) by 11.3x when compared to the closest prior work. Our empirical evaluation shows that for a large range of scenarios, JigsawServe consumes only 43.3% of the available GPU resources while meeting accuracy SLOs with less than 0.6% latency SLO violations. All of the features in JigsawServe contribute to this high efficiency -- sacrificing any one feature of accuracy scaling, GPU spatial partitioning, or task-graph-informed resource budgeting significantly reduces efficiency.", "abstract_cn": "## Abstract (摘要)\n\nApplications in emerging domains such as XR are being built as compound inference systems, where multiple ML models are composed in the form of a task graph to service each request. Serving these compound systems efficiently raises two questions: how to apportion end-to-end latency and accuracy budgets between different tasks in a compound inference system, and how to allocate resources effectively for different models with varying resource requirements. We present JigsawServe, the first serving framework that jointly optimizes for latency, accuracy, and cost in terms of GPU resources by adaptively choosing model variants and performing fine-grained resource allocation by spatially partitioning the GPUs for each task of a compound inference system. Analytical evaluation of a system with a large number of GPUs shows that JigsawServe can increase the maximum serviceable demand (in requests per second) by 11.3x when compared to the closest prior work. Our empirical evalu", "intro_en": "As machine learning (ML) inference becomes a dominant workload for datacenter resources, there is growing emphasis on maximizing the efficiency of inference serving systems. Compound inference systems are becoming increasingly important in many emerging domains such as multi-agent systems and extended reality (XR). Such systems compose multiple ML models, each performing a specific task, to provide complex functionalities, and present new challenges and opportunities for increased efficiency. This work focuses on efficient serving of compound inference systems on datacenter GPUs, where each request requires invoking a directed acyclic graph (DAG) of ML inference tasks, which are potentially dynamically determined.\n\nWe focus on two aspects that are unique to compound inference systems. First, we expect that any latency and accuracy Service Level Objectives (SLOs) are provided for the end-to-end compound inference system and need to be apportioned among the individual tasks. This affords new sources of flexibility for the serving system to choose among multiple model variants (with different latencies and accuracies) and GPU resource allocation for each task, when compared to a single task system with a given SLO constraint. Second, the ML model variants across the various tasks in a compound inference system have different resource requirements, motivating finer-grained heterogeneity in the optimal resource choice for the different tasks. Recent GPU hardware provide spatial partitioning mechanisms that enable fine-grained allocation of GPU resources. For example, NVIDIA GPUs provide spatial partitioning mechanisms such as Multi-Process Service (MPS) and Multi-Instance GPU (MIG).\n\nWe present JigsawServe, the first work to jointly optimize for latency, accuracy, and fine-grained cost (in terms of GPU resources required) by adaptively choosing model variants and allocating fine-grained spatial partitions of GPUs for each task of a compound inference system, while preserving end-to-end accuracy and latency SLOs.\n\nThere is a plethora of literature on increasing the efficiency of serving systems for requests with a single model inference, including systems that perform accuracy scaling and spatial partitioning. Compound inference systems have received relatively less attention. Table 1 summarizes key prior works that consider resource budgeting for compound inference systems, accuracy scaling through different model variants of a task, and/or spatial partitioning of GPU resources.\n\nSpecifically, we make the following contributions:\n\n- 1. We introduce JigsawServe, a novel framework to jointly optimize latency, accuracy, and fine-grained cost for compound inference systems on datacenter GPUs. JigsawServe uniquely combines: (1) per-task accuracy scaling via choosing model variants, (2) GPU spatial partitioning, and (3) task-graph-informed latency and accuracy SLO budgeting.\n\n- 2. Our analytical evaluation compares the various combinations of the features. We find that spatial partitioning (S) delivers the highest standalone gain in serving capacity for the same GPU resources (5.25× over Unopt), compared to accuracy scaling (A: 1.6×) and task-graph-informed budgeting (T: 1.1×). JigsawServe's full integration of the three features (A+S+T) achieves 21.6× capacity, surpassing combinations of S with A or T in S+A (12.1×) and S+T (7.8×).\n\n- 3. We emphasize that no prior work has evaluated GPU spatial partitioning for compound inference systems. Systems without S show significantly lower serving capacity than any system with S. A+T, in particular, is closest to (and explores a larger search space than) prior work of Loki. We find that JigsawServe allows 11.3× higher capacity than A+T.\n\n- 4. Our empirical evaluation compares the four top performing systems under a wide range of compound inference systems and workload demand conditions. JigsawServe shows the best overall performance, using just 43.3% of the available GPU resources on average, re", "intro_cn": "", "file": "./asplops26/02_JigsawServe.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 151, "added_date": "2026-04-14"}, {"title": "FlashInfer: Kernel Library for LLM Serving", "authors": "Unknown", "arxiv_id": "2501.01005", "github_repo": "flashinfer-ai/flashinfer", "conference": "", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./github/flashinfer.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 152, "added_date": "2026-04-14"}, {"title": "SpecForge: Training Speculative Decoding Framework", "authors": "Shenggui Li, Chao Wang, Yikai Zhu, Yubo Wang, Fan Yin, Shuai Shi, Yefei Chen, Xiaomin Dong, Qiaoling Chen, Jin Pan, Ji Li, Laixin Xie, Yineng Zhang, Lei Yu, Yonggang Wen, Ivor Tsang, Tianwei Zhang", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Large language models incur high inference latency due to sequential autoregressive decoding. Speculative decoding has emerged as a promising solution to accelerate inference by leveraging a smaller draft model to propose candidate tokens, which are then verified in parallel by a larger target model. However, training effective draft models remains challenging due to the lack of flexible and efficient training frameworks. We introduce SpecForge, an open-source training framework for speculative decoding that addresses these challenges.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./github/SpecForge.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 161, "added_date": "2026-04-16"}, {"title": "LLMLingua: Prompt Compression for LLM Inference", "authors": "Unknown", "arxiv_id": "", "github_repo": "microsoft/LLMLingua", "conference": "EMNLP 2023, ACL 2024", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./github/2024/llmlingua.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Compression", "id": 184, "added_date": "2026-04-20"}, {"title": "Llama Stack", "authors": "Unknown", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "Llama Stack是一个开源的AI应用代理API服务器，提供OpenAI兼容的API，可以在任何地方运行——笔记本电脑、数据中心或云端。使用任何OpenAI兼容的客户端或代理框架。可以在不更改应用代码的情况下在Llama、GPT、Gemini、Mistral或任何模型之间切换。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./github/2025/llama-stack.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 190, "added_date": "2026-04-21"}, {"title": "NIXL: NVIDIA Inference Xfer Library", "authors": "Unknown", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "NIXL (NVIDIA Inference Xfer Library) 是用于加速AI推理框架中点对点通信的库，特别是为NVIDIA Dynamo等推理框架设计。NIXL提供了对各种类型内存（CPU和GPU）和存储（文件、块和对象存储）的抽象，通过模块化插件架构实现。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./github/2025/nixl.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 191, "added_date": "2026-04-22"}, {"title": "ECHO: Elastic Speculative Decoding with Sparse Gating for High-Concurrency Scenarios", "authors": "Xinyi Hu, Yuhao Shen, Baolin Zhang, Hengxin Zhang, Jun Dai, Shuang Ge, Lei Chen, Yue Li, Mingcheng Wan", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "full_conference": "arxiv", "year": 2026, "abstract_en": "This paper presents ECHO, an elastic speculative decoding method with sparse gating for high-concurrency scenarios.", "abstract_cn": "本文提出了ECHO，一种用于高并发场景的具有稀疏门控的弹性投机解码方法。", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/echo_speculative.md", "has_real_content": true, "added_date": "2026-04-20", "date": "2026-04-09", "url": "", "notes": "", "topic": "Speculative Decoding", "venue": "arxiv", "pdf_url": "", "github": "", "blog": "", "id": 184, "is_github_project": false}, {"id": 202, "title": "ConfigSpec: Profiling-Based Configuration Selection for Distributed Edge--Cloud Speculative LLM Serving", "authors": "Xiangchen Li, Saeid Ghafouri, Jiakun Fan, Babar Ali, Hans Vandierendonck, Dimitrios S. Nikolopoulos", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Edge-Cloud Serving", "abstract_en": "Speculative decoding enables collaborative Large Language Model (LLM) inference across cloud and edge by separating lightweight token drafting from heavyweight verification. While prior work focuses on drafting accuracy and acceptance rates, the end-to-end performance critically depends on the configuration of the disaggregated edge--cloud system, including the drafter model selection, placement, and resource allocation. We present ConfigSpec, a profiling-based configuration selection framework that systematically evaluates candidate configurations across diverse edge--cloud setups to identify Pareto-optimal trade-offs between latency, throughput, and resource cost.", "abstract_cn": "投机解码通过将轻量级token起草与重量级验证分离，实现了云和边缘之间的协作式大语言模型推理。虽然之前的工作侧重于起草准确性和接受率，但端到端性能关键取决于分离式边缘-云系统的配置，包括起草模型选择、放置和资源分配。我们提出了ConfigSpec，一个基于性能分析的配置选择框架，系统地评估各种边缘-云设置中的候选配置，以识别延迟、吞吐量和资源成本之间的帕累托最优权衡。", "intro_en": "Speculative decoding has emerged as a promising technique for accelerating LLM inference, particularly in disaggregated edge-cloud settings where lightweight drafters run on edge devices while the target model resides in the cloud. However, the performance of such systems is highly sensitive to configuration choices including model selection, device placement, and resource allocation.", "intro_cn": "投机解码已成为加速LLM推理的有前途的技术，特别是在分离式边缘-云设置中，轻量级起草器在边缘设备上运行而目标模型驻留在云中。然而，这种系统的性能对配置选择高度敏感，包括模型选择、设备放置和资源分配。", "file": "39_configspec.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-24"}, {"id": 203, "title": "SPEED-Bench: A Unified and Diverse Benchmark for Speculative Decoding", "authors": "Talor Abramovich, Maor Ashkenazi, Carl Putterman, Benjamin Chislett, Tiyasa Mitra, Bita Darvish Rouhani, Ran Zilberstein, Yonatan Geifman", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Speculative Decoding", "abstract_en": "Speculative Decoding (SD) has emerged as a critical technique for accelerating Large Language Model (LLM) inference. Unlike deterministic approximation methods, SD guarantees exact output distribution preservation, making it a mathematically rigorous approach to inference acceleration. However, the lack of a unified benchmark has hindered systematic comparison and progress. We present SPEED-Bench, the first comprehensive benchmark for evaluating SD methods across diverse models, tasks, and hardware configurations.", "abstract_cn": "投机解码（SD）已成为加速大语言模型推理的关键技术。与确定性近似方法不同，SD保证精确输出分布保持，使其成为推理加速的数学严谨方法。然而，缺乏统一的基准阻碍了系统性比较和进步。我们提出了SPEED-Bench，第一个用于在各种模型、任务和硬件配置中评估SD方法的综合基准。", "intro_en": "As LLMs grow in size and complexity, inference latency becomes a critical bottleneck. Speculative decoding offers a principled approach to acceleration by using smaller draft models to propose tokens that are verified by the target model in a single forward pass. Despite growing interest, evaluation of SD methods remains fragmented across different papers with inconsistent settings.", "intro_cn": "随着LLM规模和复杂性的增长，推理延迟成为关键瓶颈。投机解码通过使用较小的起草模型提出token，由目标模型在单次前向传播中验证，提供了一种有原则的加速方法。尽管兴趣不断增长，SD方法的评估在不同论文之间仍然分散，设置不一致。", "file": "40_speed_bench.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-24"}, {"id": 204, "title": "Blink: CPU-Free LLM Inference by Delegating the Serving Stack to GPU and SmartNIC", "authors": "Mohammad Siavashi, Mariano Scazzariello, Gerald Q. Maguire Jr., Dejan Kostić, Marco Chiesa", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "LLM Serving", "abstract_en": "Large Language Model (LLM) inference is rapidly becoming a core datacenter service, yet current serving systems heavily rely on the CPU for orchestrating the inference pipeline. We present Blink, a system that delegates the entire LLM serving stack—including scheduling, memory management, and network communication—to the GPU and SmartNIC, eliminating CPU involvement in the inference pipeline. This approach enables tighter integration between compute and communication, reducing overhead and improving throughput.", "abstract_cn": "大语言模型推理正迅速成为数据中心核心服务，然而当前服务系统严重依赖CPU来协调推理流水线。我们提出了Blink，一个将整个LLM服务栈（包括调度、内存管理和网络通信）委托给GPU和SmartNIC的系统，消除了CPU在推理流水线中的参与。这种方法使计算和通信之间更紧密集成，减少开销并提高吞吐量。", "intro_en": "Current LLM serving systems like vLLM and TensorRT-LLM rely on the CPU for critical orchestration tasks, including request scheduling, KV cache management, and inter-GPU communication. T
