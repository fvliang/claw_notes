    <script>
    const papers = [{"title": "POD-Attention: Unlocking Full Prefill-Decode Overlap for Faster LLM Inference", "authors": "Aditya Kamath 等", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2025", "year": 2025, "abstract_en": "Each request in LLM inference goes through two phases: compute-bound prefill and memory-bandwidth-bound decode. To improve GPU utilization, recent systems use hybrid batching that combines the prefill and decode phases of different requests into the same batch. This approach optimizes linear operations but remains inefficient for attention computation because existing attention kernels specialize execution independently for the prefill and decode phases.\n\nIn this paper, we present **POD-Attention** - the first GPU kernel that efficiently computes attention for hybrid batches. POD-Attention aims to maximize the utilization of both compute and memory bandwidth by carefully allocating the GPU's resources such that prefill and decode operations happen concurrently on the same multiprocessor.", "abstract_cn": "*论文来源：ASPLOS 2025，数据真实可验证*", "intro_en": "", "intro_cn": "", "file": "asplos/2025/pod_attention.md", "id": 1, "topic": "Attention"}, {"title": "vAttention: Dynamic Memory Management for Serving LLMs without PagedAttention", "authors": "Ashish Panwar, Rishabh Prabhu, et al.", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2025", "year": 2025, "abstract_en": "PagedAttention is a popular approach for dynamic memory allocation in LLM serving systems. It enables on-demand allocation of GPU memory to mitigate KV cache fragmentation -- a phenomenon that crippled the batch size (and consequently throughput) in prior systems. However, in trying to allocate physical memory at runtime, PagedAttention ends up changing the virtual memory layout of the KV cache from contiguous to non-contiguous. Such a design leads to non-trivial programming and performance overheads.\n\nWe present **vAttention** -- an approach that mitigates fragmentation in physical memory while retaining the contiguity of KV cache in virtual memory. We achieve this by decoupling the allocation of virtual and physical memory using CUDA virtual memory management APIs.", "abstract_cn": "*论文来源：ASPLOS 2025，数据真实可验证*", "intro_en": "", "intro_cn": "", "file": "asplos/2025/vattention_dynamic_memory.md", "id": 2, "topic": "Attention"}, {"title": "ZipServ: Fast and Memory-Efficient LLM Inference with Hardware-Aware Lossless Compression", "authors": "Ruibo Fan, Xiangrui Yu, Xinglin Pan, Zeyu Li, Weile Luo, Qiang Wang, Wei Wang, Xiaowen Chu", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "(摘要)\n\nLossless model compression holds tremendous promise for alleviating the memory and bandwidth bottlenecks in bit-exact Large Language Model (LLM) serving. However, existing approaches often result in substantial inference slowdowns due to fundamental design mismatches with GPU architectures: at the kernel level, variable-length bitstreams produced by traditional entropy codecs break SIMT parallelism; at the system level, decoupled pipelines lead to redundant memory traffic. We present ZipServ, a lossless compression framework co-designed for efficient LLM inference. ZipServ introduces Tensor-Core-Aware Triple Bitmap Encoding (TCA-TBE), a novel fixed-length format that enables constant-time, parallel decoding, together with a fused decompression-GEMM (ZipGEMM) kernel that decompresses weights on-the-fly directly into Tensor Core registers. This \"load-compressed, compute-decompressed\" design eliminates intermediate buffers and maximizes compute intensity. Experiments show that ZipServ reduces the model size by up to 30%, achieves up to 2.21x kernel-level speedup over NVIDIA's cuBLAS, and expedites end-to-end inference by an average of 1.22x over vLLM. ZipServ is the first lossless compression system that provides both storage savings and substantial acceleration for LLM inference on GPUs.\n\n---\n\n无压缩模型压缩在实现位精确的大型语言模型（LLM）服务方面具有巨大潜力，可缓解内存和带宽瓶颈。然而，现有方法往往会导致显著的推理减速，这是由于与GPU架构的根本设计不匹配：在内核级别，传统熵编码器产生的可变长度位流破坏了SIMT并行性；在系统级别，解耦的管道导致冗余内存流量。我们提出了ZipServ，这是一种针对高效LLM推理共同设计的无损压缩框架。ZipServ引入了张量核感知的“三重位图编码”（TCA-TBE），这是一种新型的固定长度格式，可实现常量时间并行解码，同时还有一个融合的解压缩GEMM（ZipGEMM）内核，可即时将权重解压缩到张量核寄存器中。这种\"加载压缩、计算解压缩\"的设计消除了中间缓冲区并最大化了计算强度。实验表明，ZipServ可将模型大小减少高达30%，在NVIDIA的cuBLAS上实现高达2.21倍的内核级加速，并在vLLM上实现平均1.22倍的端到端加速。ZipServe是第一个在GPU上为LLM推理同时提供存储节省和显著加速的无损压缩系统。\n\n---", "abstract_cn": "", "intro_en": "(引言)\n\nThe transformative power of Large Language Models (LLMs) like GPT-4, LLaMA-3, and Qwen-3 is rooted in their massive scale, enabling a new paradigm of AI applications. However, this immense scale creates significant deployment challenges, making GPU memory and memory bandwidth the primary bottlenecks for LLM serving, especially in resource-constrained environments.\n\nModel compression offers a promising solution for efficient LLM deployment. Most existing approaches are lossy, reducing size by approximating model weights via quantization (e.g., GPTQ, AWQ) or pruning (e.g., SparseGPT). However, such approximations risk accuracy loss. For instance, aggressive 4-bit quantization (e.g., MXFP4) slashes accuracy from 56.0% to 36.2% on LiveCodeBench, while even robust int8 quantization (GPTQ-int8) can cause up to 11.1% loss in long-context reasoning (NOCHA). These risks undermine reliability in safety-critical and user-facing settings, motivating approaches that guarantee bit-exact reproducibility and numerical integrity.\n\nLossless compression offers a compelling alternative by providing bit-exact model representation without accuracy loss. To date, its benefits have largely targeted storage and training workflows. For example, LMC and ZipNN employ Huffman to compress model checkpoints for efficient storage and distribution, while NeuZip and DietGPU mitigate memory and communication overhead during training. Although recent efforts, notably DFloat11, aim to extend these gains to inference, practical efficiency remains elusive. When integrated into serving pipelines, existing lossless techniques incur significant runtime overhead. The decoupled decompression step alone takes 1.56–3.44× the time of the core inference computation. This overhead forces an unpleasant tradeoff between memory efficiency and runtime efficiency.\n\nWe contend that this tradeoff is not fundamental but arises from a mismatch between conventional compression algorithms and modern GPU architectures. The issue manifests at two levels. At the kernel level, traditional entropy codecs (e.g., Huffman or ANS) produce variable-length bitstreams, whose decoding demands serialized, data-dependent operations. These are ill-suited to the lockstep, parallel SIMT execution model of GPU warps, resulting in severe control-flow divergence and compute underutilization. At the system level, most frameworks employ a decoupled inference pipeline: weights are fully decompressed into a global-memory buffer before kernel consumption. This staged execution results in redundant, high-latency memory accesses, eroding compression-provided bandwidth savings and reducing arithmetic intensity during inference.\n\nTo rectify these fundamental algorithm-hardware mismatches, we present ZipServ, the first lossless compression framework co-designed for high-performance LLM inference on GPUs. Our key observation is that the exponent bits of BFloat16 weights in LLMs exhibit a highly skewed, low-entropy distributions in contemporary models. Exploiting this statistical redundancy, we propose Tensor-Core-Aware Triple Bitmap Encoding (TCA-TBE), a fixed-length, bitmap-based weight format tailored to GPU architectures. Unlike variable-length entropy codecs, TCA-TBE enables constant-time, parallel decoding using lightweight bitwise operations, thereby eliminating control-flow divergence and aligning with the GPU's SIMT execution model. Paired with TCA-TBE, ZipServ devises a fused decompression-GEMM kernel (ZipGEMM). Rather than decompressing weights into global memory as an intermediate step, ZipGEMM performs on-the-fly decoding, delivering compressed weights directly into the register files that feed Tensor Core matrix multiplication units. This \"load-compressed, compute-decompressed\" design eliminates intermediate buffers, reduces data movement, and maximizes the overlap between computation and memory access. By jointly addressing both the kernel-level and system-level mismatches, ZipServ transforms the theoretical storage savings of lossless compression into tangible performance gains on inference-optimized GPUs.\n\nWe demonstrate ZipServ's effectiveness through comprehensive benchmarking against state-of-the-art lossless approaches, including DietGPU, vendor-optimized nvCOMP, and the Huffman-based DFloat11. Compared to these baselines, which uniformly suffer significant runtime overhead, ZipServ consistently delivers substantial accelerations at both the kernel and system level on various inference-optimized GPUs, including RTX4090, L40S, and RTX5090. Our fused ZipGEMM achieves speedups of up to 2.21× over NVIDIA's cuBLAS, and up to 5.53× over DFloat11, the fastest lossless compression pipeline. These kernel-level improvements translate into an average 1.22× end-to-end speedup compared to leading systems like vLLM. Our results demonstrate for the first time that when co-designed with hardware, lossless compression can provide both storage savings and substantial LLM inference acceleration.\n\n---\n\n像GPT-4、LLaMA-3和Qwen-3这样的大型语言模型（LLM）的变革力量源于其巨大规模，为人工智能应用开辟了新范式。然而，这种巨大的规模带来了显著的部署挑战，使得GPU内存和内存带宽成为LLM服务的主要瓶颈，特别是在资源受限的环境中。\n\n模型压缩为高效的LLM部署提供了有希望的解决方案。大多数现有方法都是有损的，通过量化（例如GPTQ、AWQ）或剪枝（例如SparseGPT）来近似模型权重来减小尺寸。然而，这种近似存在精度损失的风险。例如，激进的4位量化（例如MXFP4）将LiveCodeBench上的准确率从56.0%降至36.2%，而即使是稳健的int8量化（GPTQ-int8）也可能导致长上下文推理（NOCHA）损失高达11.1%。这些风险损害了安全关键和面向用户场景的可靠性，促使人们寻求能够保证位精确可重复性和数值完整性的方法。\n\n无损压缩通过提供位精确的模型表示而不损失精度，提供了一个引人注目的替代方案。迄今为止，其优势主要针对存储和训练工作流。例如，LMC和ZipNN使用霍夫曼压缩模型检查点以实现高效的存储和分发，而NeuZip和DietGPU减轻了训练期间的内存和通信开销。尽管最近的努力，特别是DFloat11，旨在将这些收益扩展到推理，但实际效率仍然难以捉摸。当集成到服务管道中时，现有无损技术会产生显著的运行时开销。仅解耦的解压缩步骤就需要核心推理计算时间的1.56-3.44倍。这种开销迫使人们在内存效率和运行时效率之间做出令人不快的权衡。\n\n我们认为这种权衡并非根本性，而是源于传统压缩算法与现代GPU架构之间的不匹配。问题表现在两个层面。在内核级别，传统熵编码器（如霍夫曼或ANS）产生可变长度位流，其解码需要序列化的、数据依赖的操作。这些操作不适合GPU warp的锁定步进并行SIMT执行模型，导致严重的控制流分歧和计算利用不足。在系统级别，大多数框架采用解耦推理管道：权重在内核消费之前完全解压缩到全局内存缓冲区。这种分阶段执行导致冗余的高延迟内存访问，削弱了压缩提供的带宽节省并降低了推理期间的算术强度。\n\n为了纠正这些基本的算法-硬件不匹配，我们提出了ZipServ，这是第一个为高性能GPU上的LLM推理共同设计的无损压缩框架。我们的关键观察是，当代模型中BFloat16权重的指数位呈现出高度倾斜的低熵分布。利用这种统计冗余，我们提出了张量核感知的“三重位图编码”（TCA-TBE），这是一种针对GPU架构量身定制的固定长度、基于位图的权重格式。与可变长度熵编码器不同，TCA-TBE使用轻量级位操作实现常量时间并行解码，从而消除控制流分歧并与GPU的SIMT执行模型保持一致。与TCA-TBE配合，ZipServ设计了一个融合的解压缩-GEMM内核（ZipGEMM）。ZipGEMM不是将权重解压缩到全局内存作为中间步骤，而是执行即时解码，将压缩权重直接传送到为张量核矩阵乘法单元提供数据的寄存器文件中。这种\"加载压缩、计算解压缩\"设计消除了中间缓冲区，减少了数据移动，并最大化了计算和内存访问之间的重叠。通过共同解决内核级和系统级的不匹配，ZipServ将无损压缩的理论存储节省转化为推理优化GPU上的切实性能提升。\n\n我们通过对最先进的无损方法（包括DietGPU、供应商优化的nvCOMP和基于霍夫曼的DFloat11）进行全面基准测试来展示ZipServ的有效性。与这些基线（这些基线普遍存在显著的运行时开销）相比，ZipServ在各种推理优化GPU（包括RTX4090、L40S和RTX5090）上始终在内核和系统级别提供实质性加速。我们的融合ZipGEMM实现了比NVIDIA的cuBLAS高达2.21倍的加速，比最快的无损压缩管道DFloat11高达5.53倍的加速。这些内核级改进转化为与vLLM等领先系统相比平均1.22倍的端到端加速。我们的结果首次证明，当与硬件共同设计时，无损压缩可以同时提供存储节省和显著的LLM推理加速。\n\n---", "intro_cn": "", "file": "asplos/2026/07_zipserv_compression.md", "id": 3, "topic": "Hardware"}, {"title": "QoServe: Breaking the Silos of LLM Inference Serving", "authors": "Kanishk Goel, Jayashree Mohan, Nipun Kwatra, Ravi Anupindi, Ram Ramjee", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "(Abstract)\n\nQoServe是一个统一的LLM推理服务框架，打破了传统系统中的\"孤岛\"设计。传统LLM serving系统针对特定场景优化，导致系统碎片化。QoServe通过创新的架构设计，实现了跨场景的高质量服务。", "abstract_cn": "", "intro_en": "(Introduction)\n\n现有的LLM serving系统通常针对特定场景进行优化：\n- 延迟优化系统\n- 吞吐量优化系统\n- 成本优化系统\n\n这种碎片化导致：\n1. 系统维护困难\n2. 资源利用效率低\n3. 难以保证服务质量\n\nQoServe通过统一调度和资源管理解决了这些问题。", "intro_cn": "", "file": "asplos/2026/03_qoserve.md", "id": 4, "topic": "LLM Serving"}, {"title": "PAT: Accelerating LLM Decoding via Prefix-Aware Attention with Resource Efficient Multi-Tile Kernel", "authors": "Jinjun Yi, Zhixin Zhao, Yitao Hu, Ke Yan, Weiwei Sun, Hao Wang, Laiping Zhao, Yuhao Zhang, Wenxin Li, Keqiu Li", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "(Abstract)\n\nPAT（前缀感知注意力）提出了一种新的注意力机制优化，通过资源高效的多tile内核加速LLM解码。该方法显著降低了注意力计算的内存和计算开销。", "abstract_cn": "", "intro_en": "(Introduction)\n\n注意力机制是LLM的核心组件，但也是计算瓶颈。现有优化方法忽略了prefix的特殊性。PAT利用prefix的共享特性，实现更高效的注意力计算。", "intro_cn": "", "file": "asplos/2026/06_pat_prefix_aware_attention.md", "id": 5, "topic": "Attention"}, {"title": "MoE-APEX: An Efficient MoE Inference System with Adaptive Precision Expert Offloading", "authors": "Peng Tang, Jiacheng Liu, Xiaofeng Hou, Yifei Pu, Jing Wang, Pheng-Ann Heng, Chao Li, Minyi Guo", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "(Abstract)\n\nMoE-APEX是针对MoE（混合专家）模型的高效推理系统，通过自适应精度的专家卸载策略，在保持模型质量的同时显著降低推理成本。", "abstract_cn": "", "intro_en": "(Introduction)\n\nMoE模型通过激活部分专家来提供高容量，但推理时仍面临内存和计算挑战。MoE-APEX提出了一种自适应精度卸载策略，根据专家重要性动态调整精度。", "intro_cn": "", "file": "asplos/2026/09_moe_apex.md", "id": 6, "topic": "MoE"}, {"title": "XY-Serve: End-to-End Versatile Production Serving for Dynamic LLM Workloads", "authors": "Mingcong Song, Xinru Tang, Fengfan Hou, Jing Li, Wei Wei, Yipeng Ma, Runqiu Xiao, Hongjie Si, Dingcheng Jiang, Shouyi Yin, Yang Hu, Guoping Long", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "(Abstract)\n\nXY-Serve是华为提出的端到端LLM服务系统，专门针对动态工作负载进行优化。该系统提供了生产级别的LLM serving能力，支持多种模型和场景。", "abstract_cn": "", "intro_en": "(Introduction)\n\n生产环境中的LLM serving面临诸多挑战：\n- 多样化的模型类型\n- 动态的请求模式\n- 复杂的资源管理\n\nXY-Serve通过统一的架构解决了这些问题。", "intro_cn": "", "file": "asplos/2026/05_xy_serve.md", "id": 7, "topic": "LLM Serving"}, {"title": "Shift Parallelism: Low-Latency, High-Throughput LLM Inference for Dynamic Workloads", "authors": "Mert Hidayetoglu, Aurick Qiao, Michael Wyatt, Jeff Rasley, Yuxiong He, Samyam Rajbhandari", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "(Abstract)\n\nShift Parallelism提出了一种新的并行策略，用于在动态工作负载下实现低延迟和高吞吐量的LLM推理。该方法通过创新的请求调度和计算分配，实现了在变化负载下的稳定性能。", "abstract_cn": "", "intro_en": "(Introduction)\n\n动态工作负载是LLM serving的常见场景，请求速率和复杂度随时间变化。传统方法难以适应这种变化，导致：\n- 高延迟峰值\n- 资源浪费\n- 服务质量不稳定\n\nShift Parallelism通过动态调整并行度来适应工作负载变化。", "intro_cn": "", "file": "asplos/2026/04_shift_parallelism.md", "id": 8, "topic": "LLM Serving"}, {"title": "Towards High-Goodput LLM Serving with Prefill-decode Multiplexing", "authors": "Weihao Cui, Yukang Chen, Han Zhao, Ziyi Xu, Xiaoze Fan, Xusheng Chen, Yangjie Zhou, Shixuan Sun, Bingsheng He, Quan Chen", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "(摘要)\n\nLarge Language Model (LLM) serving must meet stringent Service Level Objectives (SLOs) for both the prefill and decode phases. Some existing solutions disaggregate the two phases, causing potential resource idleness or compute redundancy. Others split the prefill phase into chunks and fuse it with decode iteration, creating a dilemma between SLO compliance and high utilization. To address these issues, an efficient serving system should dynamically adapt compute allocation, decouple compute from memory management, and execute prefill and decode independently. We present MuxWise, an LLM serving framework that adopts a new paradigm, intra-GPU prefill-decode multiplexing, to meet these requirements. To fully exploit the paradigm, MuxWise integrates a bubble-less multiplex engine, a contention-tolerant estimator, and an SLO-aware dispatcher. Evaluation shows that MuxWise improves peak throughput under SLO guarantees by an average of 2.20× (up to 3.06×) over state-of-the-art baselines.\n\n---\n\n大型语言模型（LLM）服务必须为预填充和解码两个阶段满足严格的服务水平目标（SLO）。一些现有解决方案将两个阶段分离，导致潜在的资源闲置或计算冗余。其他方案将预填充阶段分块并与解码迭代融合，在SLO合规性和高利用率之间产生两难境地。为了解决这些问题，高效的服务系统应该动态适应计算分配，将计算与内存管理解耦，并独立执行预填充和解码。我们提出了MuxWise，这是一种采用新范式的LLM服务框架——GPU内预填充-解码复用（intra-GPU prefill-decode multiplexing）。为了充分利用这一范式，MuxWise集成了无气泡复用引擎、抗争容限估计器和SLO感知调度器。评估表明，MuxWise在SLO保证下将峰值吞吐量比最先进的基线平均提高2.20倍（最高3.06倍）。\n\n---", "abstract_cn": "", "intro_en": "(引言)\n\nLarge language models (LLM) services now perform well across diverse workloads. At the request level, an LLM processes input in two phases: a prefill phase that produces the first token, followed by a decode phase that iteratively generates the remaining tokens. The ratio of input length (prefill) to output length (decode) varies across tasks. At the application level, tasks such as chatbot services or agent-based workloads often consist of multiple turns of requests with shared context.\n\nTo achieve high throughput for serving these workloads, existing LLM serving systems employ several optimizations. While requests arrive at different times, inflight batching stalls the ongoing decode phase to prefill new requests and then processes all decode iterations together in a single batch. It greatly improves compute utilization for the memory-intensive decode phase. Since multi-turn requests share context, LLM serving systems reuse intermediate results (i.e., the KV cache) both within and across requests through a KV cache pool.\n\nLLM services also impose stringent Service Level Objectives (SLOs). For instance, chatbot typically requires Time-To-First-Token (TTFT) under 500 ms for prefill and Time-Between-Tokens (TBT) under 100 ms for decode. Since prefill and decode interleave in an LLM serving system, SLO violations may arise.\n\nTo sustain high goodput–peak throughput with SLO guarantees–existing methods fall into two categories: disaggregated serving and chunked prefill. Disaggregated serving separates the prefill and decode phases into distinct instances, but cannot adapt to serving dynamics and decreases goodput due to shrinking the KV cache pool. Chunked prefill splits the prefill phase into chunks and fuses each chunk with a decode iteration, but creates a dilemma between SLO compliance and high utilization.\n\nWe propose intra-GPU prefill-decode (PD) multiplexing as a promising new serving paradigm. Specifically, the prefill and decode phases are executed on different streaming multiprocessors (SMs) within the GPUs. In the new paradigm: 1) compute partitions can be reconfigured with low overhead to adapt to serving dynamics; 2) multiplexed phases share GPU memory, keeping the KV cache pool efficient; 3) with spatial sharing, prefill and decode execute independently, avoiding the tradeoff between SLO compliance and utilization.\n\nTo this end, we propose MuxWise, an LLM serving framework that achieves high goodput across diverse workloads. MuxWise comprises three modules: a bubble-less multiplex engine, a contention-tolerant estimator, and an SLO-aware dispatcher. Experiments show that MuxWise achieves an average 2.20× goodput improvement (up to 3.06×) over state-of-the-art solutions.\n\n---\n\n大型语言模型（LLM）服务目前在不同工作负载上表现良好。在请求级别，LLM分两个阶段处理输入：预填充阶段产生第一个token，然后是解码阶段迭代生成剩余token。输入长度（预填充）与输出长度（解码）的比率因任务而异。在应用层面，聊天机器人服务或基于agent的工作负载等任务通常包含多轮具有共享上下文的请求。\n\n为了实现这些工作负载的高吞吐量，现有的LLM服务系统采用了几种优化措施。虽然请求在不同时间到达，但飞行批处理会暂停正在进行的解码阶段以预填充新请求，然后在一个批次中一起处理所有解码迭代。它大大提高了内存密集型解码阶段的计算利用率。由于多轮请求共享上下文，LLM服务系统通过KV缓存池在请求内部和跨请求重用中间结果（即KV缓存）。\n\nLLM服务还要求严格的服务级别目标（SLO）。例如，聊天机器人通常要求预填充的首个token时间（TTFT）低于500ms，解码的token间隔时间（TBT）低于100ms。由于预填充和解码在LLM服务系统中交错，可能会出现SLO违规。\n\n为了保持高goodput——在SLO保证下的峰值吞吐量——现有方法分为两类：分解服务和分块预填充。分解服务将预填充和解码阶段分离到不同的实例中，但无法适应服务动态，并因KV缓存池缩小而降低goodput。分块预填充将预填充阶段分块并将每个块与解码迭代融合，但在SLO合规性和高利用率之间产生两难境地。\n\n我们提出了GPU内预填充-解码（PD）复用作为一种有前途的新服务范式。具体来说，预填充和解码阶段在GPU内的不同流多处理器（SM）上执行。在新范式中：1）计算分区可以低开销重新配置以适应服务动态；2）复用阶段共享GPU内存，保持KV缓存池高效；3）通过空间共享，预填充和解码独立执行，避免SLO合规性和利用率之间的权衡。\n\n为此，我们提出了MuxWise，一个在各种工作负载下实现高goodput的LLM服务框架。MuxWise包含三个模块：无气泡复用引擎、抗争容限估计器和SLO感知调度器。实验表明，MuxWise比最先进的解决方案实现了平均2.20倍的goodput提升（最高3.06倍）。\n\n---", "intro_cn": "", "file": "asplos/2026/01_high_goodput_llm_serving.md", "id": 9, "topic": "LLM Serving"}, {"title": "Bullet: Boosting GPU Utilization for LLM Serving via Dynamic Spatial-Temporal Orchestration", "authors": "Zejia Lin, Hongxin Xu, Guanyi Chen, Zhiguang Chen, Yutong Lu, Xianwei Zhang", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "(Abstract)\n\n本文提出Bullet系统，通过动态空间-时间协调来提升LLM serving的GPU利用率。传统的LLM serving系统存在GPU计算资源浪费的问题，Bullet通过创新的调度策略实现了更高效的GPU资源利用。", "abstract_cn": "", "intro_en": "(Introduction)\n\n在LLM serving场景中，GPU利用率低下是一个普遍问题。原因是：\n- 请求的动态到达模式\n- prefill和decode阶段的计算特性差异\n- 批处理调度不当\n\nBullet系统通过空间（多个GPU之间）和时间（不同请求之间）的动态协调，显著提升了GPU利用率。", "intro_cn": "", "file": "asplos/2026/02_bullet_gpu_utilization.md", "id": 10, "topic": "LLM Serving"}, {"title": "BlendServe: Optimizing Offline Inference with Resource-Aware Batching", "authors": "Yilong Zhao, Shuo Yang, Kan Zhu, Lianmin Zheng, Baris Kasikci, Yifan Qiao, Yang Zhou, Jiarong Xing, Ion Stoica", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "(Abstract)\n\nBlendServe是UC Berkeley离子·斯托伊卡团队提出的离线推理优化系统，通过资源感知的批处理策略最大化离线场景下的推理效率。", "abstract_cn": "", "intro_en": "(Introduction)\n\n离线推理（batch inference）与在线服务有不同的优化目标。传统批处理方法未充分考虑资源利用率。BlendServe通过创新的资源分配策略实现更高效的离线推理。", "intro_cn": "", "file": "asplos/2026/08_blendserve_batching.md", "id": 11, "topic": "Scheduling"}, {"title": "vLLM: Efficient Memory Management for Large Language Model Serving with PagedAttention", "authors": "", "arxiv_id": "", "github_repo": "vllm-project/vllm", "conference": "arXiv", "full_conference": "arXiv", "year": 2023, "abstract_en": "(Abstract)\n\nHigh throughput serving of large language models (LLMs) requires batching sufficiently many requests at a time. However, existing systems struggle because the key-value cache (KV cache) memory for each request is huge and grows and shrinks dynamically. When managed inefficiently, this memory can be significantly wasted by fragmentation and redundant duplication, limiting the batch size. To address this problem, we propose PagedAttention, an attention algorithm inspired by the classical virtual memory and paging techniques in operating systems. On top of it, we build vLLM, an LLM serving system that achieves (1) near-zero waste in KV cache memory and (2) flexible sharing of KV cache within and across requests to further reduce memory usage. Our evaluations show that vLLM improves the throughput of popular LLMs by 2-4× with the same level of latency compared to the state-of-the-art systems, such as FasterTransformer and Orca. The improvement is more pronounced with longer sequences, larger models, and more complex decoding algorithms.", "abstract_cn": "*本文档由自动化任务生成于 2026-03-24*", "intro_en": "(Introduction)\n\nLarge language models (LLMs) have revolutionized natural language processing tasks, enabling a wide range of applications such as chatbots, code completion, and content generation. However, deploying LLMs for online serving remains challenging due to their large memory footprint and computational requirements.\n\nThe autoregressive decoding process of LLMs generates tokens one by one, where each token depends on all previous tokens stored in the key-value (KV) cache. The KV cache can become very large, especially for long sequences. Existing LLM serving systems manage the KV cache using contiguous memory allocation, similar to how traditional deep learning frameworks manage tensors. This approach leads to significant memory waste due to fragmentation and pre-reservation.\n\nWe address this problem by introducing PagedAttention, which borrows the concept of paging from operating systems. Instead of allocating contiguous memory blocks for the KV cache, PagedAttention stores the KV cache in non-contiguous physical pages that can be dynamically allocated and freed. This approach enables near-zero waste in KV cache memory and flexible sharing of KV cache within and across requests.", "intro_cn": "大型语言模型（LLM）的高吞吐量服务需要同时批处理足够多的请求。然而，现有系统面临挑战，因为每个请求的键值缓存（KV缓存）内存很大，且会动态增长和收缩。当管理不高效时，这些内存会因碎片化和冗余复制而严重浪费，限制了批处理大小。为解决这一问题，我们提出了PagedAttention，这是一种受操作系统中经典虚拟内存和分页技术启发的注意力算法。在此基础上，我们构建了vLLM，一个LLM服务系统，实现了（1）KV缓存内存近零浪费，（2）灵活共享KV缓存在请求内部和跨请求以进一步减少内存使用。我们的评估表明，vLLM与FasterTransformer和Orca等最新系统相比，在相同延迟水平下将流行LLM的吞吐量提高了2-4倍。这种改进在更长序列、更大模型和更复杂解码算法的情况下更为明显。", "file": "arxiv/2023/vllm_pagedattention_sosp2023.md", "id": 12, "topic": "Attention"}, {"title": "ALISE: Speculative Scheduling for LLM Serving", "authors": "Various", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "(Abstract)\nALISE (Accelerating LLM Serving with Speculative Scheduling) combines speculative decoding with intelligent scheduling:\n\n1. **Speculative scheduling**: Intelligently schedules speculation\n2. **Workload-aware**: Adapts to request characteristics\n3. **Batch optimization**: Better batching decisions with speculation\n4. **Improved throughput**: Significant gains over non-speculative systems", "abstract_cn": "", "intro_en": "(Introduction)\nTraditional serving systems:\n- Treat speculation as add-on optimization\n- Don't fully exploit speculation potential\n- Suboptimal scheduling decisions\n\nALISE improves:\n- **Integrated scheduling**: Full integration of speculation into scheduler\n- **Predictive speculation**: Speculate based on predicted accept rates\n- **Batch synergy**: Better batching when speculation is considered", "intro_cn": "", "file": "arxiv/2024/alise.md", "id": 13, "topic": "Speculative Decoding"}, {"title": "PowerInfer-2: High-Speed LLM Inference for Smartphones", "authors": "来自上海交通大学IPADS实验室", "arxiv_id": "", "github_repo": "Tiiny-AI/PowerInfer", "conference": "arXiv", "full_conference": "arXiv", "year": 2024, "abstract_en": "PowerInfer-2是一个专为智能手机设计的高度优化推理框架。\n\n使用TurboSparse-Mixtral-47B，PowerInfer-2在智能手机上实现了**11.68 tokens/s**的推理速度，比其他SOTA框架快达**22倍**。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2024/powerinfer2.md", "id": 14, "topic": "LLM Serving"}, {"title": "InstCache: Predictive Cache for LLM Serving", "authors": "Various", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "(Abstract)\nInstCache introduces a predictive caching mechanism for LLM serving. The key idea is to anticipate what will be needed and proactively cache it:\n\n1. **Prefix prediction**: Predicts common prompt prefixes\n2. **Intent anticipation**: Anticipates user intent from context\n3. **Smart pre-caching**: Loads likely-needed KV cache in advance\n4. **High hit rates**: Achieves significant cache hit improvements", "abstract_cn": "", "intro_en": "(Introduction)\nLLM serving can benefit from caching:\n- Similar prompts appear frequently\n- System prompts are often reused\n- Common patterns exist in queries\n\nInstCache leverages this with:\n- **Learning-based prediction**: ML model predicts what to cache\n- **Prefix tree**: Efficient prefix matching\n- **Eviction policy**: Optimal cache management", "intro_cn": "", "file": "arxiv/2024/instcache.md", "id": 15, "topic": "LLM Serving"}, {"title": "DistServe: Disaggregating Prefill and Decoding for Goodput-optimized LLM Serving", "authors": "Y. Sheng, L. Zheng, Y. Zhu, et al. (PKU)", "arxiv_id": "", "github_repo": "", "conference": "OSDI", "full_conference": "OSDI 2024", "year": 2024, "abstract_en": "(Abstract)\nLarge Language Models (LLMs) are increasingly deployed in latency-sensitive applications. However, existing systems couple the processing of prefilling (computng prompt embeddings) and decoding (autoregressively generating tokens) phases into a single GPU, leading to severe interference: a long prompt forces all requests to wait, while a long decoding request slows down the processing of other requests.\n\nWe propose DistServe, a system that disaggregates prefilling and decoding to different GPUs. The key insight is that isolating the two phases eliminates interference and enables tailoring the hardware configuration for each. We develop an efficient method to determine the optimal placement of prefilling and decoding workloads on heterogeneous GPU clusters. We implement DistServe and evaluate it on a cluster with 16 A100 GPUs. Compared to existing systems like vLLM and Orca, DistServe improves throughput by up to 2.6x while ensuring the latency SLOs are met.", "abstract_cn": "", "intro_en": "(Introduction)\nLLM serving differs from traditional ML inference in that each request consists of two phases: prefilling (processing the prompt and computing intermediate KV cache) and decoding (autoregressively generating tokens). Prior systems interleave these two phases in a single batch, which leads to significant challenges:\n\n1. ** interference between requests with different characteristics\n2. **Inability to optimize each phase independently\n3. **Poor resource utilization due to different compute/memory requirements\n\nDistServe addresses these by disaggregating prefilling and decoding onto separate GPU groups.", "intro_cn": "大型语言模型（LLM）越来越多地部署在延迟敏感的应用中。然而，现有系统将预填充（计算提示嵌入）和解码（自回归生成token）阶段耦合到单个GPU中，导致严重的干扰：长prompt强制所有请求等待，而长解码请求会减慢其他请求的处理。\n\n我们提出了DistServe，这是一个将预填充和解码分配到不同GPU的系统。关键在于隔离这两个阶段可以消除干扰，并为每个阶段定制硬件配置。我们开发了一种高效的方法来确定异构GPU集群上预填充和解码工作负载的最佳放置位置。我们实现了DistServe并在具有16个A100 GPU的集群上对其进行了评估。与vLLM和Orca等现有系统相比，DistServe在确保延迟SLO的同时，将吞吐量提高了2.6倍。", "file": "arxiv/2024/distserve.md", "id": 16, "topic": "LLM Serving"}, {"title": "TriForce: Hierarchical Speculative Decoding", "authors": "Infini-AI-Lab", "arxiv_id": "", "github_repo": "", "conference": "COLM", "full_conference": "COLM 2024", "year": 2024, "abstract_en": "(Abstract)\nTriForce introduces a hierarchical speculative decoding approach for lossless acceleration of long sequence generation. The key innovation is a multi-level draft-verification hierarchy:\n\n1. **Coarse-level draft**: Fast, smaller model generates draft\n2. **Medium-level verification**: Intermediate model verifies\n3. **Fine-level verification**: Full model confirms final tokens\n\nThis hierarchical approach achieves near-linear speedups while maintaining identical output to standard decoding.", "abstract_cn": "", "intro_en": "(Introduction)\nLong-context LLM inference is particularly challenging due to:\n1. **Quadratic attention complexity**: O(n²) scaling with sequence length\n2. **Memory pressure**: Large KVCache requirements\n3. **Latency issues**: Slow autoregressive generation\n\nTriForce addresses these by:\n- **Hierarchical speculation**: Multiple levels reduce verification cost\n- **Lossless acceleration**: No quality degradation\n- **Scalable architecture**: Works with increasing sequence lengths", "intro_cn": "", "file": "arxiv/2024/triforce.md", "id": 17, "topic": "Speculative Decoding"}, {"title": "Sequoia: Tree-Based Speculative Decoding", "authors": "Infini-AI-Lab", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "(Abstract)\nSequoia presents a scalable and robust tree-based speculative decoding algorithm. Key contributions:\n\n1. **Efficient tree construction**: Optimal draft tree structure\n2. **Robust verification**: Handles various acceptance scenarios\n3. **Adaptive strategy**: Adjusts to different workload characteristics\n4. **Significant speedups**: Up to 2.5x over baseline methods", "abstract_cn": "", "intro_en": "(Introduction)\nTree-based speculative decoding has shown promise but faces challenges:\n- Tree construction overhead\n- Verification complexity\n- Scalability to large trees\n\nSequoia addresses these with:\n- **Optimal tree algorithms**: Minimizes expected verification cost\n- **Efficient verification**: Parallel verification of tree nodes\n- **Adaptive branching**: Dynamic tree size based on acceptance rates", "intro_cn": "", "file": "arxiv/2024/sequoia.md", "id": 18, "topic": "Speculative Decoding"}, {"title": "FlashAttention-3: Fast and Accurate Attention", "authors": "TriDao et al.", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "(Abstract)\nFlashAttention-3 brings significant improvements to the foundational attention mechanism for LLM inference and training. Key innovations:\n\n1. **Asynchrony**: Overlaps computation and memory operations\n2. **Low-precision**: FP8 support with minimal accuracy loss\n3. **Hardware optimization**: Better utilization of modern GPU tensor cores\n4. **2-3x speedup** over FlashAttention-2\n\nFlashAttention series has become the de-facto standard for efficient attention computation in modern LLM systems.", "abstract_cn": "", "intro_en": "(Introduction)\nAttention computation is the core bottleneck in Transformer models:\n\n1. **Memory-bound operation**: Standard attention requires O(N²) memory\n2. **IO overhead**: Slow HBM access dominates runtime\n3. **Limited parallelism**: Difficult to fully utilize GPU resources\n\nFlashAttention-3 addresses these with:\n- **Tile-based computation**: Process in smaller blocks\n- **Online softmax**: Reduce memory while maintaining accuracy\n- **Asynchronous execution**: Hide memory latency\n- **FP8 optimization**: Leverage tensor cores more efficiently", "intro_cn": "", "file": "arxiv/2024/flashattention3.md", "id": 19, "topic": "Attention"}, {"title": "Chameleon: Adaptive Caching for Multi-Adapter LLM Inference", "authors": "Various", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "(Abstract)\nChameleon addresses the challenge of efficient LLM inference in multi-adapter environments. Key contributions:\n\n1. **Adapter-aware caching**: Different adapters have different cache needs\n2. **Adaptive scheduling**: Dynamic adjustment based on workload\n3. **Memory optimization**: Efficient sharing of cache across adapters\n4. **Significant improvements**: Better throughput and latency", "abstract_cn": "", "intro_en": "(Introduction)\nMulti-adapter LLM deployment is increasingly common:\n- Multiple task-specific adapters on one base model\n- Each adapter has different cache requirements\n- Efficient resource sharing is challenging\n\nChameleon solves this with:\n- **Intelligent cache partitioning**: Share where possible, isolate where needed\n- **Dynamic weight adjustment**: Adapt cache allocation based on demand\n- **Co-scheduling**: Coordinate across adapters for best overall performance", "intro_cn": "", "file": "arxiv/2024/chameleon_adapter.md", "id": 20, "topic": "LLM Serving"}, {"title": "EAGLE: Early Exit and Speculative Decoding", "authors": "Various (SafeAILab)", "arxiv_id": "", "github_repo": "", "conference": "ICML", "full_conference": "ICML 2024, EMNLP 2024, NeurIPS 2025", "year": 2024, "abstract_en": "(Abstract)\nEAGLE (Early EXIT and spEculative decoding) is a family of speculative decoding methods that achieve significant speedups for LLM inference. The key innovations include:\n\n1. **EAGLE-1 (ICML'24)**: Uses early-exit techniques to speed up draft token generation\n2. **EAGLE-2 (EMNLP'24)**: Improved speculative decoding with better acceptance rates\n3. **EAGLE-3 (NeurIPS'25)**: Further optimizations for better performance\n\nEAGLE achieves 2-3x speedup over standard autoregressive decoding while maintaining output quality.", "abstract_cn": "", "intro_en": "(Introduction)\nSpeculative decoding uses a smaller \"draft\" model to predict multiple tokens ahead, which are then verified by the larger \"target\" model. EAGLE improves upon this by:\n\n1. **Early exit in draft model**: Draft model exits early for confident predictions\n2. **Tree-structured verification**: More efficient batch verification of multiple drafts\n3. **Improved acceptance rate**: Better selection of draft tokens to verify\n4. **Training-free adaptation**: Can be applied to existing models without fine-tuning", "intro_cn": "", "file": "arxiv/2024/eagle_speculative.md", "id": 21, "topic": "Speculative Decoding"}, {"title": "PipeInfer: Asynchronous Pipelined Speculation", "authors": "AutonomicPerfectionist", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "(Abstract)\nPipeInfer introduces asynchronous pipelined speculation for LLM inference acceleration. The key innovation is combining:\n\n1. **Pipelining**: Overlap multiple requests' computation\n2. **Speculation**: Use draft tokens for acceleration\n3. **Asynchronous execution**: Maximize GPU utilization\n\nThis approach achieves better throughput by keeping the GPU constantly busy with minimal idle time.", "abstract_cn": "", "intro_en": "(Introduction)\nTraditional speculative decoding has limitations:\n- Synchronous execution creates bubbles\n- Poor GPU utilization between speculation and verification\n- Limited parallelism across requests\n\nPipeInfer addresses these with:\n- **Continuous speculation pipeline**: Always have drafts in flight\n- **Decoupled verification**: Verify previous drafts while generating new ones\n- **Request-level parallelism**: Multiple requests in pipeline simultaneously", "intro_cn": "", "file": "arxiv/2024/pipeinfer.md", "id": 22, "topic": "Speculative Decoding"}, {"title": "ShadowKV: KV Cache in Shadows for Long-Context Inference", "authors": "Various", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "(Abstract)\nShadowKV introduces a novel approach for high-throughput long-context LLM inference. Key innovations:\n\n1. **Shadow cache**: Secondary cache layer for efficiency\n2. **Hierarchical caching**: Multi-level cache hierarchy\n3. **Selective computation**: Only compute when necessary\n4. **3-4x speedup**: Significant improvements for long contexts", "abstract_cn": "", "intro_en": "(Introduction)\nLong-context inference faces unique challenges:\n- KV cache becomes prohibitively large\n- Memory bandwidth is bottleneck\n- Computation waste on redundant tokens\n\nShadowKV addresses this with:\n- **Shadow mechanism**: Lightweight secondary cache tracks what can be reused\n- **Efficient recomputation**: On-demand KV regeneration when needed\n- **Smart caching policy**: Balances memory vs compute tradeoff", "intro_cn": "", "file": "arxiv/2024/shadowkv.md", "id": 23, "topic": "KV Cache"}, {"title": "MiniKV: Layer-Discriminative KV Cache", "authors": "Various (Microsoft?)", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "(Abstract)\nMiniKV introduces a 2-bit layer-discriminative KV cache optimization for efficient LLM inference. Key innovations:\n\n1. **Layer-aware quantization**: Different layers get different precision\n2. **2-bit compression**: Aggressive KV cache compression\n3. **Minimal accuracy loss**: Maintains model quality through careful design\n4. **Significant memory savings**: Up to 4x KV cache reduction", "abstract_cn": "", "intro_en": "(Introduction)\nKV cache is a major memory bottleneck in LLM serving:\n- Grows linearly with sequence length\n- Becomes prohibitive for long contexts\n- Limits batch size and concurrency\n\nMiniKV addresses this with:\n- **Layer discrimination**: Not all layers need same precision\n- **2-bit quantization**: Aggressive but careful compression\n- **Minimal quality impact**: Careful calibration maintains quality", "intro_cn": "", "file": "arxiv/2024/minikv.md", "id": 24, "topic": "KV Cache"}, {"title": "DART: Diffusion-Inspired Speculative Decoding", "authors": "Various", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "(Abstract)\nDART (Diffusion-inspired Speculative Decoding) brings ideas from diffusion models to speculative decoding for LLM inference. The approach:\n\n1. **Multiple draft candidates**: Generate several possible token sequences\n2. **Tree-based verification**: Efficiently verify multiple candidates\n3. **Quality-aware selection**: Choose best among multiple drafts\n4. **Improved acceptance rates**: Better overall efficiency", "abstract_cn": "", "intro_en": "(Introduction)\nStandard speculative decoding has limitations:\n- Linear draft sequence\n- Limited exploration of token space\n- Single acceptance path\n\nDART improves by:\n- **Branching drafts**: Explore multiple token possibilities\n- **Parallel verification**: Verify multiple paths efficiently\n- **Best-path selection**: Choose optimal sequence", "intro_cn": "", "file": "arxiv/2024/dart_speculative.md", "id": 25, "topic": "Speculative Decoding"}, {"title": "Star-Attention: Efficient LLM Inference over Long Sequences", "authors": "NVIDIA", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "(Abstract)\nStar-Attention introduces a novel sparse attention pattern for efficient long-context LLM inference. The key innovation is using a star-shaped attention pattern that:\n\n1. **Reduces attention complexity** from O(n²) to O(n)\n2. **Maintains model quality** with minimal accuracy loss\n3. **Achieves 11x speedup** on long sequence benchmarks\n\nThis is achieved by dividing the context into blocks with block-wise attention and using a small set of anchor tokens to maintain global coherence.", "abstract_cn": "", "intro_en": "(Introduction)\nLong context inference is critical for many applications but faces challenges:\n\n1. **Computational complexity**: Full attention scales quadratically\n2. **Memory pressure**: KVCache grows with sequence length\n3. **Latency**: Autoregressive generation becomes slow\n\nStar-Attention solves this with:\n- **Block-wise attention**: Local blocks attend within themselves\n- **Anchor tokens**: Small set of tokens maintain global context\n- **Approximate attention**: Trade-off between quality and speed", "intro_cn": "", "file": "arxiv/2024/star_attention.md", "id": 26, "topic": "Attention"}, {"title": "ParallelVLM: Lossless Video-LLM Acceleration with Visual Alignment Aware Parallel Speculative Decoding", "authors": "Quan Kong, Yuhao Shen, Yicheng Ji, Huan Li, Cong Wang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2025, "abstract_en": "尽管当前的视频语言模型 (Video-LLMs) 在视频理解任务上取得了令人印象深刻的性能，但它们的自回归解码效率仍然受到大量视频token的限制。\n\n视觉token剪枝可以部分缓解这一瓶颈，但现有方法仍存在信息丢失问题，且加速效果有限。\n\n**ParallelVLM** 提出了一种**视觉对齐感知的并行投机解码**方法，实现无损加速。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2025/parallelvlm.md", "id": 27, "topic": "Speculative Decoding"}, {"title": "ReSpec: Towards Optimizing Speculative Decoding in Reinforcement Learning Systems", "authors": "Qiaoling Chen, Zijun Liu, Peng Sun, Shenggui Li, Guoteng Wang, Ziming Liu, Yonggang Wen, Siyuan Feng, Tianwei Zhang", "arxiv_id": "2510.26475", "github_repo": "", "conference": "arXiv预印本", "full_conference": "arXiv预印本", "year": 2025, "abstract_en": "(Abstract)\n\nAdapting large language models (LLMs) via reinforcement learning (RL) is often bottlenecked by the generation stage, which can consume over 75% of the training time. Speculative decoding offers a promising solution by using a draft model to predict tokens in parallel. However, applying speculative decoding to RL training poses unique challenges: the RL training process has dynamic acceptance rates due to policy changes, and the overhead of maintaining multiple models can be substantial. We present ReSpec, a system that optimizes speculative decoding for RL training of LLMs. ReSpec introduces an adaptive draft selection mechanism that dynamically adjusts the draft model based on the RL policy's evolution. Additionally, we propose a memory-efficient caching strategy that reduces the overhead of managing multiple draft models. Our experiments show that ReSpec reduces the RL training time by up to 40% compared to standard speculative decoding.", "abstract_cn": "", "intro_en": "(Introduction)\n\nRL训练中投机解码的挑战：\n1. RL训练过程动态变化\n2. 接受率不稳定\n3. 多模型开销大\n\nReSpec的创新：\n- 自适应draft选择机制\n- 动态调整draft模型\n- 内存高效缓存策略\n- 减少40%训练时间", "intro_cn": "", "file": "arxiv/2025/27_respec_rl_speculative.md", "id": 28, "topic": "Speculative Decoding"}, {"title": "Reasoning Language Model Inference Serving Unveiled: An Empirical Study", "authors": "Qi Li, Junpan Wu, Xiang Liu, et al.", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2025, "abstract_en": "(Abstract)\n\nThe reasoning large language model (RLLM) has been proven competitive in solving complex reasoning tasks such as mathematics, coding, compared to general LLM. However, the unique inference patterns of RLLMs, such as extended thinking processes and self-verification mechanisms, introduce significant challenges for serving systems. In this paper, we present the first comprehensive empirical study on RLLM inference serving. We analyze the performance characteristics of RLLMs and identify key bottlenecks including longer response lengths, more complex attention patterns, and dynamic computational demands. Based on our findings, we propose several optimization strategies and evaluate their effectiveness. Our study provides valuable insights for designing efficient RLLM serving systems.", "abstract_cn": "", "intro_en": "(Introduction)\n\nRLLM的服务挑战：\n1. 更长的响应长度\n2. 更复杂的注意力模式\n3. 动态计算需求\n4. 自我验证机制\n\n研究贡献：\n- 首次全面实证研究\n- 识别关键瓶颈\n- 提出优化策略\n- 为系统设计提供见解", "intro_cn": "", "file": "arxiv/2025/05_rllm_serving_study.md", "id": 29, "topic": "LLM Serving"}, {"title": "Nightjar: Dynamic Adaptive Speculative Decoding for Large Language Models Serving", "authors": "Rui Li, Zhaoning Zhang, Libo Zhang, et al.", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2024, "abstract_en": "(Abstract)\n\nSpeculative decoding (SD) accelerates LLM inference by verifying draft tokens in parallel. However, this method presents a critical trade-off: it improves throughput in low-load, memory-bound systems but degrades performance in high-load, compute-bound environments due to verification overhead. Existing speculative decoding methods use fixed lengths and cannot adapt to workload changes or decide when to stop speculation. The cost of restarting speculative inference also remains unquantified. Under high load, the benefit of speculation diminishes, while retaining the draft model reduces KV-cache capacity, limiting batch size and degrading throughput. To overcome this, we propose Nightjar, a resource-aware adaptive speculative framework. It first adjusts to the request load by dynamically selecting the optimal speculative length for different batch sizes. Crucially, Nightjar proactively disables speculative decoding when the MAB planner determines that speculation is no longer beneficial, and during the disabled phase, offloads the draft model to the CPU only under GPU memory pressure. This reclaims memory for the KV cache, thereby facilitating larger batch sizes and maximizing overall system throughput. Experiments show that Nightjar achieves average 27.29% higher throughput and up to 20.18% lower latency compared to standard speculative decoding under dynamic request arrival rates in real-time LLM serving scenarios.", "abstract_cn": "", "intro_en": "(Introduction)\n\n大型语言模型(LLM)的自回归解码过程是推理延迟的主要瓶颈。投机解码通过使用一个较小的草稿模型并行生成多个候选标记，然后由主模型验证，从而加速这一过程。然而，现有的投机解码方法存在以下问题：\n\n1. **固定投机长度**：无法根据动态工作负载调整\n2. **高负载下性能下降**：验证开销在计算密集型场景下成为瓶颈\n3. **内存占用**：保留草稿模型占用KV缓存空间，限制批处理大小\n4. **重启成本**：投机推理重启的成本未被考虑\n\nNightjar通过以下创新解决这些问题：\n- **自适应投机长度**：根据请求负载动态调整\n- **智能禁用机制**：当投机不再有益时主动禁用\n- **草稿模型卸载**：释放GPU内存用于KV缓存", "intro_cn": "", "file": "arxiv/2025/02_nightjar.md", "id": 30, "topic": "Speculative Decoding"}, {"title": "KV-Compress: Paged KV-Cache Compression with Variable Compression Rates per Attention Head", "authors": "Ramya Prabhu, Ajay Nayak, Jayashree Mohan, Ramachandran Ramjee, Ashish Panwar", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2024, "abstract_en": "(Abstract)\n\nContext lengths of Large Language Models (LLMs) have exploded in recent years, with 128k-token context becoming a standard and million-token context becoming a reality. Efficiently supporting long-context inference remains challenging as the memory that must be allocated in key-value (KV) cache grows linearly with context length.", "abstract_cn": "", "intro_en": "", "intro_cn": "本文介绍了TIDE，这是一个时间增量draft引擎，用于自我改进的LLM推理，利用过去的推理结果来提高未来性能。\n\n---\n\n# WISP: Waste- and Interference-Suppressed Distributed Speculative LLM Serving at the Edge", "file": "arxiv/2025/llm_serving_papers_2025.md", "id": 31, "topic": "KV Cache"}, {"title": "SpecSteer: Synergizing Local Context and Global Reasoning for Efficient Personalized Generation", "authors": "Hang Lv, Sheng Liang, Hao Wang, Yongyue Zhang, Hongchao Gu, Wei Guo, Defu Lian, Yong Liu, Enhong Chen", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2025, "abstract_en": "个性化生成需要结合用户的本地上下文和云端的大规模推理能力。本地设备上的模型可以快速响应，但能力有限；云端模型能力强，但延迟高。\n\n**SpecSteer** 是一个将私有设备端上下文与云端规模推理协同的框架。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2025/specsteer.md", "id": 32, "topic": "Speculative Decoding"}, {"title": "MMSpec: Benchmarking Speculative Decoding for Vision-Language Models", "authors": "Hui Shen, Xin Wang, Ping Zhang, Yunta Hsieh, Qi Han, Zhongwei Wan, Ziheng Zhang, Jingxuan Zhang, Jing Xiong, Ziyuan Liu, Yifan Zhang, Hangrui Cao, Chenyang Zhao, Mi Zhang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2025, "abstract_en": "视觉语言模型 (Vision-Language Models, VLMs) 在多模态任务上表现出色，但由于模型规模大、上下文长，推理延迟很高。\n\n投机解码 (Speculative Decoding, SD) 是一种有前景的加速方法，但现有工作主要集中在纯语言模型上，VLM上的投机解码缺乏系统研究。\n\n**MMSpec** 是第一个专门针对**视觉语言模型投机解码**的基准测试框架。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2025/mmspec.md", "id": 33, "topic": "Speculative Decoding"}, {"title": "Pipelined Collaborative Speculative Decoding Framework for Efficient Edge-Cloud LLM Inference", "authors": "Yida Zhang, Zhiyong Gao, Shuaibing Yue, Jie Li, Rui Wang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2025, "abstract_en": "边缘-云协作推理已成为平衡设备端计算能力和云端强大模型能力的重要范式。然而，如何有效平衡边缘设备的计算能力与云端能力仍是一个开放问题。\n\n**Pipelined Collaborative Speculative Decoding** 是一个高效的**边缘-云LLM推理的流水线协作投机解码框架**。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2025/pipelined_collaborative_sd.md", "id": 34, "topic": "Speculative Decoding"}, {"title": "HeiSD: Hybrid Speculative Decoding for Embodied Vision-Language-Action Models with Kinematic Awareness", "authors": "Zihao Zheng, Zhihao Mao, Sicheng Tian, Maoliang Li, Jiayu Chen, Xinhao Sun, Zhaobo Zhang, Xuanzhe Liu, Donggang Cao, Hong Mei, Xiang Chen", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2025, "abstract_en": "视觉语言动作模型 (Vision-Language-Action, VLA) 已成为机器人控制的主流解决方案，但推理速度较慢。\n\n投机解码 (Speculative Decoding, SD) 是一种有前景的加速方法，可分为两类：\n- 基于draft的SD\n- 基于检索的SD\n\n现有方法未能分析VLA模型的独特优势。\n\n**HeiSD** 提出了一种**具有运动学感知的混合投机解码**方法。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2025/heid.md", "id": 35, "topic": "Speculative Decoding"}, {"title": "xLLM Technical Report", "authors": "Tongxuan Liu, Tao Peng, Peijun Yang, et al.", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2025, "abstract_en": "(Abstract)\n\nWe introduce xLLM, an intelligent and efficient Large Language Model (LLM) inference framework designed for high-performance, large-scale enterprise-grade deployments. xLLM addresses the critical challenges in production LLM serving by introducing several key innovations: (1) a dynamic batching mechanism that optimizes throughput while meeting latency SLOs, (2) an intelligent prefetching system that anticipates and prepares for upcoming requests, (3) a flexible serving architecture that supports multiple deployment modes including standalone, distributed, and edge-cloud configurations, and (4) comprehensive resource management with automatic scaling and load balancing. Extensive experiments demonstrate that xLLM achieves 2-5x throughput improvement over existing open-source inference frameworks while maintaining competitive latency.", "abstract_cn": "", "intro_en": "(Introduction)\n\n企业级LLM服务面临的挑战：\n1. 高吞吐量需求\n2. 延迟SLO要求\n3. 资源利用率\n4. 部署灵活性\n\nxLLM的创新：\n- 动态批处理机制\n- 智能预取系统\n- 灵活部署架构\n- 自动资源管理\n- 2-5倍吞吐量提升", "intro_cn": "我们介绍了xLLM，一个智能高效的大型语言模型（LLM）推理框架，专为高性能、大规模企业级部署而设计。xLLM通过引入几个关键创新来解决生产LLM服务的关键挑战：（1）动态批处理机制，在满足延迟SLO的同时优化吞吐量，（2）智能预取系统，可以预测和准备即将到来的请求，（3）灵活的服务架构，支持多种部署模式，包括独立、分布式和边缘云配置，（4）具有自动扩展和负载平衡的综合资源管理。大量实验表明，xLLM相比现有开源推理框架实现了2-5倍的吞吐量提升，同时保持竞争力的延迟。", "file": "arxiv/2025/06_xllm.md", "id": 36, "topic": "LLM Serving"}, {"title": "PCR: A Prefetch-Enhanced Cache Reuse System for Low-Latency RAG Serving", "authors": "Wenfeng Wang, Xiaofeng Hou, Peng Tang, Hengyi Zhou, Jing Wang, Xinkai Wang, Chao Li, Minyi Guo", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2025, "abstract_en": "检索增强生成 (Retrieval-Augmented Generation, RAG) 系统通过整合检索到的外部文档来增强大语言模型 (LLMs) 的性能，从而实现更准确和上下文感知的响应。\n\n然而，集成这些外部文档通常会导致**非常长的输入序列**，这显著增加了预填充 (prefill) 阶段的计算成本。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2025/pcr_rag_cache.md", "id": 37, "topic": "LLM Serving"}, {"title": "DSD: A Distributed Speculative Decoding Solution for Edge-Cloud Agile Large Model Serving", "authors": "Fengze Yu, Leshu Li, Brad McDanel, Sai Qian Zhang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2025, "abstract_en": "(Abstract)\n\nLarge language model (LLM) inference often suffers from high latency, which limits its practical applicability in real-time applications. Speculative decoding has emerged as a promising technique to reduce inference latency by using a smaller draft model to propose candidate tokens. However, existing speculative decoding solutions are typically designed for single-machine scenarios and cannot fully exploit the potential of distributed computing resources. We present DSD, a distributed speculative decoding solution for edge-cloud agile large model serving. DSD leverages both edge devices and cloud servers to collaboratively perform speculative decoding, dynamically allocating computation based on device capabilities and network conditions. Our experiments show that DSD achieves up to 3x speedup compared to cloud-only serving while maintaining response quality.", "abstract_cn": "", "intro_en": "(Introduction)\n\n核心挑战：\n1. LLM推理延迟高\n2. 单机场景无法利用分布式资源\n3. 边缘云资源协调困难\n\nDSD的创新：\n- 边缘云协作投机解码\n- 动态计算分配\n- 高达3倍加速\n- 保持响应质量", "intro_cn": "", "file": "arxiv/2025/03_dsd.md", "id": 38, "topic": "Speculative Decoding"}, {"title": "Speculating Experts: Accelerates Inference for Mixture-of-Experts", "authors": "Vivan Madan, Prajwal Singhania, Abhinav Bhatele, Tom Goldstein, Ashwinee Panda", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\n> ...per-token compute. However, in memory-constrained inference settings, expert weights must be offloaded to CPU, creating a performance bottleneck from CPU-GPU transfers during decoding. We propose an expert prefetching scheme that leverages currently computed internal model representations to...", "abstract_cn": "", "intro_en": "(Introduction)\n\nMoE架构通过稀疏激活来增强大语言模型的可扩展性,使其适合在资源受限的边缘网络中部署。然而,大量的专家数量通常超过单个边缘节点的内存容量,需要无线分布式MoE (WIDE)推理。", "intro_cn": "", "file": "arxiv/2026/31_speculating_experts_moe.md", "id": 39, "topic": "Speculative Decoding"}, {"title": "A Pipelined Collaborative Speculative Decoding Framework for Efficient Edge-Cloud LLM Inference", "authors": "Yida Zhang, Zhiyong Gao, Shuaibing Yue, Jie Li, Rui Wang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "边缘-云协作推理已成为平衡设备端计算能力和云端强大模型能力的重要范式。然而，如何有效平衡边缘设备的计算能力与云端能力仍是一个开放问题。\n\n**Pipelined Collaborative Speculative Decoding** 是一个高效的**边缘-云LLM推理的流水线协作投机解码框架**。", "abstract_cn": "", "intro_en": "", "intro_cn": "本文介绍了StarSD，这是一种一对多的推测解码方法，使单个draft模型能够与多个目标模型高效协作。\n\n---", "file": "arxiv/2026/llm_serving_papers_2026.md", "id": 40, "topic": "Speculative Decoding"}, {"title": "FLYING SERVING: On-the-Fly Parallelism Switching for Large Language Model Serving", "authors": "Shouwei Gao, Junqi Yin, Feiyi Wang, Wenqian Dong", "arxiv_id": "", "github_repo": "", "conference": "ACM", "full_conference": "ACM International Conference on Supercomputing (ICS 2026)", "year": 2026, "abstract_en": "(Abstract)\nProduction LLM serving must simultaneously deliver high throughput, low latency, and sufficient context capacity under non-stationary traffic and mixed request requirements. Data parallelism (DP) maximizes throughput by running independent replicas, while tensor parallelism (TP) reduces per-request latency and pools memory for long-context inference. However, existing serving stacks typically commit to a static parallelism configuration at deployment; adapting to bursts, priorities, or long-context requests is often disruptive and slow. We present Flying Serving, a vLLM-based system that enables online DP-TP switching without restarting engine workers. Flying Serving makes reconfiguration practical by virtualizing the state that would otherwise force data movement: (i) a zero-copy Model Weights Manager that exposes TP shard views on demand, (ii) a KV Cache Adaptor that preserves request KV state across DP/TP layouts, (iii) an eagerly initialized Communicator Pool to amortize collective setup, and (iv) a deadlock-free scheduler that coordinates safe transitions under execution skew. Across three popular LLMs and realistic serving scenarios, Flying Serving improves performance by up to 4.79x under high load and 3.47x under low load while supporting latency- and memory-driven requests.", "abstract_cn": "*更新时间: 2026-03-25*", "intro_en": "", "intro_cn": "生产级LLM服务必须在非平稳流量和混合请求需求下同时提供高吞吐量、低延迟和足够的上下文容量。数据并行（DP）通过运行独立副本来最大化吞吐量，而张量并行（TP）减少每请求延迟并聚合内存用于长上下文推理。然而，现有服务堆栈通常在部署时静态配置并行性；适应突发、优先级或长上下文请求通常具有破坏性且缓慢。我们提出了Flying Serving，这是一个基于vLLM的系统，可以在不重启引擎 workers 的情况下实现在线DP-TP切换。Flying Serving通过虚拟化原本会强制数据移动的状态来使重新配置变得实用：(i) 零拷贝模型权重管理器，可按需暴露TP分片视图，(ii) KV Cache适配器，可在DP/TP布局之间保留请求KV状态，(iii) 积极初始化的通信器池，以分摊集体设置，以及 (iv) 无死锁调度器，在执行偏斜下协调安全转换。在三个流行的LLM和实际服务场景中，Flying Serving在高负载下将性能提升至4.79倍，在低负载下提升至3.47倍，同时支持延迟驱动和内存驱动的请求。", "file": "arxiv/2026/flying_serving_parallelism.md", "id": 41, "topic": "LLM Serving"}, {"title": "WISP: Waste- and Interference-Suppressed Distributed Speculative LLM Serving at the Edge", "authors": "", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\nAs Large Language Models (LLMs) become increasingly accessible to end users, an ever-growing number of inference requests are initiated from edge devices and computed on centralized GPU clusters. However, the resulting exponential growth in computation workload is placing significant strain on data centers, while edge devices remain largely underutilized, leaving substantial computational resources idle. We present WISP, a waste- and interference-suppressed distributed speculative LLM serving system that coordinates edge and cloud resources for efficient inference. WISP introduces a dynamic drafting strategy that adapts to varying network conditions and request characteristics, while suppressing both computation waste and interference between concurrent requests. Our system achieves 2.3x higher throughput compared to state-of-the-art edge-cloud LLM serving systems.", "abstract_cn": "*本文档由自动化任务生成于 2026-03-24*", "intro_en": "(Introduction)\n\n边缘云LLM服务面临的挑战：\n1. 数据中心计算压力巨大\n2. 边缘设备资源未充分利用\n3. 网络延迟和带宽限制\n4. 并发请求之间的干扰\n\nWISP的核心创新：\n- 动态draft策略适应网络条件\n- 浪费和干扰抑制机制\n- 边缘云资源协调\n- 2.3倍吞吐量提升", "intro_cn": "", "file": "arxiv/2026/wisp_distributed_speculative_serving.md", "id": 42, "topic": "Speculative Decoding"}, {"title": "AE-LLM: Adaptive Efficiency Optimization for Large Language Models", "authors": "Kaito Tanaka, Masato Ito, Yuji Nishimura, Keisuke Matsuda, Aya Nakayama", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\nLarge Language Models (LLMs) have achieved remarkable success across diverse applications, yet their deployment remains challenging due to substantial computational costs, memory requirements, and energy consumption. Recent empirical studies have demonstrated that no single efficiency technique is universally optimal; instead, the effectiveness of methods su...\n\nLLM在各种应用取得了显著成功，但其部署仍面临计算成本、内存需求和能源消耗方面的挑战。最近的实证研究表明，没有单一的效率技术是普遍最优的。", "abstract_cn": "*更新时间: 2026-03-24*", "intro_en": "(Introduction)\n\n大语言模型的部署面临着多重挑战：\n- 计算成本高\n- 内存需求大\n- 能源消耗高\n\n本文提出自适应效率优化框架AE-LLM，根据不同工作负载动态选择最优的效率优化技术。", "intro_cn": "", "file": "arxiv/2026/ae_llm_adaptive_efficiency.md", "id": 43, "topic": "LLM Serving"}, {"title": "Beyond Test-Time Compute Strategies: Advocating Energy-per-Token in LLM Inference", "authors": "Patrick Wilhelm, Thorsten Wittkopp, Odej Kao", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\nLarge Language Models (LLMs) demonstrate exceptional performance across diverse tasks but come with substantial energy and computational costs, particularly in request-heavy scenarios. In many real-world applications, the full scale and capabilities of...\n\nLLM在各种任务中表现出色，但需要大量的能源和计算成本，特别是在请求密集型场景中。本文提出以\"每Token能源消耗\"作为新的优化指标。", "abstract_cn": "*更新时间: 2026-03-24*", "intro_en": "(Introduction)\n\n现有的LLM推理优化主要关注延迟和吞吐量，但忽略了能源效率这一关键指标。本文提出：\n- 每Token能源消耗(Energy-per-Token)作为核心优化目标\n- 能源感知的推理调度策略\n- 绿色计算在LLM部署中的应用", "intro_cn": "", "file": "arxiv/2026/energy_per_token_llm_inference.md", "id": 44, "topic": "LLM Serving"}, {"title": "MineDraft: A Framework for Batch Parallel Speculative Decoding", "authors": "Zhenwei Tang, Arun Verma, Zijian Zhou, Zhaoxuan Wu, Alok Prakash, Daniela Rus, Bryan Kian Hsiang Low", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "投机解码 (Speculative Decoding) 是一种通过使用draft模型预测token序列，然后由target模型验证来加速LLM推理的技术。\n\n然而，现有的投机解码框架主要针对单序列推理进行优化，无法有效处理批处理场景。\n\n**MineDraft** 是一个**批量并行投机解码框架**，专门针对批处理推理场景进行优化。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2026/minedraft.md", "id": 45, "topic": "Speculative Decoding"}, {"title": "P-EAGLE: Parallel-Drafting EAGLE with Scalable Training", "authors": "Mude Hui, Xin Huang, Jaime Campos Salas, Yue Sun, Nathan Pemberton, Xiang Song, Ashish Khetan, George Karypis", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\nReasoning LLMs produce longer outputs, requiring speculative decoding drafters trained on extended sequences. Parallel drafting - predicting multiple tokens per forward pass - offers latency benefits over sequential generation, but training complexity scales quadratically with the product of sequence length and parallel positions, rendering long-context training impractical. We present P(arallel)-EAGLE, which transforms EAGLE from autoregressive to parallel multi-token prediction via a learnable shared hidden state. To scale training to long contexts, we develop a framework featuring attention mask pre-computation and sequence partitioning techniques, enabling gradient accumulation within individual sequences for parallel-prediction training. We implement P-EAGLE in vLLM and demonstrate speedups of 1.10-1.36x over autoregressive EAGLE-3 across GPT-OSS 120B, 20B, and Qwen3-Coder 30B.", "abstract_cn": "*更新时间: 2026-03-25*", "intro_en": "", "intro_cn": "推理LLM产生更长的输出，需要在长序列上训练的投机解码drafters。并行drafting——每次前向传播预测多个tokens——比顺序生成提供延迟优势，但训练复杂度随序列长度和并行位置的乘积呈二次方增长，使得长上下文训练不切实际。我们提出了P(arallel)-EAGLE，它通过可学习的共享隐藏状态将EAGLE从自回归转变为并行多token预测。为了将训练扩展到长上下文，我们开发了一个具有注意力掩码预计算和序列分区技术的框架，使梯度能够在单个序列内积累，用于并行预测训练。我们在vLLM中实现了P-EAGLE，并在GPT-OSS 120B、20B和Qwen3-Coder 30B上展示了比自回归EAGLE-3高1.10-1.36倍的加速。", "file": "arxiv/2026/peagle_parallel_drafting.md", "id": 46, "topic": "LLM Serving"}, {"title": "MoE-Spec: Expert Budgeting for Efficient Speculative Decoding", "authors": "Bradley McDanel, Steven Li, Sruthikesh Surineni, Harshit Khaitan", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\nSpeculative decoding accelerates Large Language Model (LLM) inference by verifying multiple drafted tokens in parallel. However, for Mixture-of-Experts (MoE) models, this parallelism introduces a severe bottleneck: large draft trees activate many unique experts, significantly increasing memory pressure and diminishing speedups from speculative decoding relative to autoregressive decoding. Prior methods reduce speculation depth when MoE verification becomes expensive. We propose MoE-Spec, a training-free verification-time expert budgeting method that decouples speculation depth from memory cost by enforcing a fixed expert capacity limit at each layer, loading only the experts that contribute most to verification and dropping the long tail of rarely used experts that drive bandwidth overhead. Experiments across multiple model scales and datasets show that this method yields 10--30% higher throughput than state-of-the-art speculative decoding baselines (EAGLE-3) at comparable quality, with flexibility to trade accuracy for further latency reductions through tighter budgets.", "abstract_cn": "*更新时间: 2026-03-25*", "intro_en": "", "intro_cn": "投机解码通过并行验证多个draft tokens来加速大型语言模型（LLM）推理。然而，对于混合专家（MoE）模型，这种并行性引入了严重的瓶颈：大型draft树激活许多独特的专家，大大增加了内存压力，并减少了相对于自回归解码的投机解码加速。之前的方法在MoE验证变得昂贵时减少投机深度。我们提出了MoE-Spec，这是一种无需训练的验证时专家预算方法，通过在每一层强制执行固定的专家容量限制来解耦投机深度和内存成本，只加载对验证贡献最大的专家，并丢弃驱动带宽开销的很少使用的专家尾部的专家。在多个模型规模和数据集上的实验表明，与基线（EAGLE-3）相比，该方法在相同质量下提供10-30%更高的吞吐量，并且通过更严格的预算可以灵活地权衡准确性以进一步降低延迟。", "file": "arxiv/2026/moe_spec_expert_budgeting.md", "id": 47, "topic": "Speculative Decoding"}, {"title": "Efficient LLM Serving for Agentic Workflows: A Data Systems Perspective", "authors": "(待补充)", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\nAgentic workflows are composed of sequences of interdependent Large Language Model (LLM) calls, and they have become a dominant workload in modern AI systems. This paper examines LLM serving from a data systems perspective, focusing on the unique challenges posed by agentic workflows.\n\n智能体工作负载由相互依赖的LLM调用序列组成，已成为现代AI系统中的主导工作负载。本文从数据系统角度研究LLM服务，重点关注智能体工作负载带来的独特挑战。", "abstract_cn": "*更新时间: 2026-03-24*", "intro_en": "(Introduction)", "intro_cn": "", "file": "arxiv/2026/llm_serving_agentic_workflows.md", "id": 48, "topic": "Speculative Decoding"}, {"title": "DualPath: Breaking the Storage Bandwidth Bottleneck in Agentic LLM Inference", "authors": "Yongtong Wu, Shaoyuan Chen, Yinmin Zhong, Rilin Huang, Yixuan Tan, Wentao Zhang, Liyue Zhang, Shangyan Zhou, Yuxuan Liu, Shunfeng Zhou, Mingxing Zhang, Xin Jin, Panpan Huang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\nThe performance of multi-turn, agentic LLM inference is increasingly dominated by KV-Cache storage I/O rather than computation. In prevalent disaggregated architectures, loading the massive KV-Cache from external storage creates a fundamental imbalance: storage NICs on prefill engines become bandwidth-saturated, while those on decoding engines remain idle. This asymmetry severely constrains overall system throughput. We present DualPath, an inference system that breaks this bottleneck by introducing dual-path KV-Cache loading. Beyond the traditional storage-to-prefill path, DualPath enables a novel storage-to-decode path, in which the KV-Cache is loaded into decoding engines and then efficiently transferred to prefill engines via RDMA over the compute network. DualPath combines this optimized data path -- which inherently avoids network congestion and avoids interference with latency-critical model execution communications -- with a global scheduler that dynamically balances load across prefill and decode engines. Our evaluation on three models with production agentic workloads demonstrates that DualPath improves offline inference throughput by up to 1.87x on our in-house inference system. It can also improve online serving throughput by an average factor of 1.96x without violating SLO.", "abstract_cn": "*更新时间: 2026-03-25*", "intro_en": "", "intro_cn": "多轮、agentic LLM推理的性能越来越受KV-Cache存储I/O而非计算支配。在流行的解聚架构中，从外部存储加载大量KV-Cache造成了一个根本的不平衡：预填充引擎上的存储NIC变得带宽饱和，而解码引擎上的存储NIC却保持空闲。这种不对称性严重限制了整体系统吞吐量。我们提出了DualPath，这是一种通过引入双路径KV-Cache加载来打破这一瓶颈的推理系统。除了传统的存储到预填充路径，DualPath还启用了一种新颖的存储到解码路径，在该路径中，KV-Cache被加载到解码引擎，然后通过计算网络上的RDMA高效传输到预填充引擎。DualPath将这种优化的数据路径（本质上避免网络拥塞并避免与延迟关键模型执行通信的干扰）与全局调度器相结合，全局调度器动态平衡预填充和解码引擎之间的负载。我们在对三个具有生产agentic工作负载的模型进行评估表明，DualPath在内部推理系统上将离线推理吞吐量提高了1.87倍。它还可以在不违反SLO的情况下将在线服务吞吐量平均提高1.96倍。", "file": "arxiv/2026/dualpath_storage_bandwidth.md", "id": 49, "topic": "LLM Serving"}, {"title": "When RL Meets Adaptive Speculative Training: A Unified Training-Serving System", "authors": "Junxiong Wang, Fengxiang Bie, Jisen Li, et al.", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\nSpeculative... (待补充完整摘要)", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "arxiv/2026/03_ast.md", "id": 50, "topic": "Speculative Decoding"}, {"title": "ConsRoute: Consistency-Aware Adaptive Query Routing for Cloud-Edge-Device LLMs", "authors": "Haoyu Qiao, Hao Zhang, Shanwen Mao, Siyao (待完善)", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\n> Large Language Models (LLMs) are equipped with profound semantic knowledge, making them a natural choice for injecting semantic generalization into personalized search systems...", "abstract_cn": "", "intro_en": "(Introduction)\n\n云-边-设备协同的LLM推理需要处理异构的计算资源和网络环境。如何在保证推理质量的前提下,优化延迟和资源利用率是核心挑战。", "intro_cn": "", "file": "arxiv/2026/35_consroute.md", "id": 51, "topic": "Edge-Cloud"}, {"title": "RelayCaching: Accelerating LLM Collaboration via Decoding KV Cache Reuse", "authors": "Yingsheng Geng, Yuchong Gao, Weihong Wu, Guyue Liu, Jiang Liu", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\nThe increasing complexity of AI tasks has shifted the paradigm from monolithic models toward multi-agent large language model (LLM) systems. However, these collaborative architectures introduce a critical bottleneck: redundant prefill computation for shared content generated by previous agents, which significantly increases KV cache memory usage and time-to-first-token (TTFT). While various KV cache methods have been proposed to mitigate prefill redundancy, they either fail to maintain accuracy on agent-generated outputs or exhibit low reuse rates due to rigid constraints. We present RelayCaching, a training-free inference method that directly reuses decoding phase KV caches from previous agents in subsequent prefill phases. Our key insight is that KV caches for identical content are highly consistent across phases, while prefix-induced deviations are sparse and localized within a limited range of layers and token positions. By selectively recomputing KV caches at these positions, RelayCaching preserves model accuracy with minimal overhead, yielding a superior accuracy-efficiency trade-off over existing methods. Experiments on diverse collaborative LLM tasks spanning mathematical reasoning, general knowledge, and code generation demonstrate that RelayCaching achieves over 80% KV cache reuse, reduces TTFT by up to 4.7× compared to the standard pipeline, all with negligible accuracy degradation.", "abstract_cn": "", "intro_en": "(Introduction)\n\n多代理LLM系统是当前AI的重要发展方向，但存在计算冗余问题。RelayCaching通过重用解码阶段的KV缓存来解决这一问题，无需训练即可实现高效的代理协作。", "intro_cn": "", "file": "arxiv/2026/29_relaycaching.md", "id": 52, "topic": "KV Cache"}, {"title": "Characterizing CPU-Induced Slowdowns in Multi-GPU LLM Inference", "authors": "Euijun Chung, Yuxiao Jia, Aaron Jezghani, Hyesoon Kim", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\n> ...increasingly rely on multi-GPU systems, yet their performance is often limited by an overlooked component: the CPU. Through a detailed study of modern large language model (LLM)...", "abstract_cn": "", "intro_en": "(Introduction)\n\n多GPU系统已成为加速LLM推理的标准方法,但实际性能往往受到CPU瓶颈的限制。本文通过深入分析CPU在多GPU LLM推理中的角色,识别了导致性能下降的关键因素,并提出了优化建议。", "intro_cn": "", "file": "arxiv/2026/33_cpu_slowdowns_multigpu.md", "id": 53, "topic": "LLM Serving"}, {"title": "EAGLE-Pangu: Accelerator-Safe Tree Speculative Decoding on Ascend NPUs", "authors": "Chang Han, Yijie Hu, Jingling Liu", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\nAutoregressive decoding remains a primary bottleneck in large language models (LLMs). Tree speculative decoding has emerged as a promising technique to accelerate inference by exploring multiple candidate token sequences in parallel. However, existing approaches are primarily designed for GPUs and fail to fully leverage neural processing units (NPUs).\n\n自回归解码仍然是LLM的主要瓶颈。树形投机解码作为一种有前景的技术出现，通过并行探索多个候选token序列来加速推理。然而，现有方法主要针对GPU设计，未能充分利用NPU。", "abstract_cn": "*更新时间: 2026-03-24*", "intro_en": "(Introduction)", "intro_cn": "", "file": "arxiv/2026/eagle_pangu_tree_speculative.md", "id": 54, "topic": "Speculative Decoding"}, {"title": "SpecEyes: Accelerating Agentic Multimodal LLMs via Speculative Perception and Planning", "authors": "Haoyu Huang, Jinfa Huang, Zhongwei Wan, Xiawu Zheng, Rongrong Ji, Jiebo Luo", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\nAgentic multimodal large language models (MLLMs) (e.g., OpenAI o3 and Gemini Agentic Vision) achieve remarkable reasoning capabilities through iterative visual tool invocation. However, the cascaded pipeline of tool use introduces significant latency, making real-time deployment challenging. To address this, we propose SpecEyes, a novel speculative perception and planning framework for agentic MLLMs. Specifically, we first reveal a stateful bottleneck in current agentic MLLMs: the sequential tool-use dependency limits both latency and concurrency. Based on this insight, we propose speculative reasoning that can skip full tool invocation loops for easy queries. To decide whether to bypass the tool-using model, we introduce answer separability gating, a new confidence metric based on top-K logit gaps. Extensive experiments on multiple benchmarks (including V* Bench, HR-Bench, POPE, DeepEyes, and Thyme) demonstrate that SpecEyes can achieve up to 2.9× speedup while maintaining comparable accuracy.", "abstract_cn": "", "intro_en": "(Introduction)\n\n代理多模态大语言模型(MLLM)通过迭代调用视觉工具来实现复杂的推理能力。然而，这种级联管道存在严重的延迟问题，限制了实时部署的可能性。\n\n本文的主要贡献：\n1. 揭示了当前代理MLLM中的有状态瓶颈\n2. 提出投机推理框架，可以跳过简单查询的完整工具调用\n3. 引入答案可分离门控机制，基于top-K logit间隙判断是否绕过工具使用模型", "intro_cn": "", "file": "arxiv/2026/28_specEyes.md", "id": 55, "topic": "Speculative Decoding"}, {"title": "The Workload-Router-Pool Architecture for LLM Inference Optimization", "authors": "Huamin Chen, Xunzhuo Liu, Bowei He, Fuyuan Lyu, Yankai Chen, Xue Liu, Yuhan Liu, Junchen Jiang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2026, "abstract_en": "(Abstract)\n\n> ...caching, user-feedback-driven routing adaptation, hallucination detection, and hierarchical content-safety classification for privacy and jailbreak protection; (2) fleet optimization -- fleet provisioning and energy-efficiency analysis; (3) agentic and multimodal routing -- multimodal agent routing, tool selection, CUA security, and multi-turn context memory...", "abstract_cn": "", "intro_en": "(Introduction)\n\n随着LLM在生产环境中的大规模部署,如何高效地路由和调度推理请求成为关键挑战。传统的负载均衡策略无法充分利用LLM服务的独特特性,需要更智能的路由机制。", "intro_cn": "", "file": "arxiv/2026/34_workload_router_pool.md", "id": 56, "topic": "LLM Serving"}, {"title": "Infinite-LLM: Efficient LLM Service for Long Context with DistAttention and Distributed KVCache", "authors": "Bin Lin, Chen Zhang, Tao Peng, et al.", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv", "year": 2024, "abstract_en": "(Abstract)\n\nLarge Language Models (LLMs) demonstrate substantial potential across a diverse array of domains via request serving. However, as trends continue to push for expanding context sizes, the autoregressive nature of LLMs results in highly dynamic behavior of the attention layers, showcasing significant differences in computational characteristics and memory requirements from the non-attention layers. This presents substantial challenges for resource management and performance optimization in service systems. Existing static model parallelism and resource allocation strategies fall short when dealing with this dynamicity. To address the issue, we propose Infinite-LLM, a novel LLM serving system designed to effectively handle dynamic context lengths. Infinite-LLM disaggregates attention layers from an LLM's inference process, facilitating flexible and independent resource scheduling that optimizes computational performance and enhances memory utilization
