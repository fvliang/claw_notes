# 智能体工作负载特点\n- 多步骤、相互依赖的LLM调用\n- 状态管理需求\n- 延迟敏感的应用场景", "file": "./arxiv/2026/llm_serving_agentic_workflows.md", "has_content": true, "id": 58, "topic": "Speculative Decoding"}, {"title": "DualPath: Breaking the Storage Bandwidth Bottleneck in Agentic LLM Inference", "authors": "Yongtong Wu, Shaoyuan Chen, Yinmin Zhong, Rilin Huang, Yixuan Tan, Wentao Zhang, Liyue Zhang, Shangyan Zhou, Yuxuan Liu, Shunfeng Zhou, Mingxing Zhang, Xin Jin, Panpan Huang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/dualpath_storage_bandwidth.md", "has_content": false, "id": 59, "topic": "LLM Serving"}, {"title": "When RL Meets Adaptive Speculative Training: A Unified Training-Serving System", "authors": "Junxiong Wang, Fengxiang Bie, Jisen Li, et al.", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "现有方法的局限性：\n1. 训练与服务分离，忽视协同优化潜力\n2. 训练需要大量计算资源\n3. 无法动态适应推理性能\n\nAST的创新点：\n- 训练与服务统一框架\n- 基于推理性能的动态训练目标调整\n- 在线反馈机制持续优化\n- 高效模型更新策略", "file": "./arxiv/2026/03_ast.md", "has_content": true, "id": 60, "topic": "Speculative Decoding"}, {"title": "ConsRoute: Consistency-Aware Adaptive Query Routing for Cloud-Edge-Device LLMs", "authors": "Haoyu Qiao, Hao Zhang, Shanwen Mao, Siyao (待完善)", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "云-边-设备协同的LLM推理需要处理异构的计算资源和网络环境。如何在保证推理质量的前提下,优化延迟和资源利用率是核心挑战。", "file": "./arxiv/2026/35_consroute.md", "has_content": true, "id": 61, "topic": "Edge-Cloud"}, {"title": "RelayCaching: Accelerating LLM Collaboration via Decoding KV Cache Reuse", "authors": "Yingsheng Geng, Yuchong Gao, Weihong Wu, Guyue Liu, Jiang Liu", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "多代理LLM系统是当前AI的重要发展方向，但存在计算冗余问题。RelayCaching通过重用解码阶段的KV缓存来解决这一问题，无需训练即可实现高效的代理协作。", "file": "./arxiv/2026/29_relaycaching.md", "has_content": true, "id": 62, "topic": "KV Cache"}, {"title": "Characterizing CPU-Induced Slowdowns in Multi-GPU LLM Inference", "authors": "Euijun Chung, Yuxiao Jia, Aaron Jezghani, Hyesoon Kim", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "多GPU系统已成为加速LLM推理的标准方法,但实际性能往往受到CPU瓶颈的限制。本文通过深入分析CPU在多GPU LLM推理中的角色,识别了导致性能下降的关键因素,并提出了优化建议。", "file": "./arxiv/2026/33_cpu_slowdowns_multigpu.md", "has_content": true, "id": 63, "topic": "LLM Serving"}, {"title": "EAGLE-Pangu: Accelerator-Safe Tree Speculative Decoding on Ascend NPUs", "authors": "Chang Han, Yijie Hu, Jingling Liu", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "### 挑战\n- GPU上的树形解码实现不完全适合NPU架构\n- 需要针对NPU特性的优化", "file": "./arxiv/2026/eagle_pangu_tree_speculative.md", "has_content": true, "id": 64, "topic": "Speculative Decoding"}, {"title": "SpecEyes: Accelerating Agentic Multimodal LLMs via Speculative Perception and Planning", "authors": "Haoyu Huang, Jinfa Huang, Zhongwei Wan, Xiawu Zheng, Rongrong Ji, Jiebo Luo", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "代理多模态大语言模型(MLLM)通过迭代调用视觉工具来实现复杂的推理能力。然而，这种级联管道存在严重的延迟问题，限制了实时部署的可能性。\n\n本文的主要贡献：\n1. 揭示了当前代理MLLM中的有状态瓶颈\n2. 提出投机推理框架，可以跳过简单查询的完整工具调用\n3. 引入答案可分离门控机制，基于top-K logit间隙判断是否绕过工具使用模型", "file": "./arxiv/2026/28_specEyes.md", "has_content": true, "id": 65, "topic": "Speculative Decoding"}, {"title": "The Workload-Router-Pool Architecture for LLM Inference Optimization", "authors": "Huamin Chen, Xunzhuo Liu, Bowei He, Fuyuan Lyu, Yankai Chen, Xue Liu, Yuhan Liu, Junchen Jiang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "随着LLM在生产环境中的大规模部署,如何高效地路由和调度推理请求成为关键挑战。传统的负载均衡策略无法充分利用LLM服务的独特特性,需要更智能的路由机制。", "file": "./arxiv/2026/34_workload_router_pool.md", "has_content": true, "id": 66, "topic": "LLM Serving"}, {"title": "Infinite-LLM: Efficient LLM Service for Long Context with DistAttention and Distributed KVCache", "authors": "Bin Lin, Chen Zhang, Tao Peng, et al.", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "LLM的推理服务面临的主要挑战包括：\n1. 注意力层的动态行为与静态并行策略不匹配\n2. 长上下文场景下KV-Cache内存开销巨大\n3. 现有系统难以处理动态变化的上下文长度\n\nInfinite-LLM提出解耦注意力层的分布式KV-Cache管理，通过GPU内存池化来提升吞吐量和支持更长上下文。", "file": "./arxiv/2026/01_infinite_llm.md", "has_content": true, "id": 67, "topic": "KV Cache"}, {"title": "CXL-SpecKV: A Disaggregated FPGA Speculative KV-Cache for Datacenter LLM Serving", "authors": "Dong Liu, Yanxuan Yu", "arxiv_id": "2512.11920", "github_repo": "", "conference": "FPGA'26", "full_conference": "FPGA'26 Oral", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "LLM的部署面临以下挑战：\n\n1. **KV缓存内存巨大**：随着序列长度增加，内存需求呈二次增长\n2. **批处理大小受限**：GPU内存限制影响系统吞吐量\n3. **内存墙问题**：带宽成为瓶颈\n\nCXL-SpecKV提出以下解决方案：\n- **CXL内存解耦**：利用CXL互连将KV缓存卸载到远程FPGA\n- **投机预取**：预测未来标记并预加载缓存\n- **FPGA压缩引擎**：减少带宽需求4倍", "file": "./arxiv/2026/26_cxl_specKV.md", "has_content": true, "id": 69, "topic": "Speculative Decoding"}, {"title": "S2D2: Fast Decoding for Diffusion LLMs via Training-Free Self-Speculation", "authors": "Ligong Wang, Hao Wang, Kai Xu, Akash Srivastava", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "扩散模型在文本生成中展现出巨大潜力,但其多步去噪过程导致推理速度较慢。本文提出S2D2,通过自投机机制加速扩散LLM的解码过程。", "file": "./arxiv/2026/36_s2d2_diffusion.md", "has_content": true, "id": 70, "topic": "Speculative Decoding"}, {"title": "KV Cache Optimization Strategies for Scalable and Efficient LLM Inference", "authors": "Yichun Xu, Navjot K. Khaira, Tejinder Singh", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "大语言模型的推理过程需要大量的内存来存储KV cache，随着上下文长度增加，内存消耗呈线性增长。这对GPU内存容量、内存带宽和吞吐量都造成了严重限制。\n\n本文提出多种KV cache优化策略，包括：\n- 缓存压缩技术\n- 内存管理策略\n- 计算与内存的平衡优化", "file": "./arxiv/2026/kv_cache_optimization_strategies.md", "has_content": true, "id": 71, "topic": "KV Cache"}, {"title": "Cross-Family Speculative Prefill: Training-Free Long-Context Compression with Small Draft Models", "authors": "Shubhangi Upasani, Ravi Shanker Raju, Bo Li, Mengmeng Ji, John Long, Chen Wu, Urmish Thakker, Guangtao Wang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "### 背景\n- Agentic工作负载需要长上下文处理\n- Prefill阶段计算成本高\n- 现有的speculative decoding主要优化decode阶段", "file": "./arxiv/2026/cross_family_speculative_prefill.md", "has_content": true, "id": 72, "topic": "Speculative Decoding"}, {"title": "FlexServe: A Fast and Secure LLM Serving System for Mobile Devices with Flexible Resource Isolation", "authors": "Yinpeng Wu, Yitong Chen, Lixiang Wang, Jinyu Gu, Zhichao Hua, Yubin Xia", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "随着移动设备上LLM的快速发展，设备端推理成为趋势。然而，设备端LLM面临安全和隐私挑战。ARM TrustZone技术可用于保护敏感应用，但传统TrustZone实现存在显著性能开销。FlexServe通过创新的灵活资源隔离机制解决了这一问题。", "file": "./arxiv/2026/27_flexserve.md", "has_content": true, "id": 73, "topic": "LLM Serving"}, {"title": "TIDE: Temporal Incremental Draft Engine for Self-Improving LLM Inference", "authors": "Jiyoung Park, Hankyu Jang, Changseok Song, Wookeun Jung", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "投机解码的关键问题：\n1. 静态draft模型无法适应特定推理工作负载\n2. Draft模型质量决定整体加速效果\n3. 需要持续优化draft模型\n\nTIDE的核心贡献：\n- 从目标模型输出中提取高质量生成模式\n- 增量更新draft模型\n- 适应推理请求的分布变化", "file": "./arxiv/2026/02_tide.md", "has_content": true, "id": 75, "topic": "LLM Serving"}, {"title": "Rocks, Pebbles and Sand: Modality-aware Scheduling for Multimodal Large Language Model Inference", "authors": "Konstantinos Papaioannou, Thaleia Dimitra Doudali, et al.", "arxiv_id": "", "github_repo": "", "conference": "/来源**:", "full_conference": "/来源**: arXiv", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "The landscape of AI interactions has fundamentally shifted with the advent of Multimodal Large Language Models (MLLMs). Platforms like ChatGPT, Gemini, and Copilot now seamlessly integrate text, images, and videos, enabling richer and more natural user experiences. However, this multimodality introduces significant challenges for serving infrastructure. Unlike text-only workloads, multimodal requests exhibit orders of magnitude difference in resource demands - processing a video query requires vastly more computation than a text query.\n\nCurrent LLM serving systems were designed with text-only workloads in mind. They assume relatively uniform request sizes and processing times. When faced with multimodal workloads, these systems suffer from severe performance degradation. Large requests like videos monopolize GPU resources, causing smaller text requests to wait excessively - a phenomenon known as head-of-line blocking.", "file": "./arxiv/2026/38_rocks_pebbles_sand.md", "has_content": true, "id": 76, "topic": "LLM Serving"}, {"title": "DFlash: Block Diffusion for Flash Speculative Decoding", "authors": "Jian Chen, Yesheng Liang, Zhijian Liu", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/dflash_block_diffusion.md", "has_content": false, "id": 77, "topic": "Speculative Decoding"}, {"title": "CacheSolidarity: Preventing Prefix Caching Side Channels in Multi-tenant LLM Serving Systems", "authors": "Panagiotis Georgios Pennas, Konstantinos Papaioannou, Marco Guarnieri, Thaleia Dimitra Doudali", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "自动前缀缓存(APC)是LLM推理优化的关键技术，但它引入了时序侧信道攻击风险。CacheSolidarity通过监控和有选择性地隔离来防御此类攻击，同时保持高性能。", "file": "./arxiv/2026/30_cachesolidarity.md", "has_content": true, "id": 80, "topic": "LLM Serving"}, {"title": "StarSD: One-for-Many Speculative Decoding", "authors": "", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/starsd_one_for_many_speculative.md", "has_content": false, "id": 81, "topic": "Speculative Decoding"}, {"title": "MemBoost: A Memory-Boosted Framework for Cost-Aware LLM Inference", "authors": "Joris Köster, Zixuan Liu, Siavash Khajavi, Zizhan Zheng", "arxiv_id": "", "github_repo": "", "conference": "/来源**:", "full_conference": "/来源**: arXiv", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "The deployment of Large Language Models (LLMs) in production services has grown exponentially, powering applications from chatbots to code assistants. However, serving LLMs at scale remains computationally expensive, with inference costs dominating the operational expenses of AI services. A key observation in real-world workloads is that many queries are repeated or semantically similar across users and sessions, yet current serving systems treat each request independently, leading to redundant computation.\n\nIn this work, we propose MemBoost, a novel memory-boosted LLM serving framework that addresses this inefficiency through intelligent answer reuse and cost-aware routing. MemBoost maintains a memory of previously generated answers and uses a lightweight model to either directly reuse relevant answers or retrieve supporting information for context-enhanced inference. Only when queries are sufficiently novel or challenging does MemBoost escalate to a more powerful (and expensive) model.", "file": "./arxiv/2026/37_memboost.md", "has_content": true, "id": 85, "topic": "LLM Serving"}, {"title": "NanoFlow: Towards Optimal Large Language Model Serving Throughput", "authors": "Kan Zhu, Yufei Gao, Yilong Zhao, Liangyu Zhao, Gefei Zuo, Yile Gu, Dedong Xie, Tian Tang, Qinyu Xu, Zihao Ye, Keisuke Kamahori, Chien-Yu Lin, Ziren Wang, Stephanie Wang, Arvind Krishnamurthy, Baris Ka", "arxiv_id": "", "github_repo": "", "conference": "OSDI", "full_conference": "OSDI 2025", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./osdi/2025/nanoflow_optimal_serving.md", "has_content": false, "id": 86, "topic": "LLM Serving"}, {"title": "SWIFT: On-the-Fly Self-Speculative Decoding", "authors": "Microsoft Research", "arxiv_id": "", "github_repo": "", "conference": "ICLR", "full_conference": "ICLR 2025", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "The approach is particularly valuable for:\n- Deployment scenarios with limited resources\n- Cases where draft model training is impractical\n- Applications requiring flexible deployment", "file": "./iclr/2025/swift.md", "has_content": true, "id": 87, "topic": "Speculative Decoding"}, {"title": "Pie: A Programmable Serving System for Emerging LLM Applications", "authors": "In Gim 等", "arxiv_id": "", "github_repo": "", "conference": "SOSP", "full_conference": "SOSP 2025", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./sosp/2025/pie_programmable_serving.md", "has_content": false, "id": 88, "topic": "LLM Serving"}, {"title": "Fast State Restoration in LLM Serving with HCache", "authors": "Shiwei Gao 等", "arxiv_id": "", "github_repo": "", "conference": "EuroSys", "full_conference": "EuroSys 2025", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./eurosys/2025/hcache_state_restoration.md", "has_content": false, "id": 89, "topic": "LLM Serving"}, {"title": "M2XFP: A Metadata-Augmented Microscaling Data Format for Efficient Low-bit Quantization", "authors": "Weiming Hu, Zihan Zhang, Haoyan Zhang, Chen Zhang, Cong Guo, Yu Feng, Tianchi Hu, Guanglin Li, Guipeng Hu, Junsong Wang, Jingwen Leng", "arxiv_id": "2601.19213", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "Existing low-bit Microscaling (MX) formats, such as MXFP4, often suffer from substantial accuracy degradation due to the use of a shared scaling factor with the Power-of-Two format. In this work, we explore strategies that introduce minimal metadata to recover accuracy lost during quantization while maintaining high bit efficiency across a wide range of large language models.\n\nWe propose a complete algorithm-hardware co-design based on flexible metadata, featuring an online quantization with simple encoding. To support the proposed method efficiently, we implement a lightweight hardware unit and integrate it into the accelerator.\n\nEvaluation results demonstrate that our method substantially narrows the accuracy gap, achieving on average a 70.63% reduction in accuracy loss compared to MXFP4 and a 37.30% reduction relative to the latest NVFP4 on LLM benchmarks. Furthermore, our design delivers up to 1.91× speedup and 1.75× energy savings over state-of-the-art accelerators. Our code is available at this https URL.", "abstract_cn": "Abstract (摘要)\n\nExisting low-bit Microscaling (MX) formats, such as MXFP4, often suffer from substantial accuracy degradation due to the use of a shared scaling factor with the Power-of-Two format. In this work, we explore strategies that introduce minimal metadata to recover accuracy lost during quantization while maintaining high bit efficiency across a wide range of large language models.\n\nWe propose a complete algorithm-hardware co-design based on flexible metadata, featuring an online quantization with simple encoding. To support the proposed method efficiently, we implement a lightweight hardware unit and integrate it into the accelerator.\n\nEvaluation results demonstrate that our method substantially narrows the accuracy gap, achieving on average a 70.63% reduction in accuracy loss compared to MXFP4 and a 37.30% reduction relative to the latest NVFP4 on LLM benchmarks. Furthermore, our design delivers up to 1.91× speedup and 1.75× energy savings over state-of-the-art accelerators. Our code is available at this https URL.", "intro_en": "", "intro_cn": "---\n\n现有的低位微缩放（MX）格式（如MXFP4）由于使用Power-of-Two格式的共享缩放因子，往往会遭受严重的精度下降。在这项工作中，我们探索引入最少元数据的策略，以在量化过程中恢复丢失的精度，同时在广泛的大型语言模型中保持高比特效率。\n\n我们提出了一种基于灵活元数据的完整算法-硬件协同设计，具有简单编码的在线量化。为了有效支持所提出的方法，我们实现了一个轻量级硬件单元并将其集成到加速器中。\n\n评估结果表明，我们的方法显著缩小了精度差距，与MXFP4相比，在LLM基准上平均减少70.63%的精度损失，与最新的NVFP4相比减少37.30%。此外，我们的设计在最先进的加速器上提供高达1.91倍的加速和1.75倍的节能。我们的代码可在https://github.com/SJTU-ReArch-Group/M2XFP_ASPLOS26获取。\n\n---\n\n## 主要贡献\n\n1. **灵活元数据设计**：最小化元数据开销\n2. **在线量化**：简单编码\n3. **轻量级硬件单元**：集成到加速器\n4. **算法-硬件协同设计**\n\n---\n\n## 实验结果\n\n| 指标 | 改进 |\n|------|------|\n| 相比MXFP4精度损失减少 | 70.63% |\n| 相比NVFP4精度损失减少 | 37.30% |\n| 加速比 | 1.91× |\n| 能耗节省 | 1.75× |\n\n**代码**: https://github.com/SJTU-ReArch-Group/M2XFP_ASPLOS26", "file": "./asplops26/08_M2XFP.md", "has_content": true, "id": 90, "topic": "Compression"}, {"title": "SNIP: An Adaptive Mixed Precision Framework for Subbyte Large Language Model Training", "authors": "Yunjie Pan, Yao Fu, Ziheng Qiao, Chengmai Mao, Yining Qi, Tianchen Du, Hongxiang Li, Lanbo Li, Chen Liang, Yong Li, Dilin Wang, Wei Liu", "arxiv_id": "2602.01410", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "Training large language models (LLMs) efficiently while preserving model quality poses significant challenges, particularly with subbyte precision supported by state-of-the-art GPUs. Current mixed-precision training approaches either apply uniform precision to all GEMM operations or rely on heuristic-based methods that fail to generalize during training, leading to suboptimal convergence and instability. To address these challenges, this paper introduces SNIP, a fine-grained adaptive mixed-precision training framework for LLM pretraining that supports subbyte precision.\n\nSNIP periodically collects statistics on activations, gradients, and optimizer states to assess the precision loss impact on model quality. We define two key metrics:\n\n- **Loss divergence in the forward pass**: Caused by quantization-induced increases in training loss\n- **Weight divergence in the backward pass**: Measures error propagation through gradients affecting model updates\n\nThese metrics guide an Integer Linear Programming (ILP) problem that systematically optimizes layerwise precision to minimize overall quality loss while meeting efficiency targets.\n\nExperiments on 1B, 3B, 7B and 70B Llama-like models demonstrate that SNIP consistently outperforms existing baselines, reducing FLOPs by up to 80% while preserving model quality across different model sizes and training phases with minimal computational overhead.", "abstract_cn": "Abstract (摘要)\n\nTraining large language models (LLMs) efficiently while preserving model quality poses significant challenges, particularly with subbyte precision supported by state-of-the-art GPUs. Current mixed-precision training approaches either apply uniform precision to all GEMM operations or rely on heuristic-based methods that fail to generalize during training, leading to suboptimal convergence and instability. To address these challenges, this paper introduces SNIP, a fine-grained adaptive mixed-precision training framework for LLM pretraining that supports subbyte precision.\n\nSNIP periodically collects statistics on activations, gradients, and optimizer states to assess the precision loss impact on model quality. We define two key metrics:\n\n- **Loss divergence in the forward pass**: Caused by quantization-induced increases in training loss\n- **Weight divergence in the backward pass**: Measures error propagation through gradients affecting model updates\n\nThese metrics guide an Integer Linear Programming (ILP) problem that systematically optimizes layerwise precision to minimize overall quality loss while meeting efficiency targets.\n\nExperiments on 1B, 3B, 7B and 70B Llama-like models demonstrate that SNIP consistently outperforms existing baselines, reducing FLOPs by up to 80% while preserving model quality across different model sizes and training phases with minimal computational overhead.", "intro_en": "", "intro_cn": "---\n\n在保持模型质量的同时高效训练大型语言模型（LLM）提出了重大挑战，特别是支持最新GPU的子字节精度。当前的混合精度训练方法要么对所有GEMM操作应用统一精度，要么依赖基于启发式的方法，这些方法在训练期间无法泛化，导致次优收敛和不稳定性。为了应对这些挑战，本文介绍了SNIP，这是一个用于LLM预训练的细粒度自适应混合精度训练框架，支持子字节精度。\n\nSNIP定期收集激活、梯度和优化器状态的统计数据，以评估精度损失对模型质量的影响。我们定义了两个关键指标：\n\n- **前向传播中的损失发散**：由量化导致的训练损失增加引起\n- **后向传播中的权重发散**：通过影响模型更新的梯度测量误差传播\n\n这些指标指导整数线性规划（ILP）问题，系统地优化逐层精度，以在满足效率目标的同时最小化整体质量损失。\n\n在1B、3B、7B和70B Llama类模型上的实验表明，SNIP始终优于现有基线，在不同模型大小和训练阶段以最小计算开销保持模型质量的同时，最多减少80%的FLOP。\n\n---\n\n## 主要贡献\n\n1. **细粒度自适应混合精度**：逐层优化精度\n2. **双关键指标**：\n   - 前向传播损失发散\n   - 后向传播权重发散\n3. **ILP优化**：系统地优化精度分配\n\n---\n\n## 实验结果\n\n- 在1B, 3B, 7B, 70B模型上验证\n- **最多减少80% FLOPs**\n- 保持模型质量", "file": "./asplops26/07_SNIP.md", "has_content": true, "id": 91, "topic": "LLM Serving"}, {"title": "RedFuser: An Automatic Operator Fusion Framework for Cascaded Reductions on AI Accelerators", "authors": "Xinsheng Tang, Yuhui Zhao, Jintao Li, Jiaming Xu, Shuo Li, Jiansong Chen, Chen Zhang, Yong Li, Xiaoyong Liu, Ji Liu, Jin Wang, Wei Lin", "arxiv_id": "2603.10026", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "Operator fusion, as a key performance optimization technique in the deployment of AI models, significantly improves execution efficiency and has been widely adopted in modern AI compilers. However, for cascaded reduction operations involving multiple loops with inter-loop data dependencies, such as the safe softmax followed by GEMM within attention mechanisms, existing compilers lack effective automated fusion and kernel generation capabilities. Although some works have addressed specific instances through hand-crafted fusion strategies, their solutions are limited in generality and difficult to extend to other similar structures. Given the prevalence of such computational patterns in deep learning models, there remains significant untapped potential in achieving general and automated fusion optimization.\n\nIn this paper, we present a formal theoretical methodology for analyzing cascaded reductions which can fuse them into a single loop and introduce an incremental computation form. Based on this methodology, we design Reduction Fuser (RedFuser), a framework that automatically identifies supported cascaded reduction patterns and generates optimized fused kernels. Experiments show that RedFuser successfully fuses diverse workloads, achieving up to 2× to 5× speedup over state-of-the-art AI compilers and matching the performance of highly optimized hand-written kernels. The code is available at this https URL.", "abstract_cn": "Abstract (摘要)\n\nOperator fusion, as a key performance optimization technique in the deployment of AI models, significantly improves execution efficiency and has been widely adopted in modern AI compilers. However, for cascaded reduction operations involving multiple loops with inter-loop data dependencies, such as the safe softmax followed by GEMM within attention mechanisms, existing compilers lack effective automated fusion and kernel generation capabilities. Although some works have addressed specific instances through hand-crafted fusion strategies, their solutions are limited in generality and difficult to extend to other similar structures. Given the prevalence of such computational patterns in deep learning models, there remains significant untapped potential in achieving general and automated fusion optimization.\n\nIn this paper, we present a formal theoretical methodology for analyzing cascaded reductions which can fuse them into a single loop and introduce an incremental computation form. Based on this methodology, we design Reduction Fuser (RedFuser), a framework that automatically identifies supported cascaded reduction patterns and generates optimized fused kernels. Experiments show that RedFuser successfully fuses diverse workloads, achieving up to 2× to 5× speedup over state-of-the-art AI compilers and matching the performance of highly optimized hand-written kernels. The code is available at this https URL.", "intro_en": "", "intro_cn": "---\n\n算子融合作为AI模型部署中的关键性能优化技术，显著提高了执行效率，并已被现代AI编译器广泛采用。然而，对于涉及循环间数据依赖的级联归约操作，例如注意力机制中的安全softmax后接GEMM，现有编译器缺乏有效的自动融合和内核生成能力。虽然一些工作通过手工融合策略解决了特定实例，但其解决方案通用性有限，难以扩展到其他类似结构。鉴于此类计算模式在深度学习模型中的普遍性，在实现通用和自动融合优化方面仍有显著的未开发潜力。\n\n在本文中，我们提出了一种形式化的理论方法来分析级联归约，可以将其融合到单个循环中并引入增量计算形式。基于这种方法，我们设计了Reduction Fuser（RedFuser），这是一个自动识别支持的级联归约模式并生成优化融合内核的框架。实验表明，RedFuser成功融合了多样化的工作负载，在最先进的AI编译器上实现了高达2倍到5倍的加速，并与高度优化的手工内核性能相匹配。代码可在https://github.com/alibaba/redfuser获取。\n\n---\n\n## 主要贡献\n\n1. **形式化理论方法**：分析级联归约，可融合为单个循环\n2. **增量计算形式**：优化计算过程\n3. **RedFuser框架**：自动识别和融合级联归约模式\n\n---\n\n## 实验结果\n\n- 在最先进的AI编译器上实现 **2-5倍** 加速\n- 性能与高度优化的手工内核相当\n\n**代码**: https://github.com/alibaba/redfuser", "file": "./asplops26/06_RedFuser.md", "has_content": true, "id": 92, "topic": "LLM Serving"}, {"title": "LAER-MoE: Load-Adaptive Expert Re-layout for Efficient Mixture-of-Experts Training", "authors": "Xinyi Liu, Zijian Zhang, YongLi Zhu, Jiale Zhang, Peng Sun, XuanWang, Qi Qi, Jingren Zhou, Tong Yang, Bin Cui", "arxiv_id": "2602.11686", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "Expert parallelism is vital for effectively training Mixture-of-Experts (MoE) models, enabling different devices to host distinct experts, with each device processing different input data. However, during expert parallel training, dynamic routing results in significant load imbalance among experts: a handful of overloaded experts hinder overall iteration, emerging as a training bottleneck.\n\nIn this paper, we introduce LAER-MoE, an efficient MoE training framework. The core of LAER-MoE is a novel parallel paradigm, Fully Sharded Expert Parallel (FSEP), which fully partitions each expert parameter by the number of devices and restores partial experts at expert granularity through All-to-All communication during training. This allows for flexible re-layout of expert parameters during training to enhance load balancing. In particular, we perform fine-grained scheduling of communication operations to minimize communication overhead. Additionally, we develop a load balancing planner to formulate re-layout strategies of experts and routing schemes for tokens during training. We perform experiments on an A100 cluster, and the results indicate that our system achieves up to 1.69x acceleration compared to the current state-of-the-art training systems. Source code available at this https URL.", "abstract_cn": "Abstract (摘要)\n\nExpert parallelism is vital for effectively training Mixture-of-Experts (MoE) models, enabling different devices to host distinct experts, with each device processing different input data. However, during expert parallel training, dynamic routing results in significant load imbalance among experts: a handful of overloaded experts hinder overall iteration, emerging as a training bottleneck.\n\nIn this paper, we introduce LAER-MoE, an efficient MoE training framework. The core of LAER-MoE is a novel parallel paradigm, Fully Sharded Expert Parallel (FSEP), which fully partitions each expert parameter by the number of devices and restores partial experts at expert granularity through All-to-All communication during training. This allows for flexible re-layout of expert parameters during training to enhance load balancing. In particular, we perform fine-grained scheduling of communication operations to minimize communication overhead. Additionally, we develop a load balancing planner to formulate re-layout strategies of experts and routing schemes for tokens during training. We perform experiments on an A100 cluster, and the results indicate that our system achieves up to 1.69x acceleration compared to the current state-of-the-art training systems. Source code available at this https URL.", "intro_en": "", "intro_cn": "---\n\n专家并行对于有效训练混合专家（MoE）模型至关重要，使不同设备托管不同的专家，每个设备处理不同的输入数据。然而，在专家并行训练期间，动态路由导致专家之间严重的负载不平衡：少数过载的专家阻碍整体迭代，成为训练瓶颈。\n\n在本文中，我们介绍了LAER-MoE，一个高效的MoE训练框架。LAER-MoE的核心是一种新颖的并行范式——完全分片专家并行（FSEP），它通过设备数量完全分割每个专家参数，并在训练期间通过All-to-All通信在专家粒度上恢复部分专家。这允许在训练期间灵活重新布局专家参数以增强负载平衡。特别是，我们执行细粒度的通信操作调度以最小化通信开销。此外，我们开发了一个负载平衡规划器，用于制定训练期间专家的重新布局策略和token路由方案。我们在A100集群上进行了实验，结果表明我们的系统比当前最先进的训练系统实现了高达1.69倍的加速。源代码可在https://github.com/PKU-DAIR/Hetu-Galvatron/tree/laer-moe获取。\n\n---\n\n## 主要贡献\n\n1. **Fully Sharded Expert Parallel (FSEP)**：一种新的并行范式，完全分割每个专家参数\n2. **动态专家重新布局**：在训练期间灵活调整专家布局以实现负载均衡\n3. **细粒度通信调度**：最小化通信开销\n4. **负载平衡规划器**：制定专家重新布局策略和token路由方案\n\n---\n\n## 实验结果\n\n- 在A100集群上实现最高 **1.69倍** 加速 compared to state-of-the-art\n\n**代码**: https://github.com/PKU-DAIR/Hetu-Galvatron/tree/laer-moe", "file": "./asplops26/04_LAER-MoE.md", "has_content": true, "id": 93, "topic": "MoE"}, {"title": "SpeContext: Enabling Efficient Long-context Reasoning with Speculative Context Sparsity in LLMs", "authors": "Jiaming Xu, Hong Cao, Yuhan Lin, Jinyang Li, Zheng Liu, Jie Liu, Xingyu Li, Jin Wang, Jingyuan Jia, Ge Li", "arxiv_id": "2512.00722", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "In this paper, we point out that the objective of the retrieval algorithms is to align with the LLM, which is similar to the objective of knowledge distillation in LLMs. We analyze the similarity in information focus between the distilled language model (DLM) and the original LLM from the perspective of information theory, and thus propose a novel paradigm that leverages a DLM as the retrieval algorithm. Based on the insight, we present SpeContext, an algorithm and system co-design for long-context reasoning.\n\n1. **At the algorithm level**: SpeContext proposes lightweight retrieval head based on the head-level attention weights of DLM, achieving >90% parameters reduction by pruning the redundancy.\n\n2. **At the system level**: SpeContext designs an asynchronous prefetch dataflow via the elastic loading strategy, effectively overlapping KV cache retrieval with the LLM computation.\n\n3. **At the compilation level**: SpeContext constructs the theoretical memory model and implements an adaptive memory management system to achieve acceleration by maximizing GPU memory utilization.\n\nWe deploy and evaluate SpeContext in two resource-constrained environments, cloud and edge. Extensive experiments show that, compared with the Huggingface framework, SpeContext achieves up to 24.89x throughput improvement in cloud and 10.06x speedup in edge with negligible accuracy loss, pushing the Pareto frontier of accuracy and throughput.", "abstract_cn": "Abstract (摘要)\n\nIn this paper, we point out that the objective of the retrieval algorithms is to align with the LLM, which is similar to the objective of knowledge distillation in LLMs. We analyze the similarity in information focus between the distilled language model (DLM) and the original LLM from the perspective of information theory, and thus propose a novel paradigm that leverages a DLM as the retrieval algorithm. Based on the insight, we present SpeContext, an algorithm and system co-design for long-context reasoning.\n\n1. **At the algorithm level**: SpeContext proposes lightweight retrieval head based on the head-level attention weights of DLM, achieving >90% parameters reduction by pruning the redundancy.\n\n2. **At the system level**: SpeContext designs an asynchronous prefetch dataflow via the elastic loading strategy, effectively overlapping KV cache retrieval with the LLM computation.\n\n3. **At the compilation level**: SpeContext constructs the theoretical memory model and implements an adaptive memory management system to achieve acceleration by maximizing GPU memory utilization.\n\nWe deploy and evaluate SpeContext in two resource-constrained environments, cloud and edge. Extensive experiments show that, compared with the Huggingface framework, SpeContext achieves up to 24.89x throughput improvement in cloud and 10.06x speedup in edge with negligible accuracy loss, pushing the Pareto frontier of accuracy and throughput.", "intro_en": "", "intro_cn": "---\n\n在本文中，我们指出检索算法的目标是与LLM对齐，这类似于LLM中知识蒸馏的目标。我们从信息论的角度分析了蒸馏语言模型（DLM）和原始LLM之间信息聚焦的相似性，从而提出了一种利用DLM作为检索算法的新范式。基于这一洞察，我们提出了SpeContext，一个用于长上下文推理的算法和系统协同设计。\n\n1. **算法层面**：SpeContext提出了基于DLM头级注意力权重的轻量级检索头，通过剪枝冗余实现了超过90%的参数减少。\n\n2. **系统层面**：SpeContext通过弹性加载策略设计了异步预取数据流，有效地将KV缓存检索与LLM计算重叠。\n\n3. **编译层面**：SpeContext构建了理论内存模型并实现了自适应内存管理系统，以通过最大化GPU内存利用率来实现加速。\n\n我们在云和边缘两种资源受限环境中部署和评估SpeContext。大量实验表明，与Huggingface框架相比，SpeContext在云端实现了高达24.89倍的吞吐量提升，在边缘实现了10.06倍的加速，而精度损失可忽略不计，推动了精度和吞吐量的帕累托前沿。\n\n---\n\n## 主要贡献\n\n1. **轻量级检索头**：基于蒸馏语言模型（DLM）头级注意力权重，实现>90%参数减少\n2. **异步预取数据流**：通过弹性加载策略重叠KV缓存检索与LLM计算\n3. **自适应内存管理**：最大化GPU内存利用率\n\n---\n\n## 实验结果\n\n| 环境 | 吞吐量提升 |\n|------|------------|\n| 云端 | 24.89× |\n| 边缘 | 10.06× |\n\n- 精度损失可忽略不计", "file": "./asplops26/05_SpeContext.md", "has_content": true, "id": 94, "topic": "Speculative Decoding"}, {"title": "Ouroboros: Wafer-Scale SRAM CIM with Token-Grained Pipelining for Large Language Model Inference", "authors": "Yiqi Liu, Cheng Liu, Zhen Gu, Tianchen Ding, Zongyue Zhao, Ziyu Yang, Yufei Ding, Yibo Lin, Mingjie Lin, Xiaowei Li, Zidong Du, Chen Liu, Yunji Chen", "arxiv_id": "2603.02737", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "Conventional LLM inference architectures suffer from high energy and latency due to frequent data movement across memory hierarchies. We propose Ouroboros, a wafer-scale SRAM-based Computing-in-Memory (CIM) architecture that executes all operations in situ, eliminating off-chip migration. To maximize its limited first-level capacity, we introduce three innovations:\n\n1. **Token-Grained Pipelining**: Replaces sequence-level pipelining to mitigate length variations, boosting utilization and reducing activation storage.\n\n2. **Distributed Dynamic KV Cache Management**: Decouples memory from compute to leverage fragmented SRAM for efficient KV storage.\n\n3. **Communication-Aware Mapping**: Optimizes core allocation for locality and fault tolerance across the wafer.\n\nExperimental results show Ouroboros achieves average gains of 4.1× in throughput and 4.2× in energy efficiency, peaking at 9.1× and 17× for the 13B model.", "abstract_cn": "Abstract (摘要)\n\nConventional LLM inference architectures suffer from high energy and latency due to frequent data movement across memory hierarchies. We propose Ouroboros, a wafer-scale SRAM-based Computing-in-Memory (CIM) architecture that executes all operations in situ, eliminating off-chip migration. To maximize its limited first-level capacity, we introduce three innovations:\n\n1. **Token-Grained Pipelining**: Replaces sequence-level pipelining to mitigate length variations, boosting utilization and reducing activation storage.\n\n2. **Distributed Dynamic KV Cache Management**: Decouples memory from compute to leverage fragmented SRAM for efficient KV storage.\n\n3. **Communication-Aware Mapping**: Optimizes core allocation for locality and fault tolerance across the wafer.\n\nExperimental results show Ouroboros achieves average gains of 4.1× in throughput and 4.2× in energy efficiency, peaking at 9.1× and 17× for the 13B model.", "intro_en": "*(注：本文获取introduction失败，仅获取到摘要内容。如需完整introduction，建议下载PDF：https://arxiv.org/pdf/2603.02737)*\n\nThe development of Large Language Models (LLMs) has revolutionized artificial intelligence, but their deployment faces significant challenges due to the massive computational and memory requirements. Conventional LLM inference architectures suffer from high energy consumption and latency because of frequent data movement across memory hierarchies.\n\nTo address these challenges, we propose Ouroboros, a wafer-scale SRAM-based Computing-in-Memory (CIM) architecture designed specifically for efficient LLM inference. The key innovation of Ouroboros is that it executes all operations in situ, completely eliminating the need for off-chip data migration.", "intro_cn": "---\n\n传统的LLM推理架构由于跨内存层次结构的频繁数据移动而遭受高能耗和高延迟。我们提出了Ouroboros，这是一种基于晶圆级SRAM的存算一体（CIM）架构，在本地执行所有操作，消除了芯片外迁移。为了最大化其有限的一级容量，我们引入了三个创新：\n\n1. **Token级流水线**：用序列级流水线替换以缓解长度变化，提高利用率并减少激活存储。\n\n2. **分布式动态KV缓存管理**：将内存与计算解耦，以利用碎片化SRAM进行高效的KV存储。\n\n3. **通信感知映射**：优化晶圆上核心分配的局部性和容错性。\n\n实验结果表明，Ouroboros在吞吐量上平均实现4.1倍的提升，在能效上实现4.2倍的提升，在13B模型上分别达到9.1倍和17倍的峰值。\n\n---\n\n## 1. Introduction (引言)\n\n*(注：本文获取introduction失败，仅获取到摘要内容。如需完整introduction，建议下载PDF：https://arxiv.org/pdf/2603.02737)*\n\nThe development of Large Language Models (LLMs) has revolutionized artificial intelligence, but their deployment faces significant challenges due to the massive computational and memory requirements. Conventional LLM inference architectures suffer from high energy consumption and latency because of frequent data movement across memory hierarchies.\n\nTo address these challenges, we propose Ouroboros, a wafer-scale SRAM-based Computing-in-Memory (CIM) architecture designed specifically for efficient LLM inference. The key innovation of Ouroboros is that it executes all operations in situ, completely eliminating the need for off-chip data migration.\n\n---\n\n大型语言模型（LLM）的发展已经革新了人工智能，但其部署由于大量的计算和内存需求而面临重大挑战。传统的LLM推理架构由于跨内存层次的频繁数据移动而遭受高能耗和高延迟。\n\n为了应对这些挑战，我们提出了Ouroboros，这是一种专门为高效LLM推理设计的晶圆级SRAM存算一体（CIM）架构。Ouroboros的关键创新在于它在本地执行所有操作，完全消除了芯片外数据迁移的需要。\n\n---\n\n## 主要创新\n\n1. **Token-Grained Pipelining（Token级流水线）**\n   - 替换传统的序列级流水线\n   - 缓解长度变化问题\n   - 提高硬件利用率\n   - 减少激活存储需求\n\n2. **Distributed Dynamic KV Cache Management（分布式动态KV缓存管理）**\n   - 将内存与计算解耦\n   - 利用碎片化SRAM空间\n   - 实现高效的KV缓存存储\n\n3. **Communication-Aware Mapping（通信感知映射）**\n   - 优化核心分配策略\n   - 提高局部性\n   - 增强容错能力\n\n---\n\n## 实验结果\n\n| 指标 | 平均提升 | 13B模型峰值 |\n|------|----------|-------------|\n| 吞吐量 | 4.1× | 9.1× |\n| 能效 | 4.2× | 17× |", "file": "./asplops26/03_Ouroboros.md", "has_content": true, "id": 98, "topic": "Hardware"}, {"title": "Serving Compound Inference Systems on Datacenter GPUs", "authors": "Sriram Devata, Rahul Sukthankar, Saurabh Adya", "arxiv_id": "2603.08797", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS '26 (Extended version from HCDS workshop)", "year": 2024, "abstract_en": "Applications in emerging domains such as XR are being built as compound inference systems, where multiple ML models are composed in the form of a task graph to service each request. Serving these compound systems efficiently raises two questions: how to apportion end-to-end latency and accuracy budgets between different tasks in a compound inference system, and how to allocate resources effectively for different models with varying resource requirements. We present JigsawServe, the first serving framework that jointly optimizes for latency, accuracy, and cost in terms of GPU resources by adaptively choosing model variants and performing fine-grained resource allocation by spatially partitioning the GPUs for each task of a compound inference system. Analytical evaluation of a system with a large number of GPUs shows that JigsawServe can increase the maximum serviceable demand (in requests per second) by 11.3x when compared to the closest prior work. Our empirical evaluation shows that for a large range of scenarios, JigsawServe consumes only 43.3% of the available GPU resources while meeting accuracy SLOs with less than 0.6% latency SLO violations. All of the features in JigsawServe contribute to this high efficiency -- sacrificing any one feature of accuracy scaling, GPU spatial partitioning, or task-graph-informed resource budgeting significantly reduces efficiency.", "abstract_cn": "Abstract (摘要)\n\nApplications in emerging domains such as XR are being built as compound inference systems, where multiple ML models are composed in the form of a task graph to service each request. Serving these compound systems efficiently raises two questions: how to apportion end-to-end latency and accuracy budgets between different tasks in a compound inference system, and how to allocate resources effectively for different models with varying resource requirements. We present JigsawServe, the first serving framework that jointly optimizes for latency, accuracy, and cost in terms of GPU resources by adaptively choosing model variants and performing fine-grained resource allocation by spatially partitioning the GPUs for each task of a compound inference system. Analytical evaluation of a system with a large number of GPUs shows that JigsawServe can increase the maximum serviceable demand (in requests per second) by 11.3x when compared to the closest prior work. Our empirical evaluation shows that for a large range of scenarios, JigsawServe consumes only 43.3% of the available GPU resources while meeting accuracy SLOs with less than 0.6% latency SLO violations. All of the features in JigsawServe contribute to this high efficiency -- sacrificing any one feature of accuracy scaling, GPU spatial partitioning, or task-graph-informed resource budgeting significantly reduces efficiency.", "intro_en": "As machine learning (ML) inference becomes a dominant workload for datacenter resources, there is growing emphasis on maximizing the efficiency of inference serving systems. Compound inference systems are becoming increasingly important in many emerging domains such as multi-agent systems and extended reality (XR). Such systems compose multiple ML models, each performing a specific task, to provide complex functionalities, and present new challenges and opportunities for increased efficiency. This work focuses on efficient serving of compound inference systems on datacenter GPUs, where each request requires invoking a directed acyclic graph (DAG) of ML inference tasks, which are potentially dynamically determined.\n\nWe focus on two aspects that are unique to compound inference systems. First, we expect that any latency and accuracy Service Level Objectives (SLOs) are provided for the end-to-end compound inference system and need to be apportioned among the individual tasks. This affords new sources of flexibility for the serving system to choose among multiple model variants (with different latencies and accuracies) and GPU resource allocation for each task, when compared to a single task system with a given SLO constraint. Second, the ML model variants across the various tasks in a compound inference system have different resource requirements, motivating finer-grained heterogeneity in the optimal resource choice for the different tasks. Recent GPU hardware provide spatial partitioning mechanisms that enable fine-grained allocation of GPU resources. For example, NVIDIA GPUs provide spatial partitioning mechanisms such as Multi-Process Service (MPS) and Multi-Instance GPU (MIG).\n\nWe present JigsawServe, the first work to jointly optimize for latency, accuracy, and fine-grained cost (in terms of GPU resources required) by adaptively choosing model variants and allocating fine-grained spatial partitions of GPUs for each task of a compound inference system, while preserving end-to-end accuracy and latency SLOs.\n\nThere is a plethora of literature on increasing the efficiency of serving systems for requests with a single model inference, including systems that perform accuracy scaling and spatial partitioning. Compound inference systems have received relatively less attention. Table 1 summarizes key prior works that consider resource budgeting for compound inference systems, accuracy scaling through different model variants of a task, and/or spatial partitioning of GPU resources.\n\nSpecifically, we make the following contributions:\n\n- 1. We introduce JigsawServe, a novel framework to jointly optimize latency, accuracy, and fine-grained cost for compound inference systems on datacenter GPUs. JigsawServe uniquely combines: (1) per-task accuracy scaling via choosing model variants, (2) GPU spatial partitioning, and (3) task-graph-informed latency and accuracy SLO budgeting.\n\n- 2. Our analytical evaluation compares the various combinations of the features. We find that spatial partitioning (S) delivers the highest standalone gain in serving capacity for the same GPU resources (5.25× over Unopt), compared to accuracy scaling (A: 1.6×) and task-graph-informed budgeting (T: 1.1×). JigsawServe's full integration of the three features (A+S+T) achieves 21.6× capacity, surpassing combinations of S with A or T in S+A (12.1×) and S+T (7.8×).\n\n- 3. We emphasize that no prior work has evaluated GPU spatial partitioning for compound inference systems. Systems without S show significantly lower serving capacity than any system with S. A+T, in particular, is closest to (and explores a larger search space than) prior work of Loki. We find that JigsawServe allows 11.3× higher capacity than A+T.\n\n- 4. Our empirical evaluation compares the four top performing systems under a wide range of compound inference systems and workload demand conditions. JigsawServe shows the best overall performance, using just 43.3% of the available GPU resources on average, respecting the accuracy SLO, and showing less than 0.6% average SLO violations. Alternatives suffer significantly: S+T/A+T exceed 10% violations and have 2× resource usage in at least one case; S+A requires 33% more resources than JigsawServe with 6.7% SLO violations.", "intro_cn": "---\n\n在XR等新兴领域的应用正被构建为复合推理系统，其中多个ML模型以任务图的形式组合来服务每个请求。高效地服务这些复合系统提出了两个问题：如何在复合推理系统的不同任务之间分配端到端延迟和精度预算，以及如何有效地为具有不同资源需求的模型分配资源。我们提出了JigsawServe，这是第一个通过为复合推理系统的每个任务自适应选择模型变体并执行细粒度资源分配（通过空间分割GPU）来共同优化延迟、精度和GPU资源成本的推理服务框架。对拥有大量GPU的系统进行分析评估表明，与最接近的先前工作相比，JigsawServe可以将最大可服务需求（每秒请求数）提高11.3倍。我们的实证评估表明，在大范围的场景中，JigsawServe仅消耗43.3%的可用GPU资源，同时满足精度SLO，延迟SLO违规率低于0.6%。JigsawServe的所有特性都有助于实现这一高效率——牺牲精度扩展、GPU空间分割或任务图知情的资源预算中的任何一个特性都会显著降低效率。\n\n---\n\n## 1. Introduction (引言)\n\nAs machine learning (ML) inference becomes a dominant workload for datacenter resources, there is growing emphasis on maximizing the efficiency of inference serving systems. Compound inference systems are becoming increasingly important in many emerging domains such as multi-agent systems and extended reality (XR). Such systems compose multiple ML models, each performing a specific task, to provide complex functionalities, and present new challenges and opportunities for increased efficiency. This work focuses on efficient serving of compound inference systems on datacenter GPUs, where each request requires invoking a directed acyclic graph (DAG) of ML inference tasks, which are potentially dynamically determined.\n\nWe focus on two aspects that are unique to compound inference systems. First, we expect that any latency and accuracy Service Level Objectives (SLOs) are provided for the end-to-end compound inference system and need to be apportioned among the individual tasks. This affords new sources of flexibility for the serving system to choose among multiple model variants (with different latencies and accuracies) and GPU resource allocation for each task, when compared to a single task system with a given SLO constraint. Second, the ML model variants across the various tasks in a compound inference system have different resource requirements, motivating finer-grained heterogeneity in the optimal resource choice for the different tasks. Recent GPU hardware provide spatial partitioning mechanisms that enable fine-g", "file": "./asplops26/02_JigsawServe.md", "has_content": true, "id": 101, "topic": "LLM Serving"}, {"title": "FlashInfer: Kernel Library for LLM Serving", "authors": "", "arxiv_id": "2501.01005", "github_repo": "flashinfer-ai/flashinfer", "conference": "arXiv", "full_conference": "", "year": 2024, "abstract_en": "", "abstract_cn": "|\n| Turing | SM 7.5 | T4, RTX 20系列 |\n| Ampere | SM 8.0, 8.6 | A100, A10, RTX 30系列 |\n| Ada Lovelace | SM 8.9 | L4, L40, RTX 40系列 |\n| Hopper | SM 9.0 | H100, H200 |\n| Blackwell | SM 10.0, 10.3 | B200, B300 |\n| Blackwell | SM 12.0, 12.1 | RTX 50系列, DGX Spark, Jetson Thor |\n\n## 安装\n\n```bash\npip install flashinfer-python\n```\n\n或安装完整包：\n```bash\npip install flashinfer-python flashinfer-cubin\n# JIT cache (替换cu129为你的CUDA版本)\npip install flashinfer-jit-cache --index-url https://flashinfer.ai/whl/cu129\n```\n\n## 应用领域\nFlashInfer为以下项目提供推理支持：\n- SGLang\n- vLLM\n- TensorRT-LLM\n- TGI (Text Generation Inference)\n- MLC-LLM\n- LightLLM\n- lorax\n- ScaleLLM\n\n## 引用\n如果你在研究中使用FlashInfer，请引用我们的论文：\n\n```\n@article{ye2025flashinfer,\n title = {FlashInfer: Efficient and Customizable Attention Engine for LLM Inference Serving},\n author = {\n   Ye, Zihao and\n   Chen, Lequn and\n   Lai, Ruihang and\n   Lin, Wuwei and\n   Zhang, Yineng and\n   Wang, Stephanie and\n   Chen, Tianqi and\n   Kasikci, Baris and\n   Grover, Vinod and\n   Krishnamurthy, Arvind and\n   Ceze, Luis\n },\n journal = {arXiv preprint arXiv:2501.01005},\n year = {2025},\n url = {https://arxiv.org/abs/2501.01005}\n}\n```", "intro_en": "", "intro_cn": "---\n\n*本文档由自动化任务生成于 2026-03-24*", "file": "./github/flashinfer.md", "has_content": true, "id": 102, "topic": "LLM Serving"}, {"title" de_with_kv_cache(q, k, v)\n```\n\n## 文档\n\n- [完整文档](https://docs.flashinfer.ai/)\n- [博客](https://flashinfer.ai)\n- [Slack社区](https://join.slack.com/t/flashinfer/shared_invite/zt-379wct3hc-D5jR~1ZKQcU00WHsXhgvtA)\n\n## 更新日志\n\n- [2025-10-08] Blackwell支持 (v0.4.0)\n- [2025-03-10] [博客文章] LLM采样的无排序GPU内核", "intro_en": "", "intro_cn": "", "file": "./github/2024/flashinfer.md", "has_content": true, "id": 119, "topic": "LLM Serving"}, {"title": "vLLM", "authors": "", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./github/2024/vllm.md", "has_content": false, "id": 120, "topic": "LLM Serving"}, {"title": "ServerlessLLM", "authors": "", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./github/2024/serverlessllm.md", "has_content": false, "id": 121, "topic": "LLM Serving"}, {"title": "RouteLLM", "authors": "", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./github/2024/routellm.md", "has_content": false, "id": 122, "topic": "LLM Serving"}, {"title": "LLM Engineer Handbook", "authors": "", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./github/2024/llm_engineer_handbook.md", "has_content": false, "id": 123, "topic": "LLM Serving"}, {"title": "LLM Applications (Ray)", "authors": "", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./github/2024/llm_applications.md", "has_content": false, "id": 124, "topic": "LLM Serving"}, {"title": "LMDeploy", "authors": "" : "", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./github/2026/mlc_llm_rest_api.md", "has_content": false, "id": 137, "topic": "LLM Serving"}, {"title": "Awesome LLM Inference Papers", "authors": "", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./github/2026/awesome_llm_inference.md", "has_content": false, "id": 138, "topic": "LLM Serving"}];
    const topics = ["MoE", "Hardware", "Scheduling", "Attention", "Edge-Cloud", "Compression", "LLM Serving", "Speculative Decoding", "KV Cache"];
    
    // 按会议-年份分组
    const confYearPapers = {};
    papers.forEach(p => {
        const conf = p.conference || 'arXiv';
        const year = p.year || 2024;
        const key = conf + '|' + year;
        if (!confYearPapers[key]) confYearPapers[key] = [];
        confYearPapers[key].push(p);
    });
    
    const confYears = Object.keys(confYearPapers).sort();
    
    let currentFilter = "";
    let currentSearch = "";
    let filterMode = "topic"; // "topic" 或 "confYear"
    let expandedConf = null; // 当前展开的会议
    
    // 按会议组织年份
    const confYearMap = {};
    confYears.forEach(cy => {
        const [conf, year] = cy.split('|');
        if (!confYearMap[conf]) confYearMap[conf] = [];
        confYearMap[conf].push(year);
    });
    const conferences = Object.keys(confYearMap).sort();
    
    function initNav() {
        const navBar = document.getElementById('navBar');
        const filterGroup = document.getElementById('filterGroup');
        
        // 模式切换按钮放在 navBar
        const modeChip = document.createElement('div');
        modeChip.className = 'nav-chip mode-toggle';
        modeChip.dataset.mode = 'topic';
        modeChip.textContent = '🏷️ 主题';
        modeChip.onclick = () => setFilterMode('topic');
        navBar.appendChild(modeChip);
        
        const confChip = document.createElement('div');
        confChip.className = 'nav-chip mode-toggle';
        confChip.dataset.mode = 'confYear';
        confChip.textContent = '📅 会议';
        confChip.onclick = () => setFilterMode('confYear');
        navBar.appendChild(confChip);
        
        // "全部"按钮
        const allChip = document.createElement('div');
        allChip.className = 'nav-chip';
        allChip.dataset.filter = '';
        allChip.textContent = '全部';
        allChip.onclick = () => {
            currentFilter = "";
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            render();
        };
        filterGroup.appendChild(allChip);
        
        // 添加主题筛选
        topics.forEach(t => {
            const chip = document.createElement('div');
            chip.className = 'nav-chip filter-chip topic-filter';
            chip.dataset.filter = t;
            chip.dataset.mode = 'topic';
            chip.textContent = t;
            chip.onclick = () => setFilter(t);
            chip.style.display = 'none';
            filterGroup.appendChild(chip);
        });
        
        // 添加会议层级筛选（树形结构）
        conferences.forEach(conf => {
            // 会议名称按钮
            const confChip = document.createElement('div');
            confChip.className = 'nav-chip filter-chip conf-filter';
            confChip.dataset.conf = conf;
            confChip.dataset.mode = 'confYear';
            confChip.textContent = conf;
            confChip.style.display = 'none';
            confChip.onclick = () => toggleConf(conf);
            filterGroup.appendChild(confChip);
            
            // 年份子选项（初始隐藏）
            const years = confYearMap[conf].sort((a,b) => b - a);
            years.forEach(year => {
                const yearChip = document.createElement('div');
                yearChip.className = 'nav-chip filter-chip year-filter';
                yearChip.dataset.filter = conf + '|' + year;
                yearChip.dataset.mode = 'confYear';
                yearChip.dataset.conf = conf;
                yearChip.textContent = year;
                yearChip.style.display = 'none';
                yearChip.onclick = (e) => {
                    e.stopPropagation();
                    setFilter(conf + '|' + year);
                };
                filterGroup.appendChild(yearChip);
            });
        });
        
        // 默认显示主题筛选
        setFilterMode('topic');
    }
    
    function toggleConf(conf) {
        if (expandedConf === conf) {
            expandedConf = null;
        } else {
            expandedConf = conf;
        }
        updateConfDisplay();
    }
    
    function updateConfDisplay() {
        // 更新会议按钮样式
        document.querySelectorAll('.conf-filter').forEach(c => {
            c.classList.toggle('active', c.dataset.conf === expandedConf);
            c.classList.toggle('expanded', c.dataset.conf === expandedConf);
        });
        
        // 显示/隐藏年份选项
        document.querySelectorAll('.year-filter').forEach(c => {
            c.style.display = (c.dataset.conf === expandedConf && filterMode === 'confYear') ? '' : 'none';
        });
    }
    
    function setFilterMode(mode) {
        filterMode = mode;
        expandedConf = null;
        
        // 更新模式切换按钮样式
        document.querySelectorAll('.mode-toggle').forEach(c => {
            c.classList.toggle('active', c.dataset.mode === mode);
        });
        
        // 显示/隐藏对应的筛选按钮
        document.querySelectorAll('.topic-filter').forEach(c => {
            c.style.display = mode === 'topic' ? '' : 'none';
        });
        document.querySelectorAll('.conf-filter').forEach(c => {
            c.style.display = mode === 'confYear' ? '' : 'none';
        });
        document.querySelectorAll('.year-filter').forEach(c => {
            c.style.display = 'none';
        });
        
        // 清空当前筛选
        currentFilter = "";
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        
        render();
    }
    
    function setFilter(filter) {
        // 如果点击的是当前激活的筛选，则清除
        if (currentFilter === filter) {
            currentFilter = "";
        } else {
            currentFilter = filter;
        }
        
        document.querySelectorAll('.filter-chip').forEach(c => {
            c.classList.toggle('active', c.dataset.filter === currentFilter);
        });
        
        render();
    }
    
    function render() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        currentSearch = search;
        
        let filtered = papers.filter(p => {
            let matchFilter = true;
            if (currentFilter) {
                if (filterMode === 'topic') {
                    matchFilter = p.topic === currentFilter;
                } else if (filterMode === 'confYear') {
                    const conf = p.conference || 'arXiv';
                    const year = p.year || 2024;
                    const key = conf + '|' + year;
                    matchFilter = key === currentFilter;
                }
            }
            const matchSearch = !search || 
                (p.title && p.title.toLowerCase().includes(search)) || 
                (p.authors && p.authors.toLowerCase().includes(search));
            return matchFilter && matchSearch;
        });
        
        const list = document.getElementById('paperList');
        
        if (filtered.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">没有找到匹配的论文</div>';
            return;
        }
        
        // 按会议-年份分组显示
        let html = '';
        const grouped = {};
        filtered.forEach(p => {
            const conf = p.conference || 'arXiv';
            const year = p.year || 2024;
            const key = conf + ' / ' + year;
            if (!grouped[key]) grouped[key] = [];
            grouped[key].push(p);
        });
        
        Object.keys(grouped).sort().forEach(key => {
            html += `<div class="section-title">📁 ${key}</div>`;
            grouped[key].forEach(p => {
                html += renderPaperCard(p);
            });
        });
        
        list.innerHTML = html;
        
        document.getElementById('paperCount').textContent = papers.length;
        document.getElementById('confCount').textContent = Object.keys(confYearMap).length;
        document.getElementById('topicCount').textContent = topics.length;
        document.getElementById('totalCount').textContent = papers.length;
    }
    
    function renderPaperCard(p) {
        return `
        <div class="paper-card" data-id="${p.id}">
            <div class="title">${p.title || 'Untitled'}</div>
            <div class="authors">${p.authors || 'Unknown'}</div>
            <div class="meta">
                <span class="tag conf">${p.conference || 'arXiv'}</span>
                <span class="tag year">${p.year || '2024'}</span>
                <span class="tag topic">${p.topic || 'LLM Serving'}</span>
            </div>
            <div class="links">
                ${p.arxiv_id ? `<a href="https://arxiv.org/abs/${p.arxiv_id}" target="_blank">📄 arXiv</a>` : ''}
                ${p.github_repo ? `<a href="https://github.com/${p.github_repo}" target="_blank">🐙 GitHub</a>` : ''}
                <a href="javascript:void(0)" onclick="showDetail(${p.id})">📖 详情 →</a>
            </div>
            ${(p.abstract_en || p.abstract_cn) ? `
            <button class="abstract-toggle" onclick="toggleAbstract(${p.id}, this)">
                📖 展开摘要
            </button>
            <div class="abstract-content" id="abstract-${p.id}">
                ${p.abstract_en ? `<h4>Abstract</h4><p>${p.abstract_en.substring(0,600)}${p.abstract_en.length>600?'...':''}</p>` : ''}
                ${p.abstract_cn ? `<h4>摘要</h4><p class="cn">${p.abstract_cn.substring(0,400)}${p.abstract_cn.length>400?'...':''}</p>` : ''}
            </div>
            ` : ''}
        </div>`;
    }
    
    function toggleAbstract(id, btn) {
        const content = document.getElementById('abstract-' + id);
        if (content.classList.contains('show')) {
            content.classList.remove('show');
            btn.textContent = '📖 展开摘要';
        } else {
            content.classList.add('show');
            btn.textContent = '📕 收起摘要';
        }
    }
    
    function showDetail(id) {
        const p = papers.find(p => p.id === id);
        if (!p) return;
        
        document.getElementById('listPage').style.display = 'none';
        document.getElementById('detailPage').classList.add('show');
        
        document.getElementById('detailTitle').textContent = p.title;
        document.getElementById('detailAuthors').textContent = p.authors || 'Unknown';
        
        document.getElementById('detailMeta').innerHTML = `
            <span class="tag conf">${p.conference || 'arXiv'}</span>
            <span class="tag year">${p.year || '2024'}</span>
            <span class="tag topic">${p.topic || 'LLM Serving'}</span>
        `;
        
        let links = '';
        if (p.arxiv_id) links += `<a href="https://arxiv.org/abs/${p.arxiv_id}" target="_blank">📄 arXiv</a> `;
        if (p.github_repo) links += `<a href="https://github.com/${p.github_repo}" target="_blank">🐙 GitHub</a> `;
        document.getElementById('detailLinks').innerHTML = links;
        
        let body = '';
        if (p.abstract_en) {
            body += `<h3>Abstract</h3><p>${p.abstract_en}</p>`;
        }
        if (p.abstract_cn) {
            body += `<h3>摘要</h3><p class="cn">${p.abstract_cn}</p>`;
        }
        if (p.intro_en) {
            body += `<h3>1. Introduction</h3><p>${p.intro_en}</p>`;
        }
        if (p.intro_cn) {
            body += `<h3>引言</h3><p class="cn">${p.intro_cn}</p>`;
        }
        
        document.getElementById('detailBody').innerHTML = body || '<p style="color:#999;text-align:center;padding:40px;">暂无详细内容</p>';
        
        window.scrollTo(0, 0);
    }
    
    function showList() {
        document.getElementById('detailPage').classList.remove('show');
        document.getElementById('listPage').style.display = 'block';
    }
    
    document.getElementById('searchInput').addEventListener('input', render);
    
    initNav();
    render();
    </script>
</body>
</html>
