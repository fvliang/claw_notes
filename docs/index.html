<!DOCTYPE html>

<title>LLM Serving Papers</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:#f0f2f5;margin:0}

/* ===== 顶部 ===== */
.topbar{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:200}
.topbar-row{display:flex;justify-content:space-between;align-items:center}
.topbar h1{margin:0;font-size:18px;font-weight:700}
.topbar-actions{display:flex;gap:8px}
.topbar-btn{padding:6px 12px;background:rgba(255,255,255,.15);border:none;border-radius:8px;color:#fff;font-size:12px;cursor:pointer}
.topbar-btn:active{background:rgba(255,255,255,.25)}
.stats-row{display:flex;gap:16px;margin-top:12px}
.stat-item{text-align:center;flex:1}
.stat-num{font-size:22px;font-weight:800}
.stat-label{font-size:10px;opacity:.8}

/* ===== 筛选栏 ===== */
.filterbar{background:#fff;padding:10px 15px;position:sticky;top:70px;z-index:150;border-bottom:1px solid #e8e8e8}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.filter-row::-webkit-scrollbar{display:none}
.fchip{padding:7px 14px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer;background:#f0f0f0;color:#555;flex-shrink:0;transition:.15s}
.fchip.on{background:#007AFF;color:#fff}
.fchip.time-new{border:2px solid #FF6B35;color:#FF6B35;background:#fff3e8}
.fchip.time-new.on{background:#FF6B35;color:#fff}
.fchip.time-recent{border:2px solid #FFB800;color:#FFB800;background:#fff8e8}
.fchip.time-old{border:2px solid #aaa;color:#aaa;background:#f5f5f5}

.search{padding:10px 15px;background:#fff;border-bottom:1px solid #eee}
.search input{width:100%;padding:10px 40px 10px 14px;border:none;border-radius:10px;background:#f5f5f5;font-size:15px}
.search-icon{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:14px;color:#999}

/* ===== 论文列表 ===== */
.plist{padding:12px 15px}
.group-label{display:flex;align-items:center;gap:8px;margin:18px 0 10px;padding:6px 0;border-bottom:2px solid #ddd;font-size:13px;font-weight:700;color:#333}
.group-label .badge{padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600}
.badge-new{background:#FF6B35;color:#fff}
.badge-recent{background:#FFB800;color:#fff}
.badge-old{background:#aaa;color:#fff}

/* ===== 论文卡片 ===== */
.pcard{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);transition:.15s;position:relative}
.pcard-unread{border-left:4px solid #FF6B35;background:#fff9f4}
.pcard-read{border-left:4px solid #34C759;opacity:.65}
.pcard-newtag{position:absolute;top:-1px;right:12px;background:#FF6B35;color:#fff;font-size:10px;padding:2px 8px;border-radius:8px 8px 0 0;font-weight:700}

.pcard-top{display:flex;justify-content:space-between;align-items:start;gap:8px}
.pcard-title{font-size:14px;font-weight:600;color:#1a1a1a;line-height:1.45;flex:1}
.pcard-check{font-size:20px;cursor:pointer;padding:4px;line-height:1}
.pcard-auth{font-size:11px;color:#999;margin:6px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-tags{display:flex;gap:5px;flex-wrap:wrap}
.ptag{padding:2px 8px;border-radius:8px;font-size:10px}
.ptag-c{background:#e8f4ff;color:#007AFF}
.ptag-t{background:#f0f0f0;color:#888}
.ptag-u{background:#FF6B35;color:#fff;font-weight:600}
.ptag-r{background:#34C759;color:#fff}

.pcard-foot{display:flex;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid #f0f0f0}
.pcard-foot a{font-size:12px;color:#007AFF;text-decoration:none;font-weight:500}

.pcard-abs-btn{padding:6px 10px;background:#f5f5f5;border:none;border-radius:6px;font-size:11px;color:#888;cursor:pointer;margin-top:8px}
.pcard-abs{display:none;margin-top:10px;font-size:12px;line-height:1.6;color:#555}
.pcard-abs.show{display:block}

/* ===== 详情页 ===== */
.detail{display:none;min-height:100vh;background:#f0f2f5}
.detail.on{display:block}
.det-head{background:#fff;padding:18px 20px;border-bottom:1px solid #eee}
.det-back{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:#007AFF;cursor:pointer;margin-bottom:12px;font-weight:500}
.det-back:active{opacity:.7}
.det-title{font-size:18px;font-weight:700;color:#1a1a1a;line-height:1.4;margin:0 0 8px}
.det-auth{font-size:13px;color:#888;margin-bottom:10px}
.det-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.det-links{display:flex;gap:12px}
.det-links a{font-size:14px;color:#007AFF;text-decoration:none;font-weight:600}

.det-body{background:#fff;margin:12px 15px;padding:20px;border-radius:14px}
.det-body h3{font-size:14px;color:#007AFF;margin:24px 0 12px;padding-bottom:6px;border-bottom:1px solid #e8f4ff}
.det-body h3:first-child{margin-top:0}
.det-body p{font-size:14px;line-height:1.8;color:#333;margin:0 0 16px}

.empty{text-align:center;padding:60px 20px;color:#aaa;font-size:14px}
</style>
</head>

<script>
const P=[{"title": "POD-Attention: Unlocking Full Prefill-Decode Overlap for Faster LLM Inference", "authors": "Aditya Kamath 等", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS 2025", "year": 2025, "abstract_en": "Each request in LLM inference goes through two phases: compute-bound prefill and memory-bandwidth-bound decode. To improve GPU utilization, recent systems use hybrid batching that combines the prefill and decode phases of different requests into the same batch. This approach optimizes linear operations but remains inefficient for attention computation because existing attention kernels specialize execution independently for the prefill and decode phases.\n\nIn this paper, we present **POD-Attention** - the first GPU kernel that efficiently computes attention for hybrid batches. POD-Attention aims to maximize the utilization of both compute and memory bandwidth by carefully allocating the GPU's resources such that prefill and decode operations happen concurrently on the same multiprocessor.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./asplos/2025/pod_attention.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Attention", "id": 1, "added_date": "2026-03-15"}, {"title": "vAttention: Dynamic Memory Management for Serving LLMs without PagedAttention", "authors": "Ashish Panwar, Rishabh Prabhu, et al.", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS 2025", "year": 2025, "abstract_en": "PagedAttention is a popular approach for dynamic memory allocation in LLM serving systems. It enables on-demand allocation of GPU memory to mitigate KV cache fragmentation -- a phenomenon that crippled the batch size (and consequently throughput) in prior systems. However, in trying to allocate physical memory at runtime, PagedAttention ends up changing the virtual memory layout of the KV cache from contiguous to non-contiguous. Such a design leads to non-trivial programming and performance overheads.\n\nWe present **vAttention** -- an approach that mitigates fragmentation in physical memory while retaining the contiguity of KV cache in virtual memory. We achieve this by decoupling the allocation of virtual and physical memory using CUDA virtual memory management APIs.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./asplos/2025/vattention_dynamic_memory.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Attention", "id": 2, "added_date": "2026-03-15"}, {"title": "ZipServ: Fast and Memory-Efficient LLM Inference with Hardware-Aware Lossless Compression", "authors": "Ruibo Fan, Xiangrui Yu, Xinglin Pan, Zeyu Li, Weile Luo, Qiang Wang, Wei Wang, Xiaowen Chu", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS 2026", "year": 2026, "abstract_en": "ZipServ提出了一种硬件感知的无损压缩方法，用于加速LLM推理并降低内存占用。该方法针对现代GPU架构进行了优化，实现了显著的性能提升。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./asplos/2026/07_zipserv_compression.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Hardware", "id": 3, "added_date": "2026-03-15"}, {"title": "QoServe: Breaking the Silos of LLM Inference Serving", "authors": "Kanishk Goel, Jayashree Mohan, Nipun Kwatra, Ravi Anupindi, Ram Ramjee", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS 2026", "year": 2026, "abstract_en": "QoServe是一个统一的LLM推理服务框架，打破了传统系统中的\"孤岛\"设计。传统LLM serving系统针对特定场景优化，导致系统碎片化。QoServe通过创新的架构设计，实现了跨场景的高质量服务。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./asplos/2026/03_qoserve.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 4, "added_date": "2026-03-15"}, {"title": "PAT: Accelerating LLM Decoding via Prefix-Aware Attention with Resource Efficient Multi-Tile Kernel", "authors": "Jinjun Yi, Zhixin Zhao, Yitao Hu, Ke Yan, Weiwei Sun, Hao Wang, Laiping Zhao, Yuhao Zhang, Wenxin Li, Keqiu Li", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS 2026", "year": 2026, "abstract_en": "PAT（前缀感知注意力）提出了一种新的注意力机制优化，通过资源高效的多tile内核加速LLM解码。该方法显著降低了注意力计算的内存和计算开销。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./asplos/2026/06_pat_prefix_aware_attention.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Attention", "id": 5, "added_date": "2026-03-15"}, {"title": "MoE-APEX: An Efficient MoE Inference System with Adaptive Precision Expert Offloading", "authors": "Peng Tang, Jiacheng Liu, Xiaofeng Hou, Yifei Pu, Jing Wang, Pheng-Ann Heng, Chao Li, Minyi Guo", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS 2026", "year": 2026, "abstract_en": "MoE-APEX是针对MoE（混合专家）模型的高效推理系统，通过自适应精度的专家卸载策略，在保持模型质量的同时显著降低推理成本。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./asplos/2026/09_moe_apex.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "MoE", "id": 6, "added_date": "2026-03-16"}, {"title": "XY-Serve: End-to-End Versatile Production Serving for Dynamic LLM Workloads", "authors": "Mingcong Song, Xinru Tang, Fengfan Hou, Jing Li, Wei Wei, Yipeng Ma, Runqiu Xiao, Hongjie Si, Dingcheng Jiang, Shouyi Yin, Yang Hu, Guoping Long", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS 2026", "year": 2026, "abstract_en": "XY-Serve是华为提出的端到端LLM服务系统，专门针对动态工作负载进行优化。该系统提供了生产级别的LLM serving能力，支持多种模型和场景。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./asplos/2026/05_xy_serve.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 7, "added_date": "2026-03-16"}, {"title": "Shift Parallelism: Low-Latency, High-Throughput LLM Inference for Dynamic Workloads", "authors": "Mert Hidayetoglu, Aurick Qiao, Michael Wyatt, Jeff Rasley, Yuxiong He, Samyam Rajbhandari", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS 2026", "year": 2026, "abstract_en": "Shift Parallelism提出了一种新的并行策略，用于在动态工作负载下实现低延迟和高吞吐量的LLM推理。该方法通过创新的请求调度和计算分配，实现了在变化负载下的稳定性能。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./asplos/2026/04_shift_parallelism.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 8, "added_date": "2026-03-16"}, {"title": "Towards High-Goodput LLM Serving with Prefill-decode Multiplexing", "authors": "Weihao Cui, Yukang Chen, Han Zhao, Ziyi Xu, Xiaoze Fan, Xusheng Chen, Yangjie Zhou, Shixuan Sun, Bingsheng He, Quan Chen", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS 2026", "year": 2026, "abstract_en": "现代大型语言模型(LLM)的部署需要同时优化延迟和吞吐量。传统的LLM serving系统通常将prefill阶段和解码阶段分开处理，但这导致了资源利用不均衡的问题。本文提出了Prefill-Decode Multiplexing (PDM) 框架，通过创新的请求调度和资源分配策略，实现了更高的goodput（服务质量感知的吞吐量）。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./asplos/2026/01_high_goodput_llm_serving.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 9, "added_date": "2026-03-16"}, {"title": "Bullet: Boosting GPU Utilization for LLM Serving via Dynamic Spatial-Temporal Orchestration", "authors": "Zejia Lin, Hongxin Xu, Guanyi Chen, Zhiguang Chen, Yutong Lu, Xianwei Zhang", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS 2026", "year": 2026, "abstract_en": "本文提出Bullet系统，通过动态空间-时间协调来提升LLM serving的GPU利用率。传统的LLM serving系统存在GPU计算资源浪费的问题，Bullet通过创新的调度策略实现了更高效的GPU资源利用。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./asplos/2026/02_bullet_gpu_utilization.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 10, "added_date": "2026-03-16"}, {"title": "BlendServe: Optimizing Offline Inference with Resource-Aware Batching", "authors": "Yilong Zhao, Shuo Yang, Kan Zhu, Lianmin Zheng, Baris Kasikci, Yifan Qiao, Yang Zhou, Jiarong Xing, Ion Stoica", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS 2026", "year": 2026, "abstract_en": "BlendServe是UC Berkeley离子·斯托伊卡团队提出的离线推理优化系统，通过资源感知的批处理策略最大化离线场景下的推理效率。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./asplos/2026/08_blendserve_batching.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 11, "added_date": "2026-03-17"}, {"title": "REST: Retrieval-Based Speculative Decoding", "authors": "FasterDecoding", "arxiv_id": "", "github_repo": "", "conference": "NAACL 2024", "year": 2024, "abstract_en": "1. **Retrieves similar contexts** from recent history\n2. **Uses retrieved tokens as drafts** for verification\n3. **Achieves high acceptance rates** when prompts share common patterns\n\nThis approach is particularly effective for tasks with repetitive patterns or structured outputs.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./naacl/2024/rest.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 12, "added_date": "2026-03-17"}, {"title": "TokenSwift: Ultra Long Sequence Generation", "authors": "bigai-nlco", "arxiv_id": "", "github_repo": "", "conference": "ICML 2025", "year": 2025, "abstract_en": "1. **Hierarchical speculation**: Multi-level draft generation pipeline\n2. **Long context optimization**: Specifically designed for 10K+ token sequences\n3. **Memory efficiency**: Optimized KVCache management for long contexts\n4. **2-3x speedup**: Maintains output quality while significantly accelerating", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./icml/2025/tokenswift.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 13, "added_date": "2026-03-17"}, {"title": "LayerSkip: Early Exit and Self-Speculative Decoding", "authors": "Facebook Research", "arxiv_id": "", "github_repo": "", "conference": "ACL 2024", "year": 2024, "abstract_en": "1. **Early exit at variable layers**: Different tokens exit at different layers based on confidence\n2. **Self-speculative decoding**: Model drafts tokens and verifies them in a unified framework\n3. **Significant speedups**: Up to 2x speedup on various benchmarks", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./acl/2024/layerskip.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 14, "added_date": "2026-03-17"}, {"title": "vLLM: Efficient Memory Management for Large Language Model Serving with PagedAttention", "authors": "Unknown", "arxiv_id": "2309.06180", "github_repo": "vllm-project/vllm", "conference": "", "year": 2023, "abstract_en": "## 摘要 (中文)\n大型语言模型（LLM）的高吞吐量服务需要同时批处理足够多的请求。然而，现有系统面临挑战，因为每个请求的键值缓存（KV缓存）内存很大，且会动态增长和收缩。当管理不高效时，这些内存会因碎片化和冗余复制而严重浪费，限制了批处理大小。为解决这一问题，我们提出了PagedAttention，这是一种受操作系统中经典虚拟内存和分页技术启发的注意力算法。在此基础上，我们构建了vLLM，一个LLM服务系统，实现了（1）KV缓存内存近零浪费，（2）灵活共享KV缓存在请求内部和跨请求以进一步减少内存使用。我们的评估表明，vLLM与FasterTransformer和Orca等最新系统相比，在相同延迟水平下将流行LLM的吞吐量提高了2-4倍。这种改进在更长序列、更大模型和更复杂解码算法的情况下更为明显。", "abstract_cn": "## 摘要 (中文)\n大型语言模型（LLM）的高吞吐量服务需要同时批处理足够多的请求。然而，现有系统面临挑战，因为每个请求的键值缓存（KV缓存）内存很大，且会动态增长和收缩。当管理不高效时，这些内存会因碎片化和冗余复制而严重浪费，限制了批处理大小。为解决这一问题，我们提出了PagedAttention，这是一种受操作系统中经典虚拟内存和分页技术启发的注意力算法。在此基础上，我们构建了vLLM，一个LLM服务系统，实现了（1）KV缓存内存近零浪费，（2）灵活共享KV缓存在请求内部和跨请求以进一步减少内存使用。我们的评估表明，vLLM与FasterTransformer和Orca等最新系统相比，在相同延迟水平下将流行LLM的吞吐量提高了2-4倍。这种改进在更长序列、更大模型和更复杂解码算法的情况下更为明显。\n\n## 引言 (Introduction)\nLarge language models (LLMs) have become the backbone of many modern AI applications. Serving LLMs at scale requires high throughput to serve many concurrent users. A common technique to improve throughput is to batch multiple requests together and process them simultaneously. However, the memory consumption of LLM serving is dominated by the key-value (KV) cache, which stores intermediate activation for the attention mechanism. The KV cache is large and grows and shrinks dynamically as the model generates new tokens. Efficient management of the KV cache is critical for maximizing batch size and thus throughput.\n\n", "intro_en": "", "intro_cn": "", "file": "./arxiv/2023/vllm_pagedattention_sosp2023.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Attention", "id": 15, "added_date": "2026-03-17"}, {"title": "ALISE: Speculative Scheduling for LLM Serving", "authors": "Various", "arxiv_id": "", "github_repo": "", "conference": "arXiv 2024", "year": 2024, "abstract_en": "1. **Speculative scheduling**: Intelligently schedules speculation\n2. **Workload-aware**: Adapts to request characteristics\n3. **Batch optimization**: Better batching decisions with speculation\n4. **Improved throughput**: Significant gains over non-speculative systems", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/alise.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 18, "added_date": "2026-03-18"}, {"title": "PowerInfer-2: High-Speed LLM Inference for Smartphones", "authors": "来自上海交通大学IPADS实验室", "arxiv_id": "", "github_repo": "Tiiny-AI/PowerInfer", "conference": "", "year": 2024, "abstract_en": "PowerInfer-2是一个专为智能手机设计的高度优化推理框架。\n\n使用TurboSparse-Mixtral-47B，PowerInfer-2在智能手机上实现了**11.68 tokens/s**的推理速度，比其他SOTA框架快达**22倍**。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/powerinfer2.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 19, "added_date": "2026-03-18"}, {"title": "InstCache: Predictive Cache for LLM Serving", "authors": "Various", "arxiv_id": "", "github_repo": "", "conference": "arXiv 2024", "year": 2024, "abstract_en": "1. **Prefix prediction**: Predicts common prompt prefixes\n2. **Intent anticipation**: Anticipates user intent from context\n3. **Smart pre-caching**: Loads likely-needed KV cache in advance\n4. **High hit rates**: Achieves significant cache hit improvements", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/instcache.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 20, "added_date": "2026-03-18"}, {"title": "DistServe: Disaggregating Prefill and Decoding for Goodput-optimized LLM Serving", "authors": "Y. Sheng, L. Zheng, Y. Zhu, et al. (PKU)", "arxiv_id": "", "github_repo": "", "conference": "OSDI 2024", "year": 2024, "abstract_en": "We propose DistServe, a system that disaggregates prefilling and decoding to different GPUs. The key insight is that isolating the two phases eliminates interference and enables tailoring the hardware configuration for each. We develop an efficient method to determine the optimal placement of prefilling and decoding workloads on heterogeneous GPU clusters. We implement DistServe and evaluate it on a cluster with 16 A100 GPUs. Compared to existing systems like vLLM and Orca, DistServe improves throughput by up to 2.6x while ensuring the latency SLOs are met.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/distserve.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 21, "added_date": "2026-03-19"}, {"title": "TriForce: Hierarchical Speculative Decoding", "authors": "Infini-AI-Lab", "arxiv_id": "", "github_repo": "", "conference": "COLM 2024", "year": 2024, "abstract_en": "1. **Coarse-level draft**: Fast, smaller model generates draft\n2. **Medium-level verification**: Intermediate model verifies\n3. **Fine-level verification**: Full model confirms final tokens\n\nThis hierarchical approach achieves near-linear speedups while maintaining identical output to standard decoding.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/triforce.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 22, "added_date": "2026-03-19"}, {"title": "speculative_decoding_survey", "authors": "Unknown", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/speculative_decoding_survey.md", "has_content": false, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 23, "added_date": "2026-03-19"}, {"title": "Sequoia: Tree-Based Speculative Decoding", "authors": "Infini-AI-Lab", "arxiv_id": "", "github_repo": "", "conference": "arXiv 2024", "year": 2024, "abstract_en": "1. **Efficient tree construction**: Optimal draft tree structure\n2. **Robust verification**: Handles various acceptance scenarios\n3. **Adaptive strategy**: Adjusts to different workload characteristics\n4. **Significant speedups**: Up to 2.5x over baseline methods", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/sequoia.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 24, "added_date": "2026-03-19"}, {"title": "Mooncake: A KVCache-centric Disaggregated Architecture for LLM Serving", "authors": "Moonshot AI", "arxiv_id": "", "github_repo": "", "conference": "arXiv 2024", "year": 2024, "abstract_en": "The system implements a novel architecture that separates the prefill and decode stages while focusing on maximizing KVCache reuse across requests. Mooncake achieves significantly higher throughput compared to existing systems by leveraging:\n- Efficient KVCache transfer between disaggregated stages\n- Smart cache management and eviction policies\n- Memory-centric scheduling", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/mooncake.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 25, "added_date": "2026-03-19"}, {"title": "FlashAttention-3: Fast and Accurate Attention", "authors": "TriDao et al.", "arxiv_id": "", "github_repo": "", "conference": "arXiv 2024", "year": 2024, "abstract_en": "1. **Asynchrony**: Overlaps computation and memory operations\n2. **Low-precision**: FP8 support with minimal accuracy loss\n3. **Hardware optimization**: Better utilization of modern GPU tensor cores\n4. **2-3x speedup** over FlashAttention-2\n\nFlashAttention series has become the de-facto standard for efficient attention computation in modern LLM systems.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/flashattention3.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Attention", "id": 26, "added_date": "2026-03-20"}, {"title": "Lookahead Decoding: Break the Sequential Dependency of LLM Inference", "authors": "(待补充)", "arxiv_id": "", "github_repo": "hao-ai-lab/LookaheadDecoding", "conference": "ICML 2024", "year": 2024, "abstract_en": "Large Language Models (LLMs) generate tokens auto-regressively, which creates sequential dependency that limits parallelization during inference. This paper presents Lookahead Decoding, a technique that breaks this sequential dependency to enable parallel token generation.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/lookahead_decoding.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 27, "added_date": "2026-03-20"}, {"title": "Chameleon: Adaptive Caching for Multi-Adapter LLM Inference", "authors": "Various", "arxiv_id": "", "github_repo": "", "conference": "arXiv 2024", "year": 2024, "abstract_en": "1. **Adapter-aware caching**: Different adapters have different cache needs\n2. **Adaptive scheduling**: Dynamic adjustment based on workload\n3. **Memory optimization**: Efficient sharing of cache across adapters\n4. **Significant improvements**: Better throughput and latency", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/chameleon_adapter.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 28, "added_date": "2026-03-20"}, {"title": "Quest: Query-Aware Sparsity for Efficient Long-Context LLM Inference", "authors": "(待补充)", "arxiv_id": "", "github_repo": "mit-han-lab/Quest", "conference": "ICML 2024", "year": 2024, "abstract_en": "Long-context LLM inference requires significant memory and compute resources. Quest proposes a query-aware sparsity approach that selectively attends to relevant context, reducing computation while maintaining quality.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/quest.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 29, "added_date": "2026-03-20"}, {"title": "EAGLE: Early Exit and Speculative Decoding", "authors": "Various (SafeAILab)", "arxiv_id": "", "github_repo": "", "conference": "ICML 2024, EMNLP 2024, NeurIPS", "year": 2024, "abstract_en": "1. **EAGLE-1 (ICML'24)**: Uses early-exit techniques to speed up draft token generation\n2. **EAGLE-2 (EMNLP'24)**: Improved speculative decoding with better acceptance rates\n3. **EAGLE-3 (NeurIPS'25)**: Further optimizations for better performance\n\nEAGLE achieves 2-3x speedup over standard autoregressive decoding while maintaining output quality.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/eagle_speculative.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 30, "added_date": "2026-03-20"}, {"title": "PipeInfer: Asynchronous Pipelined Speculation", "authors": "AutonomicPerfectionist", "arxiv_id": "", "github_repo": "", "conference": "arXiv 2024", "year": 2024, "abstract_en": "1. **Pipelining**: Overlap multiple requests' computation\n2. **Speculation**: Use draft tokens for acceleration\n3. **Asynchronous execution**: Maximize GPU utilization\n\nThis approach achieves better throughput by keeping the GPU constantly busy with minimal idle time.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/pipeinfer.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 31, "added_date": "2026-03-21"}, {"title": "ShadowKV: KV Cache in Shadows for Long-Context Inference", "authors": "Various", "arxiv_id": "", "github_repo": "", "conference": "arXiv 2024", "year": 2024, "abstract_en": "1. **Shadow cache**: Secondary cache layer for efficiency\n2. **Hierarchical caching**: Multi-level cache hierarchy\n3. **Selective computation**: Only compute when necessary\n4. **3-4x speedup**: Significant improvements for long contexts", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/shadowkv.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 32, "added_date": "2026-03-21"}, {"title": "MiniKV: Layer-Discriminative KV Cache", "authors": "Various (Microsoft?)", "arxiv_id": "", "github_repo": "", "conference": "arXiv 2024", "year": 2024, "abstract_en": "1. **Layer-aware quantization**: Different layers get different precision\n2. **2-bit compression**: Aggressive KV cache compression\n3. **Minimal accuracy loss**: Maintains model quality through careful design\n4. **Significant memory savings**: Up to 4x KV cache reduction", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/minikv.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 33, "added_date": "2026-03-21"}, {"title": "DART: Diffusion-Inspired Speculative Decoding", "authors": "Various", "arxiv_id": "", "github_repo": "", "conference": "arXiv 2024", "year": 2024, "abstract_en": "1. **Multiple draft candidates**: Generate several possible token sequences\n2. **Tree-based verification**: Efficiently verify multiple candidates\n3. **Quality-aware selection**: Choose best among multiple drafts\n4. **Improved acceptance rates**: Better overall efficiency", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/dart_speculative.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 34, "added_date": "2026-03-21"}, {"title": "KIVI: A Tuning-Free Asymmetric 2bit Quantization for KV Cache", "authors": "(待补充)", "arxiv_id": "", "github_repo": "jy-yuan/KIVI", "conference": "ICML 2024", "year": 2024, "abstract_en": "KV cache quantization is crucial for reducing memory footprint in LLM inference. This paper presents KIVI, a tuning-free asymmetric 2bit quantization method for KV cache that achieves minimal accuracy loss.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/kivi.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 35, "added_date": "2026-03-21"}, {"title": "Star-Attention: Efficient LLM Inference over Long Sequences", "authors": "NVIDIA", "arxiv_id": "", "github_repo": "", "conference": "arXiv 2024", "year": 2024, "abstract_en": "1. **Reduces attention complexity** from O(n²) to O(n)\n2. **Maintains model quality** with minimal accuracy loss\n3. **Achieves 11x speedup** on long sequence benchmarks\n\nThis is achieved by dividing the context into blocks with block-wise attention and using a small set of anchor tokens to maintain global coherence.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/star_attention.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Attention", "id": 36, "added_date": "2026-03-22"}, {"title": "ParallelVLM: Lossless Video-LLM Acceleration with Visual Alignment Aware Parallel Speculative Decodi", "authors": "Quan Kong, Yuhao Shen, Yicheng Ji, Huan Li, Cong Wang", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "尽管当前的视频语言模型 (Video-LLMs) 在视频理解任务上取得了令人印象深刻的性能，但它们的自回归解码效率仍然受到大量视频token的限制。\n\n视觉token剪枝可以部分缓解这一瓶颈，但现有方法仍存在信息丢失问题，且加速效果有限。\n\n**ParallelVLM** 提出了一种**视觉对齐感知的并行投机解码**方法，实现无损加速。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/parallelvlm.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 37, "added_date": "2026-03-22"}, {"title": "ReSpec: Towards Optimizing Speculative Decoding in Reinforcement Learning Systems", "authors": "Qiaoling Chen, Zijun Liu, Peng Sun, Shenggui Li, Guoteng Wang, Ziming Liu, Yonggang Wen, Siyuan Feng, Tianwei Zhang", "arxiv_id": "2510.26475", "github_repo": "", "conference": "arXiv预印本", "year": 2025, "abstract_en": "Adapting large language models (LLMs) via reinforcement learning (RL) is often bottlenecked by the generation stage, which can consume over 75% of the training time. Speculative decoding (SD) accelerates autoregressive generation in serving systems, but its behavior under RL training remains largely unexplored. We identify three critical gaps that hinder the naive integration of SD into RL systems: diminishing speedups at large batch sizes, drafter staleness under continual actor updates, and drafter-induced policy degradation.\n\nTo address these gaps, we present ReSpec, a system that adapts SD to RL through three complementary mechanisms: dynamically tuning SD configurations, evolving the drafter via knowledge distillation, and weighting updates by rollout rewards. On Qwen models (3B--14B), ReSpec achieves up to 4.5x speedup while preserving reward convergence and training stability, providing a practical solution for efficient RL-based LLM adaptation.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/27_respec_rl_speculative.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 38, "added_date": "2026-03-22"}, {"title": "Reasoning Language Model Inference Serving Unveiled: An Empirical Study", "authors": "Qi Li, Junpan Wu, Xiang Liu, et al.", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "The reasoning large language model (RLLM) has been proven competitive in solving complex reasoning tasks such as mathematics, coding, compared to general LLM. However, the unique inference patterns of RLLMs, such as extended thinking processes and self-verification mechanisms, introduce significant challenges for serving systems. In this paper, we present the first comprehensive empirical study on RLLM inference serving. We analyze the performance characteristics of RLLMs and identify key bottlenecks including longer response lengths, more complex attention patterns, and dynamic computational demands. Based on our findings, we propose several optimization strategies and evaluate their effectiveness. Our study provides valuable insights for designing efficient RLLM serving systems.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/05_rllm_serving_study.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 39, "added_date": "2026-03-22"}, {"title": "LLaMCAT: Optimizing Large Language Model Inference with Cache Arbitration and Throttling", "authors": "Zhongchun Zhou, Chengtao Lai, Wei Zhang", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "Large Language Models (LLMs) have achieved unprecedented success but their substantial memory requirements pose significant challenges. LLaMCAT proposes a cache arbitration and throttling mechanism to optimize memory usage and improve inference throughput.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/LLaMCAT.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 40, "added_date": "2026-03-22"}, {"title": "Nightjar: Dynamic Adaptive Speculative Decoding for Large Language Models Serving", "authors": "Rui Li, Zhaoning Zhang, Libo Zhang, et al.", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2090, "abstract_en": "Speculative decoding has emerged as a promising technique to accelerate large language model (LLM) inference by leveraging a small draft model to propose candidate tokens and a large target model to verify them in parallel. However, existing speculative decoding methods adopt a fixed verification batch size throughout the inference process, failing to adapt to the dynamically varying acceptance rates and available computational resources. We present Nightjar, a dynamic adaptive speculative decoding system that dynamically adjusts the verification batch size based on runtime inference characteristics to maximize the overall system throughput. Specifically, Nightjar monitors the acceptance rate of speculative tokens in real-time and uses a lightweight predictive model to forecast future acceptance rates under different candidate batch sizes. Then, Nightjar formulates the batch size selection as a utility maximization problem and selects the optimal batch size that maximizes the throughput gain. We implement Nightjar and evaluate it with various LLM serving workloads. Our experiments show that Nightjar achieves 1.19x-1.58x throughput improvement over state-of-the-art speculative decoding systems.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/02_nightjar.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 41, "added_date": "2026-03-23"}, {"title": "Spiffy: Multiplying Diffusion LLM Acceleration via Lossless Speculative Decoding", "authors": "Sudhanshu Agrawal, Risheek Garrepalli, Raghavv Goel, Mingu Lee, Christopher Lott, Fatih Porikli", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "Diffusion-based LLMs offer an alternative to autoregressive generation. Spiffy applies speculative decoding techniques to diffusion models, achieving lossless acceleration of the generation process.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/Spiffy.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 42, "added_date": "2026-03-23"}, {"title": "KV-Compress: Paged KV-Cache Compression with Variable Compression Rates per Attention Head", "authors": "Ramya Prabhu, Ajay Nayak, Jayashree Mohan, Ramachandran Ramjee, Ashish Panwar", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2024, "abstract_en": "Context lengths of Large Language Models (LLMs) have exploded in recent years, with 128k-token context becoming a standard and million-token context becoming a reality. Efficiently supporting long-context inference remains challenging as the memory that must be allocated in key-value (KV) cache grows linearly with context length.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/llm_serving_papers_2025.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 43, "added_date": "2026-03-23"}, {"title": "SpecSteer: Synergizing Local Context and Global Reasoning for Efficient Personalized Generation", "authors": "Hang Lv, Sheng Liang, Hao Wang, Yongyue Zhang, Hongchao Gu, Wei Guo, Defu Lian, Yong Liu, Enhong Chen", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "个性化生成需要结合用户的本地上下文和云端的大规模推理能力。本地设备上的模型可以快速响应，但能力有限；云端模型能力强，但延迟高。\n\n**SpecSteer** 是一个将私有设备端上下文与云端规模推理协同的框架。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/specsteer.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 45, "added_date": "2026-03-23"}, {"title": "MMSpec: Benchmarking Speculative Decoding for Vision-Language Models", "authors": "Hui Shen, Xin Wang, Ping Zhang, Yunta Hsieh, Qi Han, Zhongwei Wan, Ziheng Zhang, Jingxuan Zhang, Jing Xiong, Ziyuan Liu, Yifan Zhang, Hangrui Cao, Chenyang Zhao, Mi Zhang", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "视觉语言模型 (Vision-Language Models, VLMs) 在多模态任务上表现出色，但由于模型规模大、上下文长，推理延迟很高。\n\n投机解码 (Speculative Decoding, SD) 是一种有前景的加速方法，但现有工作主要集中在纯语言模型上，VLM上的投机解码缺乏系统研究。\n\n**MMSpec** 是第一个专门针对**视觉语言模型投机解码**的基准测试框架。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/mmspec.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 47, "added_date": "2026-03-24"}, {"title": "Pipelined Collaborative Speculative Decoding Framework for Efficient Edge-Cloud LLM Inference", "authors": "Yida Zhang, Zhiyong Gao, Shuaibing Yue, Jie Li, Rui Wang", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "边缘-云协作推理已成为平衡设备端计算能力和云端强大模型能力的重要范式。然而，如何有效平衡边缘设备的计算能力与云端能力仍是一个开放问题。\n\n**Pipelined Collaborative Speculative Decoding** 是一个高效的**边缘-云LLM推理的流水线协作投机解码框架**。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/pipelined_collaborative_sd.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 48, "added_date": "2026-03-24"}, {"title": "HeiSD: Hybrid Speculative Decoding for Embodied Vision-Language-Action Models with Kinematic Awarene", "authors": "Zihao Zheng, Zhihao Mao, Sicheng Tian, Maoliang Li, Jiayu Chen, Xinhao Sun, Zhaobo Zhang, Xuanzhe Liu, Donggang Cao, Hong Mei, Xiang Chen", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "视觉语言动作模型 (Vision-Language-Action, VLA) 已成为机器人控制的主流解决方案，但推理速度较慢。\n\n投机解码 (Speculative Decoding, SD) 是一种有前景的加速方法，可分为两类：\n- 基于draft的SD\n- 基于检索的SD\n\n现有方法未能分析VLA模型的独特优势。\n\n**HeiSD** 提出了一种**具有运动学感知的混合投机解码**方法。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/heid.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 49, "added_date": "2026-03-24"}, {"title": "DuetServe: Harmonizing Prefill and Decode for LLM Serving via Adaptive GPU Multiplexing", "authors": "Lei Gao, Chaoyi Jiang, Hossein Entezari Zarch, Daniel Wong, Murali Annavaram", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "Modern LLM serving systems struggle to balance prefill and decode workloads. DuetServe introduces adaptive GPU multiplexing to dynamically allocate resources between prefill and decode stages, improving overall system throughput and reducing latency.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/DuetServe.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 50, "added_date": "2026-03-24"}, {"title": "xLLM Technical Report", "authors": "Tongxuan Liu, Tao Peng, Peijun Yang, et al.", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "We introduce xLLM, an intelligent and efficient Large Language Model (LLM) inference framework designed for high-performance, large-scale enterprise-grade deployments. xLLM addresses the critical challenges in production LLM serving by introducing several key innovations: (1) a dynamic batching mechanism that optimizes throughput while meeting latency SLOs, (2) an intelligent prefetching system that anticipates and prepares for upcoming requests, (3) a flexible serving architecture that supports multiple deployment modes including standalone, distributed, and edge-cloud configurations, and (4) comprehensive resource management with automatic scaling and load balancing. Extensive experiments demonstrate that xLLM achieves 2-5x throughput improvement over existing open-source inference frameworks while maintaining competitive latency.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/06_xllm.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 51, "added_date": "2026-03-25"}, {"title": "SpecForge: A Flexible and Efficient Open-Source Training Framework for Speculative Decoding", "authors": "Shenggui Li, Chao Wang, Yikai Zhu, Yubo Wang, Fan Yin, Shuai Shi, Yefei Chen, Xiaomin Dong, Qiaoling Chen, Jin Pan, Ji Li, Laixin Xie, Yineng Zhang, Lei Yu, Yonggang Wen, Ivor Tsang, Tianwei Zhang", "arxiv_id": "", "github_repo": "SpecForge", "conference": "", "year": 2025, "abstract_en": "大型语言模型由于顺序自回归解码而产生高推理延迟。Speculative Decoding (投机解码) 通过使用draft模型预测多个token，然后使用target模型并行验证，是加速自回归LLM推理的一种有前景的方法。\n\n然而，现有的投机解码框架主要关注推理阶段，缺乏对draft模型训练的支持，导致部署效率受限。\n\n**SpecForge** 是一个灵活高效的**开源训练框架**，专门用于投机解码。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/specforge.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 52, "added_date": "2026-03-25"}, {"title": "TraCT: Disaggregated LLM Serving with CXL Shared Memory KV Cache at Rack-Scale", "authors": "Dongha Yoon, Younghoon Min, Hoshik Kim, Sam H. Noh, Jongryool Kim", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "Disaggregated LLM serving with CXL shared memory enables efficient KV cache sharing across GPU nodes. TraCT leverages rack-scale CXL memory to provide high-bandwidth, low-latency access to KV cache, enabling cost-effective scaling of LLM inference.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/TraCT.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 53, "added_date": "2026-03-25"}, {"title": "PCR: A Prefetch-Enhanced Cache Reuse System for Low-Latency RAG Serving", "authors": "Wenfeng Wang, Xiaofeng Hou, Peng Tang, Hengyi Zhou, Jing Wang, Xinkai Wang, Chao Li, Minyi Guo", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "检索增强生成 (Retrieval-Augmented Generation, RAG) 系统通过整合检索到的外部文档来增强大语言模型 (LLMs) 的性能，从而实现更准确和上下文感知的响应。\n\n然而，集成这些外部文档通常会导致**非常长的输入序列**，这显著增加了预填充 (prefill) 阶段的计算成本。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/pcr_rag_cache.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 54, "added_date": "2026-03-25"}, {"title": "DSD: A Distributed Speculative Decoding Solution for Edge-Cloud Agile Large Model Serving", "authors": "Fengze Yu, Leshu Li, Brad McDanel, Sai Qian Zhang", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "Large language model (LLM) inference often suffers from high latency, which limits its practical applicability in real-time applications. Speculative decoding has emerged as a promising technique to reduce inference latency by using a smaller draft model to propose candidate tokens. However, existing speculative decoding solutions are typically designed for single-machine scenarios and cannot fully exploit the potential of distributed computing resources. We present DSD, a distributed speculative decoding solution for edge-cloud agile large model serving. DSD leverages both edge devices and cloud servers to collaboratively perform speculative decoding, dynamically allocating computation based on device capabilities and network conditions. Our experiments show that DSD achieves up to 3x speedup compared to cloud-only serving while maintaining response quality.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/03_dsd.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 55, "added_date": "2026-03-25"}, {"title": "KV Admission: Learning What to Write for Efficient Long-Context Inference", "authors": "Yen-Chieh Huang, Pi-Cheng Hsiu, Rui Fang, Ming-Syan Chen", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2025, "abstract_en": "Long-context LLM inference requires efficient KV cache management. KV Admission proposes a learning-based approach to determine which tokens should be stored in the KV cache, balancing memory usage and model quality.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/KV_Admission.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 56, "added_date": "2026-03-26"}, {"title": "Accelerating OpenPangu Inference on NPU via Speculative Decoding", "authors": "Yuntao Dai, Jing Wu, Hang Gu, Teng Wang", "arxiv_id": "2603.0", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "To mitigate the Memory Wall bottleneck encountered by Large Language Models (LLMs) during inference on NPU hardware, and addressing the scarcity of native support for mainstream speculative decoding algorithms on domestic infrastructure, this study presents an end-to-end speculative inference acceleration scheme for OpenPangu-7B.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/openpangu_npu.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 57, "added_date": "2026-03-26"}, {"title": "Speculating Experts: Accelerates Inference for Mixture-of-Experts", "authors": "Vivan Madan, Prajwal Singhania, Abhinav Bhatele, Tom Goldstein, Ashwinee Panda", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "> ...per-token compute. However, in memory-constrained inference settings, expert权重必须卸载到CPU, creating a performance bottleneck from CPU-GPU transfers during decoding. We propose an expert prefetching scheme that leverages currently computed internal model representations to...", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/31_speculating_experts_moe.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 58, "added_date": "2026-03-26"}, {"title": "Not All Prefills Are Equal: PPD Disaggregation for Multi-turn LLM Serving", "authors": "Zongze Li, Jingyu Liu, Zach Xu, Yineng Zhang, Tahseen Rabbani, Ce Zhang", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Prefill-Decode (PD) disaggregation has become the standard architecture for modern LLM serving systems. However, we observe that for multi-turn LLM serving workloads, the performance is suboptimal due to the unique request pattern: each turn includes both the user input (new prefill) and the assistant history (old prefill). The old prefill is essentially a re-decode of the historical context. We propose a new architecture, PPD Disaggregation, which further disaggregates the old prefill from the new prefill in the multi-turn scenario. This allows for more efficient resource allocation and improved throughput.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/Not_All_Prefills_Are_Equal.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 59, "added_date": "2026-03-26"}, {"title": "TENT: A Declarative Slice Spraying Engine for Performant and Resilient Data Movement in Disaggregate", "authors": "Feng Ren, Ruoyu Qin, Teng Ma, Shangming Cai, Zheng Liu, Chao Lei, Dejiang Zhu, Ke Yang, Zheming Li, Jialei Cui, Weixiao Huang, Yikai Zhao, Yineng Zhang, Hao Wu, Xiang Gao, Yuhao Fu, Jinlei Jiang, Yong", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "### English\nModern LLM serving systems increasingly adopt disaggregated architectures that separate prefill and decode stages onto different GPU clusters. However, orchestrating diverse interconnects (from multi-rail RDMA to proprietary fabrics such as Multi-Node NVLink and Ascend UB) for efficient data movement across these stages remains a critical challenge. We present TENT, a declarative slice spraying engine that provides high-level abstractions for describing data movement patterns in disaggregated LLM serving. TENT enables automatic optimization of data placement and routing based on workload characteristics and network topology. Our experiments on production clusters show that TENT achieves 40% higher throughput and 3x better tail latency compared to existing approaches.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/02_tent.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 60, "added_date": "2026-03-26"}, {"title": "A Pipelined Collaborative Speculative Decoding Framework for Efficient Edge-Cloud LLM Inference", "authors": "Yida Zhang, Zhiyong Gao, Shuaibing Yue, Jie Li, Rui Wang", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Recent advancements and widespread adoption of Large Language Models (LLMs) in both industry and academia have catalyzed significant demand for efficient LLM inference systems. This paper presents a pipelined collaborative speculative decoding framework that leverages edge and cloud resources to accelerate LLM inference while maintaining quality.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/llm_serving_papers_2026.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 61, "added_date": "2026-03-27"}, {"title": "NOSA: Native and Offloadable Sparse Attention", "authors": "Yuxiang Huang, Pengjie Wang, Jicheng Han, Weilin Zhao, Zhou Su, Ao Sun, Hongya Lyu, Hengyu Zhao, Yudong Wang, Chaojun Xiao, Xu Han, Zhiyuan Liu", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Decoding throughput improvements from larger batch sizes are limited by the quadratic complexity of attention. NOSA proposes a native and offloadable sparse attention mechanism that reduces computational overhead while maintaining model quality.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/NOSA.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Attention", "id": 62, "added_date": "2026-03-27"}, {"title": "Goose: Anisotropic Speculation Trees for Training-Free Speculative Decoding", "authors": "Unknown", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "### English\nSpeculative decoding accelerates large language model inference by drafting multiple candidate tokens and verifying them in a single forward pass. Candidates are organized as a tree: deeper trees accept more tokens per step, but adding depth requires sacrificing breadth (fallback options) under a fixed verification budget. We propose Goose, which introduces anisotropic speculation trees that adapt tree structure based on local token confidence. Goose achieves better acceptance rates by allocating more candidates to high-uncertainty positions while maintaining efficiency through adaptive tree pruning. Our experiments show that Goose achieves 1.8x speedup over baseline speculative decoding without any additional training.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/04_goose.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 63, "added_date": "2026-03-27"}, {"title": "FLYING SERVING: On-the-Fly Parallelism Switching for Large Language Model Serving", "authors": "Shouwei Gao, Junqi Yin, Feiyi Wang, Wenqian Dong", "arxiv_id": "", "github_repo": "", "conference": "ACM International Conference o", "year": 2026, "abstract_en": "## 摘要 (中文)\n生产级LLM服务必须在非平稳流量和混合请求需求下同时提供高吞吐量、低延迟和足够的上下文容量。数据并行（DP）通过运行独立副本来最大化吞吐量，而张量并行（TP）减少每请求延迟并聚合内存用于长上下文推理。然而，现有服务堆栈通常在部署时静态配置并行性；适应突发、优先级或长上下文请求通常具有破坏性且缓慢。我们提出了Flying Serving，这是一个基于vLLM的系统，可以在不重启引擎 workers 的情况下实现在线DP-TP切换。Flying Serving通过虚拟化原本会强制数据移动的状态来使重新配置变得实用：(i) 零拷贝模型权重管理器，可按需暴露TP分片视图，(ii) KV Cache适配器，可在DP/TP布局之间保留请求KV状态，(iii) 积极初始化的通信器池，以分摊集体设置，以及 (iv) 无死锁调度器，在执行偏斜下协调安全转换。在三个流行的LLM和实际服务场景中，Flying Serving在高负载下将性能提升至4.79倍，在低负载下提升至3.47倍，同时支持延迟驱动和内存驱动的请求。", "abstract_cn": "## 摘要 (中文)\n生产级LLM服务必须在非平稳流量和混合请求需求下同时提供高吞吐量、低延迟和足够的上下文容量。数据并行（DP）通过运行独立副本来最大化吞吐量，而张量并行（TP）减少每请求延迟并聚合内存用于长上下文推理。然而，现有服务堆栈通常在部署时静态配置并行性；适应突发、优先级或长上下文请求通常具有破坏性且缓慢。我们提出了Flying Serving，这是一个基于vLLM的系统，可以在不重启引擎 workers 的情况下实现在线DP-TP切换。Flying Serving通过虚拟化原本会强制数据移动的状态来使重新配置变得实用：(i) 零拷贝模型权重管理器，可按需暴露TP分片视图，(ii) KV Cache适配器，可在DP/TP布局之间保留请求KV状态，(iii) 积极初始化的通信器池，以分摊集体设置，以及 (iv) 无死锁调度器，在执行偏斜下协调安全转换。在三个流行的LLM和实际服务场景中，Flying Serving在高负载下将性能提升至4.79倍，在低负载下提升至3.47倍，同时支持延迟驱动和内存驱动的请求。\n\n## 核心贡献\n1. **在线DP-TP切换**: 首次实现无需重启引擎workers的在线数据并行-张量并行切换\n2. **状态虚拟化**: 通过虚拟化模型权重和KV Cache状态避免数据移动\n3. **零拷贝权重管理**: 按需暴露TP分片视图\n\n## 技术细节\n- **基础**: 基于vLLM构建\n- **性能**: 高负载下提升4.79倍，低负载下提升3.47倍\n- **接受会议**: ACM ICS 2026", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/flying_serving_parallelism.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 64, "added_date": "2026-03-27"}, {"title": "WISP: Waste- and Interference-Suppressed Distributed Speculative LLM Serving at the Edge", "authors": "Unknown", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "## 关键词\n- Distributed Speculative Decoding\n- Edge Computing\n- SLO-Aware Batching\n- Dynamic Drafting", "abstract_cn": "## 关键词\n- Distributed Speculative Decoding\n- Edge Computing\n- SLO-Aware Batching\n- Dynamic Drafting", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/wisp_distributed_speculative_serving.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 65, "added_date": "2026-03-27"}, {"title": "AE-LLM: Adaptive Efficiency Optimization for Large Language Models", "authors": "Kaito Tanaka, Masato Ito, Yuji Nishimura, Keisuke Matsuda, Aya Nakayama", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Large Language Models (LLMs) have achieved remarkable success across diverse applications, yet their deployment remains challenging due to substantial computational costs, memory requirements, and energy consumption. Recent empirical studies have demonstrated that no single efficiency technique is universally optimal; instead, the effectiveness of methods su...\n\nLLM在各种应用取得了显著成功，但其部署仍面临计算成本、内存需求和能源消耗方面的挑战。最近的实证研究表明，没有单一的效率技术是普遍最优的。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/ae_llm_adaptive_efficiency.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 66, "added_date": "2026-03-28"}, {"title": "Speculative Decoding Scaling Laws (SDSL): Throughput Optimization Made Simple", "authors": "Unknown", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "### English\nWe present Speculative Decoding Scaling Laws (SDSL), a systematic framework for optimizing speculative decoding throughput. Unlike prior work that focuses on individual components, SDSL provides a holistic analysis of how different parameters (draft model size, number of speculation tokens, verification efficiency) affect end-to-end throughput. We derive analytical formulas that predict throughput scaling and validate them across diverse workloads. Our framework enables practitioners to make informed decisions about speculative decoding configurations without extensive experimentation.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/07_sdsl.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 67, "added_date": "2026-03-28"}, {"title": "Learning to Draft: Adaptive Speculative Decoding with Reinforcement Learning", "authors": "Jiebin Zhang, Zhenghan Yu, Liang Wang, Nan Yang, Eugene J. Yu, Zheng Li, Yifan Song, Dawei Zhu, Xingxing Zhang, Furu Wei, Sujian Li", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "### English\nSpeculative decoding accelerates LLM inference by using a draft model to propose candidate tokens. However, existing methods use fixed drafting strategies that don't adapt to different input contexts. We propose Learning to Draft (L2D), which uses reinforcement learning to train an adaptive drafting policy. L2D formulates drafting as a sequential decision-making problem and optimizes it using policy gradient methods. Our experiments show that L2D achieves 20% higher acceptance rates compared to static baselines.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/11_learning_to_draft.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 68, "added_date": "2026-03-28"}, {"title": "HillInfer: Efficient Long-Context LLM Inference on the Edge with Hierarchical KV Eviction using Smar", "authors": "He Sun, Shinan Liu, Li Li, Mingjun Xiao", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "year": 2026, "abstract_en": "Deploying Large Language Models (LLMs) on memory-constrained AI Personal Computers (AIPCs) enables low-latency, privacy-preserving AI applications. However, the massive memory footprint of long-context LLMs makes it challenging to run them on edge devices with limited GPU memory. Existing approaches either rely on expensive high-bandwidth memory (HBM) or suffer from significant performance degradation when offloading to slower storage. In this paper, we propose HillInfer, a hierarchical KV cache eviction system that leverages SmartSSD -- a novel storage device that integrates an FPGA accelerator directly beside the NAND flash dies. HillInfer performs hierarchical KV cache management: hot tokens are kept in GPU memory, warm tokens are offloaded to SmartSSD's DRAM, and cold tokens are evicted to SmartSSD's NAND flash. Our key insight is that SmartSSD's integrated FPGA can efficiently process KV cache directly in storage, filtering and retrieving only relevant tokens without数据传输瓶颈. We design a hierarchical KV eviction policy that considers token importance, recency, and access patterns to maximize cache hit rates at each level. Experimental results show that HillInfer achieves 2.1× speedup over GPU-only baselines while reducing memory consumption by 85%.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/hillinfer.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 69, "added_date": "2026-03-28"}, {"title": "Beyond Test-Time Compute Strategies: Advocating Energy-per-Token in LLM Inference", "authors": "Patrick Wilhelm, Thorsten Wittkopp, Odej Kao", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Large Language Models (LLMs) demonstrate exceptional performance across diverse tasks but come with substantial energy and computational costs, particularly in request-heavy scenarios. In many real-world applications, the full scale and capabilities of...\n\nLLM在各种任务中表现出色，但需要大量的能源和计算成本，特别是在请求密集型场景中。本文提出以\"每Token能源消耗\"作为新的优化指标。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/energy_per_token_llm_inference.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 70, "added_date": "2026-03-28"}, {"title": "Balancing Coverage and Draft Latency in Vocabulary Trimming for Faster Speculative Decoding", "authors": "Ofir Ben Shoham", "arxiv_id": "2603.0", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Speculative decoding accelerates inference for Large Language Models by using a lightweight draft model to propose candidate tokens that are verified in parallel by a larger target model. Prior work shows that the draft model often dominates speculative decoding latency, since it generates tokens sequentially and incurs high cost from its language modeling head as vocabulary size grows.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/vocab_trimming.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 71, "added_date": "2026-03-29"}, {"title": "MineDraft: A Framework for Batch Parallel Speculative Decoding", "authors": "Zhenwei Tang, Arun Verma, Zijian Zhou, Zhaoxuan Wu, Alok Prakash, Daniela Rus, Bryan Kian Hsiang Low", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "投机解码 (Speculative Decoding) 是一种通过使用draft模型预测token序列，然后由target模型验证来加速LLM推理的技术。\n\n然而，现有的投机解码框架主要针对单序列推理进行优化，无法有效处理批处理场景。\n\n**MineDraft** 是一个**批量并行投机解码框架**，专门针对批处理推理场景进行优化。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/minedraft.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 72, "added_date": "2026-03-29"}, {"title": "SJD-PAC: Accelerating Speculative Jacobi Decoding via Proactive Drafting and Adaptive Continuation", "authors": "Jialiang Kang, Han Shu, Wenshuo Li, Yingjie Zhai, Xinghao Chen", "arxiv_id": "2603.1", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Speculative Jacobi Decoding (SJD) offers a draft-model-free approach to accelerate autoregressive text-to-image synthesis. However, the high-entropy nature of visual generation yields low draft-token acceptance rates in complex regions, creating a bottleneck that severely limits overall throughput. To overcome this, we introduce SJD-PAC, an enhanced SJD framework. First, SJD-PAC employs a proactive...", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/sjd_pac.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 73, "added_date": "2026-03-29"}, {"title": "Training-free Dropout Sampling for Semantic Token Acceptance in Speculative Decoding", "authors": "Jeongtae Lee, Minjung Jo, Hyunjoon Jeong, Gunho Park, Sunghyeon Woo, Joonghoon Kim, Se Jung Kwon, Dongsoo Lee", "arxiv_id": "2602.0", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Speculative decoding accelerates large language model inference by proposing tokens with a lightweight draft model and selectively accepting them using a target model. This work introduces DropMatch, a novel approach that matches draft tokens to the predictive distribution of the target model via Monte Carlo dropout applied exclusively to the LM head, enabling sampling-based acceptance decisions.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/dropout_sampling.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 75, "added_date": "2026-03-29"}, {"title": "P-EAGLE: Parallel-Drafting EAGLE with Scalable Training", "authors": "Mude Hui, Xin Huang, Jaime Campos Salas, Yue Sun, Nathan Pemberton, Xiang Song, Ashish Khetan, George Karypis", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "## 摘要 (中文)\n推理LLM产生更长的输出，需要在长序列上训练的投机解码drafters。并行drafting——每次前向传播预测多个tokens——比顺序生成提供延迟优势，但训练复杂度随序列长度和并行位置的乘积呈二次方增长，使得长上下文训练不切实际。我们提出了P(arallel)-EAGLE，它通过可学习的共享隐藏状态将EAGLE从自回归转变为并行多token预测。为了将训练扩展到长上下文，我们开发了一个具有注意力掩码预计算和序列分区技术的框架，使梯度能够在单个序列内积累，用于并行预测训练。我们在vLLM中实现了P-EAGLE，并在GPT-OSS 120B、20B和Qwen3-Coder 30B上展示了比自回归EAGLE-3高1.10-1.36倍的加速。", "abstract_cn": "## 摘要 (中文)\n推理LLM产生更长的输出，需要在长序列上训练的投机解码drafters。并行drafting——每次前向传播预测多个tokens——比顺序生成提供延迟优势，但训练复杂度随序列长度和并行位置的乘积呈二次方增长，使得长上下文训练不切实际。我们提出了P(arallel)-EAGLE，它通过可学习的共享隐藏状态将EAGLE从自回归转变为并行多token预测。为了将训练扩展到长上下文，我们开发了一个具有注意力掩码预计算和序列分区技术的框架，使梯度能够在单个序列内积累，用于并行预测训练。我们在vLLM中实现了P-EAGLE，并在GPT-OSS 120B、20B和Qwen3-Coder 30B上展示了比自回归EAGLE-3高1.10-1.36倍的加速。\n\n## 核心贡献\n1. **并行多token预测**: 将EAGLE从自回归转变为并行多token预测\n2. **可学习共享隐藏状态**: 通过可学习的共享隐藏状态实现并行预测\n3. **长上下文训练**: 开发了注意力掩码预计算和序列分区技术，支持长上下文训练\n\n## 技术细节\n- **实现**: 在vLLM中实现\n- **性能**: 在GPT-OSS 120B、20B和Qwen3-Coder 30B上比EAGLE-3快1.10-1.36倍", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/peagle_parallel_drafting.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 76, "added_date": "2026-03-30"}, {"title": "MoE-Spec: Expert Budgeting for Efficient Speculative Decoding", "authors": "Bradley McDanel, Steven Li, Sruthikesh Surineni, Harshit Khaitan", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "## 摘要 (中文)\n投机解码通过并行验证多个draft tokens来加速大型语言模型（LLM）推理。然而，对于混合专家（MoE）模型，这种并行性引入了严重的瓶颈：大型draft树激活许多独特的专家，大大增加了内存压力，并减少了相对于自回归解码的投机解码加速。之前的方法在MoE验证变得昂贵时减少投机深度。我们提出了MoE-Spec，这是一种无需训练的验证时专家预算方法，通过在每一层强制执行固定的专家容量限制来解耦投机深度和内存成本，只加载对验证贡献最大的专家，并丢弃驱动带宽开销的很少使用的专家尾部的专家。在多个模型规模和数据集上的实验表明，与基线（EAGLE-3）相比，该方法在相同质量下提供10-30%更高的吞吐量，并且通过更严格的预算可以灵活地权衡准确性以进一步降低延迟。", "abstract_cn": "## 摘要 (中文)\n投机解码通过并行验证多个draft tokens来加速大型语言模型（LLM）推理。然而，对于混合专家（MoE）模型，这种并行性引入了严重的瓶颈：大型draft树激活许多独特的专家，大大增加了内存压力，并减少了相对于自回归解码的投机解码加速。之前的方法在MoE验证变得昂贵时减少投机深度。我们提出了MoE-Spec，这是一种无需训练的验证时专家预算方法，通过在每一层强制执行固定的专家容量限制来解耦投机深度和内存成本，只加载对验证贡献最大的专家，并丢弃驱动带宽开销的很少使用的专家尾部的专家。在多个模型规模和数据集上的实验表明，与基线（EAGLE-3）相比，该方法在相同质量下提供10-30%更高的吞吐量，并且通过更严格的预算可以灵活地权衡准确性以进一步降低延迟。\n\n## 核心贡献\n1. **专家预算机制**: 首次提出针对MoE模型的验证时专家预算方法\n2. **解耦深度和内存成本**: 通过固定专家容量限制来解耦投机深度和内存成本\n3. **无需训练**: 完全无需训练的验证时方法\n\n## 技术细节\n- **方法**: 在每层强制执行固定的专家容量限制\n- **优势**: 比EAGLE-3提供10-30%更高的吞吐量\n- **灵活性**: 可以通过更严格的预算来权衡准确性以降低延迟", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/moe_spec_expert_budgeting.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 77, "added_date": "2026-03-30"}, {"title": "Self-Speculative Decoding for LLM-based ASR with CTC Encoder Drafts", "authors": "George Saon, Samuel Thomas, Takashi Fukuda, Tohru Nagano, Avihu Dekel, Luis Lastras", "arxiv_id": "2603.1", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "We propose self-speculative decoding for speech-aware LLMs by using the CTC encoder as a draft model to accelerate auto-regressive (AR) inference and improve ASR accuracy. Our three-step procedure works as follows: (1) if the frame entropies of the CTC output distributions are below a threshold, the greedy CTC hypothesis is accepted as final; (2) otherwise, the CTC hypothesis is verified in a single...", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/self_spec_asr.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 80, "added_date": "2026-03-30"}, {"title": "Efficient LLM Serving for Agentic Workflows: A Data Systems Perspective", "authors": "(待补充)", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Agentic workflows are composed of sequences of interdependent Large Language Model (LLM) calls, and they have become a dominant workload in modern AI systems. This paper examines LLM serving from a data systems perspective, focusing on the unique challenges posed by agentic workflows.\n\n智能体工作负载由相互依赖的LLM调用序列组成，已成为现代AI系统中的主导工作负载。本文从数据系统角度研究LLM服务，重点关注智能体工作负载带来的独特挑战。", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/llm_serving_agentic_workflows.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 81, "added_date": "2026-03-31"}, {"title": "SJD-VP: Speculative Jacobi Decoding with Verification Prediction for Autoregressive Image Generation", "authors": "Bingqi Shan, Baoquan Zhang, Xiaochen Qi, Xutao Li, Yunming Ye, Liqiang Nie", "arxiv_id": "2603.1", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Speculative Jacobi Decoding (SJD) has emerged as a promising method for accelerating autoregressive image generation. Despite its potential, existing SJD approaches often suffer from the low acceptance rate issue of speculative tokens due to token selection ambiguity. Recent works attempt to mitigate this issue primarily from the relaxed token verification perspective but fail to fully exploit the...", "abstract_cn": "", "intro_en": "Speculative Jacobi Decoding represents a novel approach to accelerating the inference process of autoregressive image generation models. By simultaneously proposing multiple tokens for verification, it aims to reduce the sequential bottleneck inherent in autoregressive generation.", "intro_cn": "", "file": "./arxiv/2026/sjd_vp.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 82, "added_date": "2026-03-31"}, {"title": "DualPath: Breaking the Storage Bandwidth Bottleneck in Agentic LLM Inference", "authors": "Yongtong Wu, Shaoyuan Chen, Yinmin Zhong, Rilin Huang, Yixuan Tan, Wentao Zhang, Liyue Zhang, Shangyan Zhou, Yuxuan Liu, Shunfeng Zhou, Mingxing Zhang, Xin Jin, Panpan Huang", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "## 摘要 (中文)\n多轮、agentic LLM推理的性能越来越受KV-Cache存储I/O而非计算支配。在流行的解聚架构中，从外部存储加载大量KV-Cache造成了一个根本的不平衡：预填充引擎上的存储NIC变得带宽饱和，而解码引擎上的存储NIC却保持空闲。这种不对称性严重限制了整体系统吞吐量。我们提出了DualPath，这是一种通过引入双路径KV-Cache加载来打破这一瓶颈的推理系统。除了传统的存储到预填充路径，DualPath还启用了一种新颖的存储到解码路径，在该路径中，KV-Cache被加载到解码引擎，然后通过计算网络上的RDMA高效传输到预填充引擎。DualPath将这种优化的数据路径（本质上避免网络拥塞并避免与延迟关键模型执行通信的干扰）与全局调度器相结合，全局调度器动态平衡预填充和解码引擎之间的负载。我们在对三个具有生产agentic工作负载的模型进行评估表明，DualPath在内部推理系统上将离线推理吞吐量提高了1.87倍。它还可以在不违反SLO的情况下将在线服务吞吐量平均提高1.96倍。", "abstract_cn": "## 摘要 (中文)\n多轮、agentic LLM推理的性能越来越受KV-Cache存储I/O而非计算支配。在流行的解聚架构中，从外部存储加载大量KV-Cache造成了一个根本的不平衡：预填充引擎上的存储NIC变得带宽饱和，而解码引擎上的存储NIC却保持空闲。这种不对称性严重限制了整体系统吞吐量。我们提出了DualPath，这是一种通过引入双路径KV-Cache加载来打破这一瓶颈的推理系统。除了传统的存储到预填充路径，DualPath还启用了一种新颖的存储到解码路径，在该路径中，KV-Cache被加载到解码引擎，然后通过计算网络上的RDMA高效传输到预填充引擎。DualPath将这种优化的数据路径（本质上避免网络拥塞并避免与延迟关键模型执行通信的干扰）与全局调度器相结合，全局调度器动态平衡预填充和解码引擎之间的负载。我们在对三个具有生产agentic工作负载的模型进行评估表明，DualPath在内部推理系统上将离线推理吞吐量提高了1.87倍。它还可以在不违反SLO的情况下将在线服务吞吐量平均提高1.96倍。\n\n## 核心贡献\n1. **双路径KV-Cache加载**: 首次引入存储到解码路径，缓解预填充引擎的带宽瓶颈\n2. **RDMA传输**: 通过RDMA高效传输KV-Cache\n3. **全局调度器**: 动态平衡预填充和解码引擎之间的负载\n\n## 技术细节\n- **性能**: 离线推理吞吐量提升1.87倍，在线服务吞吐量平均提升1.96倍\n- **架构**: 解聚式架构中的双路径设计", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/dualpath_storage_bandwidth.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "LLM Serving", "id": 83, "added_date": "2026-03-31"}, {"title": "When RL Meets Adaptive Speculative Training: A Unified Training-Serving System", "authors": "Junxiong Wang, Fengxiang Bie, Jisen Li, et al.", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "Speculative decoding has emerged as a prominent technique for accelerating large language model (LLM) inference. However, existing works primarily focus on optimizing inference efficiency, overlooking the potential of integrating training and serving. Moreover, the training of speculative decoding models often requires substantial computational resources and time. In this paper, we present an Adaptive Speculative Training (AST) framework that integrates training and serving by dynamically adjusting the training objectives based on inference performance. Specifically, AST utilizes an online feedback mechanism to continuously monitor the inference quality and acceptance rate, and adaptively modifies the training objective to enhance the draft model's capability. We also propose an efficient model update strategy that minimizes the performance degradation during training-serving co-optimization. Experimental results demonstrate that AST achieves significant improvements in both training efficiency and inference throughput.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/03_ast.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 84, "added_date": "2026-03-31"}, {"title": "EAGLE-Pangu: Accelerator-Safe Tree Speculative Decoding on Ascend NPUs", "authors": "Chang Han, Yijie Hu, Jingling Liu", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "### English\nAutoregressive decoding remains a primary bottleneck in large language model (LLM) serving, motivating the adoption of speculative decoding techniques. However, most existing speculative decoding methods are designed for GPUs and don't fully utilize the unique characteristics of NPUs (Neural Processing Units). We present EAGLE-Pangu, a tree speculative decoding framework specifically optimized for Huawei Ascend NPUs. EAGLE-Pangu leverages NPU-specific features like efficient tree traversal hardware and dedicated attention kernels to achieve optimal performance. Our implementation achieves 2.3x speedup on Ascend NPUs while maintaining output quality.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/09_eagle_pangu.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Speculative Decoding", "id": 85, "added_date": "2026-03-31"}, {"title": "ConsRoute: Consistency-Aware Adaptive Query Routing for Cloud-Edge-Device LLMs", "authors": "Haoyu Qiao, Hao Zhang, Shanwen Mao, Siyao (待完善)", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "> Large Language Models (LLMs) are equipped with profound semantic knowledge, making them a natural choice for injecting semantic generalization into personalized search systems...", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/35_consroute.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "Edge-Cloud", "id": 86, "added_date": "2026-04-01"}, {"title": "RelayCaching: Accelerating LLM Collaboration via Decoding KV Cache Reuse", "authors": "Yingsheng Geng, Yuchong Gao, Weihong Wu, Guyue Liu, Jiang Liu", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "The increasing complexity of AI tasks has shifted the paradigm from monolithic models toward multi-agent large language model (LLM) systems. However, these collaborative architectures introduce a critical bottleneck: redundant prefill computation for shared content generated by previous agents, which significantly increases KV cache memory usage and time-to-first-token (TTFT). While various KV cache methods have been proposed to mitigate prefill redundancy, they either fail to maintain accuracy on agent-generated outputs or exhibit low reuse rates due to rigid constraints. We present RelayCaching, a training-free inference method that directly reuses decoding phase KV caches from previous agents in subsequent prefill phases. Our key insight is that KV caches for identical content are highly consistent across phases, while prefix-induced deviations are sparse and localized within a limited range of layers and token positions. By selectively recomputing KV caches at these positions, RelayCaching preserves model accuracy with minimal overhead, yielding a superior accuracy-efficiency trade-off over existing methods. Experiments on diverse collaborative LLM tasks spanning mathematical reasoning, general knowledge, and code generation demonstrate that RelayCaching achieves over 80% KV cache reuse, reduces TTFT by up to 4.7× compared to the standard pipeline, all with negligible accuracy degradation.", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/29_relaycaching.md", "has_content": true, "is_placeholder_arxiv": false, "is_github_project": false, "topic": "KV Cache", "id": 88, "added_date": "2026-04-01"}, {"title": "Characterizing CPU-Induced Slowdowns in Multi-GPU LLM Inference", "authors": "Euijun Chung, Yuxiao Jia, Aaron Jezghani, Hyesoon Kim", "arxiv_id": "", "github_repo": "", "conference": "", "year": 2026, "abstract_en": "> ...increasingly rely on multi-GPU systems, yet their performance is often limited by an overlooked component: the CPU. Through a detailed study of modern large language model (LLM)...", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/33_cpu_slowdowns_multigpu.md", "has_content": true, "is_placeholder_arxiv": fals
