<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>LLM Serving Papers</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:#f0f2f5;margin:0}

.topbar{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:200}
.topbar-row{display:flex;justify-content:space-between;align-items:center}
.topbar h1{margin:0;font-size:18px;font-weight:700}
.topbar-actions{display:flex;gap:8px}
.topbar-btn{padding:6px 12px;background:rgba(255,255,255,.15);border:none;border-radius:8px;color:#fff;font-size:12px;cursor:pointer}
.stats-row{display:flex;gap:12px;margin-top:12px}
.stat-item{text-align:center;flex:1}
.stat-num{font-size:20px;font-weight:800}
.stat-label{font-size:10px;opacity:.8}

.filterbar{background:#fff;padding:10px 15px;position:sticky;top:70px;z-index:150;border-bottom:1px solid #e8e8e8}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.filter-row::-webkit-scrollbar{display:none}
.fchip{padding:7px 14px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer;background:#f0f0f0;color:#555;flex-shrink:0;transition:.15s}
.fchip.on{background:#007AFF;color:#fff}
.fchip.time-new{border:2px solid #FF6B35;color:#FF6B35;background:#fff3e8}
.fchip.time-new.on{background:#FF6B35;color:#fff}
.fchip.fav-chip{border:2px solid #E91E63;color:#E91E63;background:#fce4ec}
.fchip.fav-chip.on{background:#E91E63;color:#fff}

.search{padding:10px 15px;background:#fff;border-bottom:1px solid #eee}
.search input{width:100%;padding:10px 14px;border:none;border-radius:10px;background:#f5f5f5;font-size:15px}

.plist{padding:12px 15px}
.group-label{display:flex;align-items:center;gap:8px;margin:18px 0 10px;padding:6px 0;border-bottom:2px solid #ddd;font-size:13px;font-weight:700;color:#333}
.badge-new{background:#FF6B35;color:#fff;padding:2px 8px;border-radius:8px;font-size:11px}
.badge-recent{background:#FFB800;color:#fff;padding:2px 8px;border-radius:8px;font-size:11px}
.badge-old{background:#aaa;color:#fff;padding:2px 8px;border-radius:8px;font-size:11px}

.pcard{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);position:relative}
.pcard-unread{border-left:4px solid #FF6B35;background:#fff9f4}
.pcard-read{border-left:4px solid #34C759;opacity:.65}
.pcard-fav{border-left:4px solid #E91E63;background:#fce4ec5a}
.pcard-newtag{position:absolute;top:-1px;right:12px;background:#FF6B35;color:#fff;font-size:10px;padding:2px 8px;border-radius:8px 8px 0 0;font-weight:700}

.pcard-top{display:flex;justify-content:space-between;align-items:start;gap:8px}
.pcard-title{font-size:14px;font-weight:600;color:#1a1a1a;line-height:1.45;flex:1}
.pcard-actions{display:flex;gap:4px}
.pcard-btn{font-size:18px;cursor:pointer;padding:4px;line-height:1}
.pcard-auth{font-size:11px;color:#999;margin:6px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-tags{display:flex;gap:5px;flex-wrap:wrap}
.ptag{padding:2px 8px;border-radius:8px;font-size:10px}
.ptag-c{background:#e8f4ff;color:#007AFF}
.ptag-t{background:#f0f0f0;color:#888}
.ptag-u{background:#FF6B35;color:#fff;font-weight:600}
.ptag-r{background:#34C759;color:#fff}
.ptag-f{background:#E91E63;color:#fff;font-weight:600}

.pcard-foot{display:flex;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid #f0f0f0}
.pcard-foot a{font-size:12px;color:#007AFF;text-decoration:none;font-weight:500}
.pcard-abs-btn{padding:6px 10px;background:#f5f5f5;border:none;border-radius:6px;font-size:11px;color:#888;cursor:pointer;margin-top:8px}
.pcard-abs{display:none;margin-top:10px;font-size:12px;line-height:1.6;color:#555}
.pcard-abs.show{display:block}

.detail{display:none;min-height:100vh;background:#f0f2f5}
.detail.on{display:block}
.det-head{background:#fff;padding:18px 20px;border-bottom:1px solid #eee}
.det-back{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:#007AFF;cursor:pointer;margin-bottom:12px;font-weight:500}
.det-title{font-size:18px;font-weight:700;color:#1a1a1a;line-height:1.4;margin:0 0 8px}
.det-auth{font-size:13px;color:#888;margin-bottom:10px}
.det-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.det-links{display:flex;gap:12px}
.det-links a{font-size:14px;color:#007AFF;text-decoration:none;font-weight:600}
.det-fav{font-size:18px;cursor:pointer;margin-left:10px}
.det-body{background:#fff;margin:12px 15px;padding:20px;border-radius:14px}
.det-body h3{font-size:14px;color:#007AFF;margin:24px 0 12px;padding-bottom:6px;border-bottom:1px solid #e8f4ff}
.det-body h3:first-child{margin-top:0}
.det-body p{font-size:14px;line-height:1.8;color:#333;margin:0 0 16px}
.empty{text-align:center;padding:60px 20px;color:#aaa;font-size:14px}
</style>
</head>
<body>

<div class="topbar">
<div class="topbar-row">
<h1>📚 LLM Serving 论文库</h1>
<div class="topbar-actions">
<button class="topbar-btn" onclick="markAllRead()">全部已读</button>
<button class="topbar-btn" onclick="resetRead()">重置</button>
</div>
</div>
<div class="stats-row">
<div class="stat-item"><div class="stat-num" id="sTotal">-</div><div class="stat-label">总计</div></div>
<div class="stat-item"><div class="stat-num" id="sNew" style="color:#FF6B35">-</div><div class="stat-label">未读</div></div>
<div class="stat-item"><div class="stat-num" id="sRead" style="color:#34C759">-</div><div class="stat-label">已读</div></div>
<div class="stat-item"><div class="stat-num" id="sFav" style="color:#E91E63">-</div><div class="stat-label">收藏</div></div>
</div>
</div>

<div class="filterbar">
<div class="filter-row" id="fRow">
<div class="fchip on" data-f="all">全部</div>
<div class="fchip time-new" data-f="unread">未读 🆕</div>
<div class="fchip" data-f="read">已读 ✅</div>
<div class="fchip fav-chip" data-f="fav">⭐ 收藏</div>
</div>
<div class="filter-row" id="topicRow"></div>
</div>

<div class="search">
<input type="text" id="searchI" placeholder="搜索标题、作者、关键词...">
</div>

<div class="plist" id="plist"></div>

<div class="detail" id="det">
<div class="det-head">
<div class="det-back" onclick="back()">← 返回列表</div>
<div style="display:flex;align-items:center;gap:8px">
<div id="detTitle" class="det-title" style="flex:1"></div>
<span id="detFav" class="det-fav" onclick="togF(currentDetId)"></span>
</div>
<div id="detAuth" class="det-auth"></div>
<div id="detTags" class="det-tags"></div>
<div id="detLinks" class="det-links"></div>
</div>
<div id="detBody" class="det-body"></div>
</div>

<script>
const P=' + papers_json + ';
const topics=' + topics_json + ';
let readSet=new Set(JSON.parse(localStorage.getItem('rp_read')||'[]'));
let favSet=new Set(JSON.parse(localStorage.getItem('rp_fav')||'[]'));
let curFilter='all',curTopic='',curSearch='',currentDetId=null;

function isR(id){return readSet.has(id)}
function isF(id){return favSet.has(id)}
function togR(id){isR(id)?readSet.delete(id):readSet.add(id);localStorage.setItem('rp_read',JSON.stringify([...readSet]));render()}
function togF(id){isF(id)?favSet.delete(id):favSet.add(id);localStorage.setItem('rp_fav',JSON.stringify([...favSet]));render()}
function markAllRead(){P.forEach(p=>readSet.add(p.id));localStorage.setItem('rp_read',JSON.stringify([...readSet]));render()}
function resetRead(){readSet.clear();localStorage.setItem('rp_read','[]');render()}

function getDate(p){return p.added_date||'2026-03-15'}
function daysAgo(d){const t=new Date(),p=new Date(d);return Math.floor((t-p)/86400000)}

function initTopics(){
const row=document.getElementById('topicRow');
topics.forEach(t=>{const c=document.createElement('div');c.className='fchip';c.dataset.topic=t;c.textContent=t;c.onclick=()=>{curTopic=curTopic===t?'':t;row.querySelectorAll('.fchip').forEach(x=>x.classList.toggle('on',x.dataset.topic===curTopic));render()};row.appendChild(c)})
}

function render(){
const list=document.getElementById('plist');
const search=curSearch.toLowerCase();

let filtered=P.filter(p=>{
const read=isR(p.id),fav=isF(p.id),age=daysAgo(getDate(p));
let mf=curFilter==='all'||(curFilter==='unread'&&!read)||(curFilter==='read'&&read)||(curFilter==='fav'&&fav);
let mt=!curTopic||p.topic===curTopic;
let ms=!search||(p.title||'').toLowerCase().includes(search)||(p.authors||'').toLowerCase().includes(search)||(p.topic||'').toLowerCase().includes(search);
return mf&&mt&&ms;
});

document.getElementById('sTotal').textContent=P.length;
document.getElementById('sNew').textContent=P.filter(p=>!isR(p.id)).length;
document.getElementById('sRead').textContent=P.filter(p=>isR(p.id)).length;
document.getElementById('sFav').textContent=P.filter(p=>isF(p.id)).length;

if(!filtered.length){list.innerHTML='<div class="empty">📭 没有匹配的论文</div>';return}

const groups={};
filtered.sort((a,b)=>daysAgo(getDate(b))-daysAgo(getDate(a)));
filtered.forEach(p=>{
const age=daysAgo(getDate(p));
let label=age<=0?'0|今天新增':age===1?'1|昨天新增':age<=7?'2|最近7天':'3|更早';
if(!groups[label])groups[label]=[];
groups[label].push(p);
});

const order=['0|今天新增','1|昨天新增','2|最近7天','3|更早'];
let html='';
order.forEach(key=>{
if(!groups[key])return;
const parts=key.split('|');
const badgeClass=parts[0]=='0'?'badge-new':parts[0]=='1'?'badge-recent':'badge-old';
html+='<div class="group-label"><span>'+parts[1]+'</span><span class="'+badgeClass+'">'+groups[key].length+'篇</span></div>';
groups[key].forEach(p=>{
const read=isR(p.id),fav=isF(p.id),age=daysAgo(getDate(p)),isNew=age<=1&&!read;
let cardClass='pcard ';
if(fav)cardClass+='pcard-fav ';
else if(read)cardClass+='pcard-read ';
else cardClass+='pcard-unread ';
html+='<div class="'+cardClass+'">'
+(isNew?'<div class="pcard-newtag">NEW</div>':'')
+'<div class="pcard-top"><div class="pcard-title">'+(p.title||'Untitled')+'</div><div class="pcard-actions"><span class="pcard-btn" onclick="togF('+p.id+')">'+(fav?'⭐':'☆')+'</span><span class="pcard-btn" onclick="togR('+p.id+')">'+(read?'✅':'⭕')+'</span></div></div>'
+'<div class="pcard-auth">'+(p.authors||'')+'</div>'
+'<div class="pcard-tags"><span class="ptag ptag-c">'+(p.conference||'arXiv')+'</span><span class="ptag ptag-t">'+(p.topic||'')+'</span>'
+(fav?'<span class="ptag ptag-f">已收藏</span>':'')
+(!read?'<span class="ptag ptag-u">未读</span>':'')
+(read&&!fav?'<span class="ptag ptag-r">已读</span>':'')
+'</div>'
+'<div class="pcard-foot">'
+(p.arxiv_id?'<a href="https://arxiv.org/abs/'+p.arxiv_id+'" target="_blank">📄 arXiv</a>':'')
+(p.github_repo?'<a href="https://github.com/'+p.github_repo+'" target="_blank">🐙 GitHub</a>':'')
+'<a href="javascript:void(0)" onclick="openDet('+p.id+')">📖 详情 →</a>'
+'</div>'
+((p.abstract_en||p.abstract_cn)?'<button class="pcard-abs-btn" onclick="togAbs('+p.id+',this)">展开摘要</button><div class="pcard-abs" id="abs-'+p.id+'">'
+(p.abstract_en?'<b>Abstract:</b> '+p.abstract_en.substring(0,400)+'...':'')
+(p.abstract_cn?'<br><b>摘要:</b> '+p.abstract_cn.substring(0,300)+'...':'')
+'</div>':'')
+'</div>';
});
});
list.innerHTML=html;
}

function togAbs(id,btn){
const el=document.getElementById('abs-'+id);
if(el.classList.contains('show')){el.classList.remove('show');btn.textContent='展开摘要'}
else{el.classList.add('show');btn.textContent='收起摘要'}
}

function openDet(id){
const p=P.find(x=>x.id===id);if(!p)return;
currentDetId=id;
document.getElementById('plist').style.display='none';
document.querySelector('.filterbar').style.display='none';
document.querySelector('.search').style.display='none';
document.getElementById('det').classList.add('on');
document.getElementById('detTitle').textContent=p.title||'';
document.getElementById('detFav').textContent=isF(id)?'⭐':'☆';
document.getElementById('detAuth').textContent=p.authors||'';
document.getElementById('detTags').innerHTML='<span class="ptag ptag-c">'+(p.conference||'arXiv')+'</span><span class="ptag ptag-t">'+(p.topic||'')+'</span>'+((isF(id))?'<span class="ptag ptag-f">已收藏</span>':'');
let links='';
if(p.arxiv_id)links+='<a href="https://arxiv.org/abs/'+p.arxiv_id+'" target="_blank">📄 arXiv</a>';
if(p.github_repo)links+='<a href="https://github.com/'+p.github_repo+'" target="_blank">🐙 GitHub</a>';
document.getElementById('detLinks').innerHTML=links;
let body='';
if(p.abstract_en)body+='<h3>Abstract</h3><p>'+p.abstract_en+'</p>';
if(p.abstract_cn)body+='<h3>摘要</h3><p>'+p.abstract_cn+'</p>';
if(p.intro_en)body+='<h3>1. Introduction</h3><p>'+p.intro_en+'</p>';
if(!body)body='<div class="empty">暂无详细内容</div>';
document.getElementById('detBody').innerHTML=body;
if(!isR(id))togR(id);
window.scrollTo(0,0);
}

function back(){
document.getElementById('det').classList.remove('on');
document.getElementById('plist').style.display='block';
document.querySelector('.filterbar').style.display='flex';
document.querySelector('.search').style.display='block';
currentDetId=null;
}

document.getElementById('fRow').querySelectorAll('.fchip').forEach(c=>{
c.onclick=()=>{curFilter=c.dataset.f;document.getElementById('fRow').querySelectorAll('.fchip').forEach(x=>x.classList.toggle('on',x.dataset.f===curFilter));render()}
});

document.getElementById('searchI').addEventListener('input',e=>{curSearch=e.target.value;render()});

initTopics();render();
</script>
</body>
</html>
