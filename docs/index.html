his CPU-centric design introduces overhead that limits achievable throughput, especially at high batch sizes.", "intro_cn": "当前的LLM服务系统（如vLLM和TensorRT-LLM）依赖CPU执行关键协调任务，包括请求调度、KV缓存管理和GPU间通信。这种以CPU为中心的设计引入了限制可达到吞吐量的开销，特别是在高批量大小下。", "file": "41_blink.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-24"}, {"id": 205, "title": "Fast Heterogeneous Serving: Scalable Mixed-Scale LLM Allocation for SLO-Constrained Inference", "authors": "Jiaming Cheng, Duong Tung Nguyen", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Multi-Model Serving", "abstract_en": "Deploying large language model (LLM) services in heterogeneous GPU clusters presents significant challenges in model allocation and resource management. Different GPU types have varying memory capacities and compute capabilities, making it difficult to serve multiple LLM models while satisfying Service Level Objectives (SLOs). We propose a mixed-scale allocation framework that optimally distributes LLM models across heterogeneous GPUs, balancing SLO compliance with resource efficiency.", "abstract_cn": "在异构GPU集群中部署大语言模型服务面临模型分配和资源管理的重大挑战。不同GPU类型具有不同的内存容量和计算能力，使得在满足服务级别目标（SLO）的同时服务多个LLM模型变得困难。我们提出了一种混合尺度分配框架，在异构GPU之间最优分配LLM模型，平衡SLO合规性和资源效率。", "intro_en": "Modern LLM serving clusters increasingly comprise heterogeneous GPU hardware, ranging from high-end A100/H100 GPUs to more cost-effective alternatives. Efficiently serving multiple LLM models across such mixed infrastructure requires careful consideration of each model's resource requirements and each GPU's capabilities.", "intro_cn": "现代LLM服务集群越来越多地包含异构GPU硬件，从高端A100/H100 GPU到更经济的替代方案。在这种混合基础设施上高效服务多个LLM模型需要仔细考虑每个模型的资源需求和每个GPU的能力。", "file": "42_fast_heterogeneous_serving.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-24"}, {"id": 206, "title": "InfiniLoRA: Disaggregated Multi-LoRA Serving for Large Language Models", "authors": "Hongyu Chen, Letian Ruan, Zilin Xu, Yuchen Li, Xinyu Chen, Jingwen Leng, Bingsheng He, Minyi Guo, Shixuan Sun", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Disaggregated Serving", "abstract_en": "LoRA enables efficient customization of LLMs and is widely used in multi-tenant and multi-task serving scenarios. However, serving many LoRA adapters simultaneously introduces significant memory and scheduling challenges. We present InfiniLoRA, a disaggregated serving architecture that separates LoRA adapter storage from the base model computation, enabling elastic scaling of adapter capacity and efficient batching across heterogeneous adapters.", "abstract_cn": "LoRA实现了LLM的高效定制，广泛应用于多租户和多任务服务场景。然而，同时服务许多LoRA适配器引入了显著的内存和调度挑战。我们提出了InfiniLoRA，一种分离式服务架构，将LoRA适配器存储与基础模型计算分离，实现了适配器容量的弹性扩展和异构适配器之间的高效批处理。", "intro_en": "Multi-LoRA serving has become essential for LLM deployment platforms that need to support thousands of customized adapters. Current approaches face memory pressure from storing all adapters and scheduling overhead from managing diverse adapter configurations.", "intro_cn": "多LoRA服务已成为需要支持数千个定制适配器的LLM部署平台的关键。当前方法面临存储所有适配器的内存压力和管理多样适配器配置的调度开销。", "file": "43_infinilora.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-25"}, {"id": 207, "title": "Autopoiesis: A Self-Evolving System Paradigm for LLM Serving Under Runtime Dynamics", "authors": "Youhe Jiang, Ran Yan, You Peng, Wenshuang Li, Taiyi Wang, Fangcheng Fu, Binhang Yuan", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "LLM Serving", "abstract_en": "Modern Large Language Model (LLM) serving systems face highly dynamic runtime conditions including fluctuating request rates, varying input lengths, and changing hardware availability. Existing systems rely on static or manually-tuned configurations that fail to adapt. We present Autopoiesis, a self-evolving system paradigm that continuously adapts its scheduling strategies, resource allocation, and parallelism configurations based on real-time runtime observations, achieving consistent high performance across diverse dynamic conditions.", "abstract_cn": "现代大语言模型服务系统面临高度动态的运行时条件，包括波动的请求率、变化的输入长度和变化的硬件可用性。现有系统依赖静态或手动调整的配置，无法适应。我们提出了Autopoiesis，一种自进化系统范式，根据实时运行时观察持续适应其调度策略、资源分配和并行配置，在各种动态条件下实现一致的高性能。", "intro_en": "LLM serving systems operate in environments that are inherently dynamic—request patterns shift throughout the day, input characteristics vary across applications, and hardware conditions change due to maintenance or scaling events. Static serving configurations inevitably lead to suboptimal performance under such dynamics.", "intro_cn": "LLM服务系统在本质上动态的环境中运行——请求模式在一天中变化，输入特征在不同应用间变化，硬件条件因维护或扩展事件而改变。静态服务配置在这种动态下不可避免地导致次优性能。", "file": "44_autopoiesis.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-25"}, {"id": 208, "title": "Foundry: Template-Based CUDA Graph Context Materialization for Fast LLM Serving Cold Start", "authors": "Xueshen Liu, Yongji Wu, Yuncheng Yao, Danyang Zhuo, Ion Stoica, Z. Morley Mao", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "LLM Serving", "abstract_en": "Modern LLM service providers increasingly rely on autoscaling and parallelism reconfiguration to respond to rapidly changing workloads, but cold-start latency remains a critical bottleneck. CUDA graph capture, which enables fast kernel dispatch, requires significant setup time that delays new instance readiness. We present Foundry, a template-based approach that pre-materializes CUDA graph contexts for common configurations, enabling near-instant cold starts when deploying new LLM serving instances.", "abstract_cn": "现代LLM服务提供商越来越依赖自动扩展和并行重配置来响应快速变化的工作负载，但冷启动延迟仍然是关键瓶颈。CUDA图捕获（实现快速内核调度）需要大量设置时间，延迟了新实例的启动。我们提出了Foundry，一种基于模板的方法，预先为常见配置物化CUDA图上下文，在部署新LLM服务实例时实现近乎即时的冷启动。", "intro_en": "The shift to autoscaling in LLM serving means new instances are frequently spun up and torn down. Each cold start involves model loading, memory allocation, and CUDA graph capture—operations that can take minutes. Foundry addresses this by pre-building reusable CUDA graph templates.", "intro_cn": "LLM服务向自动扩展的转变意味着新实例频繁启动和关闭。每次冷启动涉及模型加载、内存分配和CUDA图捕获——这些操作可能需要数分钟。Foundry通过预先构建可重用的CUDA图模板来解决这个问题。", "file": "45_foundry.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-25"}, {"id": 209, "title": "Dual-Pool Token-Budget Routing for Cost-Efficient and Reliable LLM Serving", "authors": "Xunzhuo Liu, Bowei He, Xue Liu, Andy Luo, Haichen Zhang, Huamin Chen", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Scheduling", "abstract_en": "Existing LLM serving systems typically configure each instance for worst-case context length, leading to substantial KV-cache over-allocation and under-utilized concurrency. In practice, 80-95% of requests are short, yet are served under configurations optimized for long contexts, wasting 4-8x throughput capacity and triggering reliability issues. We propose Dual-Pool, a token-budget routing system that maintains separate serving pools for short and long contexts, enabling cost-efficient and reliable LLM serving.", "abstract_cn": "现有LLM服务系统通常为最坏情况的上下文长度配置每个实例，导致大量KV缓存过度分配和并发利用率不足。实际上，80-95%的请求是短请求，却在为长上下文优化的配置下服务，浪费4-8倍吞吐量容量并引发可靠性问题。我们提出了Dual-Pool，一个token预算路由系统，为短和长上下文维护分离的服务池，实现成本高效和可靠的LLM服务。", "intro_en": "The mismatch between typical request lengths and worst-case-oriented configurations creates enormous inefficiency in LLM serving. Short requests suffer from unnecessary resource reservation while the system struggles to handle occasional long requests.", "intro_cn": "典型请求长度与面向最坏情况配置之间的不匹配在LLM服务中造成了巨大效率损失。短请求遭受不必要的资源预留，而系统难以处理偶尔的长请求。", "file": "46_dual_pool_token_budget_routing.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-25"}, {"id": 210, "title": "Token-Budget-Aware Pool Routing for Cost-Efficient LLM Inference", "authors": "Huamin Chen, Xunzhuo Liu, Junchen Jiang, Bowei He, Xue Liu", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Scheduling", "abstract_en": "We present token-budget routing, a simple yet effective approach that reduces GPU costs for LLM inference by routing requests to appropriately-sized serving pools. Our theoretical analysis shows that GPU savings follow the formula alpha * (1 - 1/rho), predicting fleet-level GPU savings from two observable quantities: the short-traffic fraction alpha and the throughput gain ratio rho. On traces from the Azure LLM Inference Dataset and LMSYS-Chat-1M serving Llama-3-70B on A100 GPUs, token-budget routing reduces GPU costs significantly.", "abstract_cn": "我们提出了token预算路由，一种简单而有效的方法，通过将请求路由到适当大小的服务池来降低LLM推理的GPU成本。我们的理论分析表明，GPU节省遵循公式alpha * (1 - 1/rho)，从两个可观测量预测舰队级GPU节省：短流量比例alpha和吞吐量增益比率rho。在Azure LLM推理数据集和LMSYS-Chat-1M的追踪数据上，使用A100 GPU服务Llama-3-70B，token预算路由显著降低了GPU成本。", "intro_en": "LLM inference costs are dominated by GPU resources, and the current practice of provisioning for worst-case scenarios leads to massive waste. Most requests are short but are served on instances sized for the longest possible context.", "intro_cn": "LLM推理成本主要由GPU资源主导，当前为最坏情况配置的做法导致大量浪费。大多数请求是短请求，却在为最长可能上下文大小的实例上服务。", "file": "47_token_budget_aware_pool_routin.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-25"}, {"id": 211, "title": "Rocks Pebbles and Sand: Modality-aware Scheduling for Multimodal Large Language Model Inference", "authors": "Konstantinos Papaioannou, Thaleia Dimitra Doudali", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Scheduling", "abstract_en": "Multimodal Large Language Models (MLLMs) power platforms like ChatGPT, Gemini, and Copilot, enabling richer interactions with text, images, and videos. These heterogeneous workloads introduce additional inference stages, such as vision preprocessing and encoding, that inflate latency and memory demand. Existing scheduling policies treat all requests uniformly, ignoring modality-specific resource requirements. We propose a modality-aware scheduling approach inspired by the rocks-pebbles-sand metaphor that prioritizes scheduling decisions based on modality-specific resource profiles.", "abstract_cn": "多模态大语言模型驱动ChatGPT、Gemini和Copilot等平台，实现与文本、图像和视频的更丰富交互。这些异构工作负载引入了额外的推理阶段，如视觉预处理和编码，增加了延迟和内存需求。现有调度策略统一处理所有请求，忽略了模态特定的资源需求。我们提出了一种受岩石-卵石-沙子隐喻启发的模态感知调度方法，基于模态特定的资源特征优先排序调度决策。", "intro_en": "The rise of multimodal LLMs creates fundamentally different scheduling challenges compared to text-only models. Vision encoders and image processors add CPU-intensive preprocessing stages that existing GPU-centric schedulers overlook.", "intro_cn": "多模态LLM的兴起创造了与纯文本模型根本不同的调度挑战。视觉编码器和图像处理器增加了CPU密集的预处理阶段，现有以GPU为中心的调度器忽视了这些。", "file": "48_rocks_pebbles_and_sand.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-26"}, {"id": 212, "title": "CSAttention: Centroid-Scoring Attention for Accelerating LLM Inference", "authors": "Chuxu Song, Zhencan Peng, Jiuqi Wei, Chuanhui Yang", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Attention", "abstract_en": "Long-context LLMs increasingly rely on extended, reusable prefill prompts for agents and domain Q&A, pushing attention and KV-cache to become the dominant decode-time bottlenecks. While sparse attention reduces computation and transfer costs, it often struggles to maintain accuracy at high sparsity levels due to distribution shift between query and key patterns. We propose CSAttention, a centroid-scoring approach that clusters KV-cache entries and scores cluster centroids to identify relevant blocks, enabling high sparsity with maintained accuracy.", "abstract_cn": "长上下文LLM越来越多地依赖扩展的、可重用的预填充提示用于代理和领域问答，使注意力和KV缓存成为主要的解码时间瓶颈。虽然稀疏注意力减少了计算和传输成本，但由于查询和键模式之间的分布偏移，在高稀疏度下往往难以保持准确性。我们提出了CSAttention，一种质心评分方法，聚类KV缓存条目并评分聚类质心以识别相关块，实现在保持准确性的同时高稀疏度。", "intro_en": "As LLMs handle increasingly long contexts, the KV cache grows proportionally, making attention computation a dominant bottleneck during decoding. Sparse attention methods attempt to reduce this cost but face accuracy challenges.", "intro_cn": "随着LLM处理越来越长的上下文，KV缓存相应增长，使注意力计算成为解码期间的主要瓶颈。稀疏注意力方法试图减少这种成本但面临准确性挑战。", "file": "49_csattention.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-26"}, {"id": 213, "title": "CodecSight: Leveraging Video Codec Signals for Efficient Streaming VLM Inference", "authors": "Yulin Zou, Yan Chen, Wenyan Chen, JooYoung Park, Shivaraman Nitin, Luo Tao, Francisco Romero, Dmitrii Ustiugov", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "LLM Serving", "abstract_en": "Video streaming analytics is a crucial workload for vision-language model serving, but the high cost of multimodal token generation creates significant inference overhead. We present CodecSight, a system that leverages video codec signals (motion vectors, residual frames, and macroblock partitioning) already computed during video encoding to skip redundant visual token generation, reducing the computational cost of VLM inference for streaming video workloads.", "abstract_cn": "视频流分析是视觉语言模型服务的关键工作负载，但多模态token生成的高成本创造了显著的推理开销。我们提出了CodecSight，一个利用视频编码期间已计算的视频编解码信号（运动向量、残差帧和宏块分区）来跳过冗余视觉token生成的系统，降低了流视频工作负载的VLM推理计算成本。", "intro_en": "Streaming video analysis with VLMs is extremely costly because each frame requires full visual tokenization. However, consecutive frames in video streams share substantial visual similarity—information already captured by video codecs.", "intro_cn": "使用VLM的流视频分析极其昂贵，因为每帧需要完整的视觉token化。然而，视频流中的连续帧共享大量视觉相似性——这些信息已由视频编解码器捕获。", "file": "50_codecsight.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-26"}, {"id": 214, "title": "ProbeLogits: Kernel-Level LLM Inference Primitives for AI-Native Operating Systems", "authors": "Daeyeon Son", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "LLM Serving", "abstract_en": "An OS kernel that runs LLM inference internally can read logit distributions before any text is generated and act on them as a governance primitive. We present ProbeLogits, a kernel-level operation that performs a single forward pass and reads specific token logits to classify agent actions as safe or dangerous, with zero learned parameters. This approach enables real-time safety checks at the inference level without additional model overhead.", "abstract_cn": "在内部运行LLM推理的操作系统内核可以在任何文本生成之前读取logit分布，并将其作为治理原语行动。我们提出了ProbeLogits，一种内核级操作，执行单次前向传播并读取特定token logit以将代理行动分类为安全或危险，无需学习参数。这种方法在推理级别实现实时安全检查，无需额外模型开销。", "intro_en": "As LLMs become embedded in operating systems as native services, new primitives emerge for inference-level governance. ProbeLogits explores the concept of reading logits directly from the model's forward pass for safety classification.", "intro_cn": "随着LLM作为原生服务嵌入操作系统，出现了推理级治理的新原语。ProbeLogits探索了直接从模型前向传播读取logit进行安全分类的概念。", "file": "51_probelogits.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-26"}, {"id": 215, "title": "Quasar: Quantized Self-Speculative Acceleration for Rapid Inference via Memory-Efficient Verification", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Speculative Decoding", "abstract_en": "We present Quasar, a self-speculative decoding method that uses quantized model layers as drafters and full-precision layers as verifiers. By leveraging the same model with different precision levels, Quasar eliminates the need for separate draft models while achieving memory-efficient verification. The quantized layers produce approximate tokens that are verified against the full-precision computation, enabling significant inference acceleration without additional memory overhead.", "abstract_cn": "我们提出了Quasar，一种自投机解码方法，使用量化模型层作为起草器，全精度层作为验证器。通过利用同一模型的不同精度级别，Quasar消除了对单独起草模型的需要，同时实现内存高效的验证。量化层产生近似token，与全精度计算进行验证，在不增加额外内存开销的情况下实现显著的推理加速。", "intro_en": "Self-speculative decoding eliminates the need for a separate draft model by using parts of the target model itself for drafting. Quasar advances this idea by using quantized versions of model layers as drafters.", "intro_cn": "自投机解码通过使用目标模型本身的部分进行起草，消除了对单独起草模型的需要。Quasar通过使用模型层的量化版本作为起草器推进了这一想法。", "file": "52_quasar.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-26"}, {"id": 216, "title": "KnapSpec: Self-Speculative Decoding via Adaptive Layer Selection as a Knapsack Problem", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Speculative Decoding", "abstract_en": "Self-speculative decoding skips intermediate model layers to generate draft tokens, but selecting which layers to skip is challenging. We formulate layer selection as a knapsack optimization problem, where each layer's contribution to draft quality is weighed against its computational cost. KnapSpec dynamically selects the optimal layer skipping pattern for each input, maximizing drafting accuracy while minimizing computation overhead.", "abstract_cn": "自投机解码跳过中间模型层来生成起草token，但选择跳过哪些层具有挑战性。我们将层选择形式化为背包优化问题，其中每层对起草质量的贡献与其计算成本权衡。KnapSpec为每个输入动态选择最优层跳过模式，最大化起草准确性同时最小化计算开销。", "intro_en": "Self-speculative decoding offers a way to accelerate LLM inference without requiring a separate draft model. However, deciding which layers to skip for drafting is non-trivial—skipping too many reduces draft quality while skipping too few provides little acceleration.", "intro_cn": "自投机解码提供了无需单独起草模型即可加速LLM推理的方法。然而，决定跳过哪些层进行起草并非易事——跳过太多降低起草质量，跳过太少提供很少加速。", "file": "53_knapspec.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-27"}, {"id": 217, "title": "Efficient Training-Free Multi-Token Prediction via Embedding-Space Probing", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Speculative Decoding", "abstract_en": "We propose a training-free approach for multi-token prediction in speculative decoding by probing the embedding space of the target model. Instead of training a separate draft model, our method uses the hidden states from the target model's intermediate layers to predict future tokens, requiring no additional training while achieving competitive acceptance rates.", "abstract_cn": "我们提出了一种通过探测目标模型嵌入空间进行投机解码中多token预测的无训练方法。我们的方法使用目标模型中间层的隐藏状态来预测未来token，而不是训练单独的起草模型，无需额外训练同时实现竞争力的接受率。", "intro_en": "The need for trained draft models in speculative decoding adds complexity and deployment overhead. This work explores whether the target model's own intermediate representations can be used for multi-token prediction without any training.", "intro_cn": "投机解码中对训练起草模型的需求增加了复杂性和部署开销。这项工作探索了是否可以使用目标模型自身的中间表示进行多token预测而无需任何训练。", "file": "54_efficient_training_free_multi_.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-27"}, {"id": 218, "title": "LK Losses: Direct Acceptance Rate Optimization for Speculative Decoding", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Speculative Decoding", "abstract_en": "Training draft models for speculative decoding typically uses language modeling losses, but these losses do not directly optimize the acceptance rate—the metric that determines acceleration. We propose LK losses, a family of training objectives that directly target acceptance rate optimization, aligning draft model training with the actual metric that governs speculative decoding performance.", "abstract_cn": "为投机解码训练起草模型通常使用语言建模损失，但这些损失不直接优化接受率——决定加速的指标。我们提出了LK损失，一系列直接针对接受率优化的训练目标，将起草模型训练与实际决定投机解码性能的指标对齐。", "intro_en": "The standard approach to training draft models for speculative decoding uses next-token prediction losses. However, what matters for acceleration is how many tokens the target model accepts—not how well the draft model predicts the next token in isolation.", "intro_cn": "训练投机解码起草模型的标准方法使用下一个token预测损失。然而，对加速重要的是目标模型接受多少token——而不是起草模型单独预测下一个token的效果。", "file": "55_lk_losses.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-27"}, {"id": 219, "title": "Make Every Draft Count: Hidden State based Speculative Decoding", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Speculative Decoding", "abstract_en": "We propose a hidden state-based speculative decoding approach that leverages the intermediate representations of the target model to guide draft token generation. By analyzing the hidden state trajectories across layers, our method identifies tokens with higher acceptance probability before verification, making every draft token count toward acceleration.", "abstract_cn": "我们提出了一种基于隐藏状态的投机解码方法，利用目标模型的中间表示来指导起草token生成。通过分析层间隐藏状态轨迹，我们的方法在验证之前识别具有更高接受概率的token，使每个起草token都对加速有所贡献。", "intro_en": "Not all draft tokens in speculative decoding are equally likely to be accepted. This work explores whether hidden state information from the target model can help prioritize drafting tokens that are more likely to pass verification.", "intro_cn": "投机解码中并非所有起草token都有相同的接受可能性。这项工作探索了目标模型的隐藏状态信息是否可以帮助优先起草更有可能通过验证的token。", "file": "56_make_every_draft_count.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-27"}, {"id": 220, "title": "WANSpec: Leveraging Global Compute Capacity for LLM Inference", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Edge-Cloud Serving", "abstract_en": "We present WANSpec, a system that leverages geographically distributed compute resources for speculative LLM inference over wide-area networks. WANSpec places draft models on edge or regional compute nodes while keeping the target model in centralized datacenters, using network-aware scheduling to minimize the impact of WAN latency on speculative decoding performance.", "abstract_cn": "我们提出了WANSpec，一个利用地理分布的计算资源通过广域网络进行投机LLM推理的系统。WANSpec将起草模型放置在边缘或区域计算节点上，同时将目标模型保持在中央数据中心，使用网络感知调度来最小化广域网络延迟对投机解码性能的影响。", "intro_en": "Speculative decoding typically assumes draft and target models are co-located. WANSpec challenges this assumption by exploring how speculative decoding can work across wide-area networks with distributed compute resources.", "intro_cn": "投机解码通常假设起草模型和目标模型在同一位置。WANSpec挑战了这一假设，探索了投机解码如何在使用分布计算资源的广域网络上工作。", "file": "57_wanspec.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-27"}, {"id": 221, "title": "Privacy-Aware Split Inference with Speculative Decoding for Large Language Models over Wide-Area Networks", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Edge-Cloud Serving", "abstract_en": "We propose a privacy-aware split inference framework that combines speculative decoding with model splitting across wide-area networks. The framework ensures sensitive user data remains on local edge devices while leveraging cloud resources for target model verification, achieving both inference acceleration and data privacy preservation.", "abstract_cn": "我们提出了一种隐私感知的分割推理框架，将投机解码与广域网络上的模型分割相结合。该框架确保敏感用户数据保留在本地边缘设备上，同时利用云资源进行目标模型验证，实现推理加速和数据隐私保护。", "intro_en": "Cloud-based LLM inference raises privacy concerns when user prompts contain sensitive information. Split inference with speculative decoding offers a way to keep sensitive computations local while still benefiting from cloud-scale verification.", "intro_cn": "当用户提示包含敏感信息时，基于云的LLM推理引发隐私担忧。结合投机解码的分割推理提供了一种保持敏感计算本地化的方法，同时仍然受益于云规模的验证。", "file": "58_privacy_aware_split_inference_.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-28"}, {"id": 222, "title": "Benchmarking the Energy Savings with Speculative Decoding Strategies", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Speculative Decoding", "abstract_en": "While speculative decoding is primarily evaluated for latency reduction, its impact on energy consumption is equally important for sustainable LLM deployment. We present the first comprehensive benchmark of energy savings across different speculative decoding strategies, measuring both per-query energy and total system energy under various workload conditions.", "abstract_cn": "虽然投机解码主要评估延迟降低，其对能耗的影响对于可持续LLM部署同样重要。我们提出了首个跨不同投机解码策略的节能综合基准，测量各种工作负载条件下的每查询能耗和系统总能耗。", "intro_en": "Energy efficiency is becoming a critical metric for LLM deployment alongside latency. Speculative decoding reduces the number of forward passes needed, but its energy impact depends on whether the draft model overhead outweighs the verification savings.", "intro_cn": "能效正成为与延迟并列的LLM部署关键指标。投机解码减少了所需的前向传播次数，但其能耗影响取决于起草模型开销是否超过验证节省。", "file": "59_benchmarking_the_energy_saving.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-28"}, {"id": 223, "title": "Compiler-Assisted Speculative Sampling for Accelerated LLM Inference on Heterogeneous Edge Devices", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Local Inference", "abstract_en": "We present a compiler-assisted speculative sampling framework that optimizes draft model deployment on heterogeneous edge devices with varying compute capabilities. The compiler automatically partitions the speculative decoding pipeline across available hardware, balancing draft generation speed with verification accuracy to maximize end-to-end acceleration on resource-constrained edge platforms.", "abstract_cn": "我们提出了一种编译器辅助的投机采样框架，优化在具有不同计算能力的异构边缘设备上的起草模型部署。编译器自动在可用硬件上分割投机解码流水线，平衡起草生成速度与验证准确性，以在资源受限的边缘平台上最大化端到端加速。", "intro_en": "Running speculative decoding on edge devices is challenging due to heterogeneous compute capabilities and limited resources. A compiler-assisted approach can automatically adapt the decoding pipeline to the available hardware.", "intro_cn": "由于异构计算能力和有限资源，在边缘设备上运行投机解码具有挑战性。编译器辅助方法可以自动将解码流水线适配到可用硬件。", "file": "60_compiler_assisted_speculative_.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-28"}, {"id": 224, "title": "SpecAttn: Co-Designing Sparse Attention with Self-Speculative Decoding", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Speculative Decoding", "abstract_en": "We propose SpecAttn, a co-design framework that jointly optimizes sparse attention and self-speculative decoding for LLM inference acceleration. By sharing computation between sparse attention selection and speculative drafting, SpecAttn reduces redundant computation and achieves higher acceleration than applying either technique alone.", "abstract_cn": "我们提出了SpecAttn，一个联合优化稀疏注意力和自投机解码用于LLM推理加速的协同设计框架。通过在稀疏注意力选择和投机起草之间共享计算，SpecAttn减少了冗余计算，实现了比单独应用任一技术更高的加速。", "intro_en": "Sparse attention and speculative decoding are two complementary approaches for accelerating LLM inference, but they are typically applied independently. Co-designing these techniques can share computation and reduce overhead.", "intro_cn": "稀疏注意力和投机解码是加速LLM推理的两种互补方法，但通常独立应用。协同设计这些技术可以共享计算并减少开销。", "file": "61_specattn.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-28"}, {"id": 225, "title": "SDFP: Speculative Decoding with FIT-Pruned Models for Training-Free and Plug-and-Play LLM Acceleration", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Speculative Decoding", "abstract_en": "We present SDFP, a training-free speculative decoding method that uses FIT-pruned (feature-importance-tree pruned) versions of the target model as draft models. By pruning less important layers and attention heads based on feature importance analysis, SDFP creates lightweight draft models directly from the target model without any training, enabling plug-and-play acceleration.", "abstract_cn": "我们提出了SDFP，一种无训练投机解码方法，使用目标模型的FIT修剪（特征重要性树修剪）版本作为起草模型。通过基于特征重要性分析修剪不太重要的层和注意力头，SDFP直接从目标模型创建轻量级起草模型而无需任何训练，实现即插即用加速。", "intro_en": "Creating draft models for speculative decoding typically requires training a separate smaller model. SDFP explores whether pruning the target model itself can create an effective drafter without any training.", "intro_cn": "为投机解码创建起草模型通常需要训练一个单独的较小模型。SDFP探索了是否可以通过修剪目标模型本身来创建有效的起草器而无需任何训练。", "file": "62_sdfp.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-28"}, {"id": 226, "title": "Sparrow: Text-Anchored Window Attention with Visual-Semantic Glimpsing for Speculative Decoding in Video LLMs", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Speculative Decoding", "abstract_en": "We propose Sparrow, a speculative decoding method for video LLMs that uses text-anchored window attention to select relevant visual tokens for drafting. By glimpsing visual semantics anchored to the text context, Sparrow reduces the visual token overhead in draft generation, enabling efficient speculative decoding for video understanding tasks.", "abstract_cn": "我们提出了Sparrow，一种用于视频LLM的投机解码方法，使用文本锚定的窗口注意力选择相关视觉token进行起草。通过瞥见锚定于文本上下文的视觉语义，Sparrow减少了起草生成中的视觉token开销，实现了视频理解任务的高效投机解码。", "intro_en": "Speculative decoding for video LLMs faces unique challenges because draft generation requires processing visual tokens that are expensive to encode. Sparrow addresses this by only attending to visually relevant tokens anchored by the text context.", "intro_cn": "视频LLM的投机解码面临独特挑战，因为起草生成需要处理编码昂贵的视觉token。Sparrow通过仅关注由文本上下文锚定的视觉相关token来解决这一问题。", "file": "63_sparrow.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-29"}, {"id": 227, "title": "Balancing Latency and Accuracy of Code Completion via Local-Cloud Model Cascading", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Edge-Cloud Serving", "abstract_en": "We present a model cascading framework for code completion that balances latency and accuracy by routing queries between local small models and cloud large models. The framework uses confidence-based routing to send simple completions to local models for fast response while escalating complex requests to cloud models for higher accuracy.", "abstract_cn": "我们提出了一个用于代码补全的模型级联框架，通过在本地小模型和云大模型之间路由查询来平衡延迟和准确性。框架使用基于置信度的路由将简单补全发送到本地模型以快速响应，同时将复杂请求升级到云模型以获得更高准确性。", "intro_en": "Code completion requires both speed and accuracy. Local models offer low latency but limited capability, while cloud models provide high accuracy but introduce network delay. Cascading between them offers a practical compromise.", "intro_cn": "代码补全需要速度和准确性。本地模型提供低延迟但能力有限，而云模型提供高准确性但引入网络延迟。在它们之间级联提供了实用的折衷。", "file": "64_balancing_latency_and_accuracy.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-29"}, {"id": 228, "title": "EvoESAP: Non-Uniform Expert Pruning for Sparse MoE", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "MoE", "abstract_en": "Mixture-of-Experts (MoE) models achieve high quality with efficient compute by activating only a subset of experts per token. However, the total number of experts still consumes significant memory. We propose EvoESAP, an evolutionary expert pruning approach that non-uniformly prunes experts based on their utilization patterns, preserving frequently-activated experts while aggressively pruning rarely-used ones.", "abstract_cn": "混合专家（MoE）模型通过每token仅激活一部分专家来实现高质量和高效计算。然而，专家总数仍然消耗大量内存。我们提出了EvoESAP，一种进化式专家修剪方法，基于利用模式非均匀修剪专家，保留频繁激活的专家同时激进修剪很少使用的专家。", "intro_en": "MoE models face memory challenges because all experts must be stored even though only a few are activated per token. Expert pruning can reduce memory, but uniform pruning loses important experts.", "intro_cn": "MoE模型面临内存挑战，因为所有专家必须存储，尽管每token仅激活少数。专家修剪可以减少内存，但均匀修剪会丢失重要专家。", "file": "65_evoesap.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-29"}, {"id": 229, "title": "See the Forest for the Trees: Loosely Speculative Decoding via Visual-Semantic Guidance for Efficient Inference of Video LLMs", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Speculative Decoding", "abstract_en": "We propose loosely speculative decoding for video LLMs that uses visual-semantic guidance from higher-level scene understanding to draft tokens. Rather than requiring exact distribution matching, our approach allows controlled divergence guided by visual semantics, achieving faster decoding for video understanding tasks while maintaining semantic coherence.", "abstract_cn": "我们提出了用于视频LLM的宽松投机解码，使用来自高级场景理解的视觉语义指导来起草token。我们的方法允许由视觉语义引导的受控偏离，而不是要求精确分布匹配，在保持语义连贯性的同时为视频理解任务实现更快的解码。", "intro_en": "Strict speculative decoding requires exact distribution matching between draft and target models. For video LLMs, visual semantics provide additional guidance that can relax this requirement while maintaining output quality.", "intro_cn": "严格的投机解码要求起草模型和目标模型之间的精确分布匹配。对于视频LLM，视觉语义提供了额外的指导，可以在保持输出质量的同时放宽这一要求。", "file": "66_see_the_forest_for_the_trees.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-29"}, {"id": 230, "title": "A-IO: Adaptive Inference Orchestration for Memory-Bound NPUs", "authors": "Multiple Authors", "arxiv_id": "", "github_repo": "", "conference": "arxiv", "year": 2026, "topic": "Hardware", "abstract_en": "We present A-IO, an adaptive inference orchestration system for LLM inference on Neural Processing Units (NPUs) that are memory-bound. A-IO dynamically adjusts memory management, computation scheduling, and data movement patterns based on runtime profiling of NPU resource utilization, maximizing throughput under strict memory constraints.", "abstract_cn": "我们提出了A-IO，一种用于在内存受限的神经处理单元（NPU）上进行LLM推理的自适应推理协调系统。A-IO基于NPU资源利用的运行时分析动态调整内存管理、计算调度和数据移动模式，在严格内存约束下最大化吞吐量。", "intro_en": "NPUs offer cost-effective inference for LLMs but are often memory-bound, limiting achievable throughput. Adaptive orchestration that responds to runtime conditions can help overcome these constraints.", "intro_cn": "NPU为LLM提供经济高效的推理，但通常受内存限制，限制了可达到的吞吐量。响应运行时条件的自适应协调可以帮助克服这些约束。", "file": "67_a_io.md", "has_content": true, "is_placeholder_arxiv": true, "is_github_project": false, "added_date": "2026-04-29"}, {"id": "paper_1776244119_0", "title": "Accelerating Speculative Decoding with Block Diffusion Draft Trees", "topic": "LLM Serving", "category": "Speculative Decoding", "source": "arxiv", "arxiv_id": "2604.12989", "url": "https://arxiv.org/abs/2604.12989", "pdf_url": "https://arxiv.org/pdf/2604.12989", "date": "2026-04-14", "authors": "Liran Ringel", "summary_en": "Speculative decoding accelerates autoregressive language models by using a lightweight drafter to propose multiple future tokens, which the target model then verifies in parallel. DFlash shows that a block diffusion drafter can generate an entire draft block in a single forward pass and achieve state-of-the-art speculative decoding performance. We introduce DDTree (Diffusion Draft Tree), a method that constructs a draft tree directly from the per-position distributions of a block diffusion drafter. Under a fixed node budget, DDTree uses a simple best-first heap algorithm to select the continuations that are most likely to match the target model. The resulting tree is verified efficiently in a single target model forward pass using an ancestor-only attention mask.", "summary_cn": "推测解码通过使用轻量级草稿模型提议多个未来token来加速自回归语言模型，然后由目标模型并行验证。DFlash表明块扩散草稿模型可以在单次前向传播中生成整个草稿块并达到最先进的推测解码性能。我们提出DDTree（扩散草稿树），一种直接从块扩散草稿模型的逐位置分布构建草稿树的方法。在固定节点预算下，DDTree使用简单的最佳优先堆算法选择最可能匹配目标模型的延续。结果树使用仅祖先注意力掩码在单次目标模型前向传播中高效验证。", "tags": ["speculative-decoding", "block-diffusion", "draft-tree", "DDTree"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244119_1", "title": "Adaptive Bounded Self-Speculation with Layer-wise Confidence Calibration", "topic": "LLM Serving", "category": "Speculative Decoding", "source": "arxiv", "arxiv_id": "2604.12247", "url": "https://arxiv.org/abs/2604.12247", "pdf_url": "https://arxiv.org/pdf/2604.12247", "date": "2026-04-14", "authors": "Zhuofan Wen", "summary_en": "Speculative decoding has emerged as a promising approach to accelerate autoregressive inference in LLMs. Self-draft methods leverage the base LLM itself for speculation, but shallow layers often produce overconfident yet incorrect token predictions. We propose a novel self-draft framework that suppresses spurious confidence via layer-wise temperature annealing in early-exit decision and adaptively bounds speculation length based on token-wise decoding difficulty. By reprocessing hidden states of draft tokens in a unified parallel pass through deep layers, our method maintains exact output equivalence while maximizing computational efficiency. It requires no modifications to base LLM parameters and achieves up to 2.33x wall-time speedup. (ACL 2026 Findings)", "summary_cn": "推测解码已成为加速LLM自回归推理的有前途的方法。自草稿方法利用基础LLM本身进行推测，但浅层经常产生过度自信却不正确的token预测。我们提出一种新型自草稿框架，通过早期退出决策中的逐层温度退火来抑制虚假置信度，并根据逐token解码难度自适应限制推测长度。通过统一的并行传播重新处理草稿token的隐藏状态，在保持精确输出等价性的同时最大化计算效率。无需修改基础LLM参数，实现最高2.33倍加速。（ACL 2026 Findings）", "tags": ["speculative-decoding", "self-speculation", "early-exit", "confidence-calibration", "acl-2026"], "conference": "ACL", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244119_2", "title": "PipeLive: Efficient Live In-place Pipeline Parallelism Reconfiguration for Dynamic LLM Serving", "topic": "LLM Serving", "category": "LLM Serving", "source": "arxiv", "arxiv_id": "2604.12171", "url": "https://arxiv.org/abs/2604.12171", "pdf_url": "https://arxiv.org/pdf/2604.12171", "date": "2026-04-14", "authors": "Xu Bai", "summary_en": "Pipeline parallelism (PP) is widely used to partition LLM layers across GPUs. However, existing systems rely on static PP configurations that fail to adapt to dynamic settings. PipeLive enables live in-place PP reconfiguration with minimal disruption. It introduces a redesigned KV cache layout together with a co-designed extension to PageAttention, forming a unified mechanism for live KV resizing. It further adopts an incremental KV patching mechanism, inspired by live VM migration, to synchronize KV states between source and target configurations. PipeLive achieves 2.5X reduction in TTFT without KV cache overflow, reduces reconfiguration overhead from seconds to under 10ms, and improves TTFT and TPOT by up to 54.7% and 14.7%.", "summary_cn": "流水线并行广泛用于将LLM层分区到多个GPU上。然而现有系统依赖静态配置，无法适应动态环境。PipeLive实现最小干扰的实时就地PP重配置。它引入重新设计的KV缓存布局和PageAttention扩展，形成统一的实时KV调整机制。进一步采用增量KV补丁机制（灵感来自实时虚拟机迁移），在源和目标配置之间同步KV状态并识别安全切换点。PipeLive实现TTFT降低2.5倍而无KV缓存溢出，重配置开销从秒级降至10ms以下，TTFT和TPOT改善分别高达54.7%和14.7%。", "tags": ["pipeline-parallelism", "kv-cache", "dynamic-serving", "reconfiguration", "vllm"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244119_3", "title": "ConfigSpec: Profiling-Based Configuration Selection for Distributed Edge-Cloud Speculative LLM Serving", "topic": "LLM Serving", "category": "Speculative Decoding", "source": "arxiv", "arxiv_id": "2604.09722", "url": "https://arxiv.org/abs/2604.09722", "pdf_url": "https://arxiv.org/pdf/2604.09722", "date": "2026-04-08", "authors": "Xiangchen Li, Saeid Ghafouri, Jiakun Fan, Babar Ali, Hans Vandierendonck, Dimitrios S. Nikolopoulos", "summary_en": "Speculative decoding enables collaborative LLM inference across cloud and edge by separating lightweight token drafting from heavyweight verification. ConfigSpec presents a configuration-selection framework for distributed speculative LLM serving. It profiles edge devices and draft-target alignment, and models drafting throughput, acceptance rate, and power to evaluate goodput, verification cost efficiency, and energy efficiency across the joint configuration space. Analysis reveals structurally conflicting optima: goodput is maximised by the smallest, fastest draft model at device-dependent speculative lengths (K*=2-10), while both cost and energy efficiency converge to K=2. No single fixed configuration can simultaneously optimise all objectives. (TDIS 2026)", "summary_cn": "推测解码通过分离轻量级token起草与重量级验证，实现云边协作LLM推理。ConfigSpec提出面向分布式推测LLM服务的配置选择框架。它分析边缘设备和草稿-目标对齐，建模草稿吞吐量、接受率和功耗，在联合配置空间中评估吞吐、成本效率和能源效率。分析揭示结构性冲突最优解：吞吐量由最小最快草稿模型在设备依赖推测长度（K*=2-10）下最大化，而成本和能源效率都收敛到K=2。无单一固定配置能同时优化所有目标。（TDIS 2026）", "tags": ["speculative-decoding", "edge-cloud", "configuration-selection", "profiling", "disaggregated-inference"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244119_4", "title": "DIVERSED: Relaxed Speculative Decoding via Dynamic Ensemble Verification", "topic": "LLM Serving", "category": "Speculative Decoding", "source": "arxiv", "arxiv_id": "2604.07622", "url": "https://arxiv.org/abs/2604.07622", "pdf_url": "https://arxiv.org/pdf/2604.07622", "date": "2026-04-08", "authors": "Ziyi Wang, Siva Rajesh Kasa, Ankith M S, Santhosh Kumar Kasa, Jiaru Zou, Sumit Negi, Ruqi Zhang, Nan Jiang, Qifan Song", "github_repo": "comeusr/diversed", "summary_en": "Speculative decoding accelerates LLM inference by drafting multiple tokens in parallel, but its speedup is bottlenecked by rigid verification that strictly enforces accepted token distribution to exactly match the target model, rejecting many plausible tokens. DIVERSED proposes a relaxed verification framework that improves time efficiency while preserving generation quality. It learns an ensemble-based verifier that blends the draft and target model distributions with a task-dependent and context-dependent weight. Empirically achieves substantially higher inference efficiency. (AISTATS 2026)", "summary_cn": "推测解码通过并行起草多个token加速LLM推理，但加速受限于严格验证，强制要求接受token分布完全匹配目标模型，拒绝许多合理token。DIVERSED提出宽松验证框架，在保持生成质量的同时提高时间效率。它学习基于集成的验证器，以任务和上下文依赖权重混合草稿和目标模型分布。实验证明相比标准推测解码方法实现显著更高推理效率。（AISTATS 2026）", "tags": ["speculative-decoding", "relaxed-verification", "ensemble", "aistats-2026"], "conference": "AISTATS", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244119_5", "title": "Fast Heterogeneous Serving: Scalable Mixed-Scale LLM Allocation for SLO-Constrained Inference", "topic": "LLM Serving", "category": "LLM Serving", "source": "arxiv", "arxiv_id": "2604.07472", "url": "https://arxiv.org/abs/2604.07472", "pdf_url": "https://arxiv.org/pdf/2604.07472", "date": "2026-04-08", "authors": "Jiaming Cheng, Duong Tung Nguyen", "summary_en": "Deploying LLM inference at scale requires jointly selecting base models, provisioning heterogeneous GPUs, configuring parallelism, and distributing workloads under tight latency, accuracy, and budget constraints. Exact MILP approaches guarantee optimality but scale poorly. We propose two constraint-aware heuristics: Greedy Heuristic (GH) for single-pass allocation, and Adaptive Greedy Heuristic (AGH) that enhances GH via multi-start construction, relocate-based local search, and GPU consolidation. On Azure LLM Inference Trace (2025) workloads, both produce feasible solutions in under one second, with AGH closely approaching optimal cost while achieving over 260x speedup.", "summary_cn": "大规模部署LLM推理需要联合选择基础模型、配置异构GPU、设置并行度和在严格延迟精度预算约束下分配工作负载。精确MILP方法保证最优性但扩展性差。提出两种约束感知启发式：贪心启发式（GH）用于单次分配，自适应贪心启发式（AGH）通过多起点构造和GPU整合增强。在Azure LLM推理轨迹校准工作负载上，两种方法不到一秒产生可行解，AGH接近最优成本同时实现260倍以上加速。", "tags": ["llm-serving", "heterogeneous-gpu", "slo-constraints", "allocation", "milp"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244119_6", "title": "Valve: Production Online-Offline Inference Colocation with Jointly-Bounded Preemption Latency and Rate", "topic": "LLM Serving", "category": "LLM Serving", "source": "arxiv", "arxiv_id": "2604.07874", "url": "https://arxiv.org/abs/2604.07874", "pdf_url": "https://arxiv.org/pdf/2604.07874", "date": "2026-04-09", "authors": "Fangyue Liu, Hua Liu, Xinyuan Lyu, Shuo Ai, Hao Liang, Lingpeng Chen, Ziqian Hu, Chong Zha, Xin Jin, Hanmei Luo, Peng Chen", "summary_en": "LLM inference powers latency-critical production services. Valve is a production-friendly colocation system that jointly bounds preemption latency and preemption rate. It enables sub-millisecond compute preemption at most once per online request, and rate-limited sub-layer memory reclamation via a GPU runtime combining channel-controlled compute isolation, page-fault-free memory reclamation, and dynamic memory reservation. Deployed on 8,054 GPUs in production, Valve improves cluster utilization by 34.6% (2,170 GPU save) with minimal online interference (<5% TTFT increase, <2% TPOT increase).", "summary_cn": "LLM推理驱动延迟关键的生产服务。Valve是生产友好的共位系统，联合限制抢占延迟和抢占率。实现在线请求最多一次亚毫秒计算抢占和速率限制子层内存回收。通过结合通道控制计算隔离、无页面故障内存回收和动态内存预留的GPU运行时。在8,054个GPU生产部署中，集群利用率提高34.6%（节省2,170个GPU），在线干扰极小（TTFT增加<5%，TPOT增加<2%）。", "tags": ["llm-serving", "colocation", "gpu-runtime", "preemption", "production-deployment"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244119_7", "title": "AsyncTLS: Efficient Generative LLM Inference with Asynchronous Two-level Sparse Attention", "topic": "LLM Serving", "category": "LLM Inference", "source": "arxiv", "arxiv_id": "2604.07815", "url": "https://arxiv.org/abs/2604.07815", "pdf_url": "https://arxiv.org/pdf/2604.07815", "date": "2026-04-09", "authors": "Yuxuan Hu, Jianchao Tan, Jiaqi Zhang, Wen Zan, Pingwei Sun, Yifan Lu, Yerui Sun, Yuchen Xie, Xunliang Cai, Jing Zhang", "summary_en": "Long-context inference in LLMs faces quadratic attention complexity and prohibitive KV cache memory. AsyncTLS proposes a hierarchical sparse attention system combining coarse-grained block filtering with fine-grained token selection to balance accuracy and efficiency, coupled with an asynchronous offloading engine that overlaps KV cache transfers with computation via temporal locality exploitation. Evaluated on Qwen3 and GLM-4.7-Flash across GQA and MLA architectures, achieves accuracy comparable to full attention while delivering 1.2x-10.0x operator speedups and 1.3x-4.7x end-to-end throughput improvements on 48k-96k contexts.", "summary_cn": "LLM长上下文推理面临二次注意力复杂度和KV缓存内存挑战。AsyncTLS提出分层稀疏注意力系统，结合粗粒度块过滤与细粒度token选择平衡精度和效率，配备异步卸载引擎通过时间局部性将KV缓存传输与计算重叠。在Qwen3和GLM-4.7-Flash上评估，精度可比全注意力同时实现1.2x-10.0x算子加速和1.3x-4.7x端到端吞吐提升（48k-96k上下文）。", "tags": ["long-context", "sparse-attention", "kv-cache-offloading", "inference-optimization"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244119_8", "title": "S2D2: Fast Decoding for Diffusion LLMs via Training-Free Self-Speculation", "topic": "LLM Serving", "category": "Speculative Decoding", "source": "arxiv", "arxiv_id": "2603.25702", "url": "https://arxiv.org/abs/2603.25702", "pdf_url": "https://arxiv.org/pdf/2603.25702", "date": "2026-03-26", "authors": "Ligong Han, Hao Wang, Han Gao, Kai Xu, Akash Srivastava", "github_repo": "phymhan/S2D2", "summary_en": "Block-diffusion language models offer a path toward faster-than-autoregressive generation, but standard confidence-thresholded decoding is brittle in the few-step regime. S2D2 is a training-free self-speculative decoding framework for block-diffusion LMs. A block-diffusion model becomes autoregressive when block size is reduced to one, allowing the same pretrained model to act as both drafter and verifier. S2D2 inserts speculative verification into standard block-diffusion decoding and uses lightweight routing policies. On SDAR, up to 4.7x speedup over AR decoding, and 1.57x over tuned dynamic decoding baseline while improving accuracy by up to 4.5 points.", "summary_cn": "块扩散语言模型提供超越自回归生成的路径，但标准置信度阈值解码在少步长模式下脆弱。S2D2是免训练自推测解码框架。块扩散模型在块大小减少为1时变为自回归模式，允许同一预训练模型充当草稿器和验证器。S2D2在标准块扩散解码中插入推测验证，使用轻量路由策略。在SDAR上，相比AR解码最高4.7x加速，相比调优动态解码基线1.57x加速同时精度提升4.5点。", "tags": ["speculative-decoding", "diffusion-llm", "self-speculation", "block-diffusion", "training-free"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244119_9", "title": "Self-Distillation for Multi-Token Prediction", "topic": "LLM Serving", "category": "LLM Inference", "source": "arxiv", "arxiv_id": "2603.23911", "url": "https://arxiv.org/abs/2603.23911", "pdf_url": "https://arxiv.org/pdf/2603.23911", "date": "2026-03-25", "authors": "Guoliang Zhao, Ruobing Xie, An Wang, Shuaipeng Li, Huaibing Xie, Xingwu Sun", "summary_en": "As LLMs scale up, inference efficiency becomes a critical bottleneck. Multi-Token Prediction (MTP) could accelerate LLM inference by predicting multiple future tokens in parallel. MTP-D proposes a simple yet effective self-distillation method with minimal additional training cost, boosting MTP head acceptance rates (+7.5%) while maximumly preserving main-head performance. A looped extension strategy enables effective and economical MTP head extension and further significant inference speedup to 1-head MTP (+220.4%).", "summary_cn": "随着LLM规模增大，推理效率成为关键瓶颈。多token预测（MTP）可通过并行预测多个未来token加速推理。MTP-D提出简单有效的自蒸馏方法，额外训练成本极小，提升MTP头接受率（+7.5%）同时最大限度保留主头性能。循环扩展策略实现有效经济的MTP头扩展，进一步推理加速至1头MTP（+220.4%）。", "tags": ["multi-token-prediction", "self-distillation", "inference-efficiency", "mtp"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244119_10", "title": "The Diminishing Returns of Early-Exit Decoding in Modern LLMs", "topic": "LLM Serving", "category": "LLM Inference", "source": "arxiv", "arxiv_id": "2603.23701", "url": "https://arxiv.org/abs/2603.23701", "pdf_url": "https://arxiv.org/pdf/2603.23701", "date": "2026-03-24", "authors": "Rui Wei, Rui Du, Hanfei Yu, Devesh Tiwari, Jian Li, Zhaozhuo Xu, Hao Wang", "summary_en": "In LLM inference, early-exit stops computation at an intermediate layer once prediction is sufficiently confident. Recent LLMs adopt improved pretraining recipes and architectures that reduce layer redundancy, potentially limiting early-exit opportunities. We re-evaluate layer-wise early-exit in modern LLMs. Results show a diminishing trend in early-exit effectiveness across newer model generations. Dense transformers generally offer greater early-exit potential than MoE and SSM. Larger models (>20B parameters) and base pretrained models without specialized tuning tend to exhibit higher early-exit potential.", "summary_cn": "在LLM推理中，早期退出在中间层一旦预测足够自信就停止计算。最近LLM采用改进的预训练方案和架构，减少层冗余，可能限制早期退出机会。我们重新评估现代LLM中的逐层早期退出。结果显示较新模型代际中早期退出有效性呈递减趋势。密集Transformer通常比MoE和SSM提供更大早期退出潜力。更大模型（>20B参数）和未经专门调优的基础预训练模型倾向展现更高早期退出潜力。", "tags": ["early-exit", "inference-optimization", "layer-redundancy", "modern-llms"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244334_11", "title": "Speculative Speculative Decoding (SSD)", "topic": "LLM Serving", "category": "Speculative Decoding", "source": "arxiv", "arxiv_id": "2603.03251", "url": "https://arxiv.org/abs/2603.03251", "pdf_url": "https://arxiv.org/pdf/2603.03251", "date": "2026-03-03", "authors": "Tanishq Kumar, Tri Dao, Avner May", "github_repo": "tanishq Kumar/ssd-saguaro", "summary_en": "Speculative decoding accelerates autoregressive inference by using a fast draft model to predict upcoming tokens, then verifying them in parallel. However, speculative decoding itself relies on a sequential dependence between speculation and verification. SSD (Speculative Speculative Decoding) parallelizes these operations: while verification is ongoing, the draft model predicts likely verification outcomes and prepares speculations pre-emptively. If the actual outcome matches, a speculation is returned immediately, eliminating drafting overhead entirely. Saguaro, an optimized SSD algorithm, is on average 30% faster than optimized speculative decoding baselines and up to 5x faster than autoregressive decoding with open-source inference engines. (ICLR 2026)", "summary_cn": "推测解码通过使用快速草稿模型预测后续token再并行验证来加速推理。但推测解码本身依赖推测和验证之间的顺序依赖关系。SSD（推测推测解码）将这些操作并行化：在验证进行时，草稿模型预测可能的验证结果并提前准备推测。如果实际结果在预测集合中，可立即返回推测，完全消除草稿开销。Saguaro是最优化的SSD算法，平均比优化的推测解码基线快30%，比开源推理引擎的自回归解码最多快5倍。（ICLR 2026）", "tags": ["speculative-decoding", "ssd", "saguaro", "parallel-speculation", "iclr-2026"], "conference": "ICLR", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244334_12", "title": "Nightjar: Dynamic Adaptive Speculative Decoding for Large Language Models Serving", "topic": "LLM Serving", "category": "Speculative Decoding", "source": "arxiv", "arxiv_id": "2512.22420", "url": "https://arxiv.org/abs/2512.22420", "pdf_url": "https://arxiv.org/pdf/2512.22420", "date": "2025-12-26", "authors": "Rui Li, Zhaoning Zhang, Libo Zhang, Huaimin Wang, Xiang Fu, Zhiquan Lai", "summary_en": "Speculative decoding accelerates LLM inference by verifying draft tokens in parallel. However, it improves throughput only in low-load, memory-bound systems but degrades performance in high-load, compute-bound environments due to verification overhead. Existing methods use fixed lengths and cannot adapt to workload changes or decide when to stop speculation. Nightjar is a resource-aware adaptive speculative framework that adjusts to request load by dynamically selecting optimal speculative length for different batch sizes. Crucially, Nightjar proactively disables speculation when the MAB planner determines speculation is no longer beneficial, and offloads the draft model to CPU under GPU memory pressure, reclaiming KV cache memory for larger batches. Experiments show 27.29% higher throughput and up to 20.18% lower latency compared to standard speculative decoding under dynamic request rates.", "summary_cn": "推测解码通过并行验证草稿token加速LLM推理。但仅在低负载内存受限系统中提升吞吐量，在高负载计算受限环境中由于验证开销降低性能。现有方法使用固定长度，无法适应工作负载变化。Nightjar是资源感知的自适应推测框架，通过动态选择不同批次大小下的最优推测长度来调整请求负载。关键创新：当MAB规划器确定推测不再有益时主动禁用推测，在GPU内存压力下将草稿模型卸载到CPU，回收KV缓存内存以支持更大批次。实验显示在动态请求率下吞吐量提升27.29%，延迟降低最多20.18%。", "tags": ["speculative-decoding", "adaptive", "mab-planner", "draft-offloading", "dynamic-serving"], "conference": "arxiv", "year": "2025", "added_date": "2026-03-15"}, {"id": "paper_1776244334_13", "title": "WISP: Waste- and Interference-Suppressed Distributed Speculative LLM Serving at the Edge", "topic": "LLM Serving", "category": "Speculative Decoding", "source": "arxiv", "arxiv_id": "2601.11652", "url": "https://arxiv.org/abs/2601.11652", "pdf_url": "https://arxiv.org/pdf/2601.11652", "date": "2026-01-15", "authors": "Xiangchen Li, Jiakun Fan, Qingyuan Wang, Dimitrios Spatharakis, Saeid Ghafouri, Hans Vandierendonck, Deepu John, Bo Ji, Ali R. Butt, Dimitrios S. Nikolopoulos", "summary_en": "As LLMs become increasingly accessible, inference requests from edge devices strain data centers while edge devices remain underutilized. Speculative decoding helps balance workload between edge and cloud while maintaining lossless accuracy. WISP identifies two critical bottlenecks: Wasted Drafting Time and Verification Interference. It proposes an intelligent speculation controller, a verification time estimator, and a verification batch scheduler that collaboratively enhance drafting efficiency and optimize verification scheduling. WISP improves system capacity by up to 2.1x and 4.1x, and increases goodput by up to 1.94x and 3.7x, compared to centralized serving and SLED respectively.", "summary_cn": "随着LLM日益普及，来自边缘设备的推理请求给数据中心带来压力，而边缘设备未被充分利用。推测解码在保持无损精度同时帮助平衡边云工作负载。WISP识别两个关键瓶颈：浪费的草稿时间和验证干扰。提出智能推测控制器、验证时间估计器和验证批次调度器，协同增强草稿效率并优化验证调度。相比集中式服务和SLED，WISP系统容量提升最多2.1x和4.1x，吞吐提升最多1.94x和3.7x。", "tags": ["speculative-decoding", "edge-cloud", "distributed-serving", "slo-aware", "wisp"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244334_14", "title": "MAC-Attention: a Match-Amend-Complete Scheme for Fast and Accurate Attention Computation", "topic": "LLM Serving", "category": "LLM Inference", "source": "arxiv", "arxiv_id": "2604.00235", "url": "https://arxiv.org/abs/2604.00235", "pdf_url": "https://arxiv.org/pdf/2604.00235", "date": "2026-03-31", "authors": "Jinghan Yao, Sam Adé Jacobs, Walid Krichene, Masahiro Tanaka, Dhabaleswar K Panda", "github_repo": "YJHMITWEB/MAC-Attention", "summary_en": "Long-context decoding in LLMs is IO-bound: each token re-reads an ever-growing KV cache. Prior accelerations cut bytes via compression (lower fidelity) or selection/eviction (restricting accessibility), both degrading delayed recall. MAC-Attention is a fidelity- and access-preserving alternative that accelerates decoding by reusing prior attention computations for semantically similar recent queries. Match stage performs pre-RoPE L2 matching over a short local window; amend stage rectifies reused attention by recomputing a small band near the match boundary; complete stage fuses rectified results with fresh attention on the KV tail through a numerically stable merge. On match hit, compute and bandwidth complexity is constant regardless of context length. Reduces KV accesses by up to 99%, cuts latency by over 60% at 128K, achieves over 14.3x attention-phase speedups and up to 2.6x end-to-end.", "summary_cn": "LLM长上下文解码是IO受限的：每个token重新读取不断增长的KV缓存。先前加速通过压缩（降低保真度）或选择/驱逐（限制可访问性）减少字节，两者都损害延迟召回。MAC-Attention是保真度和可访问性保持的替代方案，通过为语义相似的近期查询重用先前的注意力计算来加速解码。匹配阶段在短局部窗口上执行预RoPE L2匹配；修正阶段通过重新计算匹配边界附近的小带区来纠正重用的注意力；完成阶段通过数值稳定的合并将纠正结果与KV尾部的新鲜注意力融合。匹配命中时，计算和带宽复杂度与上下文长度无关。KV访问减少最多99%，128K时延迟降低超过60%，注意力阶段加速超过14.3倍，端到端最多2.6倍。", "tags": ["long-context", "attention-optimization", "kv-cache", "mac-attention", "inference-efficiency"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244449_15", "title": "Flow-Controlled Scheduling for LLM Inference with Provable Stability Guarantees", "topic": "LLM Serving", "category": "LLM Serving", "source": "arxiv", "arxiv_id": "2604.11001", "url": "https://arxiv.org/abs/2604.11001", "pdf_url": "https://arxiv.org/pdf/2604.11001", "date": "2026-04-13", "authors": "Zhuolun Dong, Junyu Cao", "summary_en": "LLM inference faces a key challenge: decode lengths are unknown, so memory usage per request grows with generated tokens, potentially causing overflow and instability. We propose a simple flow-control framework that controls the rate at which prompts join the active set. We derive a necessary condition that any stable system must satisfy and establish sufficient conditions under which our algorithm provably achieves stability. Experiments show that compared to common strategies, our approach achieves higher token and request throughput, lower average and tail latency, and more stable KV cache utilization.", "summary_cn": "LLM推理面临关键挑战：解码长度未知，每个请求的内存使用随生成token增长，可能导致溢出和系统不稳定。我们提出简单的流控制框架，控制提示加入活跃集的速率。推导出任何稳定系统必须满足的必要条件，并建立算法可证明实现稳定性的充分条件。实验表明相比常用策略，我们的方法实现更高的token和请求吞吐量、更低的平均和尾延迟以及更稳定的KV缓存利用率。", "tags": ["llm-serving", "flow-control", "scheduling", "stability", "kv-cache"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244449_16", "title": "SpecMoE: A Fast and Efficient Mixture-of-Experts Inference via Self-Assisted Speculative Decoding", "topic": "LLM Serving", "category": "Speculative Decoding", "source": "arxiv", "arxiv_id": "2604.10152", "url": "https://arxiv.org/abs/2604.10152", "pdf_url": "https://arxiv.org/pdf/2604.10152", "date": "2026-04-11", "authors": "Jehyeon Bang, Eunyeong Cho, Ranggi Hwang, Jinha Chung, Minsoo Rhu", "summary_en": "The MoE architecture selectively activates parameters to mitigate computational costs, but high memory requirements and sub-optimal parameter efficiency pose challenges. Although CPU-offloaded MoE inference systems have been proposed, they offer limited efficiency for large batch sizes. SpecMoE is a memory-efficient MoE inference system based on self-assisted speculative decoding. It demonstrates effectiveness of applying speculative decoding to MoE inference without requiring additional model training or fine-tuning. Improves inference throughput by up to 4.30x while significantly reducing bandwidth requirements of both memory and interconnect on memory-constrained systems. (DAC 2026)", "summary_cn": "MoE架构通过选择性激活参数减轻计算成本，但高内存需求和参数效率低下带来挑战。虽然已有CPU卸载MoE推理系统，但对大批次效率有限。SpecMoE是基于自辅助推测解码的内存高效MoE推理系统。展示了将推测解码应用于MoE推理的有效性，无需额外模型训练或微调。推理吞吐量提升最多4.30倍，同时显著降低内存受限系统上内存和互连的带宽需求。（DAC 2026）", "tags": ["speculative-decoding", "moe-inference", "self-assisted", "cpu-offloading", "dac-2026"], "conference": "DAC", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244449_17", "title": "SPEED-Bench: A Unified and Diverse Benchmark for Speculative Decoding", "topic": "LLM Serving", "category": "Speculative Decoding", "source": "arxiv", "arxiv_id": "2604.09557", "url": "https://arxiv.org/abs/2604.09557", "pdf_url": "https://arxiv.org/pdf/2604.09557", "date": "2026-02-10", "authors": "Talor Abramovich, Maor Ashkenazi, Carl Putterman, Benjamin Chislett, Tiyasa Mitra, Bita Darvish Rouhani, Ran Zilberstein, Yonatan Geifman", "summary_en": "Speculative decoding performance is inherently data-dependent, requiring diverse and representative workloads. Existing benchmarks suffer from limited task diversity, inadequate throughput-oriented evaluation, and reliance on high-level implementations. SPEED-Bench is a comprehensive suite to standardize SD evaluation across diverse semantic domains and realistic serving regimes. It offers a Qualitative data split selected by prioritizing semantic diversity, and a Throughput data split allowing speedup evaluation across concurrency ranges from latency-sensitive low-batch to throughput-oriented high-load. Integrating with vLLM and TensorRT-LLM, SPEED-Bench quantifies how synthetic inputs overestimate real-world throughput, identifies batch-size dependent optimal draft lengths, and analyzes vocabulary pruning caveats.", "summary_cn": "推测解码性能本质上依赖数据，需要多样化和代表性的工作负载。现有基准存在任务多样性有限、吞吐量评估不足和依赖高层实现的问题。SPEED-Bench是全面的推测解码评估套件，标准化跨多样语义域和真实服务场景的评估。提供按语义多样性选择的定性数据分割，以及允许从延迟敏感低批次到吞吐导向高负载的并发范围加速评估的吞吐数据分割。集成vLLM和TensorRT-LLM，量化合成输入如何高估真实吞吐，识别批次依赖的最优草稿长度，分析词汇修剪的注意事项。", "tags": ["speculative-decoding", "benchmark", "vllm", "trt-llm", "nvidia"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244449_18", "title": "InfiniLoRA: Disaggregated Multi-LoRA Serving for Large Language Models", "topic": "LLM Serving", "category": "LLM Serving", "source": "arxiv", "arxiv_id": "2604.07173", "url": "https://arxiv.org/abs/2604.07173", "pdf_url": "https://arxiv.org/pdf/2604.07173", "date": "2026-04-08", "authors": "Hongyu Chen, Letian Ruan, Zilin Xu, Yuchen Li, Xinyu Chen, Jingwen Leng, Bingsheng He, Minyi Guo, Shixuan Sun", "summary_en": "LoRA enables efficient customization of LLMs and is widely used in multi-tenant serving. However, emerging MoE architectures significantly increase LoRA memory cost, making existing coupled LoRA serving designs poorly scalable and prone to tail-latency inflation. InfiniLoRA is a disaggregated LoRA serving system that decouples LoRA execution from base-model inference. It introduces a shared LoRA Server with parallelism-aware execution, SLO-driven provisioning, and critical-path optimizations including GPU-initiated communication and hardware-specialized LoRA kernels. Achieves 3.05x increase in serviceable request rate under strict latency SLOs, and improves LoRA adapter SLO satisfaction by 54.0%.", "summary_cn": "LoRA实现LLM高效定制化，广泛用于多租户服务。但新兴MoE架构显著增加LoRA内存成本，使现有耦合LoRA服务设计扩展性差且尾部延迟膨胀。InfiniLoRA是解耦式LoRA服务系统，将LoRA执行从基础模型推理中解耦。引入共享LoRA服务器，具有并行感知执行、SLO驱动配置和关键路径优化（包括GPU发起通信和硬件专用LoRA内核）。在严格延迟SLO下实现3.05倍可服务请求率增长，LoRA适配器SLO满足率改善54.0%。", "tags": ["lora-serving", "disaggregated", "moe", "multi-tenant", "slo"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244522_19", "title": "StreamServe: Adaptive Speculative Flows for Low-Latency Disaggregated LLM Serving", "topic": "LLM Serving", "category": "Speculative Decoding", "source": "arxiv", "arxiv_id": "2604.09562", "url": "https://arxiv.org/abs/2604.09562", "pdf_url": "https://arxiv.org/pdf/2604.09562", "date": "2026-02-11", "authors": "Satyam Kumar, Arpit Singh Gautam, Kailash Talreja, Saurabh Jha", "summary_en": "Efficient LLM serving must balance throughput and latency across diverse, bursty workloads. StreamServe is a disaggregated prefill decode serving architecture that combines metric-aware routing across compute lanes with adaptive speculative decoding that tunes speculation depth online from runtime signals. It comprises four components: StreamScheduler for request orchestration, FlowGuard for multi-signal routing, PipeServe Engine for disaggregated prefill-decode execution on multi-GPU, and SpecuStream for runtime adaptive speculation. Reduces latency by 11-18x relative to tensor-parallel vLLM baselines, reaching throughput up to 2235 tokens/second on summarization tasks.", "summary_cn": "高效LLM服务必须在多样突发工作负载中平衡吞吐和延迟。StreamServe是解耦预填充解码服务架构，结合跨计算通道的指标感知路由和从运行时信号在线调整推测深度的自适应推测解码。包含四个组件：StreamScheduler请求编排、FlowGuard多信号路由、PipeServe Engine多GPU解耦执行、SpecuStream运行时自适应推测。相比张量并行vLLM基线延迟降低11-18倍，摘要任务吞吐达2235 token/s。", "tags": ["speculative-decoding", "disaggregated-serving", "adaptive", "prefill-decode", "routing"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244522_20", "title": "StarSD: One-for-Many Speculative Decoding", "topic": "LLM Serving", "category": "Speculative Decoding", "source": "arxiv", "arxiv_id": "2601.21622", "url": "https://arxiv.org/abs/2601.21622", "pdf_url": "https://arxiv.org/pdf/2601.21622", "date": "2026-01-29", "authors": "Junhao He, Feiran You, Hongyang Du", "summary_en": "Speculative decoding accelerates autoregressive generation by separating token proposal from verification, but most approaches are designed for single-node execution and do not scale well to multi-accelerator clusters. StarSD is a one-for-many speculative decoding framework that uses a single draft model to serve multiple target models across distributed nodes via a star topology. It decouples drafting and verification, enabling effective sharing of draft computation and preventing distributed accelerators from remaining idle under bursty workloads. System-level analysis characterizes when and why a single draft model can remain fully utilized by multiple verifiers, yielding predictable latency and utilization gains. Simplifies deployment and supports flexible resource allocation across heterogeneous accelerators.", "summary_cn": "推测解码通过分离token提议和验证加速自回归生成，但多数方法针对单节点设计，不适合多加速器集群。StarSD是一对多推测解码框架，通过星形拓扑使用单一草稿模型为分布式节点上的多个目标模型服务。解耦草稿和验证，实现草稿计算的有效共享，防止突发工作负载下分布式加速器闲置。系统级分析阐明何时为何单一草稿模型可为多个验证器保持充分利用，产生可预测的延迟和利用率收益。简化部署，支持异构加速器的灵活资源分配。", "tags": ["speculative-decoding", "distributed-inference", "star-topology", "one-for-many", "multi-model"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244677_21", "title": "Token-Budget-Aware Pool Routing for Cost-Efficient LLM Inference", "topic": "LLM Serving", "category": "LLM Serving", "source": "arxiv", "arxiv_id": "2604.09613", "url": "https://arxiv.org/abs/2604.09613", "pdf_url": "https://arxiv.org/pdf/2604.09613", "date": "2026-03-13", "authors": "Huamin Chen, Xunzhuo Liu, Junchen Jiang, Bowei He, Xue Liu", "summary_en": "Production vLLM fleets provision every instance for worst-case context length, wasting 4-8x concurrency on short requests while triggering KV-cache failures (OOM crashes, preemption storms, rejections). Both problems share a root cause: configuration-traffic mismatch. We propose token-budget-aware pool routing: estimate each request's total token budget using a self-calibrating per-category bytes-per-token ratio, then dispatch to one of two vLLM pools -- a high-throughput short pool or a high-capacity long pool. A closed-form cost model predicts fleet-level GPU savings. On Azure LLM Inference Dataset traces serving Llama-3-70B on A100 GPUs, reduces GPU instances by 17-39% ($1.2-2.0M/yr at 1000 req/s). Adds O(1) dispatch overhead, self-calibrates without a tokenizer.", "summary_cn": "生产vLLM集群为最坏情况上下文长度配置每个实例，在短请求上浪费4-8倍并发，同时触发KV缓存故障。问题根源：配置与流量不匹配。提出token预算感知池路由：使用自校准的每类别字节/token比率估计每个请求的token预算，然后分发到高吞吐短池或高容量长池。闭式成本模型预测集群级GPU节省。在Azure LLM推理数据集上服务Llama-3-70B/A100，GPU实例减少17-39%（1000 req/s下每年节省1.2-2.0M美元）。O(1)分发开销，无需tokenizer自校准。", "tags": ["llm-serving", "pool-routing", "token-budget", "cost-efficient", "vllm"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244677_22", "title": "EAGLE-Pangu: Accelerator-Safe Tree Speculative Decoding on Ascend NPUs", "topic": "LLM Serving", "category": "Speculative Decoding", "source": "arxiv", "arxiv_id": "2603.08088", "url": "https://arxiv.org/abs/2603.08088", "pdf_url": "https://arxiv.org/pdf/2603.08088", "date": "2026-03-09", "authors": "Chang Han, Yijie Hu, Jingling Liu", "summary_en": "Tree-structured speculation increases parallelism but is brittle when ported across heterogeneous backends and accelerator stacks, where attention masking, KV-cache layouts, and indexing semantics are not interchangeable. EAGLE-Pangu is a reproducible system that ports EAGLE-3-style tree speculative decoding to a Pangu teacher backend on Ascend NPUs. It contributes: (i) an explicit branch/commit cache manager built on the Cache API, (ii) accelerator-safe tree tensorization that removes undefined negative indices by construction and validates structural invariants, and (iii) a fused-kernel-compatible teacher verification path with a debuggable eager fallback. Improves end-to-end decoding throughput by 1.27x on average, up to 2.46x at p99.", "summary_cn": "树形推测增加并行性但在跨异构后端移植时脆弱。EAGLE-Pangu将EAGLE-3风格树推测解码移植到Ascend NPU上的盘古教师后端。贡献：(i)基于Cache API的显式分支/提交缓存管理器，(ii)加速器安全树张量化（移除未定义负索引并验证结构不变量），(iii)兼容融合内核的教师验证路径和可调试的eager回退。端到端解码吞吐平均提升1.27倍，p99时最高2.46倍。", "tags": ["speculative-decoding", "tree-speculation", "ascend-npu", "eagle", "heterogeneous-accelerator"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244677_23", "title": "MoE-Spec: Expert Budgeting for Efficient Speculative Decoding", "topic": "LLM Serving", "category": "Speculative Decoding", "source": "arxiv", "arxiv_id": "2602.16052", "url": "https://arxiv.org/abs/2602.16052", "pdf_url": "https://arxiv.org/pdf/2602.16052", "date": "2026-02-17", "authors": "Bradley McDanel, Steven Li, Sruthikesh Surineni, Harshit Khaitan", "summary_en": "For MoE models, speculative decoding's parallelism introduces a severe bottleneck: large draft trees activate many unique experts, significantly increasing memory pressure and diminishing speedups. Prior methods reduce speculation depth when MoE verification becomes expensive. MoE-Spec is a training-free verification-time expert budgeting method that decouples speculation depth from memory cost by enforcing a fixed expert capacity limit at each layer, loading only the experts that contribute most to verification and dropping the rarely used experts that drive bandwidth overhead. Yields 10-30% higher throughput than EAGLE-3 at comparable quality, with flexibility to trade accuracy for further latency reductions through tighter budgets.", "summary_cn": "对MoE模型，推测解码的并行性引入严重瓶颈：大草稿树激活许多独特专家，增加内存压力并削弱加速。先前方法在MoE验证昂贵时减少推测深度。MoE-Spec是免训练的验证时专家预算方法，通过每层强制固定专家容量限制将推测深度与内存成本解耦，仅加载对验证贡献最大的专家，丢弃驱动带宽开销的罕见专家。吞吐量比EAGLE-3高10-30%，质量可比，可通过更严格预算灵活权衡精度换取更低延迟。", "tags": ["speculative-decoding", "moe", "expert-budgeting", "training-free", "eagle-3"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244677_24", "title": "TALON: Confidence-Aware Speculative Decoding with Adaptive Token Trees", "topic": "LLM Serving", "category": "Speculative Decoding", "source": "arxiv", "arxiv_id": "2601.07353", "url": "https://arxiv.org/abs/2601.07353", "pdf_url": "https://arxiv.org/pdf/2601.07353", "date": "2026-01-12", "authors": "Tianyu Liu, Qitan Lv, Yuhao Shen, Xiao Sun, Xiaoyan Sun", "summary_en": "Recent speculative decoding shifted from sequential chain-based drafting to tree-structured generation, but existing tree-based methods build fixed-width, fixed-depth draft trees that fail to adapt to varying token difficulty. TALON is a training-free, budget-driven adaptive tree expansion framework that can be plugged into existing tree-based methods. It constructs the draft tree iteratively until a fixed token budget is met, using a hybrid expansion strategy that adaptively allocates the node budget to each layer. This naturally shapes the tree into deep-and-narrow for deterministic contexts and shallow-and-wide for uncertain branches. Across 5 models and 6 datasets, TALON consistently outperforms EAGLE-3, achieving up to 5.16x end-to-end speedup over autoregressive decoding.", "summary_cn": "推测解码从顺序链式草稿转向树结构生成，但现有树方法构建固定宽深草稿树，无法适应token难度变化。TALON是免训练的预算驱动自适应树扩展框架，可插入现有树方法。迭代构建草稿树直到固定token预算，使用混合扩展策略自适应分配每层节点预算。自然形成确定性上下文的深窄树和不确定分支的浅宽树。5模型6数据集上一致超越EAGLE-3，自回归解码最高5.16倍端到端加速。", "tags": ["speculative-decoding", "adaptive-tree", "budget-driven", "talon", "eagle-3"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244677_25", "title": "StructKV: Preserving the Structural Skeleton for Scalable Long-Context Inference", "topic": "LLM Serving", "category": "LLM Inference", "source": "arxiv", "arxiv_id": "2604.06746", "url": "https://arxiv.org/abs/2604.06746", "pdf_url": "https://arxiv.org/pdf/2604.06746", "date": "2026-04-08", "authors": "Zhirui Chen", "summary_en": "As LLMs scale to support context windows exceeding one million tokens, KV cache linear growth imposes severe memory and bandwidth bottlenecks. Existing compression approaches prioritize tokens based on local saliency metrics but rely on local saliency snapshots at a specific layer, systematically discarding tokens that act as global information hubs but appear temporarily dormant at the pruning layer. StructKV is a structure-aware KV cache compression framework introducing three innovations: Global In-Degree Centrality aggregates attention patterns across network depth to identify global information hubs; Dynamic Pivot Detection uses information-theoretic metrics to adaptively locate the optimal compression layer; Structural Propagation and Decoupling separates computational budget from memory storage budget. (ACL 2026 Findings)", "summary_cn": "LLM扩展到百万token上下文窗口时，KV缓存线性增长造成严重内存和带宽瓶颈。现有压缩方法基于局部显著性优先排序token，但在特定层依赖局部显著性快照，系统性丢弃作为全局信息枢纽但在修剪层暂时休眠的token。StructKV是结构感知KV缓存压缩框架：全局入度中心性跨网络深度聚合注意力模式识别全局信息枢纽；动态枢纽检测用信息论指标自适应定位最优压缩层；结构传播与解耦分离计算预算与内存存储预算。（ACL 2026 Findings）", "tags": ["kv-cache", "compression", "long-context", "structure-aware", "acl-2026"], "conference": "ACL", "year": "2026", "added_date": "2026-03-15"}, {"id": "paper_1776244677_26", "title": "EchoKV: Efficient KV Cache Compression via Similarity-Based Reconstruction", "topic": "LLM Serving", "category": "LLM Inference", "source": "arxiv", "arxiv_id": "2603.22910", "url": "https://arxiv.org/abs/2603.22910", "pdf_url": "https://arxiv.org/pdf/2603.22910", "date": "2026-03-24", "authors": "Yixuan Wang, Shiyu Ji, Yijun Liu, Qingfu Zhu, Wanxiang Che", "summary_en": "KV cache memory demand poses a significant bottleneck for LLMs in long-context applications. Existing low-rank compression methods rely on irreversible parameter transformations, sacrificing flexibility to switch back to full-precision inference when memory is abundant. EchoKV is a flexible KV cache compression scheme enabling on-demand transitions between standard and compressed inference. Unlike traditional compression-decompression paradigms, EchoKV utilizes a lightweight network to reconstruct residual KV components from a partial subset, leveraging intrinsic inter-layer and intra-layer similarities among attention heads. A two-stage fine-tuning strategy allows rapid low-cost training (~1 A100 GPU-hour for a 7B model). On LongBench and RULER, EchoKV consistently outperforms existing methods across various compression ratios while maintaining high throughput for short-context scenarios.", "summary_cn": "KV缓存内存需求是LLM长上下文应用的重要瓶颈。现有低秩压缩方法依赖不可逆参数变换，牺牲在内存充足时切换回全精度推理的灵活性。EchoKV是灵活的KV缓存压缩方案，实现标准和压缩推理之间的按需切换。利用轻量网络从部分子集重建残余KV分量，利用注意力头间层内和层间固有相似性。两阶段微调策略实现快速低成本训练（7B模型约1 A100 GPU小时）。在LongBench和RULER上，EchoKV在各种压缩比下一致超越现有方法，同时保持短上下文场景的高吞吐。", "tags": ["kv-cache", "compression", "similarity-reconstruction", "flexible-inference", "echoKV"], "conference": "arxiv", "year": "2026", "added_date": "2026-03-15"}];
const topics=["KV Cache", "Edge-Cloud", "MoE", "Hardware", "Compression", "Attention", "LLM Serving", "Speculative Decoding"];
let readSet=new Set(JSON.parse(localStorage.getItem('rp_read')||'[]'));
let curFilter='all',curTopic='',curSearch='';

function isR(id){return readSet.has(id)}
function togR(id){isR(id)?readSet.delete(id):readSet.add(id);localStorage.setItem('rp_read',JSON.stringify([...readSet]));render()}
function markAllRead(){P.forEach(p=>readSet.add(p.id));localStorage.setItem('rp_read',JSON.stringify([...readSet]));render()}
function resetRead(){readSet.clear();localStorage.setItem('rp_read','[]');render()}

function getDate(p){return p.added_date||'2026-03-15'}
function daysAgo(d){const t=new Date(),p=new Date(d);return Math.floor((t-p)/86400000)}
function dateLabel(d){const a=daysAgo(d);if(a<=0)return'今天';if(a===1)return'昨天';if(a<=7)return a+'天前';return d}

function initTopics(){
const row=document.getElementById('topicRow');
topics.forEach(t=>{const c=document.createElement('div');c.className='fchip';c.dataset.topic=t;c.textContent=t;c.onclick=()=>{curTopic=curTopic===t?'':t;row.querySelectorAll('.fchip').forEach(x=>x.classList.toggle('on',x.dataset.topic===curTopic));render()};row.appendChild(c)})
}

function render(){
const list=document.getElementById('plist');
const search=curSearch.toLowerCase();

let filtered=P.filter(p=>{
const read=isR(p.id),age=daysAgo(getDate(p));
let mf=curFilter==='all'||(curFilter==='unread'&&!read)||(curFilter==='read'&&read);
let mt=!curTopic||p.topic===curTopic;
let ms=!search||(p.title||'').toLowerCase().includes(search)||(p.authors||'').toLowerCase().includes(search)||(p.topic||'').toLowerCase().includes(search);
return mf&&mt&&ms;
});

// 统计
const today=new Date().toISOString().split('T')[0];
const newP=P.filter(p=>!isR(p.id)).length;
const readP=P.filter(p=>isR(p.id)).length;
const todayP=P.filter(p=>getDate(p)===today).length;
document.getElementById('sTotal').textContent=P.length;
document.getElementById('sNew').textContent=newP;
document.getElementById('sRead').textContent=readP;
document.getElementById('sToday').textContent=todayP;

if(!filtered.length){list.innerHTML='<div class="empty">📭 没有匹配的论文</div>';return}

// 按日期分组
const groups={};
filtered.sort((a,b)=>daysAgo(getDate(b))-daysAgo(getDate(a)));
filtered.forEach(p=>{
const age=daysAgo(getDate(p));
let label;
if(age<=0)label='0|今天新增';
else if(age===1)label='1|昨天新增';
else if(age<=7)label='2|最近7天';
else label='3|更早';
if(!groups[label])groups[label]=[];
groups[label].push(p);
});

const order=['0|今天新增','1|昨天新增','2|最近7天','3|更早'];
let html='';
order.forEach(key=>{
if(!groups[key])return;
const[label]=key.split('|');
const badgeClass=label==='0'?'badge-new':label==='1'?'badge-recent':'badge-old';
html+=`<div class="group-label"><span>${key.split('|')[1]}</span><span class="${badgeClass}">${groups[key].length}篇</span></div>`;
groups[key].forEach(p=>{
const read=isR(p.id),age=daysAgo(getDate(p));
const isNew=age<=1&&!read;
html+=`<div class="pcard ${read?'pcard-read':'pcard-unread'}">
${isNew?'<div class="pcard-newtag">NEW</div>':''}
<div class="pcard-top"><div class="pcard-title">${p.title||'Untitled'}</div><span class="pcard-check" onclick="togR(${p.id})">${read?'✅':'⭕'}</span></div>
<div class="pcard-auth">${p.authors||''}</div>
<div class="pcard-tags"><span class="ptag ptag-c">${p.conference||'arXiv'}</span><span class="ptag ptag-t">${p.topic||''}</span>${!read?'<span class="ptag ptag-u">未读</span>':''}${read?'<span class="ptag ptag-r">已读</span>':''}</div>
<div class="pcard-foot">
${p.arxiv_id?'<a href="https://arxiv.org/abs/'+p.arxiv_id+'" target="_blank">📄 arXiv</a>':''}
${p.github_repo?'<a href="https://github.com/'+p.github_repo+'" target="_blank">🐙 GitHub</a>':''}
<a href="javascript:void(0)" onclick="openDet(${p.id})">📖 详情 →</a>
</div>
${(p.abstract_en||p.abstract_cn)?'<button class="pcard-abs-btn" onclick="togAbs('+p.id+',this)">展开摘要</button><div class="pcard-abs" id="abs-'+p.id+'">'+(p.abstract_en?'<b>Abstract:</b> '+p.abstract_en.substring(0,400)+'...':'')+(p.abstract_cn?'<br><b>摘要:</b> '+p.abstract_cn.substring(0,300)+'...':'')+'</div>':''}
</div>`;
});
});
list.innerHTML=html;
}

function togAbs(id,btn){
const el=document.getElementById('abs-'+id);
if(el.classList.contains('show')){el.classList.remove('show');btn.textContent='展开摘要'}
else{el.classList.add('show');btn.textContent='收起摘要'}
}

function openDet(id){
const p=P.find(x=>x.id===id);if(!p)return;
document.getElementById('plist').style.display='none';
document.querySelector('.filterbar').style.display='none';
document.querySelector('.search').style.display='none';
document.getElementById('det').classList.add('on');

document.getElementById('detTitle').textContent=p.title||'';
document.getElementById('detAuth').textContent=p.authors||'';
document.getElementById('detTags').innerHTML='<span class="ptag ptag-c">'+(p.conference||'arXiv')+'</span><span class="ptag ptag-t">'+(p.topic||'')+'</span>';
let links='';
if(p.arxiv_id)links+='<a href="https://arxiv.org/abs/'+p.arxiv_id+'" target="_blank">📄 arXiv</a>';
if(p.github_repo)links+='<a href="https://github.com/'+p.github_repo+'" target="_blank">🐙 GitHub</a>';
document.getElementById('detLinks').innerHTML=links;

let body='';
if(p.abstract_en)body+='<h3>Abstract</h3><p>'+p.abstract_en+'</p>';
if(p.abstract_cn)body+='<h3>摘要</h3><p>'+p.abstract_cn+'</p>';
if(p.intro_en)body+='<h3>1. Introduction</h3><p>'+p.intro_en+'</p>';
if(p.intro_cn)body+='<h3>引言</h3><p>'+p.intro_cn+'</p>';
if(!body)body='<div class="empty">暂无详细内容</div>';
document.getElementById('detBody').innerHTML=body;

// 自动标记已读
if(!isR(id)){togR(id)}
window.scrollTo(0,0);
}

function back(){
document.getElementById('det').classList.remove('on');
document.getElementById('plist').style.display='block';
document.querySelector('.filterbar').style.display='flex';
document.querySelector('.search').style.display='block';
}

// 筛选事件
document.getElementById('fRow').querySelectorAll('.fchip').forEach(c=>{
c.onclick=()=>{curFilter=c.dataset.f;document.getElementById('fRow').querySelectorAll('.fchip').forEach(x=>x.classList.toggle('on',x.dataset.f===curFilter));render()}
});

document.getElementById('searchI').addEventListener('input',e=>{curSearch=e.target.value;render()});

initTopics();
render();
</script>
</body>
</html>
