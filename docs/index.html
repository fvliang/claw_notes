    <script>
        const papers = [{"id": 1, "title": "ZipServ: Fast and Memory-Efficient LLM Inference with Hardware-Aware Lossless Compression", "authors": "Ruibo Fan, Xiangrui Yu, Xinglin Pan, Zeyu Li, Weile Luo, Qiang Wang, Wei Wang, Xiaowen Chu", "arxiv_id": "2603.17435", "github_repo": "", "conference": "ASPLOS", "year": 2026, "topic": "Hardware", "abstract_en": "Lossless model compression holds tremendous promise for alleviating the memory and bandwidth bottlenecks in bit-exact Large Language Model (LLM) serving. However, existing approaches often result in substantial inference slowdowns due to fundamental design mismatches with GPU architectures: at the kernel level, variable-length bitstreams produced by traditional entropy codecs break SIMT parallelism; at the system level, decoupled pipelines lead to redundant memory traffic. We present ZipServ, a lossless compression framework co-designed for efficient LLM inference. ZipServ introduces Tensor-Core-Aware Triple Bitmap Encoding (TCA-TBE), a novel fixed-length format that enables constant-time, parallel decoding, together with a fused decompression-GEMM (ZipGEMM) kernel that decompresses weights on-the-fly directly into Tensor Core registers. This \"load-compressed, compute-decompressed\" design eliminates intermediate buffers and maximizes compute intensity. Experiments show that ZipServ reduces the model size by up to 30%, achieves up to 2.21x kernel-level speedup over NVIDIA's cuBLAS, and expedites end-to-end inference by an average of 1.22x over vLLM. ZipServ is the first lossless compression system that provides both storage savings and substantial acceleration for LLM inference on GPUs.", "abstract_cn": "## Abstract (摘要)\n\nLossless model compression holds tremendous promise for alleviating the memory and bandwidth bottlenecks in bit-exact Large Language Model (LLM) serving. However, existing approaches often result in substantial inference slowdowns due to fundamental design mismatches with GPU architectures: at the kernel level, variable-length bitstreams produced by traditional entropy codecs break SIMT parallelism; at the system level, decoupled pipelines lead to redundant memory traffic. We present ZipServ, a lossless compression framework co-designed for efficient LLM inference. ZipServ introduces Tensor-Core-Aware Triple Bitmap Encoding (TCA-TBE), a novel fixed-length format that enables constant-time, parallel decoding, together with a fused decompression-GEMM (ZipGEMM) kernel that decompresses weights on-the-fly directly into Tensor Core registers. This \"load-compressed, compute-decompressed\" design eliminates intermediate buffers and maximizes compute intensity. Experiments show that ZipServ reduces the model size by up to 30%, achieves up to 2.21x kernel-level speedup over NVIDIA's cuBLAS, and expedites end-to-end inference by an average of 1.22x over vLLM. ZipServ is the first lossless compression system that provides both storage savings and substantial acceleration for LLM inference on GPUs.\n\n---\n\n无压缩模型压缩在实现位精确的大型语言模型（LLM）服务方面具有巨大潜力，可缓解内存和带宽瓶颈。然而，现有方法往往会导致显著的推理减速，这是由于与GPU架构的根本设计不匹配：在内核级别，传统熵编码器产生的可变长度位流破坏了SIMT并行性；在系统级别，解耦的管道导致冗余内存流量。我们提出了ZipServ，这是一种针对高效LLM推理共同设计的无损压缩框架。ZipServ引入了张量核感知的“三重位图编码”（TCA-TBE），这是一种新型的固定长度格式，可实现常量时间并行解码，同时还有一个融合的解压缩GEMM（ZipGEMM）内核，可即时将权重解压缩到张量核寄存器中。这种\"加载压缩、计算解压缩\"的设计消除了中间缓冲区并最大化了计算强度。实验表明，ZipServ可将模型大小减少高达30%，在NVIDIA的cuBLAS上实现高达2.21倍的内核级加速，并在vLLM上实现平均1.22倍的端到端加速。ZipServe是第一个在GPU上为LLM推理同时提供存储节省和显著加速的无损压缩系统。\n\n---", "intro_en": "The transformative power of Large Language Models (LLMs) like GPT-4, LLaMA-3, and Qwen-3 is rooted in their massive scale, enabling a new paradigm of AI applications. However, this immense scale creates significant deployment challenges, making GPU memory and memory bandwidth the primary bottlenecks for LLM serving, especially in resource-constrained environments.\n\nModel compression offers a promising solution for efficient LLM deployment. Most existing approaches are lossy, reducing size by approximating model weights via quantization (e.g., GPTQ, AWQ) or pruning (e.g., SparseGPT). However, such approximations risk accuracy loss. For instance, aggressive 4-bit quantization (e.g., MXFP4) slashes accuracy from 56.0% to 36.2% on LiveCodeBench, while even robust int8 quantization (GPTQ-int8) can cause up to 11.1% loss in long-context reasoning (NOCHA). These risks undermine reliability in safety-critical and user-facing settings, motivating approaches that guarantee bit-exact reproducibility and numerical integrity.\n\nLossless compression offers a compelling alternative by providing bit-exact model representation without accuracy loss. To date, its benefits have largely targeted storage and training workflows. For example, LMC and ZipNN employ Huffman to compress model checkpoints for efficient storage and distribution, while NeuZip and DietGPU mitigate memory and communication overhead during training. Although recent efforts, notably DFloat11, aim to extend these gains to inference, practical efficiency remains elusive. When integrated into serving pipelines, existing lossless techniques incur significant runtime overhead. The decoupled decompression step alone takes 1.56–3.44× the time of the core inference computation. This overhead forces an unpleasant tradeoff between memory efficiency and runtime efficiency.\n\nWe contend that this tradeoff is not fundamental but arises from a mismatch between conventional compression algorithms and modern GPU architectures. The issue manifests at two levels. At the kernel level, traditional entropy codecs (e.g., Huffman or ANS) produce variable-length bitstreams, whose decoding demands serialized, data-dependent operations. These are ill-suited to the lockstep, parallel SIMT execution model of GPU warps, resulting in severe control-flow divergence and compute underutilization. At the system level, most frameworks employ a decoupled inference pipeline: weights are fully decompressed into a global-memory buffer before kernel consumption. This staged execution results in redundant, high-latency memory accesses, eroding compression-provided bandwidth savings and reducing arithmetic intensity during inference.\n\nTo rectify these fundamental algorithm-hardware mismatches, we present ZipServ, the first lossless compression framework co-designed for high-performance LLM inference on GPUs. Our key observation is that the exponent bits of BFloat16 weights in LLMs exhibit a highly skewed, low-entropy distributions in conte", "file": "asplops26/01_ZipServ.md"}, {"id": 2, "title": "Serving Compound Inference Systems on Datacenter GPUs", "authors": "Sriram Devata, Rahul Sukthankar, Saurabh Adya", "arxiv_id": "2603.08797", "github_repo": "", "conference": "ASPLOS", "year": 2026, "topic": "LLM Serving", "abstract_en": "Applications in emerging domains such as XR are being built as compound inference systems, where multiple ML models are composed in the form of a task graph to service each request. Serving these compound systems efficiently raises two questions: how to apportion end-to-end latency and accuracy budgets between different tasks in a compound inference system, and how to allocate resources effectively for different models with varying resource requirements. We present JigsawServe, the first serving framework that jointly optimizes for latency, accuracy, and cost in terms of GPU resources by adaptively choosing model variants and performing fine-grained resource allocation by spatially partitioning the GPUs for each task of a compound inference system. Analytical evaluation of a system with a large number of GPUs shows that JigsawServe can increase the maximum serviceable demand (in requests per second) by 11.3x when compared to the closest prior work. Our empirical evaluation shows that for a large range of scenarios, JigsawServe consumes only 43.3% of the available GPU resources while meeting accuracy SLOs with less than 0.6% latency SLO violations. All of the features in JigsawServe contribute to this high efficiency -- sacrificing any one feature of accuracy scaling, GPU spatial partitioning, or task-graph-informed resource budgeting significantly reduces efficiency.", "abstract_cn": "## Abstract (摘要)\n\nApplications in emerging domains such as XR are being built as compound inference systems, where multiple ML models are composed in the form of a task graph to service each request. Serving these compound systems efficiently raises two questions: how to apportion end-to-end latency and accuracy budgets between different tasks in a compound inference system, and how to allocate resources effectively for different models with varying resource requirements. We present JigsawServe, the first serving framework that jointly optimizes for latency, accuracy, and cost in terms of GPU resources by adaptively choosing model variants and performing fine-grained resource allocation by spatially partitioning the GPUs for each task of a compound inference system. Analytical evaluation of a system with a large number of GPUs shows that JigsawServe can increase the maximum serviceable demand (in requests per second) by 11.3x when compared to the closest prior work. Our empirical evaluation shows that for a large range of scenarios, JigsawServe consumes only 43.3% of the available GPU resources while meeting accuracy SLOs with less than 0.6% latency SLO violations. All of the features in JigsawServe contribute to this high efficiency -- sacrificing any one feature of accuracy scaling, GPU spatial partitioning, or task-graph-informed resource budgeting significantly reduces efficiency.\n\n---\n\n在XR等新兴领域的应用正被构建为复合推理系统，其中多个ML模型以任务图的形式组合来服务每个请求。高效地服务这些复合系统提出了两个问题：如何在复合推理系统的不同任务之间分配端到端延迟和精度预算，以及如何有效地为具有不同资源需求的模型分配资源。我们提出了JigsawServe，这是第一个通过为复合推理系统的每个任务自适应选择模型变体并执行细粒度资源分配（通过空间分割GPU）来共同优化延迟、精度和GPU资源成本的推理服务框架。对拥有大量GPU的系统进行分析评估表明，与最接近的先前工作相比，JigsawServe可以将最大可服务需求（每秒请求数）提高11.3倍。我们的实证评估表明，在大范围的场景中，JigsawServe仅消耗43.3%的可用GPU资源，同时满足精度SLO，延迟SLO违规率低于0.6%。JigsawServe的所有特性都有助于实现这一高效率——牺牲精度扩展、GPU空间分割或任务图知情的资源预算中的任何一个特性都会显著降低效率。\n\n---", "intro_en": "As machine learning (ML) inference becomes a dominant workload for datacenter resources, there is growing emphasis on maximizing the efficiency of inference serving systems. Compound inference systems are becoming increasingly important in many emerging domains such as multi-agent systems and extended reality (XR). Such systems compose multiple ML models, each performing a specific task, to provide complex functionalities, and present new challenges and opportunities for increased efficiency. This work focuses on efficient serving of compound inference systems on datacenter GPUs, where each request requires invoking a directed acyclic graph (DAG) of ML inference tasks, which are potentially dynamically determined.\n\nWe focus on two aspects that are unique to compound inference systems. First, we expect that any latency and accuracy Service Level Objectives (SLOs) are provided for the end-to-end compound inference system and need to be apportioned among the individual tasks. This affords new sources of flexibility for the serving system to choose among multiple model variants (with different latencies and accuracies) and GPU resource allocation for each task, when compared to a single task system with a given SLO constraint. Second, the ML model variants across the various tasks in a compound inference system have different resource requirements, motivating finer-grained heterogeneity in the optimal resource choice for the different tasks. Recent GPU hardware provide spatial partitioning mechanisms that enable fine-grained allocation of GPU resources. For example, NVIDIA GPUs provide spatial partitioning mechanisms such as Multi-Process Service (MPS) and Multi-Instance GPU (MIG).\n\nWe present JigsawServe, the first work to jointly optimize for latency, accuracy, and fine-grained cost (in terms of GPU resources required) by adaptively choosing model variants and allocating fine-grained spatial partitions of GPUs for each task of a compound inference system, while preserving end-to-end accuracy and latency SLOs.\n\nThere is a plethora of literature on increasing the efficiency of serving systems for requests with a single model inference, including systems that perform accuracy scaling and spatial partitioning. Compound inference systems have received relatively less attention. Table 1 summarizes key prior works that consider resource budgeting for compound inference systems, accuracy scaling through different model variants of a task, and/or spatial partitioning of GPU resources.\n\nSpecifically, we make the following contributions:\n\n- 1. We introduce JigsawServe, a novel framework to jointly optimize latency, accuracy, and fine-grained cost for compound inference systems on datacenter GPUs. JigsawServe uniquely combines: (1) per-task accuracy scaling via choosing model variants, (2) GPU spatial partitioning, and (3) task-graph-informed latency and accuracy SLO budgeting.\n\n- 2. Our analytical evaluation compares the various combinations of the features. ", "file": "asplops26/02_JigsawServe.md"}, {"id": 3, "title": "Ouroboros: Wafer-Scale SRAM CIM with Token-Grained Pipelining for Large Language Model Inference", "authors": "Yiqi Liu, Cheng Liu, Zhen Gu, Tianchen Ding, Zongyue Zhao, Ziyu Yang, Yufei Ding, Yibo Lin, Mingjie Lin, Xiaowei Li, Zidong Du, Chen Liu, Yunji Chen", "arxiv_id": "2603.02737", "github_repo": "", "conference": "ASPLOS", "year": 2026, "topic": "Hardware", "abstract_en": "Conventional LLM inference architectures suffer from high energy and latency due to frequent data movement across memory hierarchies. We propose Ouroboros, a wafer-scale SRAM-based Computing-in-Memory (CIM) architecture that executes all operations in situ, eliminating off-chip migration. To maximize its limited first-level capacity, we introduce three innovations:\n\n1. **Token-Grained Pipelining**: Replaces sequence-level pipelining to mitigate length variations, boosting utilization and reducing activation storage.\n\n2. **Distributed Dynamic KV Cache Management**: Decouples memory from compute to leverage fragmented SRAM for efficient KV storage.\n\n3. **Communication-Aware Mapping**: Optimizes core allocation for locality and fault tolerance across the wafer.\n\nExperimental results show Ouroboros achieves average gains of 4.1× in throughput and 4.2× in energy efficiency, peaking at 9.1× and 17× for the 13B model.", "abstract_cn": "## Abstract (摘要)\n\nConventional LLM inference architectures suffer from high energy and latency due to frequent data movement across memory hierarchies. We propose Ouroboros, a wafer-scale SRAM-based Computing-in-Memory (CIM) architecture that executes all operations in situ, eliminating off-chip migration. To maximize its limited first-level capacity, we introduce three innovations:\n\n1. **Token-Grained Pipelining**: Replaces sequence-level pipelining to mitigate length variations, boosting utilization and reducing activation storage.\n\n2. **Distributed Dynamic KV Cache Management**: Decouples memory from compute to leverage fragmented SRAM for efficient KV storage.\n\n3. **Communication-Aware Mapping**: Optimizes core allocation for locality and fault tolerance across the wafer.\n\nExperimental results show Ouroboros achieves average gains of 4.1× in throughput and 4.2× in energy efficiency, peaking at 9.1× and 17× for the 13B model.\n\n---\n\n传统的LLM推理架构由于跨内存层次结构的频繁数据移动而遭受高能耗和高延迟。我们提出了Ouroboros，这是一种基于晶圆级SRAM的存算一体（CIM）架构，在本地执行所有操作，消除了芯片外迁移。为了最大化其有限的一级容量，我们引入了三个创新：\n\n1. **Token级流水线**：用序列级流水线替换以缓解长度变化，提高利用率并减少激活存储。\n\n2. **分布式动态KV缓存管理**：将内存与计算解耦，以利用碎片化SRAM进行高效的KV存储。\n\n3. **通信感知映射**：优化晶圆上核心分配的局部性和容错性。\n\n实验结果表明，Ouroboros在吞吐量上平均实现4.1倍的提升，在能效上实现4.2倍的提升，在13B模型上分别达到9.1倍和17倍的峰值。\n\n---", "intro_en": "*(注：本文获取introduction失败，仅获取到摘要内容。如需完整introduction，建议下载PDF：https://arxiv.org/pdf/2603.02737)*\n\nThe development of Large Language Models (LLMs) has revolutionized artificial intelligence, but their deployment faces significant challenges due to the massive computational and memory requirements. Conventional LLM inference architectures suffer from high energy consumption and latency because of frequent data movement across memory hierarchies.\n\nTo address these challenges, we propose Ouroboros, a wafer-scale SRAM-based Computing-in-Memory (CIM) architecture designed specifically for efficient LLM inference. The key innovation of Ouroboros is that it executes all operations in situ, completely eliminating the need for off-chip data migration.", "file": "asplops26/03_Ouroboros.md"}, {"id": 4, "title": "LAER-MoE: Load-Adaptive Expert Re-layout for Efficient Mixture-of-Experts Training", "authors": "Xinyi Liu, Zijian Zhang, YongLi Zhu, Jiale Zhang, Peng Sun, XuanWang, Qi Qi, Jingren Zhou, Tong Yang, Bin Cui", "arxiv_id": "2602.11686", "github_repo": "", "conference": "ASPLOS", "year": 2026, "topic": "MoE", "abstract_en": "Expert parallelism is vital for effectively training Mixture-of-Experts (MoE) models, enabling different devices to host distinct experts, with each device processing different input data. However, during expert parallel training, dynamic routing results in significant load imbalance among experts: a handful of overloaded experts hinder overall iteration, emerging as a training bottleneck.\n\nIn this paper, we introduce LAER-MoE, an efficient MoE training framework. The core of LAER-MoE is a novel parallel paradigm, Fully Sharded Expert Parallel (FSEP), which fully partitions each expert parameter by the number of devices and restores partial experts at expert granularity through All-to-All communication during training. This allows for flexible re-layout of expert parameters during training to enhance load balancing. In particular, we perform fine-grained scheduling of communication operations to minimize communication overhead. Additionally, we develop a load balancing planner to formulate re-layout strategies of experts and routing schemes for tokens during training. We perform experiments on an A100 cluster, and the results indicate that our system achieves up to 1.69x acceleration compared to the current state-of-the-art training systems. Source code available at this https URL.", "abstract_cn": "## Abstract (摘要)\n\nExpert parallelism is vital for effectively training Mixture-of-Experts (MoE) models, enabling different devices to host distinct experts, with each device processing different input data. However, during expert parallel training, dynamic routing results in significant load imbalance among experts: a handful of overloaded experts hinder overall iteration, emerging as a training bottleneck.\n\nIn this paper, we introduce LAER-MoE, an efficient MoE training framework. The core of LAER-MoE is a novel parallel paradigm, Fully Sharded Expert Parallel (FSEP), which fully partitions each expert parameter by the number of devices and restores partial experts at expert granularity through All-to-All communication during training. This allows for flexible re-layout of expert parameters during training to enhance load balancing. In particular, we perform fine-grained scheduling of communication operations to minimize communication overhead. Additionally, we develop a load balancing planner to formulate re-layout strategies of experts and routing schemes for tokens during training. We perform experiments on an A100 cluster, and the results indicate that our system achieves up to 1.69x acceleration compared to the current state-of-the-art training systems. Source code available at this https URL.\n\n---\n\n专家并行对于有效训练混合专家（MoE）模型至关重要，使不同设备托管不同的专家，每个设备处理不同的输入数据。然而，在专家并行训练期间，动态路由导致专家之间严重的负载不平衡：少数过载的专家阻碍整体迭代，成为训练瓶颈。\n\n在本文中，我们介绍了LAER-MoE，一个高效的MoE训练框架。LAER-MoE的核心是一种新颖的并行范式——完全分片专家并行（FSEP），它通过设备数量完全分割每个专家参数，并在训练期间通过All-to-All通信在专家粒度上恢复部分专家。这允许在训练期间灵活重新布局专家参数以增强负载平衡。特别是，我们执行细粒度的通信操作调度以最小化通信开销。此外，我们开发了一个负载平衡规划器，用于制定训练期间专家的重新布局策略和token路由方案。我们在A100集群上进行了实验，结果表明我们的系统比当前最先进的训练系统实现了高达1.69倍的加速。源代码可在https://github.com/PKU-DAIR/Hetu-Galvatron/tree/laer-moe获取。\n\n---", "intro_en": "", "file": "asplops26/04_LAER-MoE.md"}, {"id": 5, "title": "SpeContext: Enabling Efficient Long-context Reasoning with Speculative Context Sparsity in LLMs", "authors": "Jiaming Xu, Hong Cao, Yuhan Lin, Jinyang Li, Zheng Liu, Jie Liu, Xingyu Li, Jin Wang, Jingyuan Jia, Ge Li", "arxiv_id": "2512.00722", "github_repo": "", "conference": "ASPLOS", "year": 2026, "topic": "Speculative Decoding", "abstract_en": "In this paper, we point out that the objective of the retrieval algorithms is to align with the LLM, which is similar to the objective of knowledge distillation in LLMs. We analyze the similarity in information focus between the distilled language model (DLM) and the original LLM from the perspective of information theory, and thus propose a novel paradigm that leverages a DLM as the retrieval algorithm. Based on the insight, we present SpeContext, an algorithm and system co-design for long-context reasoning.\n\n1. **At the algorithm level**: SpeContext proposes lightweight retrieval head based on the head-level attention weights of DLM, achieving >90% parameters reduction by pruning the redundancy.\n\n2. **At the system level**: SpeContext designs an asynchronous prefetch dataflow via the elastic loading strategy, effectively overlapping KV cache retrieval with the LLM computation.\n\n3. **At the compilation level**: SpeContext constructs the theoretical memory model and implements an adaptive memory management system to achieve acceleration by maximizing GPU memory utilization.\n\nWe deploy and evaluate SpeContext in two resource-constrained environments, cloud and edge. Extensive experiments show that, compared with the Huggingface framework, SpeContext achieves up to 24.89x throughput improvement in cloud and 10.06x speedup in edge with negligible accuracy loss, pushing the Pareto frontier of accuracy and throughput.", "abstract_cn": "## Abstract (摘要)\n\nIn this paper, we point out that the objective of the retrieval algorithms is to align with the LLM, which is similar to the objective of knowledge distillation in LLMs. We analyze the similarity in information focus between the distilled language model (DLM) and the original LLM from the perspective of information theory, and thus propose a novel paradigm that leverages a DLM as the retrieval algorithm. Based on the insight, we present SpeContext, an algorithm and system co-design for long-context reasoning.\n\n1. **At the algorithm level**: SpeContext proposes lightweight retrieval head based on the head-level attention weights of DLM, achieving >90% parameters reduction by pruning the redundancy.\n\n2. **At the system level**: SpeContext designs an asynchronous prefetch dataflow via the elastic loading strategy, effectively overlapping KV cache retrieval with the LLM computation.\n\n3. **At the compilation level**: SpeContext constructs the theoretical memory model and implements an adaptive memory management system to achieve acceleration by maximizing GPU memory utilization.\n\nWe deploy and evaluate SpeContext in two resource-constrained environments, cloud and edge. Extensive experiments show that, compared with the Huggingface framework, SpeContext achieves up to 24.89x throughput improvement in cloud and 10.06x speedup in edge with negligible accuracy loss, pushing the Pareto frontier of accuracy and throughput.\n\n---\n\n在本文中，我们指出检索算法的目标是与LLM对齐，这类似于LLM中知识蒸馏的目标。我们从信息论的角度分析了蒸馏语言模型（DLM）和原始LLM之间信息聚焦的相似性，从而提出了一种利用DLM作为检索算法的新范式。基于这一洞察，我们提出了SpeContext，一个用于长上下文推理的算法和系统协同设计。\n\n1. **算法层面**：SpeContext提出了基于DLM头级注意力权重的轻量级检索头，通过剪枝冗余实现了超过90%的参数减少。\n\n2. **系统层面**：SpeContext通过弹性加载策略设计了异步预取数据流，有效地将KV缓存检索与LLM计算重叠。\n\n3. **编译层面**：SpeContext构建了理论内存模型并实现了自适应内存管理系统，以通过最大化GPU内存利用率来实现加速。\n\n我们在云和边缘两种资源受限环境中部署和评估SpeContext。大量实验表明，与Huggingface框架相比，SpeContext在云端实现了高达24.89倍的吞吐量提升，在边缘实现了10.06倍的加速，而精度损失可忽略不计，推动了精度和吞吐量的帕累托前沿。\n\n---", "intro_en": "", "file": "asplops26/05_SpeContext.md"}, {"id": 6, "title": "RedFuser: An Automatic Operator Fusion Framework for Cascaded Reductions on AI Accelerators", "authors": "Xinsheng Tang, Yuhui Zhao, Jintao Li, Jiaming Xu, Shuo Li, Jiansong Chen, Chen Zhang, Yong Li, Xiaoyong Liu, Ji Liu, Jin Wang, Wei Lin", "arxiv_id": "2603.10026", "github_repo": "", "conference": "ASPLOS", "year": 2026, "topic": "LLM Serving", "abstract_en": "Operator fusion, as a key performance optimization technique in the deployment of AI models, significantly improves execution efficiency and has been widely adopted in modern AI compilers. However, for cascaded reduction operations involving multiple loops with inter-loop data dependencies, such as the safe softmax followed by GEMM within attention mechanisms, existing compilers lack effective automated fusion and kernel generation capabilities. Although some works have addressed specific instances through hand-crafted fusion strategies, their solutions are limited in generality and difficult to extend to other similar structures. Given the prevalence of such computational patterns in deep learning models, there remains significant untapped potential in achieving general and automated fusion optimization.\n\nIn this paper, we present a formal theoretical methodology for analyzing cascaded reductions which can fuse them into a single loop and introduce an incremental computation form. Based on this methodology, we design Reduction Fuser (RedFuser), a framework that automatically identifies supported cascaded reduction patterns and generates optimized fused kernels. Experiments show that RedFuser successfully fuses diverse workloads, achieving up to 2× to 5× speedup over state-of-the-art AI compilers and matching the performance of highly optimized hand-written kernels. The code is available at this https URL.", "abstract_cn": "## Abstract (摘要)\n\nOperator fusion, as a key performance optimization technique in the deployment of AI models, significantly improves execution efficiency and has been widely adopted in modern AI compilers. However, for cascaded reduction operations involving multiple loops with inter-loop data dependencies, such as the safe softmax followed by GEMM within attention mechanisms, existing compilers lack effective automated fusion and kernel generation capabilities. Although some works have addressed specific instances through hand-crafted fusion strategies, their solutions are limited in generality and difficult to extend to other similar structures. Given the prevalence of such computational patterns in deep learning models, there remains significant untapped potential in achieving general and automated fusion optimization.\n\nIn this paper, we present a formal theoretical methodology for analyzing cascaded reductions which can fuse them into a single loop and introduce an incremental computation form. Based on this methodology, we design Reduction Fuser (RedFuser), a framework that automatically identifies supported cascaded reduction patterns and generates optimized fused kernels. Experiments show that RedFuser successfully fuses diverse workloads, achieving up to 2× to 5× speedup over state-of-the-art AI compilers and matching the performance of highly optimized hand-written kernels. The code is available at this https URL.\n\n---\n\n算子融合作为AI模型部署中的关键性能优化技术，显著提高了执行效率，并已被现代AI编译器广泛采用。然而，对于涉及循环间数据依赖的级联归约操作，例如注意力机制中的安全softmax后接GEMM，现有编译器缺乏有效的自动融合和内核生成能力。虽然一些工作通过手工融合策略解决了特定实例，但其解决方案通用性有限，难以扩展到其他类似结构。鉴于此类计算模式在深度学习模型中的普遍性，在实现通用和自动融合优化方面仍有显著的未开发潜力。\n\n在本文中，我们提出了一种形式化的理论方法来分析级联归约，可以将其融合到单个循环中并引入增量计算形式。基于这种方法，我们设计了Reduction Fuser（RedFuser），这是一个自动识别支持的级联归约模式并生成优化融合内核的框架。实验表明，RedFuser成功融合了多样化的工作负载，在最先进的AI编译器上实现了高达2倍到5倍的加速，并与高度优化的手工内核性能相匹配。代码可在https://github.com/alibaba/redfuser获取。\n\n---", "intro_en": "", "file": "asplops26/06_RedFuser.md"}, {"id": 7, "title": "SNIP: An Adaptive Mixed Precision Framework for Subbyte Large Language Model Training", "authors": "Yunjie Pan, Yao Fu, Ziheng Qiao, Chengmai Mao, Yining Qi, Tianchen Du, Hongxiang Li, Lanbo Li, Chen Liang, Yong Li, Dilin Wang, Wei Liu", "arxiv_id": "2602.01410", "github_repo": "", "conference": "ASPLOS", "year": 2026, "topic": "LLM Serving", "abstract_en": "Training large language models (LLMs) efficiently while preserving model quality poses significant challenges, particularly with subbyte precision supported by state-of-the-art GPUs. Current mixed-precision training approaches either apply uniform precision to all GEMM operations or rely on heuristic-based methods that fail to generalize during training, leading to suboptimal convergence and instability. To address these challenges, this paper introduces SNIP, a fine-grained adaptive mixed-precision training framework for LLM pretraining that supports subbyte precision.\n\nSNIP periodically collects statistics on activations, gradients, and optimizer states to assess the precision loss impact on model quality. We define two key metrics:\n\n- **Loss divergence in the forward pass**: Caused by quantization-induced increases in training loss\n- **Weight divergence in the backward pass**: Measures error propagation through gradients affecting model updates\n\nThese metrics guide an Integer Linear Programming (ILP) problem that systematically optimizes layerwise precision to minimize overall quality loss while meeting efficiency targets.\n\nExperiments on 1B, 3B, 7B and 70B Llama-like models demonstrate that SNIP consistently outperforms existing baselines, reducing FLOPs by up to 80% while preserving model quality across different model sizes and training phases with minimal computational overhead.", "abstract_cn": "## Abstract (摘要)\n\nTraining large language models (LLMs) efficiently while preserving model quality poses significant challenges, particularly with subbyte precision supported by state-of-the-art GPUs. Current mixed-precision training approaches either apply uniform precision to all GEMM operations or rely on heuristic-based methods that fail to generalize during training, leading to suboptimal convergence and instability. To address these challenges, this paper introduces SNIP, a fine-grained adaptive mixed-precision training framework for LLM pretraining that supports subbyte precision.\n\nSNIP periodically collects statistics on activations, gradients, and optimizer states to assess the precision loss impact on model quality. We define two key metrics:\n\n- **Loss divergence in the forward pass**: Caused by quantization-induced increases in training loss\n- **Weight divergence in the backward pass**: Measures error propagation through gradients affecting model updates\n\nThese metrics guide an Integer Linear Programming (ILP) problem that systematically optimizes layerwise precision to minimize overall quality loss while meeting efficiency targets.\n\nExperiments on 1B, 3B, 7B and 70B Llama-like models demonstrate that SNIP consistently outperforms existing baselines, reducing FLOPs by up to 80% while preserving model quality across different model sizes and training phases with minimal computational overhead.\n\n---\n\n在保持模型质量的同时高效训练大型语言模型（LLM）提出了重大挑战，特别是支持最新GPU的子字节精度。当前的混合精度训练方法要么对所有GEMM操作应用统一精度，要么依赖基于启发式的方法，这些方法在训练期间无法泛化，导致次优收敛和不稳定性。为了应对这些挑战，本文介绍了SNIP，这是一个用于LLM预训练的细粒度自适应混合精度训练框架，支持子字节精度。\n\nSNIP定期收集激活、梯度和优化器状态的统计数据，以评估精度损失对模型质量的影响。我们定义了两个关键指标：\n\n- **前向传播中的损失发散**：由量化导致的训练损失增加引起\n- **后向传播中的权重发散**：通过影响模型更新的梯度测量误差传播\n\n这些指标指导整数线性规划（ILP）问题，系统地优化逐层精度，以在满足效率目标的同时最小化整体质量损失。\n\n在1B、3B、7B和70B Llama类模型上的实验表明，SNIP始终优于现有基线，在不同模型大小和训练阶段以最小计算开销保持模型质量的同时，最多减少80%的FLOP。\n\n---", "intro_en": "", "file": "asplops26/07_SNIP.md"}, {"id": 8, "title": "M2XFP: A Metadata-Augmented Microscaling Data Format for Efficient Low-bit Quantization", "authors": "Weiming Hu, Zihan Zhang, Haoyan Zhang, Chen Zhang, Cong Guo, Yu Feng, Tianchi Hu, Guanglin Li, Guipeng Hu, Junsong Wang, Jingwen Leng", "arxiv_id": "2601.19213", "github_repo": "", "conference": "ASPLOS", "year": 2026, "topic": "LLM Serving", "abstract_en": "Existing low-bit Microscaling (MX) formats, such as MXFP4, often suffer from substantial accuracy degradation due to the use of a shared scaling factor with the Power-of-Two format. In this work, we explore strategies that introduce minimal metadata to recover accuracy lost during quantization while maintaining high bit efficiency across a wide range of large language models.\n\nWe propose a complete algorithm-hardware co-design based on flexible metadata, featuring an online quantization with simple encoding. To support the proposed method efficiently, we implement a lightweight hardware unit and integrate it into the accelerator.\n\nEvaluation results demonstrate that our method substantially narrows the accuracy gap, achieving on average a 70.63% reduction in accuracy loss compared to MXFP4 and a 37.30% reduction relative to the latest NVFP4 on LLM benchmarks. Furthermore, our design delivers up to 1.91× speedup and 1.75× energy savings over state-of-the-art accelerators. Our code is available at this https URL.", "abstract_cn": "## Abstract (摘要)\n\nExisting low-bit Microscaling (MX) formats, such as MXFP4, often suffer from substantial accuracy degradation due to the use of a shared scaling factor with the Power-of-Two format. In this work, we explore strategies that introduce minimal metadata to recover accuracy lost during quantization while maintaining high bit efficiency across a wide range of large language models.\n\nWe propose a complete algorithm-hardware co-design based on flexible metadata, featuring an online quantization with simple encoding. To support the proposed method efficiently, we implement a lightweight hardware unit and integrate it into the accelerator.\n\nEvaluation results demonstrate that our method substantially narrows the accuracy gap, achieving on average a 70.63% reduction in accuracy loss compared to MXFP4 and a 37.30% reduction relative to the latest NVFP4 on LLM benchmarks. Furthermore, our design delivers up to 1.91× speedup and 1.75× energy savings over state-of-the-art accelerators. Our code is available at this https URL.\n\n---\n\n现有的低位微缩放（MX）格式（如MXFP4）由于使用Power-of-Two格式的共享缩放因子，往往会遭受严重的精度下降。在这项工作中，我们探索引入最少元数据的策略，以在量化过程中恢复丢失的精度，同时在广泛的大型语言模型中保持高比特效率。\n\n我们提出了一种基于灵活元数据的完整算法-硬件协同设计，具有简单编码的在线量化。为了有效支持所提出的方法，我们实现了一个轻量级硬件单元并将其集成到加速器中。\n\n评估结果表明，我们的方法显著缩小了精度差距，与MXFP4相比，在LLM基准上平均减少70.63%的精度损失，与最新的NVFP4相比减少37.30%。此外，我们的设计在最先进的加速器上提供高达1.91倍的加速和1.75倍的节能。我们的代码可在https://github.com/SJTU-ReArch-Group/M2XFP_ASPLOS26获取。\n\n---", "intro_en": "", "file": "asplops26/08_M2XFP.md"}, {"id": 9, "title": "Towards High-Goodput LLM Serving with Prefill-decode Multiplexing", "authors": "Yukang Chen, Weihao Cui, Han Zhao, Ziyi Xu, Xiaoze Fan, Xusheng Chen, Yangjie Zhou, Shixuan Sun, Bingsheng He, Quan Chen", "arxiv_id": "2504.14489", "github_repo": "", "conference": "ASPLOS", "year": 2026, "topic": "LLM Serving", "abstract_en": "Large Language Model (LLM) serving must meet stringent Service Level Objectives (SLOs) for both the prefill and decode phases. Some existing solutions disaggregate the two phases, causing potential resource idleness or compute redundancy. Others split the prefill phase into chunks and fuse it with decode iteration, creating a dilemma between SLO compliance and high utilization. To address these issues, an efficient serving system should dynamically adapt compute allocation, decouple compute from memory management, and execute prefill and decode independently. We present MuxWise, an LLM serving framework that adopts a new paradigm, intra-GPU prefill-decode multiplexing, to meet these requirements. To fully exploit the paradigm, MuxWise integrates a bubble-less multiplex engine, a contention-tolerant estimator, and an SLO-aware dispatcher. Evaluation shows that MuxWise improves peak throughput under SLO guarantees by an average of 2.20× (up to 3.06×) over state-of-the-art baselines.", "abstract_cn": "## Abstract (摘要)\n\nLarge Language Model (LLM) serving must meet stringent Service Level Objectives (SLOs) for both the prefill and decode phases. Some existing solutions disaggregate the two phases, causing potential resource idleness or compute redundancy. Others split the prefill phase into chunks and fuse it with decode iteration, creating a dilemma between SLO compliance and high utilization. To address these issues, an efficient serving system should dynamically adapt compute allocation, decouple compute from memory management, and execute prefill and decode independently. We present MuxWise, an LLM serving framework that adopts a new paradigm, intra-GPU prefill-decode multiplexing, to meet these requirements. To fully exploit the paradigm, MuxWise integrates a bubble-less multiplex engine, a contention-tolerant estimator, and an SLO-aware dispatcher. Evaluation shows that MuxWise improves peak throughput under SLO guarantees by an average of 2.20× (up to 3.06×) over state-of-the-art baselines.\n\n---\n\n大型语言模型（LLM）服务必须为预填充和解码两个阶段满足严格的服务水平目标（SLO）。一些现有解决方案将两个阶段分离，导致潜在的资源闲置或计算冗余。其他方案将预填充阶段分块并与解码迭代融合，在SLO合规性和高利用率之间产生两难境地。为了解决这些问题，高效的服务系统应该动态适应计算分配，将计算与内存管理解耦，并独立执行预填充和解码。我们提出了MuxWise，这是一种采用新范式的LLM服务框架——GPU内预填充-解码复用（intra-GPU prefill-decode multiplexing）。为了充分利用这一范式，MuxWise集成了无气泡复用引擎、抗争容限估计器和SLO感知调度器。评估表明，MuxWise在SLO保证下将峰值吞吐量比最先进的基线平均提高2.20倍（最高3.06倍）。\n\n---", "intro_en": "Large language models (LLM) services now perform well across diverse workloads. At the request level, an LLM processes input in two phases: a prefill phase that produces the first token, followed by a decode phase that iteratively generates the remaining tokens. The ratio of input length (prefill) to output length (decode) varies across tasks. At the application level, tasks such as chatbot services or agent-based workloads often consist of multiple turns of requests with shared context.\n\nTo achieve high throughput for serving these workloads, existing LLM serving systems employ several optimizations. While requests arrive at different times, inflight batching stalls the ongoing decode phase to prefill new requests and then processes all decode iterations together in a single batch. It greatly improves compute utilization for the memory-intensive decode phase. Since multi-turn requests share context, LLM serving systems reuse intermediate results (i.e., the KV cache) both within and across requests through a KV cache pool.\n\nLLM services also impose stringent Service Level Objectives (SLOs). For instance, chatbot typically requires Time-To-First-Token (TTFT) under 500 ms for prefill and Time-Between-Tokens (TBT) under 100 ms for decode. Since prefill and decode interleave in an LLM serving system, SLO violations may arise.\n\nTo sustain high goodput–peak throughput with SLO guarantees–existing methods fall into two categories: disaggregated serving and chunked prefill. Disaggregated serving separates the prefill and decode phases into distinct instances, but cannot adapt to serving dynamics and decreases goodput due to shrinking the KV cache pool. Chunked prefill splits the prefill phase into chunks and fuses each chunk with a decode iteration, but creates a dilemma between SLO compliance and high utilization.\n\nWe propose intra-GPU prefill-decode (PD) multiplexing as a promising new serving paradigm. Specifically, the prefill and decode phases are executed on different streaming multiprocessors (SMs) within the GPUs. In the new paradigm: 1) compute partitions can be reconfigured with low overhead to adapt to serving dynamics; 2) multiplexed phases share GPU memory, keeping the KV cache pool efficient; 3) with spatial sharing, prefill and decode execute independently, avoiding the tradeoff between SLO compliance and utilization.\n\nTo this end, we propose MuxWise, an LLM serving framework that achieves high goodput across diverse workloads. MuxWise comprises three modules: a bubble-less multiplex engine, a contention-tolerant estimator, and an SLO-aware dispatcher. Experiments show that MuxWise achieves an average 2.20× goodput improvement (up to 3.06×) over state-of-the-art solutions.", "file": "asplops26/09_Towards_High-Goodput_LLM_Serving.md"}, {"id": 10, "title": "Bullet: Boosting GPU Utilization for LLM Serving through Spatial-Temporal GPU Resource Sharing", "authors": "Zejia Lin, Hongxin Xu, Guanyi Chen, Zhiguang Chen, Yutong Lu, Xianwei Zhang (中山大学)", "arxiv_id": "2504.19516", "github_repo": "", "conference": "ASPLOS", "year": 2026, "topic": "LLM Serving", "abstract_en": "Modern LLM serving systems confront inefficient GPU utilization due to the fundamental mismatch between compute-intensive prefill and memory-bound decode phases. While current practices attempt to address this by organizing these phases into hybrid batches, such solutions create an inefficient tradeoff that sacrifices either throughput or latency, leaving substantial GPU resources underutilized. We identify two key root causes: 1) the prefill phase suffers from suboptimal compute utilization due to wave quantization and attention bottlenecks. 2) hybrid batches disproportionately prioritize latency over throughput, resulting in wasted compute and memory bandwidth. To mitigate the issues, we present Bullet, a novel spatial-temporal orchestration system that eliminates these inefficiencies through precise phase coordination. Bullet enables concurrent execution of prefill and decode phases, while dynamically provisioning GPU resources using real-time performance modeling. By integrating SLO-aware scheduling and adaptive resource allocation, Bullet maximizes utilization without compromising latency targets. Experimental evaluations on real-world workloads demonstrate that Bullet delivers 1.26× average throughput gains (up to 1.55×) over state-of-the-arts, while consistently meeting latency constraints.", "abstract_cn": "## Abstract (摘要)\n\nModern LLM serving systems confront inefficient GPU utilization due to the fundamental mismatch between compute-intensive prefill and memory-bound decode phases. While current practices attempt to address this by organizing these phases into hybrid batches, such solutions create an inefficient tradeoff that sacrifices either throughput or latency, leaving substantial GPU resources underutilized. We identify two key root causes: 1) the prefill phase suffers from suboptimal compute utilization due to wave quantization and attention bottlenecks. 2) hybrid batches disproportionately prioritize latency over throughput, resulting in wasted compute and memory bandwidth. To mitigate the issues, we present Bullet, a novel spatial-temporal orchestration system that eliminates these inefficiencies through precise phase coordination. Bullet enables concurrent execution of prefill and decode phases, while dynamically provisioning GPU resources using real-time performance modeling. By integrating SLO-aware scheduling and adaptive resource allocation, Bullet maximizes utilization without compromising latency targets. Experimental evaluations on real-world workloads demonstrate that Bullet delivers 1.26× average throughput gains (up to 1.55×) over state-of-the-arts, while consistently meeting latency constraints.\n\n---\n\n现代LLM服务系统由于计算密集型预填充阶段和内存密集型解码阶段之间的根本性不匹配而面临GPU利用率低效的问题。虽然当前的做法尝试通过将这些阶段组织成混合批次来解决这个问题，但这种解决方案产生了低效的权衡，牺牲了吞吐量或延迟，导致大量GPU资源未被充分利用。我们确定了两个关键根本原因：1）预填充阶段由于波前量化（wave quantization）和注意力瓶颈导致计算利用率不佳。2）混合批次过度优先考虑延迟而非吞吐量，导致计算和内存带宽浪费。为了缓解这些问题，我们提出了Bullet，这是一种通过精确阶段协调消除这些低效率的新型时空编排系统。Bullet支持预填充和解码阶段的并发执行，同时使用实时性能建模动态配置GPU资源。通过集成SLO感知调度和自适应资源分配，Bullet在不牺牲延迟目标的情况下最大化利用率。在实际工作负载上的实验评估表明，Bullet比最先进的技术提供1.26倍的平均吞吐量提升（最高1.55倍），同时始终满足延迟约束。\n\n---", "intro_en": "GPUs have become the predominant computing platform for large language model (LLM) services, powering a wide range of applications with varying computational and latency demands. As these applications continue to grow in scale and complexity, maximizing GPU utilization has become crucial for elevating service quality. In response, a plethora of systems have been developed to optimize different aspects of LLM serving, such as kernel-level performance, scheduling strategies, and parallelization techniques.\n\nHowever, the divergent computational characteristics of LLM inference make high GPU resource utilization particularly challenging. In detail, the workflow consists of a computationally intensive prefill phase that processes all inputs in parallel, succeeded by a memory-bound decode phase that generates tokens sequentially. These two contrasting phases lead to a structural imbalance in the utilization of computational resources and memory bandwidth. The dynamic nature of workload patterns further exacerbates this imbalance, forcing GPUs to alternate between these complementary resource utilization states.\n\nPrior attempts have sought to address phase imbalance either by isolating prefill and decode across different GPUs, or by coordinating them on the same device through spatial multiplexing. Prefill-decode disaggregation represents the first approach, physically separating the two phases across dedicated GPU groups. However, such systems require careful tuning of GPU allocations for each phase, tailored to specific workload patterns, and struggle to reconfigure quickly under fluctuating request loads. In practice, chunked prefill has been pervasively adopted in production systems. This method leverages a fixed token budget to combine prefill and decode requests into hybrid batches, with longer sequences being partitioned into chunks to fit within capacity.\n\nWe identify a critical limitation that existing approaches often underutilize GPUs, resulting in suboptimal balance between latency and hardware efficiency. First, the attention exhibits relatively low compute utilization compared to linear layers. Second, the throughput-latency tradeoff in chunked prefill exhibits sub-linear scaling with chunk sizes that prolongs execution time for successive chunks. Third, while spatial sharing has the potential to exploit the natural complementarity between compute-intensive prefill and memory-bound decode phases through concurrent execution, effective orchestration is required.\n\nTo address GPU under-utilization and balance the tradeoff between throughput and latency, we propose Bullet, an LLM serving system that saturates GPU resources through spatial-temporal orchestration with fine-grained resource provisioning. Bullet proactively monitors request progress and dynamically adjusts resource provision to sustain high utilization while satisfying latency requirements. The system achieves such efficient execution with four key components: 1) a performance est", "file": "asplops26/10_Bullet.md"}, {"id": 11, "title": "A Pipelined Collaborative Speculative Decoding Framework for Efficient Edge-Cloud LLM Inference", "authors": "Yida Zhang, Zhiyong Gao, Shuaibing Yue, Jie Li, Rui Wang", "arxiv_id": "2603.19133", "github_repo": "", "conference": "ASPLOS", "year": 2026, "topic": "Speculative Decoding", "abstract_en": "Recent advancements and widespread adoption of Large Language Models (LLMs) in both industry and academia have catalyzed significant demand for LLM serving. However, traditional cloud services incur high costs, while on-device inference alone faces challenges due to limited resources. Edge-cloud collaboration emerges as a key research direction to combine the strengths of both paradigms, yet efficiently utilizing limited network bandwidth while fully leveraging and balancing the computational capabilities of edge devices and the cloud remains an open problem. To address these challenges, we propose Pipelined Collaborative Speculative Decoding Framework (PicoSpec), a novel, general-purpose, and training-free speculative decoding framework for LLM edge-cloud collaborative inference. We design an asynchronous pipeline that resolves the mutual waiting problem inherent in vanilla speculative decoding within edge collaboration scenarios, which concurrently executes a Small Language Model (SLM) on the edge device and a LLM in the cloud. Meanwhile, to mitigate the significant communication latency caused by transmitting vocabulary distributions, we introduce separate rejection sampling with sparse compression, which completes the rejection sampling with only a one-time cost of transmitting the compressed vocabulary. Experimental results demonstrate that our solution outperforms baseline and existing methods, achieving up to 2.9 speedup.", "abstract_cn": "## Abstract (摘要)\n\nRecent advancements and widespread adoption of Large Language Models (LLMs) in both industry and academia have catalyzed significant demand for LLM serving. However, traditional cloud services incur high costs, while on-device inference alone faces challenges due to limited resources. Edge-cloud collaboration emerges as a key research direction to combine the strengths of both paradigms, yet efficiently utilizing limited network bandwidth while fully leveraging and balancing the computational capabilities of edge devices and the cloud remains an open problem. To address these challenges, we propose Pipelined Collaborative Speculative Decoding Framework (PicoSpec), a novel, general-purpose, and training-free speculative decoding framework for LLM edge-cloud collaborative inference. We design an asynchronous pipeline that resolves the mutual waiting problem inherent in vanilla speculative decoding within edge collaboration scenarios, which concurrently executes a Small Language Model (SLM) on the edge device and a LLM in the cloud. Meanwhile, to mitigate the significant communication latency caused by transmitting vocabulary distributions, we introduce separate rejection sampling with sparse compression, which completes the rejection sampling with only a one-time cost of transmitting the compressed vocabulary. Experimental results demonstrate that our solution outperforms baseline and existing methods, achieving up to 2.9 speedup.\n\n---\n\n大型语言模型（LLM）在工业界和学术界的最新进展和广泛采用引发了对其服务的巨大需求。然而，传统的云服务成本高昂，而纯设备端推理由于资源有限而面临挑战。边缘云协作成为一个关键研究方向，结合两种范式的优势，但在有效利用有限网络带宽的同时充分利用和平衡边缘设备和云的计算能力仍然是一个开放问题。为了应对这些挑战，我们提出了流水线协作投机解码框架（PicoSpec），这是一种新颖的、通用的、无需训练的投机解码框架，用于LLM边缘云协作推理。我们设计了一个异步流水线，解决了边缘协作场景中 vanilla 投机解码固有的相互等待问题，该流水线在边缘设备上并行执行小型语言模型（SLM），在云上执行LLM。同时，为了减轻传输词汇分布引起的大量通信延迟，我们引入了稀疏压缩的独立拒绝采样，只需一次性传输压缩词汇即可完成拒绝采样。实验结果表明，我们的解决方案优于基线和现有方法，实现了高达2.9倍的加速。\n\n---", "intro_en": "*(摘要内容有限，建议下载PDF获取完整引言)*\n\nLarge Language Models (LLMs) have become increasingly important in both industry and academia. However, traditional cloud-based LLM services face challenges of high costs and latency, while on-device inference is limited by hardware resources. Edge-cloud collaboration has emerged as a promising direction to address these challenges.\n\nThe key contributions of this paper include:\n1. **PicoSpec Framework**: A novel pipelined collaborative speculative decoding framework\n2. **Asynchronous Pipeline**: Resolves the mutual waiting problem in edge-cloud scenarios\n3. **Sparse Compression**: Reduces communication latency with compressed vocabulary", "file": "asplops26/11_PicoSpec.md"}, {"id": 12, "title": "KV Cache Optimization Strategies for Scalable and Efficient LLM Inference", "authors": "Yichun Xu, Navjot K. Khaira, Tejinder Singh", "arxiv_id": "2603.20397", "github_repo": "", "conference": "ASPLOS", "year": 2026, "topic": "KV Cache", "abstract_en": "The key-value (KV) cache is a foundational optimization in Transformer-based large language models (LLMs), eliminating redundant recomputation of past token representations during autoregressive generation. However, its memory footprint scales linearly with context length, imposing critical bottlenecks on GPU memory capacity, memory bandwidth, and inference throughput as production LLMs push context windows from thousands to millions of tokens. Efficient KV cache management has thus become a first-order challenge for scalable LLM deployment. This paper provides a systematic review of recent KV cache optimization techniques, organizing them into five principal directions: cache eviction, cache compression, hybrid memory solutions, novel attention mechanisms, and combination strategies. For each category we analyze the underlying mechanisms, deployment trade-offs, and empirical performance across memory reduction, throughput, and model accuracy metrics. We further map techniques to seven practical deployment scenarios, including long-context single requests, high-throughput datacenter serving, edge devices, multi-turn conversations, and accuracy-critical reasoning, providing actionable guidance for practitioners selecting among competing approaches. Our analysis reveals that no single technique dominates across all settings; instead, the optimal strategy depends on context length, hardware constraints, and workload characteristics, pointing toward adaptive, multi-stage optimization pipelines as a promising direction for future research.", "abstract_cn": "## Abstract (摘要)\n\nThe key-value (KV) cache is a foundational optimization in Transformer-based large language models (LLMs), eliminating redundant recomputation of past token representations during autoregressive generation. However, its memory footprint scales linearly with context length, imposing critical bottlenecks on GPU memory capacity, memory bandwidth, and inference throughput as production LLMs push context windows from thousands to millions of tokens. Efficient KV cache management has thus become a first-order challenge for scalable LLM deployment. This paper provides a systematic review of recent KV cache optimization techniques, organizing them into five principal directions: cache eviction, cache compression, hybrid memory solutions, novel attention mechanisms, and combination strategies. For each category we analyze the underlying mechanisms, deployment trade-offs, and empirical performance across memory reduction, throughput, and model accuracy metrics. We further map techniques to seven practical deployment scenarios, including long-context single requests, high-throughput datacenter serving, edge devices, multi-turn conversations, and accuracy-critical reasoning, providing actionable guidance for practitioners selecting among competing approaches. Our analysis reveals that no single technique dominates across all settings; instead, the optimal strategy depends on context length, hardware constraints, and workload characteristics, pointing toward adaptive, multi-stage optimization pipelines as a promising direction for future research.\n\n---\n\n键值（KV）缓存是Transformer基础的大型语言模型（LLM）中的基础优化，消除了自回归生成过程中过去token表示的冗余重新计算。然而，其内存占用随上下文长度线性增长，随着生产LLM将上下文窗口从数千token扩展到数百万token，在GPU内存容量、内存带宽和推理吞吐量方面造成关键瓶颈。因此，高效的KV缓存管理已成为可扩展LLM部署的首要挑战。本文对最近的KV缓存优化技术进行了系统综述，将其组织为五个主要方向：缓存淘汰、缓存压缩、混合内存解决方案、新颖的注意力机制和组合策略。对于每个类别，我们分析了底层机制、部署权衡以及内存减少、吞吐量和模型精度指标方面的实证性能。我们进一步将技术映射到七个实际部署场景，包括长上下文单请求、高吞吐量数据中心服务、边缘设备、多轮对话和精度关键推理，为从业者在竞争方法中选择提供可操作指导。我们的分析表明，没有单一技术在所有设置中都占主导地位；相反，最佳策略取决于上下文长度、硬件约束和工作负载特征，指向自适应多阶段优化管道作为未来研究的有前途方向。\n\n---", "intro_en": "", "file": "asplops26/12_KV_Cache_Optimization.md"}];
        
        const topics = ["Hardware", "MoE", "LLM Serving", "Speculative Decoding", "KV Cache"];
        const conferences = [...new Set(papers.map(p => p.conference))];
        
        function render() {
            const topicFilter = document.querySelector('.filter-chip.active').dataset.topic;
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = papers.filter(p => {
                const matchTopic = !topicFilter || p.topic === topicFilter;
                const matchSearch = !search || 
                    p.title.toLowerCase().includes(search) || 
                    p.authors.toLowerCase().includes(search);
                return matchTopic && matchSearch;
            });
            
            const list = document.getElementById('paperList');
            
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>没有找到匹配的论文</div></div>';
                return;
            }
            
            list.innerHTML = filtered.map((p, idx) => `
                <div class="paper-card" data-topic="${p.topic}">
                    <div class="title">${p.title}</div>
                    <div class="authors">${p.authors}</div>
                    <div class="meta">
                        <span class="tag conf">${p.conference}</span>
                        <span class="tag year">${p.year}</span>
                        <span class="tag topic">${p.topic}</span>
                    </div>
                    <div class="links">
                        ${p.arxiv_id ? `<a href="https://arxiv.org/abs/${p.arxiv_id}" target="_blank">📄 arXiv</a>` : ''}
                        ${p.github_repo ? `<a href="https://github.com/${p.github_repo}" target="_blank">🐙 GitHub</a>` : ''}
                    </div>
                    ${(p.abstract_en || p.abstract_cn) ? `
                    <div class="abstract-section">
                        <button class="expand-btn" onclick="toggleAbstract(${p.id})">
                            <span id="btn-${p.id}">📖 查看摘要</span>
                        </button>
                        <div class="abstract-content" id="abstract-${p.id}">
                            ${p.abstract_en ? `<h4>Abstract (英文)</h4><p>${p.abstract_en.substring(0, 800)}${p.abstract_en.length > 800 ? '...' : ''}</p>` : ''}
                            ${p.abstract_cn ? `<h4>摘要 (中文)</h4><p class="cn">${p.abstract_cn.substring(0, 500)}${p.abstract_cn.length > 500 ? '...' : ''}</p>` : ''}
                        </div>
                    </div>
                    ` : ''}
                </div>
            `).join('');
            
            document.getElementById('paperCount').textContent = papers.length;
            document.getElementById('confCount').textContent = conferences.length;
            document.getElementById('topicCount').textContent = topics.length;
            document.getElementById('totalCount').textContent = papers.length;
        }
        
        function toggleAbstract(id) {
            const content = document.getElementById('abstract-' + id);
            const btn = document.getElementById('btn-' + id);
            if (content.classList.contains('show')) {
                content.classList.remove('show');
                btn.textContent = '📖 查看摘要';
            } else {
                content.classList.add('show');
                btn.textContent = '📕 收起摘要';
            }
        }
        
        // 初始化主题筛选
        const topicFilters = document.getElementById('topicFilters');
        topics.forEach(t => {
            const chip = document.createElement('div');
            chip.className = 'filter-chip';
            chip.dataset.topic = t;
            chip.textContent = t;
            chip.onclick = () => {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                render();
            };
            topicFilters.appendChild(chip);
        });
        
        document.getElementById('searchInput').addEventListener('input', render);
        
        render();
    </script>
</body>
