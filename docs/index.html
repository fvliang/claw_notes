    <script>
    const papers = [{"title": "POD-Attention: Unlocking Full Prefill-Decode Overlap for Faster LLM Inference", "authors": "Aditya Kamath 等", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2025", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./asplos/2025/pod_attention.md", "has_content": false, "id": 1, "topic": "Attention"}, {"title": "vAttention: Dynamic Memory Management for Serving LLMs without PagedAttention", "authors": "Ashish Panwar, Rishabh Prabhu, et al.", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2025", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./asplos/2025/vattention_dynamic_memory.md", "has_content": false, "id": 2, "topic": "Attention"}, {"title": "ZipServ: Fast and Memory-Efficient LLM Inference with Hardware-Aware Lossless Compression", "authors": "Ruibo Fan, Xiangrui Yu, Xinglin Pan, Zeyu Li, Weile Luo, Qiang Wang, Wei Wang, Xiaowen Chu", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "LLM的内存占用是部署的主要挑战。无损压缩可以在不损失精度的前提下减少内存使用，但现有方法未考虑硬件特性。ZipServ设计了硬件感知的压缩算法。", "file": "./asplos/2026/07_zipserv_compression.md", "has_content": true, "id": 3, "topic": "Hardware"}, {"title": "QoServe: Breaking the Silos of LLM Inference Serving", "authors": "Kanishk Goel, Jayashree Mohan, Nipun Kwatra, Ravi Anupindi, Ram Ramjee", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "现有的LLM serving系统通常针对特定场景进行优化：\n- 延迟优化系统\n- 吞吐量优化系统\n- 成本优化系统\n\n这种碎片化导致：\n1. 系统维护困难\n2. 资源利用效率低\n3. 难以保证服务质量\n\nQoServe通过统一调度和资源管理解决了这些问题。", "file": "./asplos/2026/03_qoserve.md", "has_content": true, "id": 4, "topic": "LLM Serving"}, {"title": "PAT: Accelerating LLM Decoding via Prefix-Aware Attention with Resource Efficient Multi-Tile Kernel", "authors": "Jinjun Yi, Zhixin Zhao, Yitao Hu, Ke Yan, Weiwei Sun, Hao Wang, Laiping Zhao, Yuhao Zhang, Wenxin Li, Keqiu Li", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "注意力机制是LLM的核心组件，但也是计算瓶颈。现有优化方法忽略了prefix的特殊性。PAT利用prefix的共享特性，实现更高效的注意力计算。", "file": "./asplos/2026/06_pat_prefix_aware_attention.md", "has_content": true, "id": 5, "topic": "Attention"}, {"title": "MoE-APEX: An Efficient MoE Inference System with Adaptive Precision Expert Offloading", "authors": "Peng Tang, Jiacheng Liu, Xiaofeng Hou, Yifei Pu, Jing Wang, Pheng-Ann Heng, Chao Li, Minyi Guo", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "MoE模型通过激活部分专家来提供高容量，但推理时仍面临内存和计算挑战。MoE-APEX提出了一种自适应精度卸载策略，根据专家重要性动态调整精度。", "file": "./asplos/2026/09_moe_apex.md", "has_content": true, "id": 6, "topic": "MoE"}, {"title": "XY-Serve: End-to-End Versatile Production Serving for Dynamic LLM Workloads", "authors": "Mingcong Song, Xinru Tang, Fengfan Hou, Jing Li, Wei Wei, Yipeng Ma, Runqiu Xiao, Hongjie Si, Dingcheng Jiang, Shouyi Yin, Yang Hu, Guoping Long", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "生产环境中的LLM serving面临诸多挑战：\n- 多样化的模型类型\n- 动态的请求模式\n- 复杂的资源管理\n\nXY-Serve通过统一的架构解决了这些问题。", "file": "./asplos/2026/05_xy_serve.md", "has_content": true, "id": 7, "topic": "LLM Serving"}, {"title": "Shift Parallelism: Low-Latency, High-Throughput LLM Inference for Dynamic Workloads", "authors": "Mert Hidayetoglu, Aurick Qiao, Michael Wyatt, Jeff Rasley, Yuxiong He, Samyam Rajbhandari", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "动态工作负载是LLM serving的常见场景，请求速率和复杂度随时间变化。传统方法难以适应这种变化，导致：\n- 高延迟峰值\n- 资源浪费\n- 服务质量不稳定\n\nShift Parallelism通过动态调整并行度来适应工作负载变化。", "file": "./asplos/2026/04_shift_parallelism.md", "has_content": true, "id": 8, "topic": "LLM Serving"}, {"title": "Towards High-Goodput LLM Serving with Prefill-decode Multiplexing", "authors": "Weihao Cui, Yukang Chen, Han Zhao, Ziyi Xu, Xiaoze Fan, Xusheng Chen, Yangjie Zhou, Shixuan Sun, Bingsheng He, Quan Chen", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "LLM serving面临的核心挑战是如何在多用户场景下同时满足延迟和吞吐量需求。现有系统通常采用分阶段处理方式，将prefill（提示处理）和decode（ token生成）分离到不同的GPU上。然而，这种方法导致了：\n1. GPU资源利用不均\n2. 请求排队延迟增加\n3. 整体系统goodput下降\n\n本文提出的PDM框架通过创新的请求多路复用技术，有效解决了上述问题。", "file": "./asplos/2026/01_high_goodput_llm_serving.md", "has_content": true, "id": 9, "topic": "LLM Serving"}, {"title": "Bullet: Boosting GPU Utilization for LLM Serving via Dynamic Spatial-Temporal Orchestration", "authors": "Zejia Lin, Hongxin Xu, Guanyi Chen, Zhiguang Chen, Yutong Lu, Xianwei Zhang", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "在LLM serving场景中，GPU利用率低下是一个普遍问题。原因是：\n- 请求的动态到达模式\n- prefill和decode阶段的计算特性差异\n- 批处理调度不当\n\nBullet系统通过空间（多个GPU之间）和时间（不同请求之间）的动态协调，显著提升了GPU利用率。", "file": "./asplos/2026/02_bullet_gpu_utilization.md", "has_content": true, "id": 10, "topic": "LLM Serving"}, {"title": "BlendServe: Optimizing Offline Inference with Resource-Aware Batching", "authors": "Yilong Zhao, Shuo Yang, Kan Zhu, Lianmin Zheng, Baris Kasikci, Yifan Qiao, Yang Zhou, Jiarong Xing, Ion Stoica", "arxiv_id": "", "github_repo": "", "conference": "ASPLOS", "full_conference": "ASPLOS 2026", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "离线推理（batch inference）与在线服务有不同的优化目标。传统批处理方法未充分考虑资源利用率。BlendServe通过创新的资源分配策略实现更高效的离线推理。", "file": "./asplos/2026/08_blendserve_batching.md", "has_content": true, "id": 11, "topic": "Scheduling"}, {"title": "REST: Retrieval-Based Speculative Decoding", "authors": "FasterDecoding", "arxiv_id": "", "github_repo": "", "conference": "NAACL", "full_conference": "NAACL 2024", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "1. **Building a retrieval cache** of recent context chunks\n2. **Querying the cache** for similar contexts when generating\n3. **Using matched tokens** as speculative drafts\n4. **Verifying with the full model** to ensure correctness\n\nThis eliminates the need for a separate draft model and can achieve better efficiency.", "file": "./naacl/2024/rest.md", "has_content": true, "id": 12, "topic": "Speculative Decoding"}, {"title": "TokenSwift: Ultra Long Sequence Generation", "authors": "bigai-nlco", "arxiv_id": "", "github_repo": "", "conference": "ICML", "full_conference": "ICML 2025", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "TokenSwift addresses these with:\n- **Streaming speculation**: Draft tokens generated incrementally\n- **Selective attention**: Only relevant context attended to\n- **Efficient cache eviction**: Smart management of long context cache", "file": "./icml/2025/tokenswift.md", "has_content": true, "id": 13, "topic": "LLM Serving"}, {"title": "LayerSkip: Early Exit and Self-Speculative Decoding", "authors": "Facebook Research", "arxiv_id": "", "github_repo": "", "conference": "ACL", "full_conference": "ACL 2024", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "1. **Self-speculation**: A single model handles both draft and verify\n2. **Layer-wise early exit**: Confident tokens skip remaining layers\n3. **Training for early exit**: Special training recipe to enable early exit capability\n4. **End-to-end optimization**: Whole system optimized together\n\nThis approach reduces model overhead and improves cache efficiency.", "file": "./acl/2024/layerskip.md", "has_content": true, "id": 14, "topic": "Speculative Decoding"}, {"title": "vLLM: Efficient Memory Management for Large Language Model Serving with PagedAttention", "authors": "", "arxiv_id": "", "github_repo": "vllm-project/vllm", "conference": "SOSP", "full_conference": "SOSP 2023", "year": 2023, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "Existing LLM serving systems manage the KV cache using static allocation. They pre-allocate a contiguous chunk of memory for each request at the beginning of inference and retain the memory until the request completes. This approach leads to two problems: (1) internal fragmentation - the pre-allocated memory may be larger than what the request actually needs; (2) reserved memory cannot be shared across requests even when they have common prefixes.\n\nTo address these problems, we propose PagedAttention, a new attention algorithm that allows the KV cache to be stored in non-contiguous memory blocks. Inspired by virtual memory in operating systems, PagedAttention stores each attention query's keys and values in a block that can be located anywhere in memory. This allows dynamic memory allocation without reservation and enables flexible sharing of the KV cache.\n\n基于此，我们构建了vLLM，这是一个支持PagedAttention的LLM服务系统。vLLM采用类似操作系统的分页系统来管理KV缓存，实现了近零浪费的内存管理。我们实现了一个新的内存分配器，专门设计用于LLM推理的解码模式，它按需分配分页，并有效地整合已完成的请求释放的页面。", "file": "./arxiv/2023/vllm_pagedattention_sosp2023.md", "has_content": true, "id": 15, "topic": "Attention"}, {"title": "ALISE: Speculative Scheduling for LLM Serving", "authors": "Various", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "ALISE improves:\n- **Integrated scheduling**: Full integration of speculation into scheduler\n- **Predictive speculation**: Speculate based on predicted accept rates\n- **Batch synergy**: Better batching when speculation is considered", "file": "./arxiv/2024/alise.md", "has_content": true, "id": 18, "topic": "Speculative Decoding"}, {"title": "PowerInfer-2: High-Speed LLM Inference for Smartphones", "authors": "来自上海交通大学IPADS实验室", "arxiv_id": "", "github_repo": "Tiiny-AI/PowerInfer", "conference": "arXiv", "full_conference": "", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2024/powerinfer2.md", "has_content": false, "id": 19, "topic": "LLM Serving"}, {"title": "InstCache: Predictive Cache for LLM Serving", "authors": "Various", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "InstCache leverages this with:\n- **Learning-based prediction**: ML model predicts what to cache\n- **Prefix tree**: Efficient prefix matching\n- **Eviction policy**: Optimal cache management", "file": "./arxiv/2024/instcache.md", "has_content": true, "id": 20, "topic": "LLM Serving"}, {"title": "DistServe: Disaggregating Prefill and Decoding for Goodput-optimized LLM Serving", "authors": "Y. Sheng, L. Zheng, Y. Zhu, et al. (PKU)", "arxiv_id": "", "github_repo": "", "conference": "OSDI", "full_conference": "OSDI 2024", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "1. ** interference between requests with different characteristics\n2. **Inability to optimize each phase independently\n3. **Poor resource utilization due to different compute/memory requirements\n\nDistServe addresses these by disaggregating prefilling and decoding onto separate GPU groups.", "file": "./arxiv/2024/distserve.md", "has_content": true, "id": 21, "topic": "LLM Serving"}, {"title": "TriForce: Hierarchical Speculative Decoding", "authors": "Infini-AI-Lab", "arxiv_id": "", "github_repo": "", "conference": "COLM", "full_conference": "COLM 2024", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "TriForce addresses these by:\n- **Hierarchical speculation**: Multiple levels reduce verification cost\n- **Lossless acceleration**: No quality degradation\n- **Scalable architecture**: Works with increasing sequence lengths", "file": "./arxiv/2024/triforce.md", "has_content": true, "id": 22, "topic": "Speculative Decoding"}, {"title": "Sequoia: Tree-Based Speculative Decoding", "authors": "Infini-AI-Lab", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "Sequoia addresses these with:\n- **Optimal tree algorithms**: Minimizes expected verification cost\n- **Efficient verification**: Parallel verification of tree nodes\n- **Adaptive branching**: Dynamic tree size based on acceptance rates", "file": "./arxiv/2024/sequoia.md", "has_content": true, "id": 23, "topic": "Speculative Decoding"}, {"title": "Mooncake: A KVCache-centric Disaggregated Architecture for LLM Serving", "authors": "Moonshot AI", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "1. **KVCache-centric architecture**: All components optimized for KVCache efficiency\n2. **Disaggregated prefill/decode**: Different compute resources for each phase\n3. **Cross-request KVCache sharing**: Significant memory savings\n4. **Transfer-efficient design**: Minimize KVCache movement overhead\n\nThis architecture is particularly effective for scenarios with high cache hit rates and long context lengths.", "file": "./arxiv/2024/mooncake.md", "has_content": true, "id": 24, "topic": "KV Cache"}, {"title": "FlashAttention-3: Fast and Accurate Attention", "authors": "TriDao et al.", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "1. **Memory-bound operation**: Standard attention requires O(N²) memory\n2. **IO overhead**: Slow HBM access dominates runtime\n3. **Limited parallelism**: Difficult to fully utilize GPU resources\n\nFlashAttention-3 addresses these with:\n- **Tile-based computation**: Process in smaller blocks\n- **Online softmax**: Reduce memory while maintaining accuracy\n- **Asynchronous execution**: Hide memory latency\n- **FP8 optimization**: Leverage tensor cores more efficiently", "file": "./arxiv/2024/flashattention3.md", "has_content": true, "id": 25, "topic": "Attention"}, {"title": "Chameleon: Adaptive Caching for Multi-Adapter LLM Inference", "authors": "Various", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "Chameleon solves this with:\n- **Intelligent cache partitioning**: Share where possible, isolate where needed\n- **Dynamic weight adjustment**: Adapt cache allocation based on demand\n- **Co-scheduling**: Coordinate across adapters for best overall performance", "file": "./arxiv/2024/chameleon_adapter.md", "has_content": true, "id": 26, "topic": "LLM Serving"}, {"title": "EAGLE: Early Exit and Speculative Decoding", "authors": "Various (SafeAILab)", "arxiv_id": "", "github_repo": "", "conference": "ICML", "full_conference": "ICML 2024, EMNLP 2024, NeurIPS 2025", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "1. **Early exit in draft model**: Draft model exits early for confident predictions\n2. **Tree-structured verification**: More efficient batch verification of multiple drafts\n3. **Improved acceptance rate**: Better selection of draft tokens to verify\n4. **Training-free adaptation**: Can be applied to existing models without fine-tuning", "file": "./arxiv/2024/eagle_speculative.md", "has_content": true, "id": 27, "topic": "Speculative Decoding"}, {"title": "PipeInfer: Asynchronous Pipelined Speculation", "authors": "AutonomicPerfectionist", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "PipeInfer addresses these with:\n- **Continuous speculation pipeline**: Always have drafts in flight\n- **Decoupled verification**: Verify previous drafts while generating new ones\n- **Request-level parallelism**: Multiple requests in pipeline simultaneously", "file": "./arxiv/2024/pipeinfer.md", "has_content": true, "id": 28, "topic": "Speculative Decoding"}, {"title": "ShadowKV: KV Cache in Shadows for Long-Context Inference", "authors": "Various", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "ShadowKV addresses this with:\n- **Shadow mechanism**: Lightweight secondary cache tracks what can be reused\n- **Efficient recomputation**: On-demand KV regeneration when needed\n- **Smart caching policy**: Balances memory vs compute tradeoff", "file": "./arxiv/2024/shadowkv.md", "has_content": true, "id": 29, "topic": "KV Cache"}, {"title": "MiniKV: Layer-Discriminative KV Cache", "authors": "Various (Microsoft?)", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "MiniKV addresses this with:\n- **Layer discrimination**: Not all layers need same precision\n- **2-bit quantization**: Aggressive but careful compression\n- **Minimal quality impact**: Careful calibration maintains quality", "file": "./arxiv/2024/minikv.md", "has_content": true, "id": 30, "topic": "KV Cache"}, {"title": "DART: Diffusion-Inspired Speculative Decoding", "authors": "Various", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "DART improves by:\n- **Branching drafts**: Explore multiple token possibilities\n- **Parallel verification**: Verify multiple paths efficiently\n- **Best-path selection**: Choose optimal sequence", "file": "./arxiv/2024/dart_speculative.md", "has_content": true, "id": 31, "topic": "Speculative Decoding"}, {"title": "Star-Attention: Efficient LLM Inference over Long Sequences", "authors": "NVIDIA", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "arXiv 2024", "year": 2024, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "1. **Computational complexity**: Full attention scales quadratically\n2. **Memory pressure**: KVCache grows with sequence length\n3. **Latency**: Autoregressive generation becomes slow\n\nStar-Attention solves this with:\n- **Block-wise attention**: Local blocks attend within themselves\n- **Anchor tokens**: Small set of tokens maintain global context\n- **Approximate attention**: Trade-off between quality and speed", "file": "./arxiv/2024/star_attention.md", "has_content": true, "id": 32, "topic": "Attention"}, {"title": "ParallelVLM: Lossless Video-LLM Acceleration with Visual Alignment Aware Parallel Speculative Decoding", "authors": "Quan Kong, Yuhao Shen, Yicheng Ji, Huan Li, Cong Wang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/parallelvlm.md", "has_content": false, "id": 33, "topic": "Speculative Decoding"}, {"title": "ReSpec: Towards Optimizing Speculative Decoding in Reinforcement Learning Systems", "authors": "Qiaoling Chen, Zijun Liu, Peng Sun, Shenggui Li, Guoteng Wang, Ziming Liu, Yonggang Wen, Siyuan Feng, Tianwei Zhang", "arxiv_id": "2510.26475", "github_repo": "", "conference": "arXiv预印本", "full_conference": "arXiv预印本", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "将LLM通过强化学习适配新任务时面临以下挑战：\n\n1. **生成阶段瓶颈**：RL训练中生成阶段消耗超过75%的训练时间\n2. **大批量下加速减弱**：传统SD在大批量推理时加速效果下降\n3. **草稿模型过时**：RL中actor持续更新，草稿模型很快过时\n4. **策略退化**：草稿模型可能引入偏差，影响策略质量\n\nReSpec的解决方案：\n- **动态SD配置调整**：根据训练阶段调整投机参数\n- **知识蒸馏演进草稿**：使草稿模型跟上actor的更新\n- **奖励加权更新**：根据rollout质量调整更新", "file": "./arxiv/2025/27_respec_rl_speculative.md", "has_content": true, "id": 34, "topic": "Speculative Decoding"}, {"title": "Reasoning Language Model Inference Serving Unveiled: An Empirical Study", "authors": "Qi Li, Junpan Wu, Xiang Liu, et al.", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "RLLM的服务挑战：\n1. 更长的响应长度\n2. 更复杂的注意力模式\n3. 动态计算需求\n4. 自我验证机制\n\n研究贡献：\n- 首次全面实证研究\n- 识别关键瓶颈\n- 提出优化策略\n- 为系统设计提供见解", "file": "./arxiv/2025/05_rllm_serving_study.md", "has_content": true, "id": 35, "topic": "LLM Serving"}, {"title": "Nightjar: Dynamic Adaptive Speculative Decoding for Large Language Models Serving", "authors": "Rui Li, Zhaoning Zhang, Libo Zhang, et al.", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2090, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "投机解码的核心挑战：\n1. 固定批大小无法适应动态变化的接受率\n2. 计算资源利用率不足\n3. 需要实时调整策略\n\nNightjar提出：\n- 实时监控接受率\n- 轻量级预测模型预测未来接受率\n- 效用最大化选择最优批大小", "file": "./arxiv/2025/02_nightjar.md", "has_content": true, "id": 36, "topic": "Speculative Decoding"}, {"title": "KV-Compress: Paged KV-Cache Compression with Variable Compression Rates per Attention Head", "authors": "Ramya Prabhu, Ajay Nayak, Jayashree Mohan, Ramachandran Ramjee, Ashish Panwar", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2024, "abstract_en": "", "abstract_cn": "vAttention: Dynamic Memory Management for Serving LLMs without PagedAttention\n\n## 基本信息\n\n- **标题**: vAttention: Dynamic Memory Management for Serving LLMs without PagedAttention\n- **作者**: Ramya Prabhu, Ajay Nayak, Jayashree Mohan, Ramachandran Ramjee, Ashish Panwar\n- **arXiv**: [2405.XXXXX](https://arxiv.org/abs/) (最初提交2024年5月)\n- **发布时间**: 2025年1月\n\n## 摘要 (Abstract)\n\nPagedAttention is a popular approach for dynamic memory allocation in LLM serving. This paper presents vAttention, an alternative approach that achieves similar benefits without requiring paged attention kernels.\n\n## 摘要 (中文)\n\nPagedAttention是LLM服务中动态内存分配的流行方法。本文介绍了vAttention，这是一种替代方法，无需分页注意力内核即可实现类似的好处。", "intro_en": "", "intro_cn": "---\n\n# Rethinking Key-Value Cache Compression Techniques for Large Language Model Serving\n\n## 基本信息\n\n- **标题**: Rethinking Key-Value Cache Compression Techniques for Large Language Model Serving\n- **作者**: Wei Gao, Xinyu Zhou, Peng Sun, Tianwei Zhang, Yonggang Wen\n- **arXiv**: [2503.XXXXX](https://arxiv.org/abs/)\n- **发布时间**: 2025年3月\n\n## 摘要 (Abstract)\n\nKey-Value cache (KV cache) compression is essential for efficient LLM serving. This paper rethinks KV cache compression techniques and proposes new methods for better memory efficiency.\n\n## 摘要 (中文)\n\n键值缓存(KV缓存)压缩对于高效的LLM服务至关重要。本文重新思考了KV缓存压缩技术，并提出了提高内存效率的新方法。\n\n---\n\n# Paged Attention Meets FlexAttention: Unlocking Long-Context Efficiency in Deployed Inference\n\n## 基本信息\n\n- **标题**: Paged Attention Meets FlexAttention: Unlocking Long-Context Efficiency in Deployed Inference\n- **作者**: Thomas Joshi, Herman Saini, Neil Dhillon, Antoni Viros i Martin, Kaoutar El Maghraoui\n- **arXiv**: [2506.XXXXX](https://arxiv.org/abs/)\n- **发布时间**: 2025年6月\n\n## 摘要 (Abstract)\n\nLarge Language Models (LLMs) encounter severe memory inefficiencies during long-context inference due to conventional handling of key-value (KV) caches. This paper explores combining PagedAttention with FlexAttention for better long-context efficiency.\n\n## 摘要 (中文)\n\n大型语言模型(LLM)在长上下文推理过程中由于传统的键值(KV)缓存处理方式而面临严重的内存效率问题。本文探讨了将PagedAttention与FlexAttention结合以提高长上下文效率。\n\n---\n\n# ReSpec: Towards Optimizing Speculative Decoding in Reinforcement Learning Systems\n\n## 基本信息\n\n- **标题**: ReSpec: Towards Optimizing Speculative Decoding in Reinforcement Learning Systems\n- **作者**: Qiaoling Chen, Zijun Liu, Peng Sun, Shenggui Li, Guoteng Wang, Ziming Liu, Yonggang Wen, Siyuan Feng, Tianwei Zhang\n- **arXiv**: [2510.XXXXX](https://arxiv.org/abs/)\n- **发布时间**: 2025年10月\n\n## 摘要 (Abstract)\n\nAdapting large language models (LLMs) via reinforcement learning (RL) is often bottlenecked by the generation stage, which can consume over 75% of the training time. This paper presents ReSpec, a system for optimizing sp", "file": "./arxiv/2025/llm_serving_papers_2025.md", "has_content": true, "id": 37, "topic": "KV Cache"}, {"title": "SpecSteer: Synergizing Local Context and Global Reasoning for Efficient Personalized Generation", "authors": "Hang Lv, Sheng Liang, Hao Wang, Yongyue Zhang, Hongchao Gu, Wei Guo, Defu Lian, Yong Liu, Enhong Chen", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/specsteer.md", "has_content": false, "id": 39, "topic": "Speculative Decoding"}, {"title": "MMSpec: Benchmarking Speculative Decoding for Vision-Language Models", "authors": "Hui Shen, Xin Wang, Ping Zhang, Yunta Hsieh, Qi Han, Zhongwei Wan, Ziheng Zhang, Jingxuan Zhang, Jing Xiong, Ziyuan Liu, Yifan Zhang, Hangrui Cao, Chenyang Zhao, Mi Zhang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2025, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2025/mmspec.md", "has_content": false, "id": 41, "topic": "Speculative Decoding"}, {"title": "Pipelined Collaborative Speculative Decoding Framework for Efficient Edge-Cloud LLM Inference", "authors": "Yida Zhang, Zhiyong Gao, Shuaibing Yue, Jie Li, Rui Wang", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2025, "abstract_en": "", "abstract_cn": "", s paper presents EAGLE-Pangu, a tree speculative decoding approach optimized for Ascend NPUs.\n\n## 摘要 (中文)\n\n自回归解码仍然是大型语言模型(LLM)推理的主要瓶颈。本文介绍了EAGLE-Pangu，这是一种针对Ascend NPUs优化的树形推测解码方法。", "intro_en": "", "intro_cn": "---\n\n## When RL Meets Adaptive Speculative Training: A Unified Training-Serving System\n\n## 基本信息\n\n- **标题**: When RL Meets Adaptive Speculative Training: A Unified Training-Serving System\n- **作者**: Junxiong Wang, Fengxiang Bie, Jisen Li, Zhongzhu Zhou, Zelei Shao, Yubo Wang, Yinghui Liu, Qingyang Wu, Avner May, Sri Yanamandra, Yineng Zhang, Ce Zhang, Tri Dao, Percy Liang, Ben Athiwaratkun, Shuaiwen Leon Song, Chenfeng Xu, Xiaoxia Wu\n- **arXiv**: [2602.XXXXX](https://arxiv.org/abs/)\n- **发布时间**: 2026年2月6日\n\n## 摘要 (Abstract)\n\nSpeculative decoding has emerged as a promising technique to accelerate LLM inference. This paper explores the combination of reinforcement learning and adaptive speculative training for unified training-serving optimization.\n\n## 摘要 (中文)\n\n推测解码已成为加速LLM推理的有前景的技术。本文探讨了强化学习与自适应推测训练的结合，以实现统一的训练-服务优化。\n\n---\n\n## StarSD: One-for-Many Speculative Decoding\n\n## 基本信息\n\n- **标题**: StarSD: One-for-Many Speculative Decoding\n- **作者**: Junhao He, Feiran You, Hongyang Du\n- **arXiv**: [2601.XXXXX](https://arxiv.org/abs/)\n- **发布时间**: 2026年1月29日\n\n## 摘要 (Abstract)\n\nThis paper presents StarSD, a one-for-many speculative decoding approach that enables a single draft model to work with multiple target models efficiently.\n\n## 摘要 (中文)\n\n本文介绍了StarSD，这是一种一对多的推测解码方法，使单个draft模型能够与多个目标模型高效协作。\n\n---\n\n## Nightjar: Dynamic Adaptive Speculative Decoding for Large Language Models Serving\n\n## 基本信息\n\n- **标题**: Nightjar: Dynamic Adaptive Speculative Decoding for Large Language Models Serving\n- **作者**: Rui Li, Zhaoning Zhang, Libo Zhang, Huaimin Wang, Xiang Fu, Zhiquan Lai\n- **arXiv**: [2512.XXXXX](https://arxiv.org/abs/)\n- **发布时间**: 2025年12月 (最初提交2025年12月)\n\n## 摘要 (Abstract)\n\nThis paper introduces Nightjar, a dynamic adaptive speculative decoding system for LLM serving that adapts to varying workloads and latency requirements.\n\n## 摘要 (中文)\n\n本文介绍了Nightjar，这是一个用于LLM服务的动态自适应推测解码系统，可适应不同的工作负载和延迟要求。\n\n---\n\n## DSD: A Distributed Speculative Decoding Solution for Edge-Cloud Agile Large Model Serving\n\n## 基", "file": "./arxiv/2026/llm_serving_papers_2026.md", "has_content": true, "id": 49, "topic": "Speculative Decoding"}, {"title": "FLYING SERVING: On-the-Fly Parallelism Switching for Large Language Model Serving", "authors": "Shouwei Gao, Junqi Yin, Feiyi Wang, Wenqian Dong", "arxiv_id": "", "github_repo": "", "conference": "ACM", "full_conference": "ACM International Conference on Supercomputing (IC", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/flying_serving_parallelism.md", "has_content": false, "id": 50, "topic": "LLM Serving"}, {"title": "WISP: Waste- and Interference-Suppressed Distributed Speculative LLM Serving at the Edge", "authors": "", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "", "file": "./arxiv/2026/wisp_distributed_speculative_serving.md", "has_content": false, "id": 51, "topic": "Speculative Decoding"}, {"title": "AE-LLM: Adaptive Efficiency Optimization for Large Language Models", "authors": "Kaito Tanaka, Masato Ito, Yuji Nishimura, Keisuke Matsuda, Aya Nakayama", "arxiv_id": "", "github_repo": "", "conference": "arXiv", "full_conference": "", "year": 2026, "abstract_en": "", "abstract_cn": "", "intro_en": "", "intro_cn": "大语言模型的部署面临着多重挑战：\n- 计算成本高\n- 内存需求大\n- 能源消耗高\n\n本文提出自适应效率优化框架AE-LLM，根据不同工作负载动态选择最优的效率优化技术。", "file": "./arxiv/2026/ae_llm_adaptive_efficiency.md", "has_content": true, "id": 52, "topic": "LLM Serving"}, {"title": "Beyond Test-Time Compute Strategies: Advocating Energy-per-Token in LLM Inference", "authors": "Patrick Wilhelm, Thorsten Wittkopp, Odej Kao", "arxiv_id": "", "github_re
